[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "subagent-factory"
version = "0.1.0"
description = "Claude Code local subagent authoring factory"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "jsonschema>=4.0",
    "python-slugify>=8.0",
    "beautifulsoup4>=4.12",
    "readability-lxml>=0.8",
    "markdownify>=0.12",
    "requests>=2.31",
    "rich>=13.0",
    "jinja2>=3.1",
    "click>=8.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]
lint = [
    "ruff>=0.5",
    "bandit>=1.7",
    "pip-audit>=2.7",
    "mypy>=1.8",
    "types-PyYAML>=6.0",
    "detect-secrets>=1.4",
]
# Document converters. `convert` is the light, self-heal default (MarkItDown
# covers PDF/ePUB/DOCX). `convert-full` adds Docling (heavy: pulls ML runtimes)
# for higher-fidelity PDF extraction.
convert = [
    "markitdown[pdf]>=0.1.0",
]
convert-full = [
    "markitdown[pdf]>=0.1.0",
    "docling>=1.0",
]
ocr = [
    "pymupdf>=1.23",
    "python-magic>=0.4",
]
# NLP extras for Step-7 C3 (Hearst is-a induction): spaCy parse-clean noun-phrase boundaries +
# nltk WordNet hypernym confirmation. Optional — hearst_isa falls back to a flat-regex extractor
# (no WordNet confidence) when absent, so CI does not install these.
nlp = [
    "spacy>=3.7",
    "nltk>=3.8",
]

[project.scripts]
subagent-factory = "tools.subagent_factory.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
# E501 (line length) is noisy on long help strings and hint text; not enforced.
ignore = ["E501"]

[tool.bandit]
# The factory deliberately shells out to package managers and converters using
# list-form argv (no shell=True) and PATH-resolved tool names — intended
# self-heal / conversion behaviour, not injection risk (B404/B603/B607).
# B105: false positives on rich colour strings ("green") in status dicts.
# B110/B112: benign defensive try/except in best-effort parsing loops.
# (B701 jinja autoescape and B606 execve are justified inline with `# nosec`.)
skips = ["B404", "B603", "B607", "B105", "B110", "B112"]

[tool.mypy]
python_version = "3.11"
# Pragmatic baseline for a mixed-typing codebase: type-check what is annotated
# without forcing annotations onto every legacy function. Promote to stricter
# flags incrementally once the tree stays clean.

[[tool.mypy.overrides]]
# Optional / untyped third-party libraries with no published stubs. Several are
# soft deps imported behind try/except or via the self-heal loader, so their
# presence varies by environment; do not fail typing on a missing stub.
module = [
    "docling.*",
    "fitz",
    "pymupdf4llm",
    "markitdown.*",
    "magic",
    "pdfminer.*",
    "jsonschema",
    "requests",
    "torch",
    "transformers.*",
    "spacy",
    "nltk",
    "nltk.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# numpy (transitive via sentence-transformers / embeddings) ships PEP 695 `type` statements in its
# bundled stubs (newer 2.x). Under python_version = "3.11" mypy parses those stubs and errors
# "Type statement is only supported in Python 3.12 and greater", red-lining CI on a fresh numpy even
# though our own code is clean. We do not type-check numpy — skip following into it (treat as Any).
module = ["numpy", "numpy.*"]
follow_imports = "skip"
ignore_missing_imports = true
