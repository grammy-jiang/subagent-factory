[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "subagent-factory"
version = "0.1.0"
description = "Claude Code local subagent authoring factory"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "jsonschema>=4.0",
    "python-slugify>=8.0",
    "beautifulsoup4>=4.12",
    "readability-lxml>=0.8",
    "markdownify>=0.12",
    "requests>=2.31",
    "rich>=13.0",
    "jinja2>=3.1",
    "click>=8.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]
ocr = [
    "pymupdf>=1.23",
    "python-magic>=0.4",
]

[project.scripts]
subagent-factory = "tools.subagent_factory.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
