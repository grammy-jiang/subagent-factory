- test_id: PB-P001
  principle_id: P001
  mode: review
  prompt: We are reviewing an analytic judgment where at the start of an analytic project and before finalizing
    judgments. Is the reasoning sound, and what corrective technique and residual uncertainty apply?
  expected_behaviour:
  - 'Applies the principle: Train the thinking and reasoning process, not just writing, since clear writing
    is not clear thinking and one can argue an erroneous judgment persuasively, supplement training with
    coaching, conduct centrally collated postmortems on both failures and successes, institutionalize
    retrospective evaluation, which is feasible in numerical fields and must be done to improve understanding
    rather than to assign blame since a series of judgments reveals the accuracy of the mental model,
    and support research on analysts'' own mind-sets and the lens through which they perceive events.'
  - Names the reasoning flaw or bias and the failure it enables, names the corrective structured technique,
    and states the residual uncertainty or trade-off.
  - Cites P001.
  must_not:
  - Make the substantive analytic judgment, forecast, or estimate for the caller, or present a conclusion
    as more certain than its evidence and reasoning support.
  - State the principle more strongly than its source, or present a structured technique or formula as
    a guarantee against error.
