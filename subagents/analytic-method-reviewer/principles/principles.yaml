- principle_id: P010
  statement: On key issues management should reject most single-outcome analysis and,
    when the cost of error is high or deception is a serious possibility, mandate
    a systematic process such as Analysis of Competing Hypotheses, requiring analysts
    to identify the alternatives considered, justify why they are less likely, and
    clearly express the likelihood that events may not turn out as expected.
