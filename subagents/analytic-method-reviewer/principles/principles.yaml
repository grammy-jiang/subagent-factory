    test_cases: []
- principle_id: P029
  statement: Weigh situational logic's two weaknesses, the difficulty of understanding
    foreign mental and bureaucratic processes, which invites mirror-imaging, and its
    failure to exploit theory from similar cases so that its proximate causes may
    be only symptoms, and prefer situational logic for short-term estimates while
    using theory for the longer range.
  derived_from_claims:
  - C00213
  - C00214
  - C00215
  - C00216
  - C00217
  - C00241
  - C00242
  confidence: high
  applies_when:
