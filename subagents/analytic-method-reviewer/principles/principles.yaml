- principle_id: P005
  statement: Organizations avoid errors better than individuals because they think
    more slowly and can impose orderly procedures such as checklists, reference-class
    forecasting, and the premortem, so treat an organization as a decision factory
    and apply routine quality control at the three stages of framing the problem,
    collecting information, and reflection and review, supported by a precise shared
    vocabulary of biases that serves as the hook for constructive criticism.
