- principle_id: P009
  statement: 'Expect motivated skepticism when evidence is dissonant: holding quality
    constant and flipping only the conclusion, experts rate consonant evidence credible
    and dissonant evidence not, neutralizing it about four times more often by impugning
    motives, authenticity, or interpretation, with assurances of rigor barely denting
    the double standard.'
