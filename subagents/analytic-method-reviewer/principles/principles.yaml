- principle_id: P004
  statement: 'Use Red Team analysis to counter mirror-imaging: do not assume a foreign
    actor reasons as the analyst would, because cultural, organizational, and personal
    experience drive different responses; staff a team steeped in the target''s environment,
    have them reason and write in the first person as the adversary, present uncoordinated
    first-person products without caveats, and recognize the technique only reduces
    rather than eliminates the analyst''s own mind-set.'
