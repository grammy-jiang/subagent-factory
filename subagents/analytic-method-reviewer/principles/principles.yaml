- principle_id: P028
  statement: Get the reasons pro and con out of your head and onto paper because you
    cannot hold them all in mind at once, and recognize that decomposition and externalization
    tools are for the ablest analysts, not only the weak, since written elements let
    you work each part while keeping the whole in view.
