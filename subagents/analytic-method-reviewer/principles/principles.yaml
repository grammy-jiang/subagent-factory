  - an interpretive dispute is being fought over specific pieces of evidence
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P019
  statement: Apply plausibility pruners to imaginative reasoning, cutting off speculative
    branches before they exceed the bounds of probability, since theory-driven thinking
    buys closure while imagination-driven thinking reveals possibilities at the cost
    of confusion, and good judgment continually manages this trade-off.
  derived_from_claims:
  - C00316
  - C00317
  - C00318
  - C00319
