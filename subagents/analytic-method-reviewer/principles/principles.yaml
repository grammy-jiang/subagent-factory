  - organizing analysis so competing interpretations genuinely contend
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P021
  statement: Use an accurate reading of the goals behind an unacceptable proposal
    to find integrative solutions that upgrade common interests rather than split
    the difference, which requires understanding your own means-ends chain, since
    pursuing established subgoals without knowing why they were valued blocks the
    creativity needed to design new options.
  derived_from_claims:
  - C01764
  - C01765
  - C01773
  - C02106
  - C02107
  - C02108
  confidence: high
  applies_when:
  - seeking a solution that satisfies both sides' underlying objectives
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P022
  statement: Direct training and self-examination inward toward the analyst's own
    thinking and reasoning, because analysts must understand themselves before they
    can understand others, rather than only toward organizational procedures, methods,
    or substantive topics.
  derived_from_claims:
  - C00151
  - C00153
  - C00196
  - C00485
  - C01733
  confidence: high
  applies_when:
  - deciding whether to collect more information
  - designing analyst training or self-review
  - explaining how a judgment was reached
  - planning how to improve analytic quality
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P023
  statement: Make beliefs and values explicit and debate two opposed images as complete
    wholes rather than arguing over each incident, because many crucial failures come
    not from wrong answers but from wrong questions, and the beliefs most in need
    of scrutiny lie at the higher end of the means-ends chain, where actors adopt
    subgoals without analyzing why attaining a subgoal would actually produce the
    desired end.
  derived_from_claims:
  - C01537
  - C01540
  - C02859
  - C02860
  - C02861
  confidence: high
  applies_when:
  - surfacing the assumptions behind a policy or an interpretation
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P024
  statement: Recognize that an intelligence agency's incentive structure and organizational
    culture can matter as much as individual psychology, and guard against the classic
    failure of neglecting negative evidence, the dogs that do not bark, since absent
    events that a true hypothesis predicts make far less impact than present ones
    and countering this requires training and discipline.
  derived_from_claims:
  - C00355
  - C02006
  - C02007
  - C02008
  confidence: high
  applies_when:
  - weighing evidence for a hypothesis
  - diagnosing an intelligence failure or building an estimate
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P025
  statement: Adopt the basic safeguard of taking account of how perception produces
    common errors, so that awareness that belief systems display irrational consistency
    and that images form too quickly leads a decision-maker to examine his supporting
    evidence, suspend judgment longer, and consult people less involved, and that
    knowing consistent evidence is often wrongly taken as disconfirming alternatives
    restrains the false confidence that events are proving his image correct.
  derived_from_claims:
  - C01746
  - C01747
  - C02884
  - C02885
  confidence: high
  applies_when:
  - building habits to counter one's own predictable perceptual errors
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P026
  statement: 'Run Brainstorming as a structured two-phase process (divergent generation
    then convergent grouping) to generate hypotheses and break mind-sets: never censor
    an idea and instead probe what prompted it, ban killer phrases, include at least
    one outsider, leave rank at the door with no official analytic line, allow about
    an hour and cap the session near 90 minutes, and record ideas visibly.'
