- principle_id: P016
  statement: Treat the link from lessons learned to later behavior as only probabilistic,
    since learning from history biases but does not determine perception and can be
    outweighed by other motives, as leaders sensitized to the dangers of appeasement
    nonetheless favored conciliation under fear of nuclear war, and a formative lesson
    can fail to transfer even where it plainly applies.
