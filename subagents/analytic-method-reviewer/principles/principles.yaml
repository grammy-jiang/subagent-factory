- principle_id: P002
  statement: Remember that high-drive conditions inhibit the flexible, principle-based
    kind of learning, so overwhelming events yield overgeneralized and oversimplified
    lessons, meaning decision-makers are often too involved in the highest-impact
    events to draw the most useful information from them, and that once an event stamps
    many members of an organization its lessons become institutionalized in doctrine
    and language and outlive their applicability.
