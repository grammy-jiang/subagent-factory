  - reasoning from a comparable case
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P018
  statement: Because theory and fact interact so that what counts as an important
    fact differs across frameworks and the same information is cited for opposite
    conclusions, do not try to settle an interpretive dispute by appeal to one or
    two facts or to the most recent behavior, but debate instead the general images
    that lie behind the specific interpretations.
