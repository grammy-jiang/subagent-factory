schema_version: principles-v1
principles:
- principle_id: P001
  statement: Train the thinking and reasoning process, not just writing, since clear
    writing is not clear thinking and one can argue an erroneous judgment persuasively,
    supplement training with coaching, conduct centrally collated postmortems on both
    failures and successes, institutionalize retrospective evaluation, which is feasible
    in numerical fields and must be done to improve understanding rather than to assign
    blame since a series of judgments reveals the accuracy of the mental model, and
    support research on analysts' own mind-sets and the lens through which they perceive
    events.
