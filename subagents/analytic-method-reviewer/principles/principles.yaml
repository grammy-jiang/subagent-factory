- principle_id: P014
  statement: Because evidence consistent with several hypotheses is common in intelligence
    and has only a probabilistic relationship to them so hypotheses can seldom be
    eliminated entirely, resist confirmation-seeking, which leads analysts astray,
    and recognize that the probabilistic nature weakens an elimination strategy but
    never justifies a confirmation strategy, as documented intelligence successes
    pitted competing hypotheses against the evidence.
