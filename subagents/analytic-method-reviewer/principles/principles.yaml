- principle_id: P008
  statement: Recognize that institutionalizing a devil's advocate can backfire, since
    labeling opposition as a role signals resistance and lets a decision-maker gain
    false confidence from believing he has been open-minded, so give special weight
    instead when subordinates who previously held differing views converge on one
    conclusion, especially against your own position or their own interest, while
    discounting conversions the role itself could have produced.
