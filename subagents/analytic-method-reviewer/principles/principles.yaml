- principle_id: P011
  statement: 'Sequence structured techniques across the analytic project: at the start
    use brainstorming, a Key Assumptions Check, and Outside-In Thinking; use Indicators
    and ACH throughout and revisit them as new information arrives; during hypothesis
    testing apply a contrarian or Red Team technique and review intelligence gaps;
    and before finalizing re-check key assumptions, brainstorm for missed hypotheses,
    run Devil''s Advocacy against an unquestioned consensus, and include a key-indicators
    list to track whether the judgment holds.'
