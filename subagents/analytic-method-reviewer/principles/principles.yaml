- principle_id: P017
  statement: Reason by comparison and analogy only with care, since it fills gaps
    by assuming the present resembles a precedent, a vivid precedent imposes itself
    before analysis, and using comparison admits insufficient information, so treat
    two situations as equivalent in all respects only after in-depth analysis confirms
    they are comparable.
