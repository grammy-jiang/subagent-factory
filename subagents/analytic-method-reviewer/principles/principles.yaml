- principle_id: P015
  statement: 'Build psychologically safe, sharing, and diverse teams: safety to correct
    higher-ups, a shared ''we'' purpose, and giver behavior raise a team''s emergent
    open-mindedness (which predicts accuracy), and diversity of perspective, not ability
    alone, drives the gains from aggregation.'
