- principle_id: P013
  statement: Recognize that Analysis of Competing Hypotheses is distinguished by starting
    from a full set of alternatives, emphasizing the most diagnostic evidence, and
    seeking to refute so that the most likely hypothesis has the least evidence against
    it, so that concluding there is no indication of an event wrongly conflates an
    unproven with a disproved hypothesis, and whenever tempted to write there is no
    evidence, ask whether you could realistically expect to see it if it were true.
