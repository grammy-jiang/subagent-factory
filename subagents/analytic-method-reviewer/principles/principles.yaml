- principle_id: P027
  statement: Adopt the scientific strategy of seeking to refute rather than confirm
    hypotheses, because people naturally avoid and discount disconfirming evidence,
    a hypothesis can be disproved by a single inconsistent item but never proved by
    consistent evidence, and confirmation-seeking caused most subjects to fail the
    two-four-six rule-discovery task.
