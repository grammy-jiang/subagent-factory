- principle_id: P012
  statement: 'Watch the ''right mistake'' defense and adjust for known measurement
    biases: deliberately erring toward caution is legitimate only when the two errors
    have genuinely asymmetric costs, and collapses if you never update afterward,
    and you should adjust the outside view for systematic biases such as social-desirability
    effects in polling.'
