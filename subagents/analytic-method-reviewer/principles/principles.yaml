  - generating ideas or brainstorming
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P020
  statement: Because a single operative hypothesis with no competitor is too readily
    confirmed, encourage alternative images and, rather than seeking unbiased analysis,
    deliberately structure conflicting cognitive biases into the process with multiple
    devils' advocates, recognizing that one person cannot see the evidence as an opponent
    would when the difference in frameworks is basic, so an advocate who is not a
    true devil is of limited value.
  derived_from_claims:
  - C01030
  - C01031
  - C01032
  - C01095
  - C02871
  - C02872
