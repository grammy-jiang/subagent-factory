- principle_id: P003
  statement: Use the attempt to specify disconfirming evidence to reveal when an image
    is in fact invulnerable to most events, as with an unrecognized inherent-bad-faith
    model, and treat as a warning sign that the opposite of an observed event would
    have been read as supporting the same conclusion, while accepting that explicit
    prediction has severe limits because facts admit multiple interpretations and
    good theories yield only probabilistic predictions.
