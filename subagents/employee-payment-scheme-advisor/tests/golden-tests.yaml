schema_version: golden-tests-v1
subagent_slug: employee-payment-scheme-advisor
generated_at: "2026-06-12T12:00:00+00:00"
profile_version: "0.3.0"
source_id: payment-systems-and-20260612115310

golden_tests:
  - test_id: GT-001
    description: >-
      Positive routing — advise mode (how to design an incentive scheme through
      participation)
    prompt: >
      We are introducing a new productivity bonus for our shop-floor and supervisory
      staff. How should we involve employees in designing and rolling it out so that it
      actually improves output rather than being resented?
    expected_route: invoke
    expected_mode: advise
    must_ask_for: []
    minimum_output: >-
      Prescriptive guidance that names specific participative actions (such as forming
      cross-level working groups) and explains the link between participation,
      productivity, and reward, grounded in the source's evidence.
      [anchor: payment-systems-and-20260612115310-h0008,
      payment-systems-and-20260612115310-h0009]
    must_not_do:
      - >-
        Present the bonus formula or scheme structure as the primary driver of success
        [anchor: payment-systems-and-20260612115310-h0006]
      - >-
        Treat the extra pay as the motivator rather than as a reward for improved
        performance [anchor: payment-systems-and-20260612115310-h0016]
      - Hallucinate organisation details not provided by the caller

  - test_id: GT-002
    description: >-
      Positive routing — review mode (existing scheme underperformed; scheme
      modification/subversion failure mode)
    prompt: >
      Our piecework incentive scheme has been in place for two years but productivity
      has drifted back to where it started and managers seem to be quietly working around
      it. Can you review what is going wrong?
    expected_route: invoke
    expected_mode: review
    must_ask_for: []
    minimum_output: >-
      A critique that identifies weak consultation, missing operating controls, or scheme
      subversion/decay, each tied to a named failure mode from the source, with a
      concrete corrective recommendation.
      [anchor: payment-systems-and-20260612115310-h0007]
    must_not_do:
      - >-
        Blame only the pay rate or scheme structure without examining the participative
        process [anchor: payment-systems-and-20260612115310-h0006]
      - >-
        Approve the scheme as sound without checking for subversion or policy decay
        [anchor: payment-systems-and-20260612115310-h0007]

  - test_id: GT-003
    description: >-
      Positive routing — validate mode (check a proposed scheme against success criteria
      before site-wide extension)
    prompt: >
      Before we extend this incentive scheme from the pilot department to the whole site,
      can you check it against what is known to make these schemes succeed?
    expected_route: invoke
    expected_mode: validate
    must_ask_for: []
    minimum_output: >-
      A pass-or-concern judgement against the criteria that scheme success follows from
      consultation and from having the necessary operating systems and controls, naming
      the specific gaps if any.
      [anchor: payment-systems-and-20260612115310-h0006,
      payment-systems-and-20260612115310-h0007]
    must_not_do:
      - >-
        Wave the scheme through without assessing the extent of consultation
        [anchor: payment-systems-and-20260612115310-h0006]
      - >-
        Ignore whether the operating systems and controls needed for the scheme are in
        place [anchor: payment-systems-and-20260612115310-h0007]

negative_routing_tests:
  - test_id: NR-001
    description: >-
      Negative routing — technical/financial payment-processing system (the
      role-inference trap)
    prompt: >
      We are designing the payment system for our e-commerce platform and need to choose
      how to handle card transactions, settlement, and refunds reliably at scale. How
      should we architect it?
    expected_route: do_not_invoke
    expected_mode: null
    must_ask_for: []
    minimum_output: >-
      Explanation that this advisor covers employee incentive and reward schemes, not
      technical or financial payment-processing systems, which are outside its scope.
      [anchor: payment-systems-and-20260612115310-h0005]
    must_not_do:
      - Offer a transaction-processing or settlement architecture
      - >-
        Reframe a fintech question as an employee-reward question to justify invocation

  - test_id: NR-002
    description: >-
      Negative routing — collective-bargaining dispute (source assigns to negotiation
      channels, not participative team design)
    prompt: >
      The union and management are at an impasse over the annual cost-of-living pay rise
      and are heading for arbitration. Can you decide what the settlement should be?
    expected_route: do_not_invoke
    expected_mode: null
    must_ask_for: []
    minimum_output: >-
      Explanation that fundamental management-workforce pay disputes belong to normal
      negotiation channels rather than participative scheme design, per the source.
      [anchor: payment-systems-and-20260612115310-h0010]
    must_not_do:
      - Propose a settlement figure
      - >-
        Pull the dispute into participative team design against the source's boundary
        rule [anchor: payment-systems-and-20260612115310-h0010]

missing_context_tests:
  - test_id: MC-001
    description: >-
      Missing required input — request with no scheme description or organisation context
    prompt: >
      Can you advise on our incentive scheme?
    expected_route: invoke
    expected_mode: advise
    must_ask_for:
      - >-
        A description of the payment or incentive scheme (its purpose and current or
        proposed form) and the organisation context — the staff levels and sections
        affected, how their work is interdependent, and the productivity outcome sought.
    minimum_output: >-
      Clear statement that the advice cannot proceed without a description of the scheme
      and the organisation context, and a specific request for them.
    must_not_do:
      - Proceed as if a scheme and context had been provided
      - Hallucinate the scheme or the organisation and advise on that instead
