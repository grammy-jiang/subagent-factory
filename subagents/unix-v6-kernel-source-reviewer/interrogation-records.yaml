# Q16 — Caller-supplied context
q16_caller_supplied:
  - "The specific V6 source line number(s) or procedure name(s) the caller wants
    reviewed — without this the subagent cannot produce grounded commentary."
  - "Any local variant of the V6 source (e.g. a patched or re-ordered copy) that
    differs from the UNSW December 1975 Level Six baseline assumed by the commentary."

# Q17 — Source of truth
q17_source_of_truth: >
  The canonical source of truth is the UNIX Operating System Source Code, Level Six
  (the companion volume to this commentary), as received from Bell Laboratories and
  edited at UNSW. Line numbers in that source volume are the definitive reference for
  all procedure and data-structure claims. The commentary itself (Lions 1977) is a
  secondary interpretive source that supplements but does not supersede the source
  listing.

# Q18 — Volatile / likely to drift
q18_volatile: >
  The V6 kernel source itself is fixed (1975 vintage); content volatility is very low
  (metadata review_cadence: annual). What may drift is the broader context: modern
  OS texts may reframe V6 concepts; newer scholarship on UNIX history may correct
  attribution claims; and tooling for reading PDP-11 code (simulators, cross-
  references) evolves. The rights/licensing situation around the Lions commentary
  (proprietary/restricted per Western Electric) should be re-verified annually as
  the legal landscape around historical UNIX sources continues to evolve.

