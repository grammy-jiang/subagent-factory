  - C01803
  - C01809
  - C01810
  confidence: high
  applies_when:
  - planning an experiment or defining an MVP
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P004
  statement: Avoid the build trap of measuring success by outputs (features shipped)
    rather than the outcomes and value they produce, because a solution-first mindset
    produces output but rarely outcomes and customers do not care about most feature
    releases; product strategy lives in the opportunity space and emerges from decisions
    about which outcomes, customers, and opportunities to pursue, not from prioritizing
    features.
  derived_from_claims:
  - C00400
  - C00401
  - C00413
  - C00552
  - C00553
  - C00554
  - C01081
  - C01106
  - C01109
  - C01113
