- principle_id: P010
  statement: Aim for a product that is valuable (to company and customers), usable
    (by its users), and feasible (to build with the time and tools available) — the
    intersection of all three — and find that sweet spot with a small cross-functional
    discovery team (two to four people led by a product owner, including someone who
    knows users and can prototype the UI and a senior engineer who knows the architecture);
    this 'triad' is named for the three concerns, not three bodies, the most innovative
    solutions often come from an engineer given business and user insight, and the
    team must coordinate with the development team, stakeholders, subject-matter experts,
    and users.
  derived_from_claims:
  - C00003
