- principle_id: P016
  statement: 'Adopt a customer-centric mindset that elevates customer value to a peer
    goal of business value: profit should not come at the customer''s expense, because
    serving customer needs is how the company generates profit, and a trio can otherwise
    hit an outcome by shortcuts that create business value at the customer''s expense.'
