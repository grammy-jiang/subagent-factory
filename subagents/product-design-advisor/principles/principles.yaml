  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P012
  statement: Learning you were wrong after a couple of days is excellent news versus
    after weeks of building, so celebrate what you learn rather than fear being wrong
    — failing to learn is frequently the biggest failure — and use stories faster
    and less formally in discovery (prototypes in hours, code prototypes in days),
    expecting most ideas to fail or need adjustment.
