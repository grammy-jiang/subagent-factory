- principle_id: P030
  statement: 'Choose prototype fidelity by the tradeoffs of each level: paper (fast,
    cheap, high-level flow only, good for touch), clickable wireframes (real click
    and tap insight into workflow and findability but readable as unfinished), mid-
    and high-fidelity (near-final visuals and interactions but limited versus native
    and costly to keep in sync), and coded prototypes (highest realism and, in live-data
    form, real analytics and A/B testing, but slow to build and tempting to over-perfect);
    trial several tools because no list is comprehensive.'
