- principle_id: P006
  statement: 'Manage stakeholders and dependencies with proactive communication, because
    outcome-focused teams plan only small batches (which unsettles managers who want
    a long plan) and abandoning the roadmap removes a coordination tool: proactively
    tell owners and executives how the work is going, what you tried and learned,
    and what is next (framed on outcomes); reach out to uninvolved parts of the organization
    (support, marketing, parallel units, sales) so they stay informed and less resistant
    and you learn their plans; and give dependent departments and customers advance
    notice of significant changes, letting customers opt out at least temporarily.'
  derived_from_claims:
  - C00708
  - C01895
  - C01896
  - C01897
  - C01898
  - C01931
  - C01932
  - C01933
