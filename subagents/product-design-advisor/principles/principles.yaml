    skill: null
    reference: null
    test_cases: []
- principle_id: P011
  statement: Story-map an idea by assuming the solution already exists and mapping
    what end-users do to get value (not what it takes to implement), identifying every
    actor who must interact (including the software or interface itself) and sequencing
    their steps along the successful path; map the best solution you can from what
    you know today and refine it as you test.
