    while two-way-door decisions (easy to reverse, like choosing a target opportunity
    to explore) warrant deciding fast and learning by acting; time-box reversible
    prioritization decisions (an hour or two, at most a day or two), use all four
    factor lenses rather than over-relying on one, and enter the assessment with an
    open mind rather than working backward from a foregone conclusion, because framing
