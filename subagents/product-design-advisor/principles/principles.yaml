schema_version: principles-v1
principles:
- principle_id: P001
  statement: Treat human control and computer automation as independent design dimensions,
    and deliberately look for high-automation designs that still preserve meaningful
    human control.
  derived_from_claims:
  - C02050
  - C02051
  - C02052
  - C02066
  - C02111
  - C02112
  - C02113
  - C02153
  - C02154
  - C02155
  - C02156
  confidence: high
  applies_when:
  - framing or reviewing an AI/automation system's overall control model
  - someone argues that more automation must mean less human control
  - when choosing or critiquing an automation strategy
  - Selecting an automation strategy or deciding how much authority an AI system should
    have.
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P002
  statement: 'Shift the organization from output to outcomes: measure success by progress
    toward specific outcomes (a leadership activity), empower teams to decide which
    features create the required outcomes, propagate the feature-to-outcome conversation
    to the highest levels, and replace product roadmaps with hypothesis backlogs prioritized
    by risk, feasibility, and potential success while retraining managers to grant
    latitude to experiment.'
  derived_from_claims:
  - C00438
  - C00439
  - C00860
  - C01900
  - C01901
  - C01902
  confidence: high
  applies_when:
  - deciding how to direct a product team's work
  - a solution is well underway but may not fit the strategy
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P003
  statement: 'Treat every design as a testable hypothesis and validate it as efficiently
    as possible with customer feedback before investing further: build the smallest
    possible MVP (which need not be code, and may be sketches, prototypes, copy, or
    visual design) inside a build-measure-learn loop, run experiments whose outcomes
    tell you whether to pursue, refine, or abandon the direction, and treat the MVP
    as a disposable learning tool while clarifying whether it is built to learn or
    to deliver value.'
  derived_from_claims:
  - C00968
  - C00969
  - C00970
  - C00971
  - C00972
  - C01686
  - C01706
  - C01707
  - C01708
  - C01801
