  applies_when:
  - defining what success means for a team or initiative
  - setting product strategy or measuring success
  - prioritizing work
  - defining success metrics
  - a team measures success by features shipped or velocity
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
