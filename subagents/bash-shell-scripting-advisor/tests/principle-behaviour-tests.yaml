- test_id: PB-P001
  principle_id: P001
  mode: review
  prompt: We are reviewing shell or command-line work where passing data via the environment. What do
    you advise, and what is the trade-off, portability, or version caveat?
  expected_behaviour:
  - 'Applies the principle: Know that a variable assignment prefixed to a command scopes differently by
    target: before an ordinary utility it is exported only for that command, before a special built-in
    it persists in the current environment, before a function it applies during the call with unspecified
    persistence afterward, and any assignment to a readonly variable is an error.'
  - Names the shell hazard and the failure it enables, and states the trade-off, portability, or version
    caveat.
  - Cites P001.
  must_not:
