- principle_id: P007
  statement: 'Double-quote expansions to control field splitting: only the unquoted
    results of parameter expansion, command substitution, and arithmetic expansion
    are split, IFS drives how they split (with a null IFS disabling splitting entirely),
    so quoting is the primary defence against accidental word-splitting.'
