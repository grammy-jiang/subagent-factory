  applies_when:
  - expanding a variable or command substitution that will be used as data, a filename,
    or an argument
  - any parameter expansion or command substitution
  - a value may contain whitespace or special characters
  - Writing commands that include user data, filenames, or generated output.
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P005
  statement: 'Quote every character that has special meaning to the shell when it
    must be literal, and pick the quoting mechanism by its scope: single-quotes preserve
    everything (and cannot contain a single-quote), double-quotes preserve everything
    except the dollar-sign, backquote, and backslash, and an unquoted backslash escapes
    just the next character.'
