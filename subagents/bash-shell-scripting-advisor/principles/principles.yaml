- principle_id: P004
  statement: Double-quote every parameter expansion and command substitution used
    as data (filenames, arguments, test operands); unquoted, they undergo word splitting
    on $IFS and pathname expansion (globbing), corrupting any value that contains
    whitespace or glob characters. Note that quotes nest across a `$(...)` boundary
    as a separate pair.
