  - chaining commands conditionally on success or failure
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P018
  statement: Each stage of a pipeline runs in a separate subshell, so variables modified
    inside `... | while` do not persist afterward; POSIX leaves whether the last stage
    is a subshell unspecified (lastpipe/ksh93 differ), so do not depend on it — feed
    the loop with process substitution or `read` instead.
  derived_from_claims:
  - C00037
  - C00083
  - C00084
  - C00297
  - C00298
  - C00299
  confidence: high
  applies_when:
  - a loop or assignment on the right-hand side of a pipe must set variables the rest
    of the script reads
  - a piped command sets a variable you need, or a pipeline grows long
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P019
  statement: 'Move filenames between tools NUL-delimited: `find -print0 | xargs -0`,
    `printf ''%s\0''`, or `find -exec cmd {} +` — never bare `xargs`, which splits
    on whitespace and mishandles quotes; and pass `{}` to `find -exec sh -c` as a
    positional argument (`sh -c ''... "$1"'' x {}`), never interpolated into the code,
    which is a command-injection vector.'
  derived_from_claims:
  - C00132
  - C00135
  - C00252
  - C01022
  - C01023
  - C01024
  confidence: high
  applies_when:
  - piping filenames to another command, or running a shell per found file
  - parsing a stream of filenames into elements
  - When passing filesystem paths from find to another command.
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P020
  statement: 'Quoting changes matching semantics: in `[[ ]]` the RHS of `=`/`==` is
    a glob pattern (quote it for a literal compare) and the RHS of `=~` is a regex
    (quote it for a literal, or store a long regex in a variable); `>`/`<` in `[[
    ]]` compare by string collation, not numerically.'
