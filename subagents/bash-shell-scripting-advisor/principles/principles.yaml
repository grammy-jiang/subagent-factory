  - C01711
  - C01712
  - C03338
  - C03339
  confidence: high
  applies_when:
  - you need parameters, recursion, or scripting
  - a script or reviewer is considering aliases as a mechanism for reusable behaviour
  - Customizing interactive shell commands.
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
