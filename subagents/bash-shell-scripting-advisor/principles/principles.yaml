  applies_when:
  - comparing a string against a fixed value, pattern, or regex in [[ ]]
  - matching a string against a regular expression in [[ ]]
  - using = or == inside [[ ]]
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P021
  statement: 'Combine stdout and stderr in the correct order: >file 2>&1 duplicates
    the stdout FD into stderr (shared file position, no clobber), whereas 2>&1 >file
    leaves errors on the terminal, and >file 2>file must never be used (two independent
    FDs clobber each other).'
