schema_version: principles-v1
principles:
- principle_id: P001
  statement: 'Know that a variable assignment prefixed to a command scopes differently
    by target: before an ordinary utility it is exported only for that command, before
    a special built-in it persists in the current environment, before a function it
    applies during the call with unspecified persistence afterward, and any assignment
    to a readonly variable is an error.'
  derived_from_claims:
  - C00182
  - C00273
  - C00275
  - C00276
  - C00472
  - C00476
  - C00504
  - C01777
  - C01778
  - C01779
  - C01939
  - C01940
  - C01941
  - C02720
  - C02721
  - C02722
  - C02723
  - C02724
  - C02725
  confidence: high
  applies_when:
  - passing data via the environment
  - prefixing VAR=value to a command and reasoning about whether it persists
  - When configuring commands through environment variables.
  - Configuring environment for commands or child processes.
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P002
  statement: 'Do not rely on aliases for script logic: alias substitution applies
    only to the command-name word of a simple command, never to reserved words in
    context, is not inherited by separate shell invocations or utility environments,
    and only chains to the next word when the alias value ends in a blank.'
