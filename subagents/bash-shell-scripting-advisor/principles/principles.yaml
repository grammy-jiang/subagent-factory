  - using the [ / test command
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P017
  statement: 'Use && and || for short-circuit control flow: after && the next command
    runs only if the previous succeeded, after || only if it failed, commands are
    expanded only when they are actually executed, and the list status is that of
    the last command executed.'
  derived_from_claims:
  - C00357
  - C00358
  - C01128
  - C01129
  - C01130
  - C01798
  - C01799
