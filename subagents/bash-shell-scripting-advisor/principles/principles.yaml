- principle_id: P013
  statement: 'Use the correct interpreter: put #!/usr/bin/env bash on the very first
    line of a Bash script (never omit it or use #!/bin/sh, which forces POSIX features
    even when /bin/sh is really Bash); running via ./script uses the shebang while
    ''bash script'' ignores it; keep LF-only line endings and do not add a .sh extension.'
