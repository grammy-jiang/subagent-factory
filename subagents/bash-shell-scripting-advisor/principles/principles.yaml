  - When variables or command output become command arguments.
  - an expansion result may contain IFS characters and must remain a single field
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P008
  statement: Apply a single redirection to a whole compound command (a loop's done
    or a { } group) to redirect every command inside it; Bash opens the file once
