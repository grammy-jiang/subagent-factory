    test_cases: []
- principle_id: P016
  statement: 'Write robust ''test''/''['' conditions: give each operator and operand
    as a separate argument (with a closing '']''), quote operands because a one-argument
    test is true for any non-null string, and restrict each test to a single primary
    combined with ''&&''/''||'' instead of the POSIX-deprecated ''-a'', ''-o'', and
    parentheses.'
  derived_from_claims:
  - C00076
  - C00077
  - C00214
  - C00218
  - C00320
  - C00512
  - C00513
  - C00514
