  applies_when:
  - creating or packaging a skill
  - authoring and uploading a custom Skill
  - creating a new skill by hand or reviewing a skill's layout
  - creating or refining a skill
  - creating or structuring an agent skill
  - Authoring or reviewing a Claude skill package.
  - Authoring or reviewing an Agent Skill package
  - creating or scaffolding a new agent skill
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P002
  statement: 'Design Skills for three-tier progressive disclosure: keep only a short
    name+description in frontmatter (always loaded), put working instructions in SKILL.md
    (loaded when the skill is judged relevant), and push bulk detail into a references/
    directory loaded only on demand — so an agent can hold hundreds of skills without
    exhausting its context window.'
