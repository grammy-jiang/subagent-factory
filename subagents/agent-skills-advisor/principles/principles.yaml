schema_version: principles-v1
principles:
- principle_id: P001
  statement: 'Package every skill as a minimal, valid skill folder: the entry file
    is exactly SKILL.md, the folder name is kebab-case, README.md stays outside the
    skill folder, and scripts, references, or assets are included only when they serve
    the workflow.'
