principle_behaviour_tests:
- test_id: PB-P001
  principle_id: P001
  mode: advise
  prompt: I'm working on an Agent Skills question where creating or packaging a skill is at issue (authoring agent skills). What should I check for, what is the fix, and what residual trade-off or referral should I carry?
  expected_behaviour:
  - 'Applies the principle: Package every skill as a minimal, valid skill folder.'
  - Names the specific skill mechanism and the correction, and states the residual trade-off or referral.
  - Cites P001.
  must_not:
  - Invents a frontmatter field, beta header, CLI flag, install path, or permission token not present in the sources.
  - Writes the caller's domain feature or asserts the skill is effective without an evaluation.
