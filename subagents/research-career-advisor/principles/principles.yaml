  - a contribution can stand as an independent piece of work
  - building an early-career record around a multi-year goal
  - an advance is independently defensible and useful
  - uncertainty is intrinsic to the proposed research
  - initial plans encounter a dead end or an unanticipated opportunity
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P018
  statement: Develop tacit professional and systems judgment through technically grounded
    practice, varied cases, mixed-experience work, and timely critique that preserves
