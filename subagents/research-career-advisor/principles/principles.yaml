schema_version: principles-v1
principles:
- principle_id: P001
  statement: Brainstorm without immediate judgment, preserve every candidate, and
    reveal existing solutions only after participants have independently attacked
    the problem.
  derived_from_claims:
  - C00187
  - C00188
  - C00193
  - C00196
  - C00197
  - C00431
  - C00432
  - C00602
  confidence: medium
  applies_when:
  - An apparent solution arises through intuition, analogy, or incubation
  - Prior knowledge suggests a partial structural relation to the current problem
  - Generating candidate problems or solutions collaboratively
  - An experiment is being designed or reviewed for diagnostic value.
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P002
  statement: Build a research talk as one rehearsed scientific story whose opening
    establishes the question, context, and importance at a depth appropriate to the
    audience, then connects methods and results to their significance.
  derived_from_claims:
  - C00011
  - C00012
  - C00013
  - C00014
  - C00015
  - C00047
  - C00048
  - C00049
  - C00405
  confidence: medium
  applies_when:
  - presenting research to a mixed scientific audience
  - preparing for a consequential presentation
  - preparing an oral research presentation
  - deciding how much background the audience needs
  - Writing a manuscript
  - Presenting research
  - Teaching
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P003
  statement: Before submission, expose every premise and logical link, distinguish
    assumptions from established results, and disclose known weaknesses rather than
    strengthening claims beyond the evidence.
  derived_from_claims:
  - C00041
  - C00042
  - C00058
  - C00063
  - C00073
  - C00074
  - C00075
  - C00308
  - C00309
  confidence: medium
  applies_when:
  - timely dissemination matters
  - working under an early-career time constraint
  - deciding whether a manuscript is ready for submission
  - revising a manuscript before submission
  - an argument contains uncertain or incomplete links
  - a publishable result has a recognized weakness
  - Uncertainty and time prevent both perfect diagnosis and perfect execution
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P004
  statement: 'Use collaboration without surrendering research identity: contribute
    distinctive ideas, clarify authority and credit when incentives overlap, and also
    initiate work that the community can recognize as your own.'
  derived_from_claims:
  - C00023
  - C00024
  - C00154
  - C00155
  - C00156
  - C00388
  - C00389
  - C00463
  confidence: medium
  applies_when:
  - deciding whether to form a research collaboration
  - collaborators' roles or career incentives overlap
  - transitioning from trainee to independent researcher
  - collaborating with an established researcher
  - collaboration is intended to demonstrate scientific independence
  - Judging work in natural science or engineering
  - Forming or evaluating a research collaboration
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P005
  statement: Build an early-career grant around important, achievable projects, treating
    a major long-term idea as exploratory and including enough advanced work to demonstrate
    results within the award cycle.
  derived_from_claims:
  - C00124
  - C00125
  - C00126
  - C00536
  - C00537
  - C00538
  - C00539
  - C00540
  confidence: medium
  applies_when:
  - the applicant lacks an established record of delivering large programs
  - the funding term is short or nonresearch duties limit available time
  - Preparing a competitive research-funding application
  - Drafting a grant title, abstract, and objectives
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P006
  statement: Make a paper's significance discoverable at every entry point with an
    accurate title, a brief results-focused abstract, and an introduction that explains
    the question, contribution, and change in understanding.
  derived_from_claims:
  - C00066
  - C00067
  - C00068
  - C00069
  - C00070
  - C00499
  - C00505
  confidence: medium
  applies_when:
  - communicating a significant result in a scientific paper
  - drafting the title, abstract, or introduction
  - Naming a manuscript
  - Closing a research paper
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P007
  statement: Communicate important ideas through formal talks, written reports, and
    timely informal explanation; improve by critiquing real presentations and adapting
    effective techniques.
  derived_from_claims:
  - C00050
  - C00051
  - C00052
  - C00380
  - C00381
  - C00383
  confidence: medium
  applies_when:
  - preparing and delivering a timed scientific talk
  - a presentation contains more material than its indispensable core
  - A new idea requires understanding or adoption by others
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P008
  statement: Preserve reproducibility without sacrificing readability by publishing
    the methodological detail needed for independent evaluation and separating optional
    specialist depth from the main argument.
  derived_from_claims:
  - C00065
  - C00076
  - C00077
  - C00133
  - C00134
  - C00471
  confidence: medium
  applies_when:
  - reporting significant empirical or computational research
  - optional derivations or procedures are needed by specialists
  - arguing that proposed objectives can be achieved
  - feasibility depends on a method unfamiliar to reviewers
  - Writing and publishing scholarly work
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P009
  statement: Obtain demanding local review before submission, including language editing
    when needed, and treat a referee's misunderstanding as a prompt to improve exposition
    unless it reveals a substantive research flaw.
  derived_from_claims:
  - C00083
  - C00084
  - C00085
  - C00484
  - C00485
  confidence: medium
  applies_when:
  - preparing a manuscript for journal submission
  - the author does not command the publication language professionally
  - a referee appears to misunderstand a correct result
  - A venue permits a rebuttal or requests a revision
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P010
  statement: Prefer an established adviser when other mentoring qualities are comparable,
    but choose the adviser who actually protects access, guidance, continuity, and
    independent recognition.
  derived_from_claims:
  - C00029
  - C00039
  - C00408
  - C00409
  confidence: medium
  applies_when:
  - mentoring quality is otherwise comparable
  - Selecting a graduate research adviser
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P011
  statement: Research the prospective group, ask informed questions, and explain a
    genuine complement between the candidate's goals and the group's work; prepare
    the teaching contribution as well for faculty roles.
  derived_from_claims:
  - C00109
  - C00110
  - C00111
  - C00535
  confidence: medium
  applies_when:
  - before and during a scientific job interview
  - applying for a professorial role that includes teaching
  - Integrating teaching into an academic research role
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P012
  statement: Prefer a small portfolio of high-quality, influential papers over fragmenting
    a strong contribution into many weak publications.
  derived_from_claims:
  - C00072
  - C00467
  confidence: medium
  applies_when:
  - placing a paper's contribution in the existing literature
  - Choosing a publication strategy
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P013
  statement: Build a doctoral dissertation as a coherent, logically ordered body of
    substantial advances around one explicit thesis, excluding unrelated or merely
    incremental work and supplying the problem, prior solutions, candidate contribution,
    and necessary evidence.
  derived_from_claims:
  - C00406
  - C00407
  - C00410
  - C00411
  - C00412
  - C00413
  - C00414
  - C00416
  - C00417
  - C00522
  - C00523
  - C00524
  - C00525
  - C00528
  - C00529
  - C00530
  confidence: medium
  applies_when:
  - Defining or evaluating a doctoral thesis agenda
  - Planning, drafting, or evaluating a doctoral dissertation
  - Training or assessing a doctoral researcher
  - Preparing a doctoral proposal or confirmation review
  - The central thesis is clear before accumulated studies are organized
  - Structuring and rehearsing a doctoral-defense presentation
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P014
  statement: Assume reported precision may be optimistic until the uncertainty process
    accounts for apparatus tuning and selection effects and is checked by independent,
    holdout, or later measurements.
  derived_from_claims:
  - C00228
  - C00234
  - C00241
  - C00242
  - C00243
  - C00244
  - C00245
  - C00246
  - C00249
  - C00250
  confidence: medium
  applies_when:
  - Experimental setup and selection can affect the observations used to estimate
    uncertainty
  - A decision combines inputs with substantially different reliability
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P015
  statement: Orient a scientific program around consequential questions the researcher
    can explain and partly own; let those problems determine the techniques, learning
    capabilities central to independence, collaborating for others, and honoring commitments
    when changing methods.
  derived_from_claims:
  - C00009
  - C00010
  - C00019
  - C00020
  - C00021
  - C00071
  - C00140
  - C00141
  - C00147
  confidence: medium
  applies_when:
  - during graduate or postdoctoral research
  - entering a new field
  - selecting a research problem
  - choosing or revising a scientific program
  - another researcher can supply a distinct capability with clear roles
  - the initial technique no longer anchors the most important available problems
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P016
  statement: Research prospective colleagues and present evidence of initiative, intellectual
    leadership, collegiality, and a concrete first two-to-three-year agenda rather
