  applies_when:
  - preparing for a research job interview
  - applying or interviewing for a scientific position
  - a prior contribution offers credible follow-on work
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P017
  statement: Decompose a long research agenda into complete, distinct, publishable
