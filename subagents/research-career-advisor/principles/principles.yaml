  applies_when:
  - launching an early-career research program
  - working under a time-limited appointment
  - an appointment includes a high-risk, long-duration project
  - working under a fixed-term appointment
  - an adviser proposes work whose duration approaches or exceeds the appointment
  - leaving an assignment unlikely to yield timely, credited output
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P020
