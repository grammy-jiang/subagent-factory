- principle_id: P144
  statement: Never modify product or brand names even when they look funny, ungrammatical,
    or wrong, because they are proper names central to the product's identity and
    to its copyright protection (based on a specific spelling); transfer a specific
    brand named for a reason unmodified, and transcribe an internationally recognized
    brand exactly as in the source.
