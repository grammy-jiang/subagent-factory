- principle_id: P141
  statement: 'On spotting an apparent error, notify the client and choose — by the
    text''s length, subject, deadline, and the client''s preference — whether to raise
    queries as you go or at delivery; handle errors by type: fix simple linguistic
    errors quietly, refer completely incomprehensible meaning to the client, fix minor
    factual errors but notify the client, and even for a serious error you are certain
    of, still contact the client for clarification.'
