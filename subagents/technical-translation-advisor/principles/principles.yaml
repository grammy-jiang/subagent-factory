- principle_id: P035
  statement: Establish whether the job is an instrumental translation (used in place
    of the source as a freestanding target text — so errors must be corrected) or
    a documentary translation (describing what the source said and how, as in back-translation
    or judicial use — so errors are preserved and shown, and back-translation is a
    limited quality check); in an instrumental translation the translator, as the
    expert, corrects simple linguistic errors, incorrect line breaks, text-versus-diagram
    mismatches, and obviously wrong units of measure (e.g. a 250 kg tablet where kg
    should be mg).
