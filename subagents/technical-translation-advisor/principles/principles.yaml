- principle_id: P145
  statement: For a brand unknown in the target culture, do not blindly substitute
    a comparable target brand, since the two products may differ in characteristics
    or composition with consequences for repeatability or safety (e.g. in a chemistry
    paper); research first, then in specialist texts reproduce the brand name plus
    a brief function phrase, and in general texts use a comparable product qualified
    with 'such as' (to avoid implying endorsement) or a generic description.
