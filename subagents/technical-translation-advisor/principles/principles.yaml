- principle_id: P142
  statement: 'Recognize and handle program code without being a programmer: commands
    and arguments resemble English words, but words written entirely in uppercase
    and multi-word tokens joined without spaces or by underscores (e.g. MENUITEM,
    Style_Caption) are usually non-translatable identifiers to leave unchanged, and
    in localization the translatable part is the on-screen strings.'
