- principle_id: P146
  statement: Translate warning and advisory information with particular care — it
    can be a matter of life or death and carries legal weight — and apply a notice
    severity hierarchy deliberately — Byrne illustrates one convention (Note; Warning
    for minor injury; Caution for equipment or data damage; Danger for serious or fatal
    injury), but the governing signal-word ordering and definitions vary by market and
    standard (for example ANSI Z535 in the US or ISO 3864 internationally), so verify
    the correct hierarchy against the standard in force for the target market rather
    than assuming Byrne's ordering — neither understating risk (so readers do not dismiss
    it) nor overstating it (using the highest level where a lower one fits dilutes its
    impact when truly needed).
  derived_from_claims:
  - C00820
