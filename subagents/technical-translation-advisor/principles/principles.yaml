- principle_id: P143
  statement: 'Respect the syntax that runtime variables impose: where a string has
    two identical variables (e.g. ''Click %s to update %s''), preserve their order
    and rework the translation around it or the substitution will be wrong; and where
    a language lacks a consistent plural marker, replace plural variables with a rendering
    covering both forms (e.g. batch(es)), consulting the client or project manager
    when in doubt.'
