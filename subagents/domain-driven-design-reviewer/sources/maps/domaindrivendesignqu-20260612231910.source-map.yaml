# ══════════════════════════════════════════════════════════════════
# CANDIDATE UNITS
# All statements are paraphrases (distillation-only source).
# ══════════════════════════════════════════════════════════════════
candidate_units:

  # ── s1_1: Software Must Reflect Its Domain ──
  - unit_id: u001
    node_id: s1_1
    statement: >-
      Software originates from and remains deeply connected to its domain; the
      primary purpose of any software system is to serve a specific real-world
      domain, so design must start there.
    source_anchors:
      - domaindrivendesignqu-20260612231910-h0008
    salience: 0.88

  - unit_id: u002
    node_id: s1_1
    statement: >-
      To make software fit harmoniously with its domain, developers should model
      the software as a direct reflection of the domain — capturing its core
      concepts, elements, and relationships precisely.
    source_anchors:
      - domaindrivendesignqu-20260612231910-h0008
    salience: 0.90

  # ── s1_2: The Domain Model as Abstraction ──
  - unit_id: u003
    node_id: s1_2
    statement: >-
      A domain model is not a particular diagram but the idea the diagram is
      intended to convey; it is a rigorously organized, selective abstraction of
      knowledge drawn from domain experts, not merely what lives in an expert's
      head.
    source_anchors:
      - domaindrivendesignqu-20260612231910-h0008
    salience: 0.92

  - unit_id: u004
    node_id: s1_2
    statement: >-
      The model is the internal representation of the target domain and is
      essential throughout design and development; without an explicit model,
      complexity becomes unmanageable and software cannot evolve with the domain.
    source_anchors:
      - domaindrivendesignqu-20260612231910-h0008
    salience: 0.90

  - unit_id: u005
    node_id: s1_2
    statement: >-
      The model must be communicated — through diagrams, writing, and a shared
      language — because it is the essence of the software and must be understood
      by both domain experts and developers.
    source_anchors:
      - domaindrivendesignqu-20260612231910-h0008
    salience: 0.88

  # ── s1_3: DDD vs. Waterfall and Agile ──
  - unit_id: u006
    node_id: s1_3
    statement: >-
      DDD combines design and development practice so that design accelerates
      development and feedback from development continuously enhances the design,
      addressing the one-way information flow weakness of waterfall approaches.
    source_anchors:
      - domaindrivendesignqu-20260612231910-h0006
    salience: 0.62

  # ── s2_1: Collaborative Discovery with Domain Experts ──
  - unit_id: u007
    node_id: s2_1
    statement: >-
      Domain knowledge must be built collaboratively between software specialists
      and domain experts through sustained dialogue; domain experts possess the
      essential domain knowledge, while software specialists provide the
      analytical structure needed to transform it into a model.
    source_anchors:
      - domaindrivendesignqu-20260612231910-h0010
    salience: 0.85

  - unit_id: u008
    node_id: s2_1
    statement: >-
      In early conversations with domain experts, the software specialist should
      ask questions to uncover essential concepts, extract key vocabulary, and
      identify the relationships between domain elements — even if those concepts
      initially emerge unpolished and disorganized.
    source_anchors:
      - domaindrivendesignqu-20260612231910-h0010
    salience: 0.84

  # ── s2_2: Iterative Model Refinement ──
  - unit_id: u009
    node_id: s2_2
    statement: >-
      The communication between domain experts and software specialists is
      bidirectional: domain experts supply knowledge, and the analytical
      perspective of software specialists helps surface key domain concepts and
      construct the structure of future discussions.
    source_anchors:
      - domaindrivendesignqu-20260612231910-h0010
    salience: 0.83

  - unit_id: u010
    node_id: s2_2
    statement: >-
      The domain model is created jointly by software specialists and domain
      experts; it is the place where these two areas of expertise meet, making
      the process time-consuming but necessary because the software must
      ultimately blend perfectly with the domain.
    source_anchors:
      - domaindrivendesignqu-20260612231910-h0010
    salience: 0.82

  # ── s3_1: The Need for a Common Language ──
  - unit_id: u011
    node_id: s3_1
    statement: >-
      A fundamental communication barrier exists between developers (who think in
      classes, patterns, and algorithms) and domain experts (who speak in
      domain-specific jargon); bridging this gap requires a deliberately
      constructed shared language.
    source_anchors:
      - domaindrivendesignqu-20260612231910-h0014
      - domaindrivendesignqu-20260612231910-h0015
    salience: 0.92

  - unit_id: u012
    node_id: s3_1
    statement: >-
      When terminology used in day-to-day team discussions is disconnected from
      the terminology embedded in the code, the most precise expressions of the
      domain emerge in a transient form that is never captured and team members
      cannot share knowledge reliably.
    source_anchors:
      - domaindrivendesignqu-20260612231910-h0015
    salience: 0.90

  - unit_id: u013
    node_id: s3_1
    statement: >-
      A core DDD principle: use a language based on the model as the backbone of
      all team communication; this language — the Ubiquitous Language — must be
      used consistently in all forms of communication including speech, writing,
      diagrams, and code.
    source_anchors:
      - domaindrivendesignqu-20260612231910-h0015
    salience: 0.95

  - unit_id: u014
    node_id: s3_1
    statement: >-
      A change in the Ubiquitous Language must become a change in the domain
      model, and vice versa; the language and the model are strongly
      interconnected and must evolve in lockstep.
    source_anchors:
      - domaindrivendesignqu-20260612231910-h0015
    salience: 0.92

  - unit_id: u015
    node_id: s3_1
    statement: >-
      Domain experts should object to terms or structures that fail to convey
      domain understanding, while developers should watch for ambiguity or
      inconsistency in design; both sides bear responsibility for the integrity
      of the Ubiquitous Language.
    source_anchors:
      - domaindrivendesignqu-20260612231910-h0015
    salience: 0.88

  # ── s3_2: Creating the Ubiquitous Language ──
  - unit_id: u016
    node_id: s3_2
    statement: >-
      The Ubiquitous Language is built through collaborative design sessions in
      which team members use key domain terms in bold, correct one another, and
      gradually converge on a shared vocabulary; all team members must stay
      focused on essentials and avoid private jargon.
    source_anchors:
      - domaindrivendesignqu-20260612231910-h0016
    salience: 0.90

  - unit_id: u017
    node_id: s3_2
    statement: >-
      Developers should implement the main concepts of the model in code — giving
      classes names drawn directly from the Ubiquitous Language — so that the
      code expresses the model, becomes more readable, and reproduces the
      language accurately.
    source_anchors:
      - domaindrivendesignqu-20260612231910-h0016
    salience: 0.88

  # ── s3_3: Communication Tools ──
  - unit_id: u018
    node_id: s3_3
    statement: >-
      Small focused diagrams covering a subset of the model, supplemented by
      explanatory text for behavior and constraints, are more effective than a
      single large diagram of the entire model, which typically becomes too
      cluttered to communicate clearly.
    source_anchors:
      - domaindrivendesignqu-20260612231910-h0016
    salience: 0.72

  - unit_id: u019
    node_id: s3_3
    statement: >-
      Documents used to communicate the model must remain in sync with the
      model; outdated documents that use incorrect language and no longer reflect
      the current model are not helpful and should be avoided.
    source_anchors:
      - domaindrivendesignqu-20260612231910-h0016
    salience: 0.70

  # ── s4_1: Why Analysis Models Diverge ──
  - unit_id: u020
    node_id: s4_1
    statement: >-
      When a separate analysis model is created without input from developers
      and then handed off for implementation, a growing divide opens between
      model and code; developers adapt or replace the model, domain knowledge is
      lost in translation, and the software drifts from what the model intended.
    source_anchors:
      - domaindrivendesignqu-20260612231910-h0018
    salience: 0.86

  - unit_id: u021
    node_id: s4_1
    statement: >-
      Analysts working independently cannot foresee all defects and intricacies
      of the domain; important details about object persistence, performance, and
      invariants are only discovered during design and implementation, making
      pure analysis models impractical.
    source_anchors:
      - domaindrivendesignqu-20260612231910-h0018
    salience: 0.82

  # ── s4_2: Closing the Model-Code Gap ──
  - unit_id: u022
    node_id: s4_2
    statement: >-
      Domain modeling and design must be closely related: the model should be
      constructed with an eye toward software and design considerations, and
      developers must be included in the modeling process to ensure the model can
      actually be implemented.
    source_anchors:
      - domaindrivendesignqu-20260612231910-h0018
    salience: 0.92

  - unit_id: u023
    node_id: s4_2
    statement: >-
      Those who write the code must know the model well and feel responsible for
      its integrity; a change to the code implies a change to the model, and
      refactoring code to the point where it no longer expresses the model is a
      design failure.
    source_anchors:
      - domaindrivendesignqu-20260612231910-h0018
    salience: 0.93

  - unit_id: u024
    node_id: s4_2
    statement: >-
      Any technical person contributing to the model must spend time touching the
      code, and every developer must be involved in some level of discussion about
      the model and have contact with domain experts; model ideas must be
      exchanged through the Ubiquitous Language.
    source_anchors:
      - domaindrivendesignqu-20260612231910-h0018
    salience: 0.88

  - unit_id: u025
    node_id: s4_2
    statement: >-
      A software system should be designed so that a portion of it literally
      reflects the domain model, making the mapping obvious; if the central part
      of the design does not map to the domain model, the model has little value
      and the software's correctness is suspect.
    source_anchors:
      - domaindrivendesignqu-20260612231910-h0018
    salience: 0.92

  # ── s5_1: Layered Architecture ──
  - unit_id: u026
    node_id: s5_1
    statement: >-
      A complex application should be partitioned into four conceptual layers:
      User Interface, Application, Domain, and Infrastructure; each layer depends
      only on layers below it, and the Domain Layer is isolated from UI,
      application, and infrastructure concerns.
    source_anchors:
      - domaindrivendesignqu-20260612231910-h0020
    salience: 0.90

  - unit_id: u027
    node_id: s5_1
    statement: >-
      Mixing domain-related code with other layers makes it extremely difficult
      to understand and modify business logic; changes to the UI can accidentally
      alter business rules, and implementing model-driven objects becomes
      impractical.
    source_anchors:
      - domaindrivendesignqu-20260612231910-h0020
    salience: 0.86

  - unit_id: u028
    node_id: s5_1
    statement: >-
      Concentrating all domain model code in a single isolated layer — free from
      display, storage, and application task responsibilities — allows the model
      to evolve into a rich representation capable of capturing essential business
      knowledge.
    source_anchors:
      - domaindrivendesignqu-20260612231910-h0020
    salience: 0.88

  # ── s5_2: Entities ──
  - unit_id: u029
    node_id: s5_2
    statement: >-
      An Entity is a domain object defined by its thread of identity and
      continuity across states, rather than by its attribute values; two objects
      with the same attributes are not the same Entity if they have different
      identities.
    source_anchors:
      - domaindrivendesignqu-20260612231910-h0022
    salience: 0.93

  - unit_id: u030
    node_id: s5_2
    statement: >-
      When an object is distinguished by its identity rather than its attributes,
      make identity primary to its model definition; define a means of
      distinguishing each object regardless of its form or history, and define an
      operation that produces a unique result per object.
    source_anchors:
      - domaindrivendesignqu-20260612231910-h0022
    salience: 0.90

  - unit_id: u031
    node_id: s5_2
    statement: >-
      Identity for an Entity may be an attribute, a combination of attributes, a
      specially created attribute, or even a behavior; the key requirement is
      that two objects with the same identity must be considered the same by the
      system, and mistaken identity leads to data corruption.
    source_anchors:
      - domaindrivendesignqu-20260612231910-h0022
    salience: 0.88

  # ── s5_3: Value Objects ──
  - unit_id: u032
    node_id: s5_3
    statement: >-
      A Value Object describes certain aspects of a domain element through its
      attributes alone and has no identity; it is not tracked and does not need
      to be uniquely identified, unlike an Entity.
    source_anchors:
      - domaindrivendesignqu-20260612231910-h0023
    salience: 0.93

  - unit_id: u033
    node_id: s5_3
    statement: >-
      Value Objects should be made immutable: created with a constructor and
      never modified during their lifetime; when a different value is needed, a
      new Value Object is created rather than modifying the existing one.
    source_anchors:
      - domaindrivendesignqu-20260612231910-h0023
    salience: 0.93

  - unit_id: u034
    node_id: s5_3
    statement: >-
      Immutable Value Objects can be safely shared; if a shareable Value Object
      were mutable, changes to it by one consumer would inadvertently affect all
      other consumers referencing the same object.
    source_anchors:
      - domaindrivendesignqu-20260612231910-h0023
    salience: 0.90

  - unit_id: u035
    node_id: s5_3
    statement: >-
      Attributes grouped into a Value Object should form a conceptual whole;
      for example, street, city, and state conceptually belong together as an
      Address Value Object rather than as separate attributes on a Customer Entity.
    source_anchors:
      - domaindrivendesignqu-20260612231910-h0023
    salience: 0.86

  # ── s5_4: Services ──
  - unit_id: u036
    node_id: s5_4
    statement: >-
      When an important domain behavior does not naturally belong to any Entity
      or Value Object — because it represents a significant action involving
      multiple objects — it should be declared as a Service rather than forced
      into an existing domain object.
    source_anchors:
      - domaindrivendesignqu-20260612231910-h0025
    salience: 0.90

  - unit_id: u037
    node_id: s5_4
    statement: >-
      A Service has three defining characteristics: the operation refers to a
      domain concept that does not naturally belong to an Entity or Value Object,
      the operation refers to other objects in the domain, and the operation is
      stateless.
    source_anchors:
      - domaindrivendesignqu-20260612231910-h0025
    salience: 0.92

  - unit_id: u038
    node_id: s5_4
    statement: >-
      Services should not replace operations that naturally belong on domain
      objects; a Service should only be created when such an operation stands out
      as an important concept in the domain, and it should be defined using the
      Ubiquitous Language.
    source_anchors:
      - domaindrivendesignqu-20260612231910-h0025
    salience: 0.88

  - unit_id: u039
    node_id: s5_4
    statement: >-
      The domain layer must remain isolated from infrastructure and application
      concerns; Services at the application and domain layers serve different
      purposes, and deciding which layer a Service belongs to requires careful
      consideration of whether the operation is conceptually part of the domain.
    source_anchors:
      - domaindrivendesignqu-20260612231910-h0025
    salience: 0.82

  # ── s5_5: Modules ──
  - unit_id: u040
    node_id: s5_5
    statement: >-
      When a model grows large, it must be organized into Modules that group
      related concepts and tasks; understanding the interaction between Modules
      provides a higher-level view of the system before diving into internal
      details.
    source_anchors:
      - domaindrivendesignqu-20260612231910-h0028
    salience: 0.83

  - unit_id: u041
    node_id: s5_5
    statement: >-
      Modules should be chosen to tell the story of the system with a cohesive
      set of concepts, maximizing internal cohesion and minimizing coupling
      between modules; Module names should become part of the Ubiquitous Language
      and reflect insight into the domain.
    source_anchors:
      - domaindrivendesignqu-20260612231910-h0028
    salience: 0.85

  - unit_id: u042
    node_id: s5_5
    statement: >-
      Modules should be allowed to evolve with the project rather than kept
      frozen; when a Module design mistake is found it is better to change the
      Module than to find workarounds, even though Module refactoring is more
      expensive than class refactoring.
    source_anchors:
      - domaindrivendesignqu-20260612231910-h0028
    salience: 0.78

  # ── s5_6: Aggregates ──
  - unit_id: u043
    node_id: s5_6
    statement: >-
      An Aggregate is a cluster of associated domain objects treated as a single
      unit for data changes; it has a boundary separating inside objects from
      outside, and a single root Entity through which all external access must
      pass.
    source_anchors:
      - domaindrivendesignqu-20260612231910-h0029
    salience: 0.97

  - unit_id: u044
    node_id: s5_6
    statement: >-
      Only the Aggregate root is accessible from outside the boundary; external
      objects may only hold persistent references to the root, not to internal
      objects, so all changes to internal objects are mediated and controlled by
      the root.
    source_anchors:
      - domaindrivendesignqu-20260612231910-h0029
    salience: 0.95

  - unit_id: u045
    node_id: s5_6
    statement: >-
      Aggregates enforce invariants: because external objects can only change the
      root, and the root controls all changes to internal objects, invariants can
      be reliably maintained across the Aggregate; deleting the root removes all
      internal objects, guaranteeing referential integrity.
    source_anchors:
      - domaindrivendesignqu-20260612231910-h0029
    salience: 0.95

  - unit_id: u046
    node_id: s5_6
    statement: >-
      Repositories should only be provided for Aggregate roots; querying the
      database should return only root objects, with internal objects obtained
      through traversal associations rather than direct queries.
    source_anchors:
      - domaindrivendesignqu-20260612231910-h0029
    salience: 0.90

  - unit_id: u047
    node_id: s5_6
    statement: >-
      The root Entity has global identity and is responsible for maintaining
      invariants; internal Entities of an Aggregate have only local identity,
      meaningful only within the Aggregate boundary.
    source_anchors:
      - domaindrivendesignqu-20260612231910-h0029
    salience: 0.88

  - unit_id: u048
    node_id: s5_6
    statement: >-
      To reduce complexity, associations in a model should be minimized: remove
      non-essential associations, reduce multiplicity by adding constraints where
      possible, and convert bidirectional associations to unidirectional ones
      where conceptually justified.
    source_anchors:
      - domaindrivendesignqu-20260612231910-h0029
    salience: 0.85

  # ── s5_7: Factories ──
  - unit_id: u049
    node_id: s5_7
    statement: >-
      When creating a complex Aggregate or object requires significant knowledge
      of its internal structure and invariants, a Factory should be used to
      encapsulate that creation logic; placing complex creation in a constructor
      or in the client breaks encapsulation and leaks domain knowledge outside
      the domain layer.
    source_anchors:
      - domaindrivendesignqu-20260612231910-h0031
    salience: 0.90

  - unit_id: u050
    node_id: s5_7
    statement: >-
      Object creation through a Factory must be atomic: if the creation process
      cannot complete properly, an exception should be raised to ensure no
      partially-created, invalid object is returned; this is especially critical
      for Aggregates where all invariants must be enforced at creation time.
    source_anchors:
      - domaindrivendesignqu-20260612231910-h0031
    salience: 0.88

  - unit_id: u051
    node_id: s5_7
    statement: >-
      A Factory Method added to an Aggregate root is suitable for creating
      objects that belong inside that Aggregate; a dedicated Factory class is
      more appropriate when the construction of an Aggregate involves a complex
      series of steps or the creation of many related objects simultaneously.
    source_anchors:
      - domaindrivendesignqu-20260612231910-h0031
    salience: 0.85

  - unit_id: u052
    node_id: s5_7
    statement: >-
      A simple constructor is sufficient when construction is not complex, does
      not involve creating other objects, and when the client is interested in
      the implementation; Factories are needed only when object creation is a
      major, knowledge-intensive operation.
    source_anchors:
      - domaindrivendesignqu-20260612231910-h0031
    salience: 0.80

  - unit_id: u053
    node_id: s5_7
    statement: >-
      Reconstituting a persisted object from a database is fundamentally
      different from creating a new one: the reconstituted object already has an
      identity and invariant violations should be handled as repair rather than
      as exceptions, whereas a fresh object creation must fail loudly on any
      invariant breach.
    source_anchors:
      - domaindrivendesignqu-20260612231910-h0031
    salience: 0.82

  # ── s5_8: Repositories ──
  - unit_id: u054
    node_id: s5_8
    statement: >-
      A Repository encapsulates all logic needed to obtain references to
      pre-existing domain objects; domain objects should obtain needed references
      through the Repository rather than by accessing the infrastructure directly,
      keeping the model clear and focused on domain concepts.
    source_anchors:
      - domaindrivendesignqu-20260612231910-h0032
    salience: 0.92

  - unit_id: u055
    node_id: s5_8
    statement: >-
      Only provide Repositories for Aggregate roots that actually need direct
      access; the Repository interface should be a pure domain model interface
      even though its implementation may contain infrastructure details, shielding
      clients from persistence technology.
    source_anchors:
      - domaindrivendesignqu-20260612231910-h0032
    salience: 0.90

  - unit_id: u056
    node_id: s5_8
    statement: >-
      Allowing clients to access the database directly causes domain logic to
      migrate into queries and client code, turns Entities and Value Objects into
      mere data containers, and makes the model irrelevant; a Repository prevents
      this by keeping the domain focus intact.
    source_anchors:
      - domaindrivendesignqu-20260612231910-h0032
    salience: 0.88

  - unit_id: u057
    node_id: s5_8
    statement: >-
      A Repository provides an interface that gives the illusion of an in-memory
      collection of all objects of a given type; it should expose methods to add,
      remove, and select objects by criteria, encapsulating the actual storage and
      query technology completely.
    source_anchors:
      - domaindrivendesignqu-20260612231910-h0032
    salience: 0.88

  - unit_id: u058
    node_id: s5_8
    statement: >-
      The Factory–Repository relationship: Factories create new objects from
      scratch, while Repositories find and reconstitute already-existing objects;
      to add a new object to the system, it should be created by the Factory
      first and then given to the Repository for storage.
    source_anchors:
      - domaindrivendesignqu-20260612231910-h0032
    salience: 0.85

  # ── s6_1: Continuous Refactoring ──
  - unit_id: u059
    node_id: s6_1
    statement: >-
      Refactoring is the process of redesigning code to make it better without
      changing application behavior; it is done in small, controllable steps and
      requires automated tests to verify that no functionality is broken.
    source_anchors:
      - domaindrivendesignqu-20260612231910-h0037
    salience: 0.85

  - unit_id: u060
    node_id: s6_1
    statement: >-
      Sophisticated domain models are seldom developed except through an iterative
      refactoring process with close involvement of domain experts and developers
      who are interested in learning about the domain.
    source_anchors:
      - domaindrivendesignqu-20260612231910-h0037
    salience: 0.88

  # ── s6_2: Refactoring for Domain Insight ──
  - unit_id: u061
    node_id: s6_2
    statement: >-
      Beyond technical code-quality refactoring, there is a second kind driven by
      new insight into the domain — when a relationship between elements is
      discovered or a concept becomes clearer, those insights must be incorporated
      into the design through refactoring.
    source_anchors:
      - domaindrivendesignqu-20260612231910-h0037
    salience: 0.87

  - unit_id: u062
    node_id: s6_2
    statement: >-
      Code should express not only what it does but why it does it; expressive,
      readable code that captures the substance of the model is the goal of
      domain-driven refactoring, not merely syntactically clean code.
    source_anchors:
      - domaindrivendesignqu-20260612231910-h0037
    salience: 0.85

  - unit_id: u063
    node_id: s6_2
    statement: >-
      A deep model sloughs off the superficial and captures the essential;
      starting from nouns and verbs produces only a shallow model — the model
      must be iteratively refined toward deeper and deeper insight to become
      useful.
    source_anchors:
      - domaindrivendesignqu-20260612231910-h0037
    salience: 0.86

  # ── s6_3: Bring Key Concepts Into Light ──
  - unit_id: u064
    node_id: s6_3
    statement: >-
      A Breakthrough in design occurs when implicit concepts are made explicit:
      when a concept that was being used to explain other concepts is recognized
      as a key domain concept deserving its own class or relationship in the model.
    source_anchors:
      - domaindrivendesignqu-20260612231910-h0039
    salience: 0.90

  - unit_id: u065
    node_id: s6_3
    statement: >-
      Implicit concepts can be discovered by listening carefully to the language
      used during modeling: key concepts emerge in the Ubiquitous Language and
      should be looked for there; awkwardness in a design section often signals
      a missing key concept.
    source_anchors:
      - domaindrivendesignqu-20260612231910-h0039
    salience: 0.88

  - unit_id: u066
    node_id: s6_3
    statement: >-
      Apparent contradictions between domain experts or between requirements often
      turn out to be different perspectives on the same concept; reconciling them
      can surface important implicit concepts and improve the model.
    source_anchors:
      - domaindrivendesignqu-20260612231910-h0039
    salience: 0.80

  # ── s6_4: Constraint, Process, and Specification ──
  - unit_id: u067
    node_id: s6_4
    statement: >-
      Constraints should be made explicit by extracting invariant logic into
      separate, named methods or Constraint objects, making it clear that an
      operation is subject to a specific rule and allowing the constraint to grow
      in complexity without cluttering the host object.
    source_anchors:
      - domaindrivendesignqu-20260612231910-h0039
      - domaindrivendesignqu-20260612231910-c0040
      - domaindrivendesignqu-20260612231910-c0042
    salience: 0.85

  - unit_id: u068
    node_id: s6_4
    statement: >-
      A Specification is an object used to test whether another object satisfies
      a certain criterion; it encapsulates complex business rules that would
      otherwise bloat an Entity or migrate to the application layer, keeping them
      in the domain layer where they belong.
    source_anchors:
      - domaindrivendesignqu-20260612231910-h0039
    salience: 0.87

  - unit_id: u069
    node_id: s6_4
    statement: >-
      Simple Specifications testing single rules can be composed into composite
      Specifications expressing complex business rules; this keeps the rules
      explicit, cohesive, and readable at the point of use.
    source_anchors:
      - domaindrivendesignqu-20260612231910-h0039
      - domaindrivendesignqu-20260612231910-c0046
    salience: 0.85

  # ── s7_1: Model Fragmentation in Large Teams ──
  - unit_id: u070
    node_id: s7_1
    statement: >-
      In large multi-team projects, striving to maintain one large unified model
      for the entire enterprise will not work; instead, the model should be
      consciously divided into several well-integrated smaller models, each with
      a clearly delimited boundary and precisely defined relationships.
    source_anchors:
      - domaindrivendesignqu-20260612231910-h0049
    salience: 0.88

  - unit_id: u071
    node_id: s7_1
    statement: >-
      The internal consistency of a model is called unification; without it,
      terms become ambiguous or contradictory across the codebase, and the model
      loses its value as a shared conceptual framework.
    source_anchors:
      - domaindrivendesignqu-20260612231910-h0049
    salience: 0.82

  # ── s7_2: Bounded Context ──
  - unit_id: u072
    node_id: s7_2
    statement: >-
      A Bounded Context defines the scope within which a specific domain model
      applies; its boundaries must be explicitly set in terms of team organization,
      application boundaries, code bases, and database schemas so that the model
      stays strictly consistent within those bounds.
    source_anchors:
      - domaindrivendesignqu-20260612231910-h0050
    salience: 0.97

  - unit_id: u073
    node_id: s7_2
    statement: >-
      A Bounded Context is not a Module; a Bounded Context provides the logical
      frame within which the model evolves and encompasses Modules, whereas
      Modules are used to organize the elements within a model.
    source_anchors:
      - domaindrivendesignqu-20260612231910-h0050
    salience: 0.88

  - unit_id: u074
    node_id: s7_2
    statement: >-
      When different teams work on the same model, changes to the model may break
      existing functionality; using multiple Bounded Contexts lets each team work
      freely within their own context, keeping their model pure, consistent, and
      independently refinable.
    source_anchors:
      - domaindrivendesignqu-20260612231910-h0050
    salience: 0.90

  # ── s7_3: Continuous Integration within a Bounded Context ──
  - unit_id: u075
    node_id: s7_3
    statement: >-
      Even within a Bounded Context, the model can fragment as team members add
      duplicated code or make changes without fully understanding the model;
      Continuous Integration is a necessary process within a Bounded Context to
      merge and test code frequently and keep the model unified.
    source_anchors:
      - domaindrivendesignqu-20260612231910-h0052
    salience: 0.85

  - unit_id: u076
    node_id: s7_3
    statement: >-
      Continuous Integration within a Bounded Context requires a merge procedure
      (daily for small teams), an automated build, and an automated test suite
      that is run on every build; Continuous Integration applies only within a
      Bounded Context and does not address relationships between neighboring
      contexts.
    source_anchors:
      - domaindrivendesignqu-20260612231910-h0052
    salience: 0.83

  # ── s7_4: Context Map ──
  - unit_id: u077
    node_id: s7_4
    statement: >-
      A Context Map is a document — diagram or written — that outlines all
      Bounded Contexts in a project and the relationships between them; every
      team member must share and understand it so that integration boundaries are
      clear and overlapping contexts can be avoided.
    source_anchors:
      - domaindrivendesignqu-20260612231910-h0054
    salience: 0.92

  - unit_id: u078
    node_id: s7_4
    statement: >-
      Each Bounded Context should be named using the Ubiquitous Language; a
      common practice is to define each context, create Modules for it, and use
      a naming convention in the code to indicate which Bounded Context each
      Module belongs to.
    source_anchors:
      - domaindrivendesignqu-20260612231910-h0054
    salience: 0.85

  # ── s7_5: Shared Kernel ──
  - unit_id: u079
    node_id: s7_5
    statement: >-
      A Shared Kernel designates a specific subset of the domain model — and the
      associated code and database design — that two teams agree to share; changes
      to this subset require consultation with both teams and must not be made
      unilaterally.
    source_anchors:
      - domaindrivendesignqu-20260612231910-h0056
    salience: 0.88

  - unit_id: u080
    node_id: s7_5
    statement: >-
      Teams using a Shared Kernel must integrate their changes to the kernel
      frequently (at least weekly), maintain a shared test suite that both teams
      run against the kernel, and communicate all changes to each other promptly.
    source_anchors:
      - domaindrivendesignqu-20260612231910-h0056
    salience: 0.85

  # ── s7_6: Customer-Supplier ──
  - unit_id: u081
    node_id: s7_6
    statement: >-
      When one subsystem heavily depends on another but not vice versa, they are
      in a Customer-Supplier relationship; the customer team presents requirements
      and the supplier team sets the timetable, with the schedule driven by the
      supplier but the interface ultimately meeting the customer's needs.
    source_anchors:
      - domaindrivendesignqu-20260612231910-h0058
    salience: 0.88

  - unit_id: u082
    node_id: s7_6
    statement: >-
      In a Customer-Supplier relationship, jointly developed automated acceptance
      tests should validate the interface contract; adding these tests to the
      supplier's continuous integration suite lets the supplier make changes
      confidently without risking side effects for the customer's application.
    source_anchors:
      - domaindrivendesignqu-20260612231910-h0058
    salience: 0.88

  - unit_id: u083
    node_id: s7_6
    statement: >-
      A Customer-Supplier relationship requires management support to work; when
      the supplier team has no motivation to support the customer team's needs,
      the customer team must protect itself — either through a conformist stance,
      an Anticorruption Layer, or by going Separate Ways.
    source_anchors:
      - domaindrivendesignqu-20260612231910-h0058
    salience: 0.82

  # ── s7_7: Anticorruption Layer ──
  - unit_id: u084
    node_id: s7_7
    statement: >-
      An Anticorruption Layer isolates the client model from an external or
      legacy model; it translates between the two models so the client model
      remains pure and consistent, presenting external concepts in the client's
      own terms and preventing external model corruption from leaking in.
    source_anchors:
      - domaindrivendesignqu-20260612231910-h0059
    salience: 0.92

  - unit_id: u085
    node_id: s7_7
    statement: >-
      The Anticorruption Layer is best implemented as a Service from the client
      model's perspective, backed by a Façade wrapping the external system and
      an Adapter that translates between the two systems; a Translator object
      handles data conversion between the contexts.
    source_anchors:
      - domaindrivendesignqu-20260612231910-h0059
    salience: 0.88

  # ── s7_8: Separate Ways ──
  - unit_id: u086
    node_id: s7_8
    statement: >-
      When the benefits of integration between two subsystems are not worth the
      coordination effort, the Separate Ways pattern applies: each subsystem
      develops its own model independently with no sharing, and integration
      between them is not pursued; models developed separately are very difficult
      to re-integrate later.
    source_anchors:
      - domaindrivendesignqu-20260612231910-h0060
    salience: 0.80

  # ── s7_9: Open Host Service ──
  - unit_id: u087
    node_id: s7_9
    statement: >-
      When a subsystem must be integrated with many other subsystems, rather than
      creating a custom translation layer for each, define a protocol that gives
      access to the subsystem as a set of Services; this Open Host Service
      protocol should be expanded for general integration needs while one-off
      translators handle idiosyncratic special cases.
    source_anchors:
      - domaindrivendesignqu-20260612231910-h0062
    salience: 0.82

  # ── s7_10: Distillation ──
  - unit_id: u088
    node_id: s7_10
    statement: >-
      Distillation of a large model means identifying the Core Domain — the
      essence of the application's unique business value — and separating it
      from Generic Subdomains that, while necessary, are not the primary focus
      of the project.
    source_anchors:
      - domaindrivendesignqu-20260612231910-h0064
    salience: 0.93

  - unit_id: u089
    node_id: s7_10
    statement: >-
      The Core Domain should be made small, explicitly highlighted to distinguish
      it from supporting code, and staffed with the best available developers;
      if the core business logic is poorly designed or implemented, all other
      parts of the system provide little value.
    source_anchors:
      - domaindrivendesignqu-20260612231910-h0064
    salience: 0.92

  - unit_id: u090
    node_id: s7_10
    statement: >-
      Generic Subdomains should be factored out into separate Modules with lower
      development priority than the Core Domain; teams should consider off-the-
      shelf solutions or published models for Generic Subdomains rather than
      investing scarce core-team resources in them.
    source_anchors:
      - domaindrivendesignqu-20260612231910-h0064
    salience: 0.88

  - unit_id: u091
    node_id: s7_10
    statement: >-
      The Core Domain of one system may become a Generic Subdomain of another;
      identifying the correct Core is context-dependent and requires understanding
      the unique business purpose of the specific system being built.
    source_anchors:
      - domaindrivendesignqu-20260612231910-h0064
    salience: 0.85

  - unit_id: u092
    node_id: s7_10
    statement: >-
      Generic Subdomains can be implemented in four ways: using an off-the-shelf
      solution, outsourcing to another team, adopting an existing published model,
      or building in-house; each option has trade-offs around integration effort,
      dependency, and control.
    source_anchors:
      - domaindrivendesignqu-20260612231910-h0064
    salience: 0.82

  # ── s8_3: Advice for Learning DDD ──
  - unit_id: u093
    node_id: s8_3
    statement: >-
      Evans' practical advice for applying DDD: stay hands-on (modelers must
      code), anchor abstract thinking in concrete scenarios, avoid applying DDD
      everywhere (draw a context map to decide where to push DDD), and expect to
      experiment and make mistakes because modeling is a creative process.
    source_anchors:
      - domaindrivendesignqu-20260612231910-h0070
    salience: 0.68
