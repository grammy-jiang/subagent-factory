  applies_when:
  - establishing shared terminology for design discussions and reviews
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P005
  statement: 'Separate side-effect-free calculations from state-changing commands:
    keep as much logic as possible in side-effect-free functions that return a new
    immutable value object instead of mutating state, restrict commands to simple
    operations that return no domain data, and centralize complex calculation in immutable
    value objects so client code reads declaratively.'
  derived_from_claims:
  - C00250
  - C00251
  - C00252
  - C00253
  - C00281
  - C00282
  - C00283
  - C00284
  - C00285
