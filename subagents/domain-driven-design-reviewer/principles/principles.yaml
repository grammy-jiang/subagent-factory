schema_version: principles-v1
principles:
- principle_id: P001
  statement: 'Distinguish Value Objects from Entities: model a concept that has data
    but no long-lived identity as an immutable Value Object whose equality is over
    all its attributes (it may still carry behavior), and model a concept with long-lived
    identity as an Entity with an explicitly defined identifier and equality based
    on that identity.'
  derived_from_claims:
  - C00085
  - C00086
  - C00087
  - C00088
  - C00096
  - C00099
  - C00100
  - C00101
  - C00530
  - C00531
  - C00533
  - C00534
  - C00535
  - C00536
  confidence: high
  applies_when:
  - an object must be tracked and distinguished across states and forms
  - modeling a descriptive aspect of the domain
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P002
  statement: 'Use aggregates to reconcile invariants with concurrency: maintaining
    an invariant means preventing concurrent writes to the objects it covers while
    objects with no shared invariant may change concurrently, an aggregate is a domain
    object containing others that is modified only by loading the whole and calling
    its methods, and nominating some entities as the single entrypoint for modifying
    their related objects puts one object in charge of consistency and makes the system
    easier to reason about.'
  derived_from_claims:
  - C00139
  - C00140
  - C00142
  - C00143
  - C00144
  - C00145
  - C00618
  - C00619
  - C00620
  - C00621
  - C00622
  - C00637
  confidence: high
  applies_when:
  - defining transactional consistency boundaries
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P003
  statement: Build an Anticorruption Layer that exposes the external system as services
    in your own model and translates conceptual objects in both directions (not merely
    transporting messages), implemented as facades, adapters, and lightweight stateless
    translators; write the facade in the other system's model, and never assume primitive
    data transported between systems carries the same meaning.
  derived_from_claims:
  - C00196
  - C00197
  - C00200
  - C00351
  - C00352
  - C00353
  - C00354
  - C00355
  - C00356
  - C00357
  confidence: high
  applies_when:
  - interacting with a system built on a different model
  - integrating heavily with a legacy or external system of a different model
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P004
  statement: 'Apply the precise domain-driven vocabulary consistently in the ubiquitous
    language: Entity (defined by identity/continuity) versus Value Object (no identity);
    stateless Service standing alone in the model; deep model versus supple design;
    assertion, invariant, and side effect; conceptual contour; unification within
    a bounded context; model-driven design; standalone class and whole value; and
    strategic design as team-level decisions affecting the whole project.'
  derived_from_claims:
  - C00491
  - C00492
  - C00493
  - C00494
  - C00495
  - C00496
  - C00497
  - C00498
  - C00499
  - C00500
