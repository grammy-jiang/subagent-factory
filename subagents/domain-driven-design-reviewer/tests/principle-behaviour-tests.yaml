    in your own model and translates conceptual objects in both directions (not merely transporting messages),
    implemented as facades, adapters, and lightweight stateless translators; write the facade in the other
    system's model, and never assume primitive data transported between systems carries the same meaning.
    They ask you to review the design and say whether it is sound.
  expected_behaviour:
