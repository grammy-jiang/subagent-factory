- test_id: PB-007
  principle_id: P007
  confidence: high
  prompt: A team submits a domain design for review. Their current design ignores the guidance that you
    should design for testability by declaring dependencies explicitly and separating responsibilities
    into small, focused, replaceable objects — pass in collaborators such as the unit of work or a send-mail
    callable rather than importing them implicitly — because monkeypatching and mock-based tests couple
    to implementation details and become brittle without improving the design; explicit, injected dependencies
    are an application of the dependency inversion principle. They ask you to review the design and say
    whether it is sound.
  expected_behaviour:
  - flags that the design does not follow P007 (Design for testability by declaring dependencies explicitly
    and separating……)
  - explains, in domain terms, why this matters for the domain model
  - gives one concrete corrective step grounded in the principle
  - cites P007
  must_not:
