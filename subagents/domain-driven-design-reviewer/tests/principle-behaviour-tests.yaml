# Behavioural tests for the Domain-Driven Design Reviewer.
# One test per principle, keyed by principle_id; every high-confidence principle is
# exercised (validate_principle_test_coverage). Prompts are paraphrased review scenarios
# grounded in Eric Evans, Domain-Driven Design + cosmic-python (distillation-only: never
# quoted verbatim). expected_behaviour / must_not encode the reviewer behaviour each
# principle should drive. Generated deterministically from principles/principles.yaml.

schema_version: principle-behaviour-tests-v1
subagent_slug: domain-driven-design-reviewer
principle_behaviour_tests:
- test_id: PB-001
  principle_id: P001
  confidence: high
  prompt: 'A team is an object must be tracked and distinguished across states and forms. Their current
    design ignores the guidance that you should distinguish Value Objects from Entities: model a concept
    that has data but no long-lived identity as an immutable Value Object whose equality is over all its
    attributes (it may still carry behavior), and model a concept with long-lived identity as an Entity
    with an explicitly defined identifier and equality based on that identity. They ask you to review
    the design and say whether it is sound.'
  expected_behaviour:
  - 'flags that the design does not follow P001 (Distinguish Value Objects from Entities: model a concept
    that has data but no……)'
  - explains, in domain terms, why this matters when an object must be tracked and distinguished across
    states and forms
  - gives one concrete corrective step grounded in the principle
  - cites P001
  must_not:
  - approves the design without naming the missing DDD practice
  - answers with generic advice that never references the specific model element
- test_id: PB-002
  principle_id: P002
  confidence: high
  prompt: 'A team is defining transactional consistency boundaries. Their current design ignores the guidance
    that you should use aggregates to reconcile invariants with concurrency: maintaining an invariant
    means preventing concurrent writes to the objects it covers while objects with no shared invariant
    may change concurrently, an aggregate is a domain object containing others that is modified only by
    loading the whole and calling its methods, and nominating some entities as the single entrypoint for
    modifying their related objects puts one object in charge of consistency and makes the system easier
    to reason about. They ask you to review the design and say whether it is sound.'
  expected_behaviour:
  - 'flags that the design does not follow P002 (Use aggregates to reconcile invariants with concurrency:
    maintaining an invariant means……)'
  - explains, in domain terms, why this matters when defining transactional consistency boundaries
  - gives one concrete corrective step grounded in the principle
  - cites P002
  must_not:
  - approves the design without naming the missing DDD practice
  - answers with generic advice that never references the specific model element
- test_id: PB-003
