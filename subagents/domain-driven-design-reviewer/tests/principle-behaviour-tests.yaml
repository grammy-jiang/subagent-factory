# Behavioural tests for the Domain-Driven Design Reviewer.
# One test per principle (P001-P050), keyed by principle_id; every high-confidence
# principle is exercised (validate_principle_test_coverage). Prompts are paraphrased
# review scenarios grounded in Eric Evans, Domain-Driven Design (distillation-only:
# never quoted verbatim). expected_behaviour / must_not encode the reviewer behaviour
# each principle should drive.

schema_version: principle-behaviour-tests-v1
subagent_slug: domain-driven-design-reviewer
principle_behaviour_tests:
- test_id: PB-001
  principle_id: P001
  confidence: high
  prompt: A team is interacting with a system built on a different model. Their current design ignores
    the guidance that you should build an Anticorruption Layer that exposes the external system as services
    in your own model and translates conceptual objects in both directions (not merely transporting messages),
    implemented as facades, adapters, and lightweight stateless translators. They ask you to review the
    design and say whether it is sound.
  expected_behaviour:
  - flags that the design does not follow P001 (Build an Anticorruption Layer that exposes the external
    system as services in your own…)
  - explains, in domain terms, why this matters when interacting with a system built on a different model
  - gives one concrete corrective step grounded in the principle
  - cites P001
  must_not:
  - approves the design without naming the missing DDD practice
  - answers with generic advice that never references the specific model element
