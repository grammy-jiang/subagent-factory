schema_version: golden-tests-v1
subagent_slug: domain-driven-design-reviewer
generated_at: '2026-06-14'
golden_tests:
- test_id: GT-001
  prompt: Reviewing any domain model, code artifact, or design document for DDD correctness. What do you
    advise, and why?
  principle_coverage:
  - P001
  expected_route: invoke
  minimum_output: 'The entire team — domain experts and developers alike — must use a single language
    based on the domain model (the Ubiquitous Language) in all communication: spoken conversation, written
    documents, diagrams, and code. A divergence between the language used in discussions and the language
    embedded in code is a first-order defect: it means domain knowledge is never reliably captured. Any
    change to this language must simultaneously become a change to the model, and vice versa'
- test_id: GT-002
  prompt: Reviewing whether domain-layer classes and their names, relationships, and responsibilities
    correspond to stated domain concepts. What do you advise, and why?
  principle_coverage:
  - P002
  expected_route: invoke
  minimum_output: A portion of the software must literally reflect the domain model, making the mapping
    between model and implementation obvious. Developers who write the code must know the model well and
    feel responsible for its integrity. Refactoring code to a state where it no longer expresses the model
    is a design failure, not an improvement. Analysis and implementation must never be performed in isolation
    from each other
- test_id: GT-003
  prompt: Assessing whether domain-layer classes call infrastructure code (ORMs, SQL builders, HTTP clients)
    directly. What do you advise, and why?
  principle_coverage:
  - P003
  expected_route: invoke
  minimum_output: Domain logic must be concentrated in a single, isolated Domain Layer, completely free
    from display logic, storage concerns, and application orchestration responsibilities. A complex application
    must be partitioned into at least four conceptual layers — User Interface, Application, Domain, and
    Infrastructure — where each layer depends only on layers below it. Mixing domain code with any other
    layer makes business logic extremely difficult to understand or modify safely
- test_id: GT-004
  prompt: Classifying domain objects as Entity vs. Value Object. What do you advise, and why?
  principle_coverage:
  - P004
  expected_route: invoke
  minimum_output: 'An Entity is defined by a thread of identity and continuity across states, not by its
    attribute values. When a domain object is distinguished by who or what it is rather than what it has,
    identity must be made primary in its model definition: a unique identity operation must be defined,
    and two objects with the same identity must be considered the same regardless of attribute differences.
    Mistaken identity leads to data corruption'
- test_id: GT-005
  prompt: Reviewing Entity classes for attributes that are conceptually related and could be extracted
    into a Value Object. What do you advise, and why?
  principle_coverage:
  - P005
  expected_route: invoke
  minimum_output: 'A Value Object describes aspects of a domain concept solely through its attributes
    and has no identity. Value Objects must be immutable: they are created with a constructor and never
    modified; when a different value is needed, a new instance is created. Assigning mutation methods
    to a Value Object is a design defect; immutability enables safe sharing across consumers'
- test_id: GT-006
  prompt: Reviewing whether a domain operation has been incorrectly placed on an Entity or pushed into
    the Application layer. What do you advise, and why?
  principle_coverage:
  - P006
  expected_route: invoke
  minimum_output: 'When an important domain behavior does not naturally belong to any Entity or Value
    Object — because it involves multiple domain objects and represents a significant concept in the domain
    — it must be declared as a domain Service. A Service has three characteristics: the operation refers
    to a domain concept not naturally housed in any Entity/Value Object; it refers to other objects in
    the domain; and it is stateless. Services must not replace operations that naturally belong on domain
    objects'
- test_id: GT-007
  prompt: Reviewing whether external code holds direct references to internal Aggregate objects and bypasses
    the root. What do you advise, and why?
  principle_coverage:
  - P007
  expected_route: invoke
  minimum_output: An Aggregate is a cluster of associated domain objects treated as a single unit for
    data changes. It has a single root Entity through which all external access must pass. External objects
    may only hold persistent references to the Aggregate root, never to internal objects. All invariants
    across the cluster are enforced by the root. Repositories must be provided only for Aggregate roots;
    internal objects are reached by traversal, never by direct query
- test_id: GT-008
  prompt: Reviewing creation logic for Aggregates with multi-step initialization or many invariants to
    satisfy. What do you advise, and why?
  principle_coverage:
  - P008
  expected_route: invoke
  minimum_output: 'When creating a complex Aggregate or object requires significant knowledge of its internal
    structure and invariants, a Factory must be used to encapsulate that creation logic. Complex creation
    in a constructor or in client code breaks encapsulation and leaks domain knowledge. Factory creation
    must be atomic: if the object cannot be fully and validly constructed, an exception is raised and
    no partially-created object is returned'
- test_id: GT-009
  prompt: Reviewing domain-layer classes for direct calls to ORMs, SQL builders, or raw data stores. What
    do you advise, and why?
  principle_coverage:
  - P009
  expected_route: invoke
  minimum_output: A Repository encapsulates all logic needed to obtain references to pre-existing domain
    objects. Domain objects must obtain needed references through the Repository, not by accessing infrastructure
    directly. The Repository interface is a pure domain-model interface — even when its implementation
    contains infrastructure details — presenting the illusion of an in-memory collection with add, remove,
    and select-by-criteria operations. Allowing clients direct database access causes domain logic to
    migrate into queries, making the model irrelevant
- test_id: GT-010
  prompt: Reviewing a model that feels awkward, has workarounds, or uses the same term in multiple inconsistent
    ways. What do you advise, and why?
  principle_coverage:
  - P010
  expected_route: invoke
  minimum_output: 'Sophisticated domain models are developed only through iterative refactoring with continuous
    domain-expert involvement. Beyond technical code-quality refactoring, there is a second kind driven
    by new insight into the domain: whenever a relationship is discovered or a concept becomes clearer,
    that insight must be incorporated into the design through refactoring. Making implicit concepts explicit
    — recognising a concept used informally and giving it its own class or relationship in the model —
    is the primary mechanism of breakthrough insight'
- test_id: GT-011
  prompt: Reviewing multi-team projects for uncontrolled model sharing or missing context boundaries.
    What do you advise, and why?
  principle_coverage:
  - P011
  expected_route: invoke
  minimum_output: 'Every domain model must have explicitly defined boundaries (a Bounded Context). The
    boundaries must be set in terms of team organisation, application boundaries, code bases, and database
    schemas. Within those bounds the model must remain strictly consistent; terms must not be assumed
    equivalent across context boundaries. In a multi-team project a single unified model will not work:
    the model must be consciously divided into well-integrated smaller models. All Bounded Contexts and
    the relationships between them must be documented in a Context Map that every team member shares and
    understands'
- test_id: GT-012
  prompt: Integrating with a legacy system whose terminology or concepts would otherwise leak into the
    client domain model. What do you advise, and why?
  principle_coverage:
  - P012
  expected_route: invoke
  minimum_output: When integrating with an external or legacy system whose model would corrupt the client
    model if absorbed directly, an Anticorruption Layer must be used. The layer translates between the
    two models — presenting external concepts in the client's own terms — so the client model remains
    pure and consistent. The Anticorruption Layer is best implemented as a domain Service backed by a
    Facade wrapping the external system and an Adapter that translates between them
- test_id: GT-013
  prompt: Reviewing resource allocation and development priority decisions across a large model. What
    do you advise, and why?
  principle_coverage:
  - P013
  expected_route: invoke
  minimum_output: Distillation of a large model requires identifying the Core Domain — the unique business
    logic that is the primary source of competitive value — and separating it from Generic Subdomains
    that are necessary but not differentiating. The Core Domain must be kept small, explicitly highlighted,
    and staffed with the best available developers; if the core is poorly designed, all other parts of
    the system provide little value. Generic Subdomains should be factored into separate Modules with
    lower development priority, and off-the-shelf or published models should be considered for them
negative_routing_tests:
- test_id: NR-001
  prompt: Infrastructure-only code (persistence adapters, HTTP handlers) that deliberately uses technology-specific
    terminology rather than domain terms. Can you handle this for us?
  principle_coverage:
  - P001
  expected_route: do_not_invoke
  must_not_do:
  - Answer as if the request were in scope when it is not
- test_id: NR-002
  prompt: Application-layer orchestration classes that intentionally sit above the domain model and coordinate
    use cases. Can you handle this for us?
  principle_coverage:
  - P002
  expected_route: do_not_invoke
  must_not_do:
  - Answer as if the request were in scope when it is not
- test_id: NR-003
  prompt: Deliberately thin CRUD applications where the team has explicitly accepted a Smart UI pattern
    with no significant domain complexity. Can you handle this for us?
  principle_coverage:
  - P003
  expected_route: do_not_invoke
  must_not_do:
  - Answer as if the request were in scope when it is not
- test_id: NR-004
  prompt: Objects that describe attributes of a concept without needing individual tracking (use Value
    Object guidance instead). Can you handle this for us?
  principle_coverage:
  - P004
  expected_route: do_not_invoke
  must_not_do:
  - Answer as if the request were in scope when it is not
- test_id: NR-005
  prompt: Objects that require individual tracking across transactions (use Entity instead). Can you handle
    this for us?
  principle_coverage:
  - P005
  expected_route: do_not_invoke
  must_not_do:
  - Answer as if the request were in scope when it is not
- test_id: NR-006
  prompt: Application-layer services that orchestrate use cases but do not contain domain logic. Can you
    handle this for us?
  principle_coverage:
  - P006
  expected_route: do_not_invoke
  must_not_do:
  - Answer as if the request were in scope when it is not
- test_id: NR-007
  prompt: Objects that are not part of a transactional boundary (standalone Entities or Value Objects
    used purely for read operations). Can you handle this for us?
  principle_coverage:
  - P007
  expected_route: do_not_invoke
  must_not_do:
  - Answer as if the request were in scope when it is not
- test_id: NR-008
  prompt: Simple objects whose construction requires no domain knowledge and involves no other domain
    objects. Can you handle this for us?
  principle_coverage:
  - P008
  expected_route: do_not_invoke
  must_not_do:
  - Answer as if the request were in scope when it is not
- test_id: NR-009
  prompt: Read-model or reporting queries that intentionally bypass the domain model for performance and
    operate at the infrastructure layer under explicit architectural allowance. Can you handle this for
    us?
  principle_coverage:
  - P009
  expected_route: do_not_invoke
  must_not_do:
  - Answer as if the request were in scope when it is not
- test_id: NR-010
  prompt: Pure structural code refactoring with no domain-concept change (rename, extract method for readability
    only). Can you handle this for us?
  principle_coverage:
  - P010
  expected_route: do_not_invoke
  must_not_do:
  - Answer as if the request were in scope when it is not
- test_id: NR-011
  prompt: Single-team projects with a single bounded model that is fully consistent — explicit Context
    Map is still recommended but urgency is lower. Can you handle this for us?
  principle_coverage:
  - P011
  expected_route: do_not_invoke
  must_not_do:
  - Answer as if the request were in scope when it is not
- test_id: NR-012
  prompt: Both contexts share a Shared Kernel and their models are intentionally aligned. Can you handle
    this for us?
  principle_coverage:
  - P012
  expected_route: do_not_invoke
  must_not_do:
  - Answer as if the request were in scope when it is not
- test_id: NR-013
  prompt: Small, single-domain systems where every part of the model is core and no generic subdomain
    separation is warranted. Can you handle this for us?
  principle_coverage:
  - P013
  expected_route: do_not_invoke
  must_not_do:
  - Answer as if the request were in scope when it is not
