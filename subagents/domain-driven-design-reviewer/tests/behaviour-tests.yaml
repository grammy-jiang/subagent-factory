- test_id: GT-005
  prompt: designing operations that compute or change state. What do you advise, and why?
  principle_coverage:
  - P003
  expected_route: invoke
  minimum_output: 'Separate commands from queries: place as much logic as possible in side-effect-free
    functions — refactoring a method that both calculates and modifies into a side-effect-free calculation
