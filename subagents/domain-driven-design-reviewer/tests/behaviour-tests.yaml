- test_id: GT-003
  prompt: defining transactional consistency boundaries. What do you advise, and why?
  principle_coverage:
  - P002
  expected_route: invoke
  minimum_output: 'Use aggregates to reconcile invariants with concurrency: maintaining an invariant means
    preventing concurrent writes to the objects it covers while objects with no shared invariant may change
    concurrently, an aggregate is a domain object containing others that is modified only by loading the
    whole and calling its methods, and nominating some entities as the single entrypoint for modifying
    their related objects puts one object in charge of consistency and makes the system easier to reason
    about'
