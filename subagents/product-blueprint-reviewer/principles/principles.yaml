- principle_id: P006
  statement: 'Recognize that good process and research alone do not escape the build
    trap: it also takes a supportive, product-led organization that favours outcomes
    over outputs, evaluates strategy on a cadence, rewards learning, gets close to
    customers, and treats product management as a critical function.'
