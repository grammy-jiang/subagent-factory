- principle_id: P019
  statement: Assign deterministic control, state, storage, security, audit, interfaces,
    telemetry, durable mutation, validation, and workflow transitions to normal software;
    reserve AI for language-heavy, judgment-heavy, or reasoning-heavy work, and never
    let AI bypass deterministic validation before durable effects.
  derived_from_claims:
  - C00094
  - C00097
  - C00098
  - C00112
  - C00132
  confidence: medium
  applies_when:
  - Designing AI, agent, or LLM responsibilities inside a system.
  - Designing responsibility boundaries between software and AI components.
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P020
  statement: 'Tie rewards and incentives to solving problems, achieving outcomes,
    and learning, not to shipping output, and re-evaluate reward structures when transitioning
    to product-led: rewarding output proxies, scorecards of items to deliver, and
    livelihoods tied to shipping keep the organization in the build trap and stifle
    innovation.'
  derived_from_claims:
  - C00156
  - C00166
  - C00397
  - C00398
  - C00399
  confidence: medium
  applies_when: []
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P021
  statement: 'Adopt being product-led as a winning strategy whose fundamental criterion
    for building is that the product solves a real user problem, and diagnose health
    by the signs of a strong product team: the team originates ideas and can connect
    the why to the what, the organization is able to kill ideas, goals are outcome-oriented
    and actionable and clearly communicated, and product managers are respected leaders
    who talk more about problems than solutions.'
  derived_from_claims:
  - C00424
  - C00425
  - C00426
  - C00427
  - C00428
  confidence: medium
  applies_when: []
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P022
  statement: 'Recognize that treating strategy as a plan creates the Knowledge, Alignment,
    and Effects gaps, and close them the right way: communicate strategic intent and
    ask only for enough information to decide (not more detail), give teams room to
    experiment and understand the why before the how, and let each level define how
    it will achieve the intent of the level above.'
  derived_from_claims:
  - C00265
  - C00266
  - C00267
  - C00268
  - C00269
  confidence: medium
  applies_when: []
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P023
  statement: 'Give aligned teams real autonomy: do not hand down committed feature
    requests (which severs work from outcomes and blocks course-correction) and do
    not answer poor results with more controls, but let teams explore solutions and
    adjust to the data as long as they stay aligned to the strategic intent, because
    leadership misalignment is the single biggest blocker to product success.'
  derived_from_claims:
  - C00270
  - C00271
  - C00272
  - C00273
  - C00274
  confidence: medium
  applies_when: []
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P024
  statement: 'Organize around products rather than projects: a product is a value
    vehicle that must be nurtured and iterated toward outcomes over time, so a projects-only
    mentality and project-management frameworks (PRINCE2, PMBOK, PMI) damage product
    work.'
  derived_from_claims:
  - C00174
  - C00175
  - C00176
  - C00177
  - C00178
  confidence: medium
  applies_when: []
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P025
  statement: 'Lead by influence rather than authority: a product manager owns the
    why (while the team collectively owns the what) and is not a project manager or
    mini-CEO, so acting as the product''s sole owner or dictator only alienates the
    team.'
