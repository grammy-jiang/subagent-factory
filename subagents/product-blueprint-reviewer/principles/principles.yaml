    skill: null
    reference: null
    test_cases: []
- principle_id: P015
  statement: Write a product vision that states why you are building and the customer
    value proposition, let it emerge from experimentation and describe main capabilities
    rather than every feature (with the VP of product owning it), wrap multiple products
    in a portfolio the CPO governs as a system, and deliberately make time to innovate
    by saying no and dedicating teams - since the best solutions are linked to real
    problems users want solved.
  derived_from_claims:
  - C00304
  - C00305
  - C00306
  - C00307
  - C00308
  - C00309
  confidence: medium
  applies_when: []
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P016
  statement: Match the experiment to the uncertainty and context - concierge (manual
    and open, tight feedback loops, B2B-friendly, does not scale), Wizard of Oz (looks
    finished with a manual backend, feedback at scale), concept testing (landing pages,
    wireframes, or prototypes, usually generative), and prototypes (test a flow but
    only after problem research) - and keep the objective learning, not earning.
  derived_from_claims:
  - C00353
  - C00354
  - C00355
  - C00358
  - C00361
  - C00362
  confidence: medium
  applies_when: []
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
