- principle_id: P010
  statement: 'Build a deep bench of product people and understand the distinct responsibilities
    of each level: create associate or junior programs open to career-switchers with
    coaching, keep the mid-level product manager from becoming purely operational
    by pushing project-management effort to the team, and scale up through senior
    product manager (top individual contributor), director (first people manager),
    VP (owning a product line''s strategy and finances), and CPO (owning the whole
    portfolio).'
