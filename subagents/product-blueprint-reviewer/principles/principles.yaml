    skill: null
    reference: null
    test_cases: []
- principle_id: P034
  statement: Measure success by outcomes (the value delivered to customers and the
    business), not by outputs (features, releases, velocity); optimizing for output
    is the build trap and erodes value and market position.
  derived_from_claims:
  - C00150
  - C00151
  - C00172
  - C00173
  confidence: medium
  applies_when: []
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P035
  statement: 'Hire and grow product managers as product-management experts, not as
    technical or market experts: product management spans the whole system beyond
    UX, and the manager needs only to be tech-literate (not tech-fluent) enough to
    make trade-off decisions.'
  derived_from_claims:
  - C00158
  - C00210
  - C00211
  - C00212
  confidence: medium
  applies_when: []
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P036
  statement: 'Be product-led rather than sales-, visionary-, or technology-led: let
    product strategy aligned to business outcomes lead and connect business, market,
    and technology, because the other operating models fail to scale or sustain.'
  derived_from_claims:
  - C00179
  - C00180
  - C00181
  - C00182
  confidence: medium
  applies_when: []
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P037
  statement: Deploy strategy by setting the right level of goals for each level's
    time scale (teams think in weeks, executives in years), because appropriately
    constrained teams feel safe to decide while too-broad or too-prescriptive direction
    lands the organization in the build trap - the same premise underlying OKRs, Hoshin
    Kanri, and mission command.
  derived_from_claims:
  - C00281
  - C00282
  - C00283
  - C00285
  confidence: medium
  applies_when: []
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P038
  statement: Deeply understand customer problems before defining value; without that
    understanding organizations substitute feature-count as a false success proxy
    and chase competitor parity or one-off sales-driven features.
  derived_from_claims:
  - C00165
  - C00167
  - C00168
  - C00169
  confidence: medium
  applies_when: []
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P039
  statement: Right-size product work with ruthless prioritization around a few key
    goals - one person writing user stories forty hours a week is a build-trap signal
    - and shift a product manager's balance of tactical, strategic, and operational
    work with their seniority and the product's stage.
  derived_from_claims:
  - C00224
  - C00225
  - C00226
  - C00227
  confidence: medium
  applies_when: []
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P040
  statement: Have product managers act as risk mitigators and have leaders make experimentation
    safe by giving explicit boundaries such as spending caps, segmenting Alpha and
    Beta populations for a bounded rollout and easy rollback, and defusing first-experiment
    fear through a boundaries conversation and demonstrated small wins.
  derived_from_claims:
  - C00409
  - C00410
  - C00411
  - C00412
  confidence: medium
  applies_when: []
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P041
  statement: Set a very few concise, outcome-oriented strategic intents based on the
    current state (asking what is the most important thing to do to reach the vision
    from where the company is now) - about one for a small company and three for a
    large one - and keep them high-level and business-focused.
  derived_from_claims:
  - C00296
  - C00297
  - C00298
  - C00299
  confidence: medium
  applies_when: []
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P042
  statement: Use the four strategy-deployment levels - vision, strategic intent, product
    initiatives, and options - and treat strategy creation as a sustained C-suite
    priority that moves the organization from its current state to its vision by identifying
    obstacles and experimenting, driven by the Product Kata loop of direction, current
    state, obstacle, experiment, and learning.
  derived_from_claims:
  - C00286
  - C00287
  - C00288
  - C00289
  confidence: medium
  applies_when: []
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P043
  statement: Translate strategic intents into product initiatives (the customer problems
    to solve, the how) whose options are the bets teams explore, keep initiatives
    and options aligned to the product or portfolio vision, and remember that one-off
    products built without a coherent vision do not scale.
  derived_from_claims:
  - C00300
  - C00301
  - C00302
  - C00303
  confidence: medium
  applies_when: []
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P044
  statement: Use the Product Kata as a repeatable problem-solving habit driven by
    its six questions (goal, current state, biggest obstacle, how to solve it, what
    is expected, what was learned), arriving at initiatives from the strategic intent
    and breaking success metrics into a shorter per-release team goal for fast feedback.
  derived_from_claims:
  - C00315
  - C00316
  - C00317
  - C00319
  confidence: medium
  applies_when: []
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P045
  statement: Actually talk to users (data alone cannot tell the whole story) using
    generative, problem-based research to find the root cause and context before designing
    - distinct from evaluative usability testing - and resist the urge to start solving
    before understanding the problem.
  derived_from_claims:
  - C00335
  - C00336
  - C00337
  - C00338
  confidence: medium
  applies_when: []
  operational_mapping:
    profile_rule: true
