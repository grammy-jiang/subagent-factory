- principle_id: P007
  statement: 'Do not get attached to solutions or build merely to ship: a feature
    that solves no current problem is a distraction, so fall in love with the problem,
    kill bad ideas early, test the riskiest assumption cheaply first, get creative
    to reach customers when access is blocked, expect solving one problem to uncover
    the bigger real one, and experiment to learn rather than to earn.'
