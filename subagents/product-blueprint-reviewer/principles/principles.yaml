  - C00193
  - C00194
  - C00201
  - C00204
  - C00205
  confidence: medium
  applies_when: []
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P026
  statement: 'Do not become an order-taking Waiter: without a goal, prioritization
    degenerates into a popularity contest, so push back on solutions handed down and
    dig into the underlying problem rather than implementing every request.'
  derived_from_claims:
  - C00196
  - C00197
  - C00198
  - C00199
  - C00200
  confidence: medium
  applies_when: []
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P027
  statement: 'Do not set vision purely top-down: have teams surface and share what
    they learn so it informs strategy, and anchor everything on a strong company vision
    (the linchpin) that combines mission and vision, is short and memorable and gives
    context on how, and cascades from corporate down to products in multi-product
    companies.'
