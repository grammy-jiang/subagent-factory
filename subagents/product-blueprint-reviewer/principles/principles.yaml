- principle_id: P003
  statement: 'Organize teams around value streams and strategic goals rather than
    technical components or features: component and feature organization breed output-oriented
    busywork on stable slices, while goal and value-stream organization (built backward
    from the customer''s value) force prioritization and eliminate useless work, balancing
    coverage against goals.'
