  - C00072
  - C00073
  confidence: high
  applies_when: []
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P031
  statement: Never treat research gaps as solved; map engineering gaps toward roadmap-sized
    product work, academic gaps toward validation or open questions, and out-of-scope
