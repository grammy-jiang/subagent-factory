schema_version: principles-v1
principles:
- principle_id: P001
  statement: 'Find a class''s hidden responsibilities with heuristics: group methods
    by similar name and access, treat many private or protected methods as another
    class dying to get out (a private method you want to test should be public, and
    if that bothers you it belongs on another class, which does not reduce encapsulation),
    look for hard-coded decisions and extract methods named for intent (since method
    names do not tell the whole story), map internal relationships with feature sketches,
    describe the primary responsibility in one sentence and factor out the rest, and
    scratch-refactor when you cannot otherwise see them.'
  derived_from_claims:
  - C00389
  - C00390
  - C00391
  - C00392
  - C00393
  - C00394
  - C00395
  - C00396
  - C00397
  - C00398
  - C00399
  - C00404
  confidence: high
  applies_when:
  - deciding how to split a large class into responsibilities
  operational_mapping:
    profile_rule: true
- principle_id: P002
  statement: 'Favor fast, fine-grained unit tests that localize errors, and keep a
    suite that runs fast: a test that talks to a database, network, or file system,
    or needs special environment setup, is not a unit test and slow tests end up not
    being run.'
  derived_from_claims:
  - C00030
  - C00032
  - C00033
  - C00034
  - C00035
  - C00036
  - C00037
  - C00038
  - C00039
  confidence: high
  applies_when:
  - designing a test suite for legacy code
  - classifying a test as unit vs integration
  operational_mapping:
    profile_rule: true
- principle_id: P003
  statement: When breaking dependencies without tests, leave the logic alone as much
    as possible and get separation by inserting seams that let you call one method
    or access one datum rather than another, moving behavior between classes only
    later once tests exist; to encapsulate globals, wrap them in a class (grouping
    globals used or modified together), declare a global instance, and lean on the
    compiler, starting with data or small methods, encapsulating free functions behind
    an interface with fake and production subclasses that merely delegate, and preferring
    the class-and-virtual-function approach over free or static functions for explicit
    seams.
  derived_from_claims:
  - C00502
  - C00503
  - C00504
  - C00505
  - C00506
  - C00507
  - C00508
  - C00509
  - C00510
  confidence: high
  applies_when:
  - code under test depends on global variables or free functions
  operational_mapping:
    profile_rule: true
- principle_id: P004
  statement: 'Use effect sketches, a bubble per affected variable or return value
    with arrows to what can change, to find where to test: identify change points,
    sketch effects outward to the methods where users can sense them, make sure you
    have found all clients including via super- and subclasses, and note that removing
    tiny duplication yields fewer endpoints.'
  derived_from_claims:
  - C00264
  - C00265
  - C00266
  - C00267
  - C00269
  - C00270
  - C00271
  - C00272
  - C00282
  confidence: high
  applies_when:
  - mapping where a change's effects can be observed
  operational_mapping:
    profile_rule: true
- principle_id: P005
  statement: 'Do targeted testing: after understanding tests, verify they cover the
    exact code you will change, test the branch that will change and confirm it is
    hit with a sensing variable or debugger, pick inputs that expose errors such as
    truncation, and when refactoring check both that the behavior still exists and
    that it is connected correctly, since the most valuable characterization tests
    exercise a specific path and each conversion; even with a refactoring tool, quirks
    may force you to work by hand.'
  derived_from_claims:
  - C00313
  - C00314
  - C00315
  - C00316
  - C00317
  - C00318
  - C00319
  - C00320
  - C00321
  confidence: high
  applies_when:
  - confirming a test actually covers the change you will make
  operational_mapping:
    profile_rule: true
- principle_id: P006
  statement: Break a big class into smaller single-responsibility classes incrementally
    and on demand — driven by the change you are making rather than a destabilizing
    refactoring binge or a hypothetical ideal — by identifying its responsibilities
    (making sure the team understands them) and splitting at the implementation level
    before the interface level; while the class is still large, use Sprout Class or
    Sprout Method so ongoing changes do not worsen it.
  derived_from_claims:
  - C00381
  - C00382
  - C00383
  - C00384
  - C00385
  - C00387
  - C00408
  - C00409
  - C00410
  confidence: high
  applies_when:
  - a class has grown large with many methods and responsibilities
  - planning how to decompose a large class
  operational_mapping:
    profile_rule: true
- principle_id: P007
  statement: 'Break a monster method manually with sensing variables, a temporary
    that senses a condition, kept across the refactoring session and then deleted,
    and with Extract What You Know in small named chunks chosen by coupling count:
    favor a low count because a type-conversion error is the key danger (checking
    where each passed variable is declared), prefer zero-count extractions, and use
    a sensing variable and a few tests when the count exceeds zero.'
  derived_from_claims:
  - C00449
  - C00450
  - C00451
  - C00452
  - C00453
  - C00454
  - C00455
  - C00456
  - C00457
  confidence: high
  applies_when:
  - breaking down a monster method without a refactoring tool
  operational_mapping:
    profile_rule: true
- principle_id: P008
  statement: Break build-time coupling by extracting interfaces for classes used from
    outside a cluster and depending on interfaces or abstract classes rather than
    concrete ones (Dependency Inversion), which creates a compilation firewall; moving
    cohesive clusters behind interfaces into their own packages raises total rebuild
    cost slightly but sharply cuts average build time, a one-time cost per cluster.
  derived_from_claims:
  - C00151
  - C00152
  - C00153
  - C00154
  - C00155
  - C00156
  - C00157
  - C00158
  confidence: high
  applies_when:
  - build times are slow because of concrete-class dependencies
  operational_mapping:
    profile_rule: true
- principle_id: P009
  statement: 'Use Wrap Class to add behavior in another class that uses the method
    rather than in the class itself: choose a decorator-style wrapper (same interface,
    delegating) when many callers must get the behavior at once and a plain wrapper
    for a few places, use Extract Implementer or Extract Interface if you cannot instantiate
    the wrapped class, and use decorators sparingly.'
  derived_from_claims:
  - C00128
  - C00129
  - C00130
  - C00131
  - C00132
  - C00133
  - C00134
  - C00136
  confidence: high
  applies_when:
  - adding cross-cutting behavior around an existing class
  operational_mapping:
    profile_rule: true
- principle_id: P010
  statement: 'Avoid over-reliance on libraries: reuse saves time but promiscuous direct
    use locks you in (a royalty hike can kill an application), so avoid littering
    direct library-class calls because every hard-coded use could have been a seam,
    wrap final, sealed, or non-virtual library classes behind a thin wrapper, and
    remember a coding convention can substitute for a restrictive language feature;
    library designers who enforce constraints via language features err because production
    constraints break testing, including the once and restricted-override dilemmas.'
  derived_from_claims:
  - C00322
  - C00323
  - C00324
  - C00325
  - C00326
  - C00327
  - C00328
  - C00329
  confidence: high
  applies_when:
  - code depends heavily on third-party or platform libraries
  operational_mapping:
    profile_rule: true
- principle_id: P011
  statement: 'Treat preserving existing behavior as the primary constraint on any
    change: in every modification far more behavior must be preserved than is altered,
    and unintentionally dropping or changing behavior is a bug.'
  derived_from_claims:
  - C00010
  - C00011
  - C00012
  - C00016
  - C00018
  - C00019
  - C00020
  confidence: high
  applies_when:
  - adding a feature
  - fixing a bug
  - refactoring
  - optimizing
  operational_mapping:
    profile_rule: true
- principle_id: P012
  statement: Use Wrap Method to add behavior that runs entirely before or after existing
    logic by renaming the original and adding a same-signature wrapper (or a method
    calling both) while preserving signatures, which adds tested behavior without
    growing existing methods and keeps it independent, at the cost of possibly awkward
    names; avoid inline additions that create temporal coupling.
  derived_from_claims:
  - C00121
  - C00122
  - C00123
  - C00124
  - C00125
  - C00126
  - C00127
  confidence: high
  applies_when:
  - adding behavior that need not interleave with existing method logic
  operational_mapping:
    profile_rule: true
- principle_id: P013
  statement: Use programming by difference to add a feature quickly via a subclass
    that overrides a method, then use the pinning test to refactor toward a cleaner
    structure such as a configuration option, delegate, or rename, because extensive
    inheritance forces one feature per subclass and cannot combine them.
  derived_from_claims:
  - C00170
  - C00171
  - C00172
  - C00173
  - C00174
  - C00175
  - C00176
  confidence: high
  applies_when:
  - adding a variation quickly in object-oriented code
  operational_mapping:
    profile_rule: true
- principle_id: P014
  statement: Respect the Liskov Substitution Principle by keeping subclass objects
    substitutable for their superclasses everywhere; avoid overriding concrete methods
    (and call the overridden one if you must), since frequent concrete overrides confuse
    readers, and prefer a normalized hierarchy where the superclass is abstract and
    subclasses supply the implementations.
  derived_from_claims:
  - C00178
  - C00179
  - C00180
  - C00181
  - C00182
  - C00183
  - C00184
  confidence: high
  applies_when:
  - using inheritance and overriding methods
  operational_mapping:
    profile_rule: true
- principle_id: P015
  statement: Use Parameterize Constructor to externalize a constructor-created object
    by passing it in while keeping the original signature delegating so clients do
    not change, aware that its downside is opening the door to more dependencies on
    the parameter's class and that default-argument variants force header includes
    in C++ and should be used sparingly.
  derived_from_claims:
  - C00198
  - C00199
  - C00200
  - C00201
  - C00546
  - C00547
  - C00548
  confidence: high
  applies_when:
  - a constructor allocates a collaborator you cannot reach under test
  - a constructor hard-codes creation of a collaborator
  operational_mapping:
    profile_rule: true
- principle_id: P016
  statement: Use Adapt Parameter when you cannot Extract Interface on a parameter's
    class (a sealed or low-level library type) or it is hard to fake, wrapping the
    incoming parameter behind a new narrow interface with a production wrapper and
    a fake to decouple from the API; prefer Extract Interface for parameter dependencies
    generally but not for low-level or implementation-specific types, move toward
    interfaces that communicate responsibilities rather than implementation (a pervasive
    legacy problem is missing abstraction layers), and since Adapt Parameter does
    not preserve signatures, bias toward changes you are confident in over the best
    structure.
  derived_from_claims:
  - C00488
  - C00489
  - C00490
  - C00491
  - C00492
  - C00493
  - C00494
  confidence: high
  applies_when:
  - a parameter's type blocks testing and cannot be extracted to an interface
  operational_mapping:
    profile_rule: true
- principle_id: P017
  statement: To break up a monster method with a tool, work tool-only with no other
    edits (not even reordering, since no tool checks reorder safety and it is a bug
    source) and get tests afterward, aiming your extractions at separating logic from
    awkward dependencies and introducing seams, doing coarse work first with hokey
    but communicative names and handling details after tests, and guarding against
    the common no-test extraction errors of a missing passed variable, hiding or overriding
    a base-class method, and wrong parameter or return types.
  derived_from_claims:
  - C00442
  - C00443
  - C00444
  - C00445
  - C00446
  - C00447
  - C00448
  confidence: high
  applies_when:
  - decomposing a monster method with a refactoring tool
  operational_mapping:
    profile_rule: true
- principle_id: P018
  statement: Establish test-code conventions (a Test suffix, a Fake prefix, and a
    Testing prefix for testing subclasses) so tests do not swamp you and navigation
    between a class and its tests stays ergonomic; decide test location by deployment-size
    constraints, co-locating when space allows or stripping test code via build settings
    when it does not, and separate test and production directories only for a good
    reason, since painful navigation makes people stop writing tests.
  derived_from_claims:
  - C00360
  - C00361
  - C00362
  - C00363
  - C00364
  - C00365
  confidence: high
  applies_when:
  - organizing test code within a project
  operational_mapping:
    profile_rule: true
- principle_id: P019
  statement: 'Minimize lag time between a change and its feedback: aim to compile
    and test every class or module separately in its own harness in seconds, since
    bundling changes to avoid frequent builds is usually unnecessary waste and, for
    compiled languages, dependency is the main impediment to fast feedback.'
  derived_from_claims:
  - C00143
  - C00144
  - C00145
  - C00146
  - C00147
  - C00150
  confidence: high
  applies_when:
  - build and test cycles are slow enough to hurt development
  operational_mapping:
    profile_rule: true
- principle_id: P020
  statement: Treat Subclass and Override Method as the core dependency-breaking technique
    that many others are variants of, using inheritance in a test to nullify behavior
    you do not care about or access behavior you do, guided by the paper-view model
    and the class's factoring; only null out behavior irrelevant to the current test,
    prefer overriding methods that already exist since extracting without tests is
    risky, and make the smallest set of methods overridable.
  derived_from_claims:
  - C00564
  - C00565
  - C00566
  - C00567
  - C00568
  - C00569
  confidence: high
  applies_when:
  - breaking a dependency in object-oriented code with inheritance
  operational_mapping:
    profile_rule: true
- principle_id: P021
  statement: Relax a singleton for testing with Introduce Static Setter or a resetForTesting
    called in setUp and tearDown, making the constructor protected and subclassing;
    distinguish real reasons to enforce one instance from merely wanting a global,
    drop the singleton property when it only serves as a global, and guard against
    misuse with a team rule or build-time and runtime checks.
  derived_from_claims:
  - C00211
  - C00212
  - C00213
  - C00214
  - C00215
  - C00216
  confidence: high
  applies_when:
  - a singleton blocks testing
  operational_mapping:
    profile_rule: true
- principle_id: P022
  statement: Treat global mutable data as the most apparent hurdle to testing, a kind
    of spooky action at a distance, and relax a singleton with a static setter, accepting
    the removed access protection because protection and tests both prevent errors
    and here you need the stronger tool; drive toward the better state of reducing
    global references until the singleton becomes a normal class, make a global factory
    substitutable via a swappable factory behind an interface, reset shared static-setter
    state in setUp and tearDown only when wrong next-test state could mislead, and
    shed globals by giving the classes that need them a common superclass and passing
    the global in.
  derived_from_claims:
  - C00538
  - C00539
  - C00540
  - C00541
  - C00542
  - C00543
  confidence: high
  applies_when:
  - substituting or reducing globals and singletons for testing
  operational_mapping:
    profile_rule: true
- principle_id: P023
  statement: Extract a class safely by listing the variables and methods to move (to
    know what to test, covering private ones through their public callers), using
    Extract Class with tests or the conservative tool-independent procedure without
    tests; do not lean on the compiler for possibly-shadowed variables but search
    manually, avoid inheritance bugs by extracting new methods from old bodies rather
    than moving overriding methods, and after extracting do not get overambitious
    but move the code in a better direction rather than to the ideal.
  derived_from_claims:
  - C00411
  - C00412
  - C00413
  - C00414
  - C00415
  - C00416
  confidence: high
  applies_when:
  - pulling a responsibility out of a big class
  operational_mapping:
    profile_rule: true
- principle_id: P024
  statement: Tell the Story of the System by explaining the architecture in a few
    concepts and adding the next most important each round, using the forced simplification
    to find abstractions and expose ideal versus expedient, and use the story as a
    design guide by preferring changes that keep it substantially true (adding an
    unmentioned responsibility is a bolder distortion than generalizing the story
    slightly) and telling it often to share a view.
  derived_from_claims:
  - C00349
  - C00350
  - C00351
  - C00352
  - C00353
  - C00354
  confidence: high
  applies_when:
  - communicating or evaluating an architecture and its changes
  operational_mapping:
    profile_rule: true
- principle_id: P025
  statement: 'Value object seams over link and preprocessing seams, which do little
    to improve design, and migrate procedural code toward object orientation incrementally:
    treat the whole program as effectively one big object and use the language''s
    object-oriented extensions as a wedge to break tangled dependencies — grouping
    related functions into classes, extracting methods, and (when migrating C to C++)
    compiling C as C++, applying Encapsulate Global References while preserving signatures,
    then Parameterize Constructor — accepting that mechanical migration is not great
    object-oriented design but a good start.'
  derived_from_claims:
  - C00375
  - C00376
  - C00377
  - C00378
  - C00379
  - C00380
  confidence: high
  applies_when:
  - a procedural language offers a path toward object orientation
  - improving procedural code that has an object-oriented option
  operational_mapping:
    profile_rule: true
- principle_id: P026
  statement: Remove duplication zealously to distill a design, since it yields small
    focused methods and orthogonality where one place changes a given behavior, makes
    localized behavior easy to replace or override, and lets designs emerge, being
    mostly mechanical work in which naming is the creative part.
  derived_from_claims:
  - C00425
  - C00426
  - C00427
  - C00428
  - C00429
  - C00430
  confidence: high
  applies_when:
  - repeated logic can be consolidated across a code area
  operational_mapping:
    profile_rule: true
- principle_id: P027
  statement: Use a link seam to substitute an implementation at the linking or reference-resolution
    step, recognizing its enabling point lives outside the source in build or deploy
    config; make the test-vs-production difference obvious and start sensing schemes
    as simple as possible.
  derived_from_claims:
  - C00074
  - C00075
  - C00076
  - C00077
  - C00078
  - C00079
  confidence: medium
  applies_when:
  - dependencies are pervasive and object seams are unavailable
  operational_mapping:
    profile_rule: true
- principle_id: P028
  statement: To harness a heavily include-dependent C++ class, add includes one at
    a time rather than including everything until it builds, and break an unwanted
    dependency with an alternative empty definition plus a separate build, reserving
    that technique for a huge class with severe dependencies because C++ include defaults
    reparse declarations and invite slow, transitively bloated builds.
  derived_from_claims:
  - C00223
  - C00224
  - C00225
  - C00226
  - C00227
  - C00228
  confidence: medium
  applies_when:
  - getting a large, include-heavy C++ class under test
  operational_mapping:
    profile_rule: true
- principle_id: P029
  statement: Treat long methods as quagmires and monster methods as worse, distinguishing
    a bulleted method with little indentation and shared temporaries from a snarled
    method with deep nesting that gives you vertigo when you line up its blocks, and
    recognizing that a tool that safely extracts methods lets you skip verifying extractions
    while without one your cleanup is bounded by the tests you can get in place.
  derived_from_claims:
  - C00436
  - C00437
  - C00438
  - C00439
  - C00440
  - C00441
  confidence: medium
  applies_when:
  - confronting a very long or deeply nested method
  operational_mapping:
    profile_rule: true
- principle_id: P030
  statement: See code in terms of seams to spot existing testing opportunities and
    to structure new code for testability; object seams are the primary seam in object-oriented
    languages, but a call with no enabling point (such as an object created in the
    same method) is not a seam.
  derived_from_claims:
  - C00068
  - C00069
  - C00080
  - C00081
  - C00086
  confidence: high
  applies_when:
  - assessing testability of existing code
  operational_mapping:
    profile_rule: true
- principle_id: P031
  statement: 'Use Sprout Method when added behavior is a distinct piece of new code:
    develop it test-first in a new method (writing the call first, commented out)
    and call it from the old code, which separates new from old and adds tested behavior
    even when the call sites are not yet testable; prefer this over adding code inline.'
  derived_from_claims:
  - C00109
  - C00110
  - C00111
  - C00112
  - C00116
  confidence: high
  applies_when:
  - adding a distinct piece of behavior to a method you cannot yet test
  operational_mapping:
    profile_rule: true
- principle_id: P032
  statement: 'Use Sprout Class when you cannot instantiate the class in a test harness
    in reasonable time: put the change in a new class the source class uses; a sprouted
    class may fold into existing concepts or become a new one, so do not hold back
    despite the added conceptual complexity.'
  derived_from_claims:
  - C00115
  - C00117
  - C00118
  - C00119
  - C00120
  confidence: high
  applies_when:
  - heavy creational or hidden dependencies block instantiating the class
  operational_mapping:
    profile_rule: true
- principle_id: P033
  statement: Use test-driven development to add features by writing a failing test,
    getting it to compile, making it pass, and removing duplication, repeating in
    small steps (large only when certain of the algorithm), not getting lost generalizing
    while making it compile, and treating removing duplication as the critical final
    step.
  derived_from_claims:
  - C00162
  - C00163
  - C00164
  - C00165
  - C00167
  confidence: high
  applies_when:
  - adding a feature to code you can get under test
  operational_mapping:
    profile_rule: true
- principle_id: P034
  statement: Use names consistently and avoid abbreviations (inconsistent ones force
    guessing), let removing duplication align code naturally with the Open/Closed
    Principle of being open for extension and closed to modification, and extract
    shared behavior into a superclass without over-collapsing the hierarchy, since
    thin subclasses can be better than static methods that force all clients to change.
  derived_from_claims:
  - C00431
  - C00432
  - C00433
  - C00434
  - C00435
  confidence: high
  applies_when:
  - naming classes and methods or deciding a hierarchy's shape
  operational_mapping:
    profile_rule: true
- principle_id: P035
  statement: Break a hard-coded object creation in a constructor with Extract and
    Override Factory Method, overriding it in a testing subclass where the language
    allows virtual calls in constructors (not C++, where you use Supersede Instance
    Variable or Extract and Override Getter), and use Extract and Override Getter
    to introduce a lazy getter routed through the class and overridden in a subclass,
    watching object lifetime in non-garbage-collected languages and making all code
    use the getter.
  derived_from_claims:
  - C00517
  - C00518
  - C00519
  - C00520
  - C00521
  confidence: high
  applies_when:
  - a constructor creates an object you cannot depend on under test
  operational_mapping:
    profile_rule: true
- principle_id: P036
  statement: Use Supersede Instance Variable to swap a constructor-created object
    via a supersede method that destroys the old and sets the new when C++ disallows
    constructor virtual dispatch (choosing Extract and Override Getter if the object
    is not used in the constructor, Supersede if it is used and must be replaceable
    before another method runs, and Extract and Override Factory Method where virtual
    constructor calls are allowed), avoiding setters that change base objects because
    they force knowing an object's history, and using an uncommon prefix like supersede
    to search for production misuse.
  derived_from_claims:
  - C00570
  - C00571
  - C00572
  - C00573
  - C00574
  confidence: high
  applies_when:
  - a constructor-created object must be replaced but virtual dispatch is unavailable
  operational_mapping:
    profile_rule: true
- principle_id: P037
  statement: Do not extract an interface to break every parameter dependency, since
    a near one-to-one class-to-interface ratio clutters the design; ask why the dependency
    is bad (creation pain, a side effect, or slowness) because Extract Interface severs
    the whole class, and if only pieces are problematic sever just those, for example
    by Subclass and Override on the isolated problematic method.
  derived_from_claims:
  - C00232
  - C00233
  - C00234
  - C00235
  - C00236
  confidence: high
  applies_when:
  - choosing how aggressively to break a parameter dependency
  operational_mapping:
    profile_rule: true
- principle_id: P038
  statement: 'Prefer Extract Interface as one of the safest dependency-breaking techniques
    since the compiler catches missteps: create an interface with the methods a context
    needs, implement it to sense or separate, and pass a fake, via a tool, incremental
    steps, or cutting and pasting declarations; use Extract Implementer only when
    a class''s name is perfect for the interface and you lack a rename tool (it merely
    swaps one concrete creation for another, so look for a factory), and for a class
    in a hierarchy consider whether Extract Interface with different names is more
    direct.'
  derived_from_claims:
  - C00523
  - C00526
  - C00527
  - C00528
  - C00529
  confidence: high
  applies_when:
  - breaking a dependency on a class you can modify
  operational_mapping:
    profile_rule: true
- principle_id: P039
  statement: To change a private method, first test it through a public method, which
    tests it as used and avoids over-generalizing it; to test it directly, make it
    public, and if that bothers you the class is doing too much and the method belongs
    on another class, since each method need only be as general as its callers require.
