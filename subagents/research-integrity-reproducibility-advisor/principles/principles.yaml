  applies_when:
  - sharing results through seminars, talks, abstracts, posters, preprints, public
    repositories, or other channels before formal journal review
  - later journal submission is planned
  - Developing an oral presentation, abstract, poster, preliminary report, meeting
    record, internal report, international edition, translation, or expanded study
    into another publication.
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P014
  statement: Disclose potentially patentable inventions promptly through the applicable
    institutional process, identify all and only qualifying inventors, and reconcile
    jurisdiction-specific rules before cross-border sharing or commercialization.
