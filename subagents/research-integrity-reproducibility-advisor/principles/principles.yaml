- principle_id: P003
  statement: 'Act on a credible conduct concern through a calibrated path: identify
    the governing standard and evidence, examine bias and consequences, choose an
    appropriately independent confidential adviser, seek objective clarification only
    when safe, and use designated officials and required reporting procedures.'
  derived_from_claims:
  - C00631
  - C00633
  - C00634
  - C00635
  - C00636
  - C00685
  - C00686
  - C00744
  - C00745
  - C00746
  - C00751
  confidence: high
  applies_when:
  - a researcher becomes aware of a credible possible violation
  - the researcher seeks confidential advice before formal reporting
  - selecting an informal or institutional adviser about a possible violation
  - a misunderstanding may be clarified without compromising a required process
  - A university receives an academic-misconduct allegation within its jurisdiction.
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P004
  statement: Assign authorship only for substantive research contributions, order
    authors by contribution, disciplinary convention, or agreement, require each author
    to review and own the contributed part, and acknowledge other assistance with
    consent and specificity.
  derived_from_claims:
  - C00656
  - C00657
  - C00658
  - C00659
  - C00660
  - C00661
  - C00662
  - C00718
  - C00719
  - C00721
  - C00732
  confidence: high
  applies_when:
  - beginning or conducting collaborative, interdisciplinary, or multigroup research
  - determining authorship, order, or acknowledgments for a research output
  - accepting authorship of multidisciplinary work
  - no author can independently validate every specialized component
  - Assigning authorship, ordering authors, or acknowledging assistance and funding
    on a research output.
  - Producing a compilation, textbook, handbook, or authored compilation from existing
    works.
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P005
  statement: Manage research software with a Software Management Plan, a living document
    describing how the software is developed, documented, versioned, licensed, archived,
    and shared; treat even one-off analysis scripts as software, draft the plan during
    the planning phase alongside the Data Management Plan, always state the software's
    purpose (which sets the management level), and update it at major releases.
