  - recording, analyzing, storing, retaining, or sharing research data
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P006
  statement: Classify possible misconduct under the applicable definition and evidence
    threshold, distinguishing fabrication, falsification, and plagiarism from honest
    error, negligence, and differences of opinion without inferring intent from the
    disputed act alone.
  derived_from_claims:
  - C00628
  - C00629
  - C00630
  - C00632
  - C00637
  - C00683
  - C00697
  confidence: high
  applies_when:
  - evaluating suspected fabrication, falsification, plagiarism, or another alleged
    standards violation
  - an institution must classify and respond to conduct below professional standards
  - an institution investigates a formal misconduct allegation
  - false publication information is knowingly represented in an application or professional
    record
  - Classifying an error caused by interpretation, judgment, research capability,
    or equipment limitations.
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P007
  statement: Choose publication units for coherence, completeness, and significant
    contribution; do not republish substantially the same findings or fragment a study
    merely to inflate output, while allowing distinct components that each form a
    complete and meaningful report.
  derived_from_claims:
  - C00004
  - C00624
  - C00625
  - C00626
  - C00655
  - C00690
  confidence: high
  applies_when:
  - designing, performing, analyzing, documenting, reviewing, or publishing research
  - deciding how to divide and submit a body of research
  - deciding whether a body of work warrants one publication or several
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P008
  statement: Never manipulate, select, process, visualize, interpret, or report data
    so that the apparent support exceeds what the observations warrant; examine design
    and measurement weaknesses as well as deliberate alteration.
  derived_from_claims:
  - C00612
  - C00613
  - C00614
  - C00698
  - C00708
  - C00709
  confidence: high
  applies_when:
  - collecting, selecting, processing, visualizing, interpreting, or reporting research
    data
  - Designing studies, collecting observations, analyzing data, reporting results,
    or recording contributions.
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P009
  statement: Investigate data-integrity concerns by distinguishing invented research
    from manipulation of real research, preserving and inspecting original records,
    and using specialist reconstruction or replication when credible anomalies cannot
    be resolved directly.
  derived_from_claims:
  - C00627
  - C00722
  - C00734
  - C00735
  - C00736
  - C00737
  confidence: high
  applies_when:
  - an error in an article, proposal, laboratory record, report, abstract, thesis,
    or related record could mislead others
  - A material error or omission is discovered in work that is in press or public.
  - Inconsistencies, failed replication, missing records, or insider evidence create
    a credible concern about empirical work.
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P010
  statement: Begin human-subject or identifiable-private-data research only after
    appropriate review, with qualified operators and student supervision, and protect
    participants through risk minimization, informed consent, freedom from coercion,
    privacy, and withdrawal rights.
  derived_from_claims:
  - C00638
  - C00639
  - C00640
  - C00641
  - C00729
  - C00730
  confidence: high
  applies_when:
  - a study involves human participants or covered identifiable human data
  - vulnerability, consent capacity, local context, or uncompensated risk complicates
    participation
  - Designing or conducting research involving people or identifiable private information.
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P011
  statement: Audit citations for bibliographic accuracy, relevance, and actual support,
    search the literature thoroughly, and read and cite original work where possible
    rather than relying only on later summaries.
  derived_from_claims:
  - C00647
  - C00648
  - C00650
  - C00651
  - C00711
  - C00712
  confidence: high
  applies_when:
  - another person's published idea or result informs the present work
  - establishing novelty, significance, or evidentiary support in a research communication
  - Using another person's idea, conclusion, datum, formula, table, image, program,
    or other attributable contribution.
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P012
  statement: Make research sufficiently open for exchange, scrutiny, and authorized
    follow-on use while withholding only information protected by valid secrecy, confidentiality,
    or intellectual-property duties.
  derived_from_claims:
  - C00649
  - C00700
  - C00710
  - C00725
  - C00727
