  statement: License the parts of an ML or AI system separately, since a model comprises
    training data, code, and weights that may each be licensed differently and the
    model licence governs the model and its derivatives independently of the other
    components; the chosen licence signals to users how the model should be used,
    and Creative Commons (which has no source-code terms) can cover data and weights
