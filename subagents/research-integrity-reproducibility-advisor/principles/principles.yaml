  - Conducting peer review or another formal academic evaluation.
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P013
  statement: Permit a full or secondary publication only when the prior dissemination
    is eligible, every similar report is disclosed and cross-cited, relevant materials
    are supplied, and all required editorial and rights-holder consents are obtained.
  derived_from_claims:
  - C00652
  - C00653
  - C00654
  - C00741
  - C00742
