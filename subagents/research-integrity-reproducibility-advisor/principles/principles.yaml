- principle_id: P023
  statement: Use containers to capture a whole computing environment for reproducibility,
    because the dependency stack of even a moderate project is huge and a self-contained
    snapshot is easier than resolving dependencies by hand; containers are lighter
    than virtual machines and more robust than package managers or Binder since they
    reproduce the entire system, and are shared by writing a recipe (Dockerfile),
    building an image, and distributing the image for others to run.
