- principle_id: P021
  statement: 'Build a layered test suite with both positive tests (something works)
    and negative tests (something errors when it should): quick smoke tests that reject
    a broken build, runtime checks embedded in the program to catch edge cases early,
    and slow system or end-to-end tests that verify outward functionality (and performance,
    migration, stress, usability, and recovery) which should be run only after lower-level
    tests pass and prioritised on the most common, important, and breakage-prone paths.'
