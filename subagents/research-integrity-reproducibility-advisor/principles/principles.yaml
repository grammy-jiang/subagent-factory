- principle_id: P024
  statement: 'Contribute well to another open source project: orient yourself to its
    roles (author, owner, maintainers, contributors, community members), read its
    documentation and contributing guidelines, match its style and conventions, break
    changes into small well-defined chunks, test the changes against an up-to-date
    version and update the documentation, describe what you changed and why and how
    in the pull request, and remember that valuable non-code contributions (docs,
