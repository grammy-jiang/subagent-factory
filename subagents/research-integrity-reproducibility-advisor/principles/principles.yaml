schema_version: principles-v1
principles:
- principle_id: P001
  statement: Address the real barriers to data sharing (organising data presentably,
    licensing uncertainty, choosing a repository); ensure that for anonymised human-participant
    data the consent forms cover sharing with other researchers and the participant
    sheets state how data is stored, preserved, used, and kept confidential; and accept
    that some data legitimately cannot be fully opened for legal, ethical, privacy,
    security, or commercial reasons, in which case share partial or obscured datasets.
  derived_from_claims:
  - C00240
  - C00241
  - C00242
  - C00243
  - C00244
  - C00245
  - C00246
  - C00320
