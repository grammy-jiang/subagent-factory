- principle_id: P018
  statement: 'Run an open source project with the essential files: a licence file
    (without which no one can legally use it and it is not open source), a DOI so
    the code is citeable, a README covering what the project is, its features, install
    and run instructions, tests, authors, and acknowledgements (write the install
    steps the first time you do them), and, if you want collaborators, contributing
    guidelines and a code of conduct (adopting a standard like the Contributor Covenant)
    kept in the root and linked from the README.'
