- principle_id: P022
  statement: Do not manipulate or analyse data manually in spreadsheet software (including
    copy-paste), because that produces a non-reproducible workflow; use scripts or
    a tool like OpenRefine that records the steps, validate the data for consistency,
    completeness, and correctness before it enters the analysis, and for collaborative
    collection reuse a standard versioned spreadsheet design with a shared template,
    per-column entry standards, and one person answering questions.
