- principle_id: P002
  statement: 'Accept the upfront time cost of reproducibility because it is more than
    repaid: a version-controlled reproducible pipeline makes a reviewer''s late request
    fast to satisfy and the work easy to reuse; being reproducible does not oblige
    you to support reuse beyond re-running the published analyses; the primary beneficiaries
    are usually the research team and your future self; and the required skills (data
    engineering, RSE, technical writing, project management) are themselves a barrier
    worth investing in.'
