  statement: 'Describe data so it can be understood and reused, since data without
    metadata is useless: write documentation in plain language covering source, strengths,
    weaknesses, and limitations; share a README per dataset describing methods and
    data-specific details; provide a data dictionary or codebook (human- and machine-readable)
    sufficient to interpret the data alone; store data in a logical folder structure
    with a README; and use recognised discipline-specific community metadata standards
    so data can be combined across sources.'
