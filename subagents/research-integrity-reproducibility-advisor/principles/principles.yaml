- principle_id: P026
  statement: 'Follow Make authoring conventions: indent recipes with tabs not spaces,
    combine dependent commands on one line since each line runs in its own subshell,
    name the first target all and provide a clean target, declare non-file targets
    as .PHONY, avoid repetition with automatic variables and pattern rules and functions
    like wildcard and patsubst, define UPPERCASE variables at the top, develop the
    directory structure and Makefile together, and avoid recursive nested Makefiles
    that hide the full dependency graph.'
