    skill: null
    reference: null
    test_cases: []
- principle_id: P016
  statement: Build open hardware to be modular and extensible with documented interfaces
    so a community can grow around it, be honest with collaborators about the support
    they can expect, make the project discoverable with a common platform and descriptive
    metadata, make it citable by archiving versions with a DOI for long-term reproducibility,
    and remember that without an open licence others cannot legally use it and that
    hardware licensing is more complex than software because patent law sometimes
    applies.
