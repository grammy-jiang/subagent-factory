- principle_id: P029
  statement: 'Commit well: make each commit an atomic single change, commit no generated
    files, stage the specific files by name rather than adding everything, and write
    a meaningful message with a roughly 50-character present-tense imperative summary
    that explains what you did, why, and what is impacted, describing what the code
