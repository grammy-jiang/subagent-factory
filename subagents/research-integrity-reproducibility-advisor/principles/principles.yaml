- principle_id: P020
  statement: 'Understand usage-restricting licences: Ethical Source and Responsible
    AI licences curtail the freedom to use software for any purpose, so by the classical
    FSF and OSI definitions they are not free or open source and their adoption is
    limited; even an attribution requirement can count as a restriction, compliance
    is harder and more expensive to demonstrate than for conventional licences, and
    DRM-style technical enforcement tends to be brittle, invasive, and bypassable.'
