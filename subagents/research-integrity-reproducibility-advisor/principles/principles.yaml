- principle_id: P019
  statement: 'Use version control, the systematic recording of changes to files over
    time, because manual versioning (v01, v02) is impractical once many files change
    and reproducibility requires providing both the code and the data used to produce
    a figure: version control captures provenance and a version history, hides older
    versions while keeping them accessible, and lets multiple people''s changes be
    tracked and combined, making research more transparent and easier to reproduce
    and build upon for nearly any file type.'
