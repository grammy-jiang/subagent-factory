  - a potentially patentable project spans jurisdictions
  - Research produces material for which patent protection may be needed.
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P015
  statement: 'Detect plagiarism by substantive appropriation, not surface similarity:
    abridgment, reordering, synonym changes, restructuring, mosaicing, added commentary,
    or uncited self-reuse do not cure missing attribution.'
