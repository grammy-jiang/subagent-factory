    (P012). No over-claim.'
- rule_ref: knowledge_partition.always_on[5]
  verdict: WITHIN_SCOPE
  distortion:
  - none
  severity: low
  action: accept_with_note
  note: 'Integrity/misconduct skill bullet compared against P006/P008/P009/P003/P010. Data not overstating
    the observations (P008), classify fabrication/falsification/plagiarism vs honest error without inferring
