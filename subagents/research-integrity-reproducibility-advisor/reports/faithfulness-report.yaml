schema_version: faithfulness-report-v1
subagent_slug: research-integrity-reproducibility-advisor
findings:
- rule_ref: quality_bar[0]
  verdict: WITHIN_SCOPE
  distortion:
  - none
  severity: low
  action: accept_with_note
  note: 'Compared against P022/P030/P023/P032/P019: the bar asks that data prep be scripted, the environment
    captured, and the project a version-controlled dependency build — each clause maps to one cited principle
    and adds no universal "always" the sources do not carry (P002 keeps it purpose-proportioned). Advisory
    criterion, not authority to act.'
- rule_ref: quality_bar[1]
  verdict: WITHIN_SCOPE
  distortion:
  - none
  severity: low
  action: accept_with_note
  note: 'Compared against P008/P009: "apparent support must not exceed what the observations warrant" is
    P008''s own wording, and "measurement weaknesses are examined" restates P008/P009''s investigate-and-inspect
    clause. No strengthening beyond the source.'
- rule_ref: quality_bar[2]
  verdict: WITHIN_SCOPE
  distortion:
  - none
  severity: low
  action: accept_with_note
  note: 'Compared against P004/P007/P015/P011: authorship-for-substantive-contribution (P004), coherent
    not fragmented/duplicated publication (P007), plagiarism by substance not surface (P015), and citation
    auditing (P011) are each restated, not broadened into a blanket rule.'
- rule_ref: quality_bar[3]
  verdict: WITHIN_SCOPE
  distortion:
  - none
  severity: low
  action: accept_with_note
  note: 'Compared against P006/P003/P009: "classify under the applicable definition and evidence threshold
    without inferring intent" is P006 verbatim in substance; "taken to designated officials, not adjudicated
    ad hoc" restates P003. The advisor classifies and routes; it does not itself adjudicate.'
- rule_ref: quality_bar[4]
  verdict: WITHIN_SCOPE
  distortion:
  - none
  severity: low
  action: accept_with_note
  note: 'Compared against P010/P001: "research begins only after appropriate review, with consent, risk
    minimization, privacy, withdrawal" is P010''s protection set; "non-openable data shared partially or
    not at all" is P001''s partial/obscured-dataset clause. No over-claim.'
- rule_ref: quality_bar[5]
  verdict: WITHIN_SCOPE
  distortion:
  - none
  severity: low
  action: accept_with_note
  note: 'Compared against P012/P018/P025/P028: "open for scrutiny while validly protected information is
    withheld" is P012; the licence-and-essential-files clause restates P018/P025/P028. Deliberate-licence
    framing matches the sources'' purpose-tied guidance, not a mandate of one licence.'
- rule_ref: forbidden_behaviours[0]
  verdict: WITHIN_SCOPE
  distortion:
  - none
  severity: low
  action: accept_with_note
  note: 'Compared against P006/P003: the restraint (no institutional finding, no declaring guilt, no inferring
    intent from the act) is strictly narrower than the principles, which permit classification-and-routing.
    A boundary that under-claims relative to the source cannot over-claim.'
- rule_ref: forbidden_behaviours[1]
  verdict: WITHIN_SCOPE
  distortion:
  - none
  severity: low
  action: accept_with_note
  note: 'Compared against P014: P014 says disclose patentable inventions through the institutional process
    and reconcile jurisdiction-specific rules; the forbidden rule turns that into "do not give binding legal
    advice, route to counsel." Restraint, not strengthening.'
- rule_ref: forbidden_behaviours[2]
  verdict: WITHIN_SCOPE
  distortion:
  - none
  severity: low
  action: accept_with_note
  note: 'Compared against P002/P005/P030: the sources tie reproducibility practices to a purpose/context
    (P002, P005 management-level, P030 environment capture); forbidding "certify as reproducible" or "present
    one practice as universally correct" enforces exactly that context-tie. No over-claim.'
- rule_ref: forbidden_behaviours[3]
  verdict: WITHIN_SCOPE
  distortion:
  - none
  severity: low
  action: accept_with_note
  note: 'Compared against P004/P007: ownership of the authorship and publication decision rests with the
    researchers (P004 each author owns their part; P007 they choose publication units). Forbidding the advisor
    to make that decision preserves, not exceeds, the source.'
