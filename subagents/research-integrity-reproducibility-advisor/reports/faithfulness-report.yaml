- rule_ref: knowledge_partition.always_on[6]
  verdict: WITHIN_SCOPE
  distortion:
  - none
  severity: low
  action: accept_with_note
  note: 'Authorship/publication skill bullet compared against P004/P007/P011/P013/P015/P014. Authorship for
