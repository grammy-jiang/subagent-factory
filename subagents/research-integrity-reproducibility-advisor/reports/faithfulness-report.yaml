- rule_ref: knowledge_partition.always_on[0]
  verdict: WITHIN_SCOPE
  distortion:
  - none
  severity: low
  action: accept_with_note
  note: 'Data-management skill bullet compared against P001/P017/P027/P033. Each duty maps to a principle:
    DMP + repository + at-least-one-person access (P017), documentation/README/data-dictionary/discipline
    standards (P027), rich PID metadata for discoverability (P033), and the consent-and-rights-aware stance
    on non-openable data (P001). RESOLVED (review S6): P027''s applies_when was broadened to "documenting,
    storing, depositing, or sharing a dataset so it can be understood and reused" (in addition to "reusing
    a dataset produced by others") to match P027''s own general statement, so the bullet''s documentation
    duties are within scope rather than SCOPE_BROADENED.'
- rule_ref: knowledge_partition.always_on[1]
  verdict: WITHIN_SCOPE
  distortion:
  - none
  severity: low
  action: accept_with_note
  note: 'Reproducible-pipelines skill bullet compared against P002/P022/P023/P030/P032/P026. Scripted data
    prep not spreadsheet-by-hand (P022), captured environment + semantic versioning (P030), containers (P023),
    Make/Snakemake dependency tree (P032, with P026 the Make authoring conventions), all under the accept-the-upfront-cost
    framing of P002. No practice presented as universal beyond its cited principle.'
- rule_ref: knowledge_partition.always_on[2]
  verdict: WITHIN_SCOPE
  distortion:
  - none
  severity: low
  action: accept_with_note
  note: 'Version-control skill bullet compared against P019/P029/P031. Track changes in version control not
    v01/v02 files (P019), atomic named-file commits with meaningful messages excluding generated artefacts
    (P029), stable main branch with conflicts understood before resolution (P031). Direct restatement of the
    three principles.'
- rule_ref: knowledge_partition.always_on[3]
  verdict: WITHIN_SCOPE
  distortion:
  - none
  severity: low
  action: accept_with_note
  note: 'Research-software skill bullet compared against P005/P021/P034/P016. Software Management Plan proportional
    to purpose (P005), layered smoke/runtime/unit/system suite with positive and negative tests (P021), isolated
    unit tests pinning defects (P034), and open-hardware modular/documented/discoverable/citable design (P016).
    P016 is deliberately housed with research software as a managed, shareable artefact — a scope decision,
    not a strengthened claim; its confidence is medium in the principle and the bullet adds no certainty.'
- rule_ref: knowledge_partition.always_on[4]
  verdict: WITHIN_SCOPE
  distortion:
  - none
  severity: low
  action: accept_with_note
  note: 'Open-source/licensing skill bullet compared against P018/P024/P020/P025/P028/P012. Essential project
    files incl. a licence without which it is not open (P018), contributing well to others'' projects (P024),
    the non-free status of usage-restricting licences (P020, stated as the FSF/OSI view the principle carries,
