  - A name does not clearly communicate the purpose of the thing it names.
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P005
  statement: 'Prefer small, well-named functions that separate intention from implementation:
    extract a fragment into a function named after what it does whenever you would
    otherwise write a comment, and inline functions whose indirection no longer earns
    its keep.'
