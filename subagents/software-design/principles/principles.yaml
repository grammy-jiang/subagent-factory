    skill: null
    reference: null
    test_cases: []
- principle_id: P006
  statement: 'Optimize for changeability and leave the codebase healthier than you
    found it: the real test of good code is how easily it can be changed, so favor
    clarity over brevity and write primarily for the future human reader.'
  derived_from_claims:
  - C00220
  - C00221
  - C00222
  - C00223
  - C00674
  - C00675
  - C00677
  - C00680
  - C00682
  - C00683
  - C00684
  confidence: high
  applies_when:
  - fixing a bug or adding a feature in an existing code base
  - Making any change to a long-lived codebase.
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P007
  statement: 'Simplify conditional logic: decompose complex conditions into intention-named
    functions, use guard clauses for unusual cases, and replace type-code switching
    with polymorphism — reserving polymorphism for type-based or base-plus-variant
    cases rather than converting every conditional.'
  derived_from_claims:
  - C00481
  - C00482
  - C00621
  - C00672
  - C00731
  - C00799
  - C00800
  - C00801
  - C00802
  - C00803
  - C00819
  confidence: high
  applies_when:
  - Conditional logic is complex, or the same type-based switch is duplicated across
    functions.
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P008
  statement: Use OO mechanisms, inheritance, and design patterns only where they reduce
    complexity; prefer composition over implementation inheritance and avoid exposing
    instance variables.
  derived_from_claims:
  - C00250
  - C00252
  - C00253
  - C00259
  - C00260
  - C00826
  - C00827
  - C00828
  - C00829
