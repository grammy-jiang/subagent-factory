  applies_when:
  - Conditional logic is complex, or the same type-based switch is duplicated across
    functions.
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P008
  statement: Use OO mechanisms, inheritance, and design patterns only where they reduce
    complexity; prefer composition over implementation inheritance and avoid exposing
    instance variables.
  derived_from_claims:
  - C00250
  - C00252
  - C00253
  - C00259
