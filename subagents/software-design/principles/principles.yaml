  applies_when:
  - A function interacts with another module's data more than its own, or modules
    trade too much detail.
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P016
  statement: Refactor in tiny behavior-preserving steps, compiling and running the
    tests after each step and committing after each success; when a step breaks the
    tests and the cause is not obvious, revert to the last green commit and redo with
    smaller steps.
