- principle_id: P015
  statement: 'Co-locate behavior with the data it uses and cut inappropriate coupling
    between modules: move a function or field to the data it most references, and
    reduce excessive chatting between modules (feature envy, message chains, middle
    man, insider trading) with moves, delegation hiding, or a shared module.'
