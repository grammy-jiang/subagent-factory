    skill: null
    reference: null
    test_cases: []
- principle_id: P003
  statement: 'Make testing risk-driven and bug-finding: concentrate tests on complex
    code and boundary/corner cases, start a bug fix by writing a failing test that
    exposes it, and judge a suite by confidence that a defect would trip a test rather
    than by coverage percentage.'
