schema_version: principles-v1
principles:
- principle_id: P001
  statement: 'Treat a fast, self-checking, self-testing suite as a prerequisite for
    refactoring: automate the tests, make them check their own results, run them frequently,
    and confirm each test can fail when it should.'
  derived_from_claims:
  - C00256
  - C00542
  - C00573
  - C00574
  - C00652
  - C00653
  - C00654
  - C00705
  - C00745
  - C00746
  - C00748
  - C00749
  confidence: high
  applies_when:
  - a system that will undergo ongoing change and refactoring
  - About to refactor any non-trivial code.
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P002
  statement: 'Write for the reader, not the writer: code is read far more than written,
    so judge clarity from the viewpoint of another programmer who knows nothing about
    the system, and make code obvious with good names, consistency, and structure-revealing
    whitespace.'
