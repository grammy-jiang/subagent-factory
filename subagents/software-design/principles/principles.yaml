    skill: null
    reference: null
    test_cases: []
- principle_id: P004
  statement: Name variables, functions, and classes with intention-revealing, unambiguous,
    pronounceable, searchable names that say why they exist, what they do, and how
    they are used; if a name needs a comment to be understood, it has failed.
