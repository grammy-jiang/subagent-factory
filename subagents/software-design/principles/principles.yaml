  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P014
  statement: 'Keep surviving comments truthful, brief, and local: delete redundant,
    mandated, noise, obsolete, journal, and authorship comments and all commented-out
    code, and let source control hold history; reserve comments for technical notes
    the code cannot express.'
