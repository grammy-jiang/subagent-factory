  - families of products or construction steps vary
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P010
  statement: 'Eliminate duplicated knowledge so the system says everything once and
    only once: fold identical code into a method, repeated conditionals into polymorphism,
    and similar algorithms into a Template Method or Strategy.'
