    skill: null
    reference: null
    test_cases: []
- principle_id: P013
  statement: 'Manage inheritance deliberately: pull common members up and push specific
    members down, remove subclasses that no longer earn their keep, and replace subclassing
    with delegation when you need more than one axis of variation or the subclass
    is not a true subtype — favoring composition over inheritance.'
