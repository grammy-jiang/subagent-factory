  - choosing between subclassing and composition for reuse
  - behaviour must be changeable at run time
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P009
  statement: 'Separate constructing a system from using it: move object construction
    and dependency wiring into main, factories, or a dependency-injection container
    so application objects stay passive and unaware of how they were built.'
