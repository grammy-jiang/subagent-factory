    skill: null
    reference: null
    test_cases: []
- principle_id: P012
  statement: 'Refactor when change demands it: refactor first to make a feature or
    bug fix easy (preparatory), refactor to understand unfamiliar code (comprehension),
    remove duplication by the rule of three, and fold refactoring opportunistically
    into everyday work because software is never done.'
