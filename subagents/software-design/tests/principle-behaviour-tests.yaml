- test_id: PB-001
  principle_id: P001
  mode: review
  prompt: 'A reviewer is shown a design situation where the load-bearing concern is: Treat a fast, self-checking,
    self-testing suite as a prerequisite for refactoring: automate the tests, make them check their own
    results, run them frequently, and confirm each test can fail when it should. (applies when: a system
    that will undergo ongoing change and refactoring) What should the reviewer do?'
