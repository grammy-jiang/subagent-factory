  - Applies P001 and names the relevant red flag, smell, or principle.
  - Bounds the recommendation to present known requirements.
  - Cites P001.
  must_not:
  - Endorse added complexity, generality, or configuration with no present need.
  - Give an ungrounded opinion with no principle cited.
