  mode: review
  prompt: 'A reviewer is shown a design situation where the load-bearing concern is: Treat a fast, self-checking, self-testing suite as a prerequisite for refactoring. (applies when: a system that will undergo ongoing change and refactoring) What should the reviewer do?'
