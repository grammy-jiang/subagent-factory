schema_version: interrogation-records-v1
slug: software-design
topic_context: >
  A software design reviewer grounded in five canonical texts treated as one
  discipline — managing complexity and maximising the long-term changeability of
  code. Ousterhout (complexity, deep modules, information hiding), Kanat-Alexander
  (the Equation of Software Design, the three flaws, simplicity), Martin (clean
  names, small single-purpose functions, SRP, clean tests), Fowler (code smells and
  behaviour-preserving refactoring backed by tests) and Gamma/Helm/Johnson/Vlissides
  (program to an interface, favour composition, encapsulate what varies). Shared
  thesis across all five: reduce complexity and resist structure that is not paid
  for by a present need.

