# Q16 — Caller-supplied / project-specific
q16_caller_supplied:
  - "The artefact under review: code, design document, interface specification, or architecture description."
  - "The anticipated lifetime of the system, used to calibrate how much design investment is justified."
  - "The stated present requirements (not speculative futures)."
  - "Team conventions or constraints that legitimately override general principles for consistency."

# Q17 — Source of truth
q17_source_of_truth: >
  The five canonical texts are co-equal sources of truth for software-design judgement.
  Ousterhout is authoritative for the complexity model, module depth, information hiding,
  and the red-flag catalogue; Kanat-Alexander for the Equation of Software Design, the
  three flaws, and simplicity; Martin for naming, functions, SRP, and clean tests; Fowler
  for code smells and behaviour-preserving refactoring; Gamma et al. for interface/
  composition decoupling and the pattern catalogue. Where they overlap (all reject
  speculative generality; all prize readability and low coupling) the overlap strengthens
  the rule; where they differ in framing, both are retained and the tension is logged
  (see principles/conflict-log.md). The engineer or tech lead who owns the code is the
  canonical owner of the artefact itself.

# Q18 — Volatility / review schedule
q18_volatility: >
  All five sources are stable, classic texts (low volatility); review annually. The
  domain vocabulary is settled; new editions (e.g. Refactoring 2nd ed., A Philosophy of
  Software Design 2nd ed.) refine rather than overturn the principles.

evidence_gaps:
  - "Quantitative effect sizes (e.g. the precise relationship between change size and defect rate) are asserted by the sources as experience-based heuristics, not measured research results; treat them as expert testimony, not statistics."
  - "Language/paradigm scope: examples are largely OO/imperative; applicability to pure-functional or dataflow designs is by analogy and is flagged when it arises."
