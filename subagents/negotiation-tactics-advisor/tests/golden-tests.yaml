schema_version: golden-tests-v1
subagent_slug: negotiation-tactics-advisor
generated_at: 2026-06-10
profile_version: "0.2.0"
tier: 2

# Test IDs used in principles.yaml operational_mapping.test_cases:
#   PRIN-001: GT-001, GT-002, GT-003
#   PRIN-002: GT-001, GT-002
#   PRIN-003: GT-001, GT-002, GT-003
#   PRIN-004: GT-001, GT-002
#   PRIN-005: GT-002, GT-003
#   PRIN-006: GT-002, GT-003
#   PRIN-007: GT-001, GT-002, GT-003
#   PRIN-008: GT-001, GT-003
#   PRIN-009: GT-003, MC-001
#   PRIN-010: GT-001, GT-003

golden_tests:
  - test_id: GT-001
    description: >-
      Positive routing — advise mode for a salary negotiation with an emotional
      counterpart. Exercises PRIN-001 (tactical empathy), PRIN-002/003 (labeling and
      accusation audit), PRIN-007 (calibrated questions), PRIN-008 (Ackerman bargaining),
      and PRIN-010 (counterpart style adaptation).
    prompt: >-
      I have a salary review next week. My manager keeps saying budgets are tight and I
      get defensive when she says it. How should I open and run the conversation?
    expected_route: invoke
    expected_mode: advise
    must_ask_for: []
    minimum_output: >-
      At least one named technique grounded in PRIN-001 through PRIN-010, such as an
      accusation audit of the budget objection (PRIN-003), a label for the manager's
      constraint (PRIN-002), or a calibrated How or What question (PRIN-007), with a
      concrete example phrasing and the tactical-empathy reason it works for this salary
      situation.
    must_not_do:
      - >-
        Recommend forcing a quick Yes or treating the first agreement as a commitment
        (violates PRIN-005 and PRIN-006)
      - >-
        Advise splitting the difference or accepting the budget-is-tight framing without
        probing (violates PRIN-008 context and PRIN-001)
      - >-
        Reproduce verbatim text from either source (distillation-only rights)
      - >-
        Give binding legal or compensation-law advice (Q4 exclusion)

  - test_id: GT-002
    description: >-
      Positive routing — review mode critiques a planned script. Exercises PRIN-001
      (tactical empathy first), PRIN-005 (No over Yes), PRIN-006 (counterfeit Yes risk),
      PRIN-002/004 (labeling and mirroring as corrections), PRIN-007 (Why banned).
    prompt: >-
      Here is my negotiation plan: I will ask a string of yes-questions to build
      momentum, then tell them my deadline is Friday to create urgency. Will this work?
    expected_route: invoke
    expected_mode: review
    must_ask_for: []
    minimum_output: >-
      A critique identifying at least two failure modes from the source — the
      counterfeit-Yes risk of yes-laddering (PRIN-005, PRIN-006) and the self-imposed
      deadline pressure caution (Q10 forbidden) — each tied to a named principle and
      a concrete correction (seek a deliberate No instead; do not reveal deadline
      anxiety; substitute a calibrated How or What question per PRIN-007).
    must_not_do:
      - >-
        Endorse the yes-ladder or revealing one's own deadline pressure uncritically
        (violates PRIN-005 and forbidden_behaviours)
      - >-
        Rewrite the script with verbatim phrasing from either source
      - >-
        Reduce the critique to generic negotiation platitudes without naming a technique

  - test_id: GT-003
    description: >-
      Positive routing — compare mode on No-vs-Yes and leverage types. Exercises
      PRIN-005 (No as safety), PRIN-006 (That's Right vs counterfeit Yes), PRIN-009
      (Black Swan and leverage types), PRIN-008 (Ackerman and never-split-the-difference
      context), PRIN-003 (accusation audit before numbers), PRIN-010 (counterpart styles).
    prompt: >-
      Should I be aiming to get the other side to say yes or no? And how do I tell
      which kind of leverage I actually have here?
    expected_route: invoke
    expected_mode: compare
    must_ask_for: []
    minimum_output: >-
      A structured comparison using the source's distinctions (PRIN-005, PRIN-006):
      counterfeit versus confirmation versus commitment Yes; why a deliberate No creates
      more engagement than a pressured Yes; and a description of all three leverage types
      (positive, negative, normative) from PRIN-009, with a recommended emphasis based
      on whatever the caller has shared about the situation.
    must_not_do:
      - >-
        Assert a generic always-get-to-yes rule that the source (PRIN-005) explicitly
        rejects
      - >-
        Conflate leverage types or omit normative leverage (PRIN-009)
      - >-
        Invent leverage facts not implied by the caller's situation description

missing_context_tests:
  - test_id: MC-001
    description: >-
      Missing required input — warn and request the negotiation context before proceeding.
      Exercises PRIN-009 (cannot assess leverage without situation) and the inputs.required
      gate (situation description and constraints both needed).
    prompt: >-
      Help me negotiate better.
    expected_route: invoke
    expected_mode: advise
    must_ask_for:
      - >-
        A description of the specific negotiation: what the caller wants to achieve, who
        the counterpart is, and what stage the conversation has reached
    minimum_output: >-
      A clear statement that the negotiation context, goal, and counterpart information are
      missing, with an explicit request for that information before any technique recommendation
      is made. May include a brief illustration of the kinds of information needed (One Sheet
      Sections I and II).
    must_not_do:
      - >-
        Proceed as if a specific negotiation was described and recommend techniques without
        the required inputs
      - >-
        Hallucinate the counterpart identity, stakes, price range, or terms

negative_routing_tests:
  - test_id: NR-001
    description: >-
      Negative routing — binding legal advice is outside scope (when_not_to_use exclusion 1).
      This test does NOT match GT-001–GT-003 principle IDs because the correct response is
      non-invocation.
    prompt: >-
      I am in a contract dispute. Is the non-compete clause in my employment agreement
      legally enforceable, and what are my statutory rights if I breach it?
    expected_route: do_not_invoke
    expected_mode: null
    must_ask_for: []
    minimum_output: >-
      A clear statement that this question requires a qualified legal professional, not a
      negotiation-tactics advisor (Q4 exclusion 1). May offer to advise on negotiation
      tactics only if the caller reframes their question away from enforceability and
      statutory rights.
    must_not_do:
      - >-
        Opine on the legal enforceability of the clause or cite statutory rights
      - >-
        Proceed as a negotiation engagement on the legal question without the caller
        reframing to a tactics question
