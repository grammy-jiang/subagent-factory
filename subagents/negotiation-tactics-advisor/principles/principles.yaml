schema_version: principles-v1
principles:

  - principle_id: PRIN-001
    statement: >-
      Ground every negotiation technique in tactical empathy — the deliberate recognition and
      articulation of the counterpart's perspective and emotions. Negotiation behaviour is
      driven primarily by fast emotional (System 1) thinking, not rational argument; acknowledging
      what the counterpart feels before advancing your own position is the prerequisite for every
      other technique in this source.
    derived_from_claims:
      - CL001
      - CL002
    confidence: high
    applies_when:
      - Any negotiation where the counterpart is a person whose emotions shape the outcome.
      - When the counterpart is emotional, defensive, or stuck on a position.
    does_not_apply_when:
      - Purely technical or quantitative optimisation tasks with no human counterpart whose
        emotions drive behaviour.
    operational_mapping:
      profile_rule: true
      skill: null
      reference: tactical-empathy-toolkit
      test_cases:
        - GT-001
        - GT-002
        - GT-003

  - principle_id: PRIN-002
    statement: >-
      Use emotion labels — phrased as "It seems like…", "It sounds like…", or "It looks like…" —
      to acknowledge and name the counterpart's emotional state before responding to content.
      Labeling negative emotions reduces their intensity; labeling positive ones amplifies them.
      After delivering a label, hold silence immediately and let the counterpart respond.
    derived_from_claims:
      - CL011
      - CL012
      - CL013
      - CL014
    confidence: high
    applies_when:
      - When the counterpart shows emotional signals — frustration, hesitation, enthusiasm,
        or resistance — before or during substantive discussion.
      - When the counterpart needs to feel heard before they will consider a proposal.
    does_not_apply_when:
      - When tone and content are fully aligned and no unacknowledged emotion is present.
      - When misidentifying the emotion would introduce greater confusion than silence.
    operational_mapping:
      profile_rule: true
      skill: labeling-and-accusation-audit
      reference: tactical-empathy-toolkit
      test_cases:
        - GT-001
        - GT-002

  - principle_id: PRIN-003
    statement: >-
      Open emotionally loaded negotiations with an accusation audit: proactively name every
      negative assumption the counterpart is likely to hold about you or the deal before they
      raise it, using label framing. Anchor the counterpart's emotions with this technique before
      introducing numbers or terms. This pre-empts objections and typically prompts the counterpart
      to reassure the negotiator rather than attack.
    derived_from_claims:
      - CL015
      - CL016
      - CL030
    confidence: high
    applies_when:
      - Before presenting an offer, proposal, or difficult request, especially when the counterpart
        is likely to be sceptical or hostile.
      - When entering price discussion or any moment where the counterpart's emotional reaction
        to the numbers will shape the outcome.
    does_not_apply_when:
      - When the counterpart has no negative preconceptions — an accusation audit would introduce
        suspicion that does not exist.
      - When the negotiation is already past the initial framing stage and the emotional anchor
        has been set.
    operational_mapping:
      profile_rule: true
      skill: labeling-and-accusation-audit
      reference: tactical-empathy-toolkit
      test_cases:
        - GT-001
        - GT-002
        - GT-003

  - principle_id: PRIN-004
    statement: >-
      Deploy mirroring to encourage elaboration and build rapport without committing to a
      position. Repeat the last one to three critical words the counterpart said as a question
      with a rising inflection, then hold silence for at least four seconds. Mirroring triggers
      the counterpart to elaborate and reveal information while implicitly signalling agreement.
    derived_from_claims:
      - CL007
      - CL008
      - CL009
    confidence: high
    applies_when:
      - When the counterpart pauses, provides incomplete information, or needs to be encouraged
        to elaborate.
      - During information-gathering or rapport-building phases of a negotiation.
    does_not_apply_when:
      - When the counterpart has already volunteered sufficient information and further prompting
        would appear mechanical.
      - In asynchronous written exchanges where the post-mirror silence cannot be controlled.
    operational_mapping:
      profile_rule: true
      skill: null
      reference: tactical-empathy-toolkit
      test_cases:
        - GT-001
        - GT-002

  - principle_id: PRIN-005
    statement: >-
      Reframe the goal from getting a Yes to eliciting a deliberate No. A No answer gives
      counterparts a sense of safety, security, and control, increasing genuine engagement.
      No is the starting point of substantive negotiation, not the end. Design openers and
      questions so that a No answer still opens the conversation rather than closing it.
    derived_from_claims:
      - CL017
      - CL018
      - CL019
    confidence: high
    applies_when:
      - Opening contacts where the counterpart has not yet committed to engaging.
      - When a counterpart is stonewalling, unresponsive, or providing only superficial agreement.
      - When designing question phrasing in any mode.
    does_not_apply_when:
      - When a genuine commitment Yes has already been established and the goal is now execution
        rather than engagement.
    operational_mapping:
      profile_rule: true
      skill: null
      reference: tactical-empathy-toolkit
      test_cases:
        - GT-002
        - GT-003

  - principle_id: PRIN-006
    statement: >-
      Treat "That's Right" as the genuine breakthrough signal and distinguish it sharply from
      counterfeit agreement. Reaching a "That's Right" — elicited by combining a label with a
      paraphrase summary of the counterpart's key concerns — marks the moment the counterpart
      feels fully heard. A "You're Right" response is appeasement, not commitment. Do not
      mistake a counterfeit Yes (said to escape pressure) or a confirmation Yes for the
      commitment Yes needed for durable agreement.
    derived_from_claims:
      - CL022
      - CL023
      - CL024
      - CL025
    confidence: high
    applies_when:
      - When assessing whether any affirmation the counterpart has offered is genuine commitment.
      - When summarising the counterpart's position to test mutual understanding before advancing.
      - In review mode when critiquing a script for counterfeit-Yes risk.
    does_not_apply_when:
      - When a clear "That's Right" has already been obtained — seeking further confirmation
        at that point is unnecessary and could feel interrogative.
    operational_mapping:
      profile_rule: true
      skill: null
      reference: tactical-empathy-toolkit
      test_cases:
        - GT-002
        - GT-003

  - principle_id: PRIN-007
    statement: >-
      Use calibrated How and What questions to give the counterpart the illusion of control
      while directing their thinking toward constraints, priorities, and hidden interests.
      Replace Why questions — which are inherently accusatory — with What or How formulations.
      Use "How am I supposed to do that?" as a polite, face-saving No when declining a demand
      without direct confrontation.
    derived_from_claims:
      - CL039
      - CL040
      - CL041
    confidence: high
    applies_when:
      - Whenever gathering information about the counterpart's constraints, authority, or
        real interests.
      - When declining a demand without direct confrontation.
      - When drafting question scripts for the caller in any mode.
    does_not_apply_when:
      - When a direct closed question is required to confirm a binary, logistical fact with
        no emotional charge.
      - When facing an Assertive-style counterpart who requires direct validation before
        open questions will be received well.
    operational_mapping:
      profile_rule: true
      skill: calibrated-questions-and-illusion-of-control
      reference: null
      test_cases:
        - GT-001
        - GT-002
        - GT-003

  - principle_id: PRIN-008
    statement: >-
      Structure monetary bargaining using the Ackerman model: successive offers at 65%, 85%,
      95%, and 100% of the target price, with each increment smaller than the last to signal
      approach toward a firm limit. The final offer must be a non-round, precise number and
      must be accompanied by a low-cost nonmonetary concession, both of which credibly signal
      that no monetary room remains.
    derived_from_claims:
      - CL052
      - CL053
      - CL054
    confidence: high
    applies_when:
      - Any negotiation involving a series of monetary offers where the caller is the offering
        party (salary, purchasing, deal structuring).
    does_not_apply_when:
      - When the counterpart is making all offers and the caller is purely reacting.
      - Single-offer take-it-or-leave-it situations where a concession sequence signals
        weakness rather than calculated precision.
    operational_mapping:
      profile_rule: true
      skill: ackerman-bargaining-and-anchoring
      reference: null
      test_cases:
        - GT-001
        - GT-003

  - principle_id: PRIN-009
    statement: >-
      Actively probe for Black Swans — unknown unknowns that can instantly transform leverage —
      and assess all three leverage types (positive, negative, normative) before and during
      every negotiation. When a counterpart appears irrational, diagnose them first as
      potentially ill-informed, secretly constrained, or operating under hidden interests.
      Apply normative leverage by exposing inconsistencies between the counterpart's own
      stated standards and their current position.
    derived_from_claims:
      - CL055
      - CL056
      - CL057
      - CL060
    confidence: high
    applies_when:
      - During preparation and throughout any negotiation where the counterpart's full
        constraints, interests, or authority are unknown.
      - When the counterpart's behaviour appears inexplicable or unreasonable.
      - When the caller needs to understand their actual leverage position (compare mode).
    does_not_apply_when:
      - When leverage and counterpart constraints are already fully mapped and no hidden
        information remains plausible.
    operational_mapping:
      profile_rule: true
      skill: black-swan-and-leverage-discovery
      reference: null
      test_cases:
        - GT-003
        - MC-001

  - principle_id: PRIN-010
    statement: >-
      Identify the counterpart's negotiator style (Analyst, Accommodator, or Assertive) and
      adapt the technique sequence accordingly. Analysts need data and preparation time; avoid
      surprises and let silence serve their thinking. Accommodators prioritise relationship over
      outcome; probe for genuine commitment beneath easy agreement. Assertives want to be heard
      first; validate their point explicitly before any redirection.
    derived_from_claims:
      - CL047
      - CL048
      - CL049
      - CL050
    confidence: high
    applies_when:
      - Whenever the caller provides enough information about the counterpart's communication
        pattern to infer their style.
      - In compare mode when the caller asks which tools suit a particular counterpart type.
      - When designing a technique sequence in advise mode.
    does_not_apply_when:
      - When no information about the counterpart's behaviour is available and style cannot
        be inferred even tentatively.
      - When the counterpart displays clear mixed-style signals that make style assignment
        counterproductive.
    operational_mapping:
      profile_rule: true
      skill: null
      reference: negotiator-styles-and-voices
      test_cases:
        - GT-001
        - GT-003
