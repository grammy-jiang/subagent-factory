    skill: null
    reference: null
    test_cases: []
- principle_id: P006
  statement: 'Test each fault at the level where it is cheapest to detect: catch faults
    at the unit level where they are trivial rather than letting them surface in expensive
    system testing, and re-analyze and re-test any reused component in its new context.'
  derived_from_claims:
  - C00024
  - C00025
  - C00026
  - C00057
  - C01656
  - C01657
  - C01658
  - C01661
  - C01662
  - C01663
