- principle_id: P005
  statement: Design classes to be loosely coupled and highly cohesive with explicit
    substitutable dependencies, since only such classes are easy to unit-test; when
    a test grows large or is hard to write, treat it as a design signal to split the
    class or introduce abstractions.
