  applies_when:
  - deciding at which level to target a class of faults
  - reusing a component in a new context
  - choosing among unit, integration, and system coverage
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P007
  statement: 'Use test doubles to replace components that are unimplemented, perform
    unrecoverable actions, depend on unreliable resources, or are slow: a stub returns
    canned values while a mock also verifies the calls made to it, enabling interaction-based
    testing (obtain doubles, specify expected interactions, act, verify) that checks
    how objects communicate rather than only their state.'
  derived_from_claims:
  - C00509
  - C00510
  - C00511
  - C00512
  - C00513
  - C00514
  - C01983
  - C01984
  - C01985
  - C01986
