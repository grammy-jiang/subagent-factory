schema_version: principles-v1
principles:
- principle_id: P001
  statement: MCP servers MUST validate every access token per OAuth 2.1 Section 5.2,
    accept only tokens whose intended audience is the server itself, return HTTP 401
    for invalid or expired tokens, and never accept or transit tokens issued for other
    resources; clients MUST NOT send a server any token not issued by that server's
    authorization server.
  derived_from_claims:
  - C00046
  - C00047
  - C00048
  - C00079
  - C00080
  - C00081
  - C00099
  - C00100
  - C00101
  - C00588
  - C00597
  confidence: high
  applies_when:
  - an MCP server receives a request bearing an access token
  - an MCP server receives a token from a client and could forward it to a downstream
    API
  - An MCP server receives a bearer token for a protected resource request
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P002
  statement: 'Treat MCP tool metadata as an instruction-injection surface: scan, constrain,
    whitelist, sanitize, and avoid forwarding imperative metadata to models before
    tool exposure.'
  derived_from_claims:
  - C00691
  - C00698
  - C00700
  - C00742
  - C00746
  - C00759
  - C00926
  - C00927
  - C00928
  - C00929
  - C00930
  confidence: medium
  applies_when:
  - A client connects to a malicious, compromised, or unreviewed MCP server.
  - A client would otherwise load tool descriptions without showing or checking the
    full model-visible text.
  - Server-provided tool metadata is about to be admitted to model context or a risky
    tool call may execute.
  - Publishing, installing, loading, or forwarding MCP tool descriptions or usage
    fields.
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P003
  statement: Use the authorization-code flow with PKCE for MCP clients, then call
    protected MCP resources with the issued bearer access token only after a successful
    token exchange.
  derived_from_claims:
  - C00571
  - C00572
  - C00573
  - C00576
  - C00577
  - C00578
  - C00581
  - C00620
  - C00621
  - C00624
  confidence: medium
  applies_when:
  - The MCP OAuth client is public and uses an authorization-code flow.
  - The client cannot safely retain a long-lived client secret.
  - An MCP client accesses a remote MCP server on behalf of a user
  - The flow uses an authorization code with a public MCP client
  - A public MCP client receives an authorization code after user approval.
  - The client needs to call protected MCP resources.
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P004
  statement: Use Dynamic Client Registration to onboard LLM clients without manual
    administrator pre-registration when MCP clients and services are numerous or frequently
    changing.
  derived_from_claims:
  - C00559
  - C00566
  - C00567
  - C00568
  - C00631
  - C00635
  - C00644
  - C00677
  - C00681
  confidence: medium
  applies_when:
  - The authorization server exposes a dynamic registration endpoint.
  - The ecosystem allows arbitrary or frequently added LLM clients and MCP servers.
  - Previously unknown MCP clients need to initiate authorization against the server.
  - The authorization platform supports a registration endpoint.
  - An MCP client or workbench needs to onboard many or previously unknown MCP servers.
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: &id002 []
- principle_id: P005
  statement: Pin and reverify MCP server and tool definitions by version, hash, or
    equivalent integrity check whenever tools are installed, refreshed, or executed.
  derived_from_claims:
  - C00385
  - C00390
  - C00410
  - C00701
  - C00702
  - C00710
  - C00760
  confidence: high
  applies_when:
  - Tool definitions are discovered once and later used for execution or authorization
    decisions.
  - MCP server or package architecture allows tool descriptions to change after approval.
  - A client relies on an earlier approval to trust a current tool definition.
  - MCP server tool metadata persists across sessions or is reused by a client, team,
    or deployment.
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P006
  statement: Use the separated authorization-server model in MCP as the architectural
    basis for enterprise-ready integrations rather than embedding all authorization
    behavior in the MCP server itself.
  derived_from_claims:
  - C00498
  - C00565
  - C00579
  - C00580
  - C00593
  - C00594
  - C00598
  confidence: medium
  applies_when:
  - An MCP implementation follows the updated authorization model that separates authorization-server
    responsibilities from MCP-server responsibilities.
  - The MCP server trusts a separate authorization server named in its protected-resource
    metadata.
  - A deployment has or can use an external identity provider or OAuth authorization
    server
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P007
  statement: Deliver Protected Resource Metadata via a WWW-Authenticate resource_metadata
    parameter on 401 responses or a well-known URI; clients MUST parse WWW-Authenticate
    headers, react to 401s, prefer the resource_metadata URL when present, and otherwise
    fall back to the well-known URIs in the specified order.
  derived_from_claims:
  - C00017
  - C00018
  - C00021
  - C00471
  - C00560
  - C00561
  confidence: high
  applies_when:
  - an MCP client receives a 401 from an MCP server
  - The resource server cannot or should not host metadata at the fixed well-known
    protected-resource location.
  - A client first connects to the protected MCP resource without credentials.
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P008
  statement: Bind every MCP authorization decision to the identity of the caller that
    triggers the invocation, and re-authorize when a new caller interacts; authorization
    enforced only at the server or resource level, without being scoped to the caller,
    is insecure.
  derived_from_claims:
  - C00401
  - C00402
  - C01176
  - C01177
  - C01181
  - C01184
  - C01203
  - C01206
  - C01209
  - C01212
  confidence: high
  applies_when:
  - MCP servers are exposed through remote HTTP or SSE transports and track user sessions
    or tokens.
  - An MCP server exposes tools whose execution reaches sensitive operations
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P009
  statement: Keep MCP instruction authority scoped to the tool or server that supplied
    it; metadata or outputs from one server must not direct how another server's tools
    are invoked.
  derived_from_claims:
  - C00703
  - C00705
  - C00706
  - C00708
  - C00717
  - C00720
  - C00727
  - C00733
  - C00734
  - C00737
  confidence: medium
  applies_when:
  - Tool descriptions from different MCP servers are jointly visible to the model.
  - A tool description mentions another server, another tool, recipients, credentials,
    routing, or execution rules outside its own scope.
  - An agent connects MCP servers from different trust zones into the same model context.
  - A tool description or tool output contains directives about recipients, payloads,
    or behavior for another MCP server.
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P010
  statement: Treat all tool descriptions, annotations, schemas, and retrieved resource
    content as untrusted unless obtained from a trusted server, because tool poisoning,
    full-schema poisoning, resource-content poisoning, typosquatting, and shadow servers
    can inject malicious behaviour or instructions.
  derived_from_claims:
  - C00145
  - C00146
  - C00147
  - C00148
  - C00149
  - C00384
  - C00389
  - C00399
  - C00420
  confidence: high
  applies_when:
  - a client connects to MCP servers or ingests tool/resource metadata
  - Tool descriptions, schemas, return values, or retrieved content are provided to
    an LLM context.
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P011
  statement: For enterprise app-to-app MCP access, put authorization policy under
    enterprise admin and IdP control instead of relying on each user to approve direct
    OAuth connections.
  derived_from_claims:
  - C00494
  - C00495
  - C00496
  - C00497
  - C00503
  - C00504
  - C00505
  - C00506
  - C00507
  confidence: medium
  applies_when:
  - Access is to enterprise-managed resources and an enterprise policy authority can
    approve integrations centrally.
  - Access involves company-controlled accounts or enterprise application data.
  - Current integration setup would require users to approve multiple redirect-based
    OAuth connections.
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P012
  statement: Treat every tool's metadata — its name and natural-language description
    loaded at MCP registration — as untrusted data, never as instructions the agent
    may obey; a description must not be able to add steps to a tool's operation or
    invoke other tools.
  derived_from_claims:
  - C00742
  - C00744
  - C00745
  - C00746
  - C01137
  - C01138
  - C01139
  - C01175
  confidence: high
  applies_when:
  - An MCP client imports tool metadata from an external or third-party server into
    model context.
  - connecting an agent to MCP servers or loading third-party tool descriptions into
    the agent context
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P013
  statement: 'Adopt a progressive least-privilege scope model: grant a minimal initial
    scope of low-risk read/discovery operations, elevate incrementally via targeted
    WWW-Authenticate scope challenges, tolerate down-scoped tokens, emit precise (not
    full-catalog) challenges with logged elevation events, and have clients start
    from baseline scopes while caching denied-scope failures.'
  derived_from_claims:
  - C00038
  - C00039
  - C00131
  - C00132
  - C00133
  - C00134
  - C00135
  - C00136
  confidence: medium
  applies_when:
  - designing or requesting OAuth scopes for MCP tools and resources
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases:
    - PB-P016
- principle_id: P014
  statement: Clients MUST implement PKCE (S256 when technically capable) and verify
    PKCE support before authorizing by checking code_challenge_methods_supported in
    the authorization-server (or OpenID provider) metadata, refusing to proceed when
    it is absent; OpenID-Connect-Discovery authorization servers MUST publish this
    field.
  derived_from_claims:
  - C00061
  - C00062
  - C00063
  - C00064
  - C00065
  - C00676
  - C00679
  confidence: high
  applies_when:
  - a client begins an authorization-code flow
  - MCP clients participate in OAuth authorization.
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P015
  statement: Log tool invocations with their parameters and originating prompt at
    every layer (host, client, server), centralize cross-cutting logging via MCP gateways
    or proxies, keep immutable records of actions and authorizations (e.g., IdP token
    exchange), and use OpenTelemetry for end-to-end linkability.
  derived_from_claims:
  - C00197
  - C00198
  - C00203
  - C00227
  - C00228
  - C00257
  - C00275
  confidence: high
  applies_when:
  - operating MCP in any environment requiring troubleshooting, forensics, or accountability
  - operating MCP where compliance, accountability, or forensics is required
  - operating MCP servers, especially in multi-tenant environments
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P016
  statement: Validate every tool invocation and model-execution request against well-defined
    schemas, expected ranges, and the intended execution context (checking malformed
    inputs, missing fields, and excessive sizes), and block or restrict parameter
    forwarding when the data source is ambiguous or user-supplied.
  derived_from_claims:
  - C00238
  - C00259
  - C00270
  - C00271
  - C00391
  - C00397
  - C00398
  confidence: high
  applies_when:
  - a tool or model receives parameters or forwarded inputs
  - An MCP server accepts parameters generated or influenced by an LLM.
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P017
  statement: Use a cryptographic MCP message envelope to bind JSON-RPC traffic to
    agent identity, message integrity, timestamp freshness, nonce-based replay resistance,
    and auditability, while pairing it with application-layer controls for command
    and context semantics.
  derived_from_claims:
  - C00372
  - C00373
  - C00380
  - C00407
  - C00408
  - C00409
  - C00412
  confidence: high
  applies_when:
  - MCP traffic needs identity binding, message integrity, replay protection, or cryptographic
    audit evidence.
  - MCP messages pass through proxies, middleware, host agents, or other components
    that could alter payloads after transport protection terminates.
  - Message signing or replay protection is configured for an MCP channel.
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: &id001 []
- principle_id: P018
  statement: Prefer OAuth authorization-server metadata discovery for MCP OAuth so
    clients can discover endpoints automatically and avoid manual endpoint configuration
    errors.
  derived_from_claims:
  - C00584
  - C00585
  - C00586
  - C00589
  - C00598
  - C00678
  - C00680
  confidence: medium
  applies_when:
  - An MCP client needs to discover where to obtain authorization for a protected
    MCP resource
  - Implementing or configuring MCP OAuth authorization.
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P019
  statement: 'Select MCP transport by deployment target: stdio for local servers (low-latency,
    no network overhead) and HTTP/S with streaming for remote servers (adds standard
    authentication); do not assume one transport fits both.'
  derived_from_claims:
  - C00656
  - C00657
  - C00658
  - C00659
  - C00660
  - C01292
  confidence: high
  applies_when:
  - Developing or selecting the transport for an MCP server.
  - choosing or reviewing an MCP server or client transport
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P020
  statement: MCP proxy servers that use static client IDs MUST obtain user consent
    for each dynamically registered client before forwarding to third-party authorization
    servers, to prevent confused-deputy exploitation via stolen authorization codes.
  derived_from_claims:
  - C00076
  - C00085
  - C00086
  - C00087
  - C00088
  confidence: high
  applies_when:
  - an MCP server proxies to third-party authorization servers with a static client
    ID
  - the MCP server acts as an OAuth proxy to a third-party API
  - the third-party AS uses a static client ID and/or supports dynamic client registration
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P021
  statement: Build on OAuth 2.1 and the referenced RFC subset (RFC 8414, RFC 7591,
    RFC 9728, Client ID Metadata Documents) rather than inventing bespoke authorization;
    authorization servers MUST implement OAuth 2.1 with appropriate measures for both
    confidential and public clients.
  derived_from_claims:
  - C00006
  - C00010
  - C00674
  - C00675
  - C00676
  confidence: high
  applies_when:
  - An MCP implementation supports OAuth authorization.
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P022
  statement: Run agents and MCP servers with least privilege, always sandbox any server
    that touches the host (files, commands, network) or executes LLM-generated code,
    and do not rely on containers alone as a security boundary—add stronger isolation
    such as gVisor, Kata Containers, or SELinux sandboxes.
  derived_from_claims:
  - C00179
  - C00180
  - C00181
  - C00182
  - C00272
  confidence: high
  applies_when:
  - an MCP server interacts with the host or runs model-generated code
  - MCP triggers shell commands, database queries, or external API calls
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P023
  statement: 'Do not adopt or standardize on the SSE-over-HTTP transport: it is deprecated
    in the MCP specification (and client migration to the recommended streamable HTTP
    transport lags), so use streamable HTTP instead.'
  derived_from_claims:
  - C00236
  - C01338
  - C01339
  - C01340
  - C01341
  confidence: high
  applies_when:
  - choosing an MCP HTTP transport
  - choosing a transport for a new or updated MCP client
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P024
  statement: Treat all contextual and Resource input (documents, pasted text, retrieved
    content, emails, Slack) as untrusted rather than authoritative, because obfuscated
    embedded directives can redirect tool calls (indirect prompt injection).
  derived_from_claims:
  - C00428
  - C00429
  - C01025
  - C01045
  confidence: high
  applies_when:
  - when external content is placed in an agent context
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P025
  statement: Enforce authentication and authorization at the per-tool level for every
    tool that can reach a sensitive operation; missing per-tool checks enable unauthorized
    access to sensitive operations.
  derived_from_claims:
  - C00425
  - C00426
  - C01179
  - C01181
  confidence: high
  applies_when:
  - when agents operate across trust boundaries or can invoke sensitive operations
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P026
  statement: Run local MCP servers inside isolation boundaries and restrict their
    filesystem and network access to the minimum required for their intended function.
  derived_from_claims:
  - C00392
  - C00393
  - C00832
  - C00844
  confidence: high
  applies_when:
  - Deploying or reviewing MCP servers that run on a local host.
  - When MCP servers can initiate outbound network or file-like requests
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P027
  statement: Avoid auto-approving command execution in MCP-enabled environments, especially
    where commands can affect sensitive data, local systems, development workspaces,
    or production infrastructure.
  derived_from_claims:
  - C00395
  - C00396
  - C00747
  - C00762
  confidence: high
  applies_when:
  - A proposed MCP tool call can delete, modify, spend, transfer, disclose, or otherwise
    affect sensitive resources.
  - MCP-connected tools can run commands or make changes in sensitive environments.
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P028
  statement: Gate critical, high-impact, or irreversible actions behind explicit human
    confirmation before execution (Plan-then-Execute pre-execution gating, with a
    two-person rule for the highest-impact actions), accepting the efficiency loss
    for the reduction in harm.
  derived_from_claims:
  - C00435
  - C00436
  - C01072
  - C01086
  confidence: high
  applies_when:
  - when actions can be destructive, financial, administrative, externally visible,
    or otherwise high impact
  - the action is critical, high-impact, or irreversible
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P029
  statement: Institute regular red-team and adversarial-testing exercises using external
    experts or automated attack frameworks to simulate prompt injections and tool
    tampering, so weaknesses are found and patched before real adversaries exploit
    them.
  derived_from_claims:
  - C00456
  - C00457
  - C01126
  confidence: high
  applies_when:
  - when preparing production deployment or changing prompts, tools, memory, retrieval,
    policies, or model providers
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P030
  statement: Treat MCP context as a boundary-sensitive asset and enforce strict context
    isolation and lifecycle controls with per-user, per-agent, per-workflow, and per-tenant
    namespaces, isolated retrieval stores, sensitivity tagging, TTL and purge, pre-storage
    redaction, approval and preview for sensitive sharing, access logging, injection
    filtering, and contamination remediation.
  derived_from_claims:
  - C00358
  - C00359
  - C00360
  - C00361
  - C00362
  - C00363
  - C00364
  - C00365
  - C00366
  - C00367
  - C00368
  - C00369
  - C00370
  - C00371
  confidence: high
  applies_when:
  - MCP context, embeddings, retrieval indexes, memory, prompts, reasoning traces,
    or interaction history may persist or be reused across identities, workflows,
    trust domains, departments, or tenants.
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: *id001
- principle_id: P031
  statement: Do not infer authorization correctness from the presence of authorization
    logic, specific APIs, or framework constructs; authorization state may be cached
    in memory, held as a global flag, tied to a session, or embedded in initialization
    logic and then reused, and checks are scattered rather than at fixed APIs — so
    reason about the concrete execution path instead.
  derived_from_claims:
  - C01184
  - C01186
  - C01187
  - C01189
  - C01213
  - C01214
  - C01217
  - C01221
  - C01222
  - C01223
  - C01226
  - C01230
  - C01264
  confidence: high
  applies_when:
  - Reviewing whether an MCP server is subject to caller identity confusion
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P032
  statement: Enforce strong MCP authentication and authorization with mutual authentication,
    short-lived scoped and bound tokens, server-side validation, per-request deny-by-default
    RBAC or ABAC, lifecycle controls, least privilege, centralized IAM and policy
    decisions, secure endpoint defaults, and immediate credential incident response.
  derived_from_claims:
  - C00333
  - C00334
  - C00335
  - C00336
  - C00337
  - C00338
  - C00339
  - C00340
  - C00341
  - C00342
  - C00343
  - C00344
  confidence: high
  applies_when:
  - MCP clients, agents, tools, servers, users, or services authenticate, authorize,
    invoke tools, or access data.
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: *id001
- principle_id: P033
  statement: Bound every MCP agent with unique identity, documented least-privilege
    scopes, policy-as-code enforcement, just-in-time elevation for risky access, continuous
    entitlement review, runtime guardrails, tamper-evident action logs, and separation
    of permission-granting from deployment authority.
  derived_from_claims:
  - C00290
  - C00291
  - C00292
  - C00293
  - C00294
  - C00295
  - C00296
  - C00297
  - C00298
  - C00299
  - C00300
  confidence: high
  applies_when:
  - MCP agents can act across repositories, cloud APIs, ticketing systems, CI/CD,
    production settings, identity systems, or sensitive data stores.
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: *id001
- principle_id: P034
  statement: Preserve MCP intent-flow integrity by anchoring the original user goal,
    treating retrieved resources and tool outputs as untrusted data, validating every
    planned action against the goal, using isolated checker or policy-decision controls,
    and pausing for human re-authentication on intent drift.
  derived_from_claims:
  - C00322
  - C00323
  - C00324
  - C00325
  - C00326
  - C00327
  - C00328
  - C00329
  - C00330
  - C00331
  - C00332
  confidence: high
  applies_when:
  - External context, tool output, retrieved documents, schemas, or long-lived memory
    can influence multi-step MCP planning.
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: *id001
- principle_id: P035
  statement: Use lifecycle-centric MCP threat modeling that covers creation, deployment,
    operation, maintenance, attacker type, threat origin, consequence, supply-chain
    risk, and LLM-specific tool risks.
  derived_from_claims:
  - C00856
  - C00857
  - C00871
  - C00910
  - C00912
  - C00998
  - C01006
  - C01007
  - C01008
  - C01009
  - C01010
  confidence: medium
  applies_when:
  - Scoping MCP security requirements, audits, mitigations, research agendas, or secure-by-design
    guidance.
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P036
  statement: 'Enforce least-privilege secure delegation for MCP servers using OAuth:
