  derived_from_claims:
  - C00241
  - C00242
  - C00243
  confidence: medium
  applies_when:
  - tracing participants across differing reference systems
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P069
  statement: Remember that the five cohesive devices exist in many languages but with
    different preferences, frequencies, and combinations, that cohesion is also carried
    by tense continuity, stylistic consistency, and punctuation so that unmotivated
    style shifts disrupt it, and that translation tends to raise explicitness, explicitation
    being a likely near-universal of language mediation.
  derived_from_claims:
  - C00271
  - C00272
  - C00273
  confidence: medium
  applies_when:
  - managing the overall texture and explicitness of a translation
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P070
  statement: Aim for explanatory coherence, which justifies the continuity of sense,
    not merely supplemental coherence that supplies minimal links, and analyse implicature,
    what a speaker implies beyond the literal signalled conventionally through conjunctions
    or presupposing structures or non-conventionally, keeping it distinct from conventional
