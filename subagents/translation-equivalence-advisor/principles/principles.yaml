    skill: null
    reference: null
    test_cases: []
- principle_id: P078
  statement: Treat equivalence as relative and only partially achievable rather than
    an absolute standard, because it is shaped by linguistic and cultural factors;
    equivalence is a convenient working term, not a fixed theoretical target.
  derived_from_claims:
  - C00008
  - C00009
  confidence: medium
  applies_when:
  - assessing how closely a translation matches its source
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P079
  statement: Evaluate a translation as a set of strengths and weaknesses open to improvement
    rather than as simply good or bad, and treat translation strategies as options
