    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P058
  statement: At the interpretation stage, read a word through its collocational pattern
    rather than substituting a dictionary equivalent, because a collocation's meaning
    can differ from the sum of its parts and even a formally matching cross-language
