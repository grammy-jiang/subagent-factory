    grammatical text can still be thematically ill-formed.
  derived_from_claims:
  - C00168
  - C00169
  - C00170
  - C00171
  confidence: medium
  applies_when:
  - examining how a clause distributes its information
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P048
  statement: 'Draw on the strategies for resolving tension between syntax and information
    flow: voice change (keeping the passive''s impersonality in the supplied subject),
    change of verb (such as give and get or buy-from and sell-to, where the target''s
    phraseology allows), nominalization (to keep a verb-initial thematic order under
    an obligatory subject-verb target), and extraposition (cleft or pseudo-cleft to
    escape a fixed clause order).'
  derived_from_claims:
  - C00227
  - C00228
  - C00229
