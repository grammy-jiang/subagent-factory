    one, and translate idioms and fixed expressions only into your language of habitual
    use, since active competence in a foreign language''s idioms rarely matches a
    native speaker''s.'
  derived_from_claims:
  - C00087
  - C00088
  - C00098
  confidence: medium
  applies_when:
  - drafting or revising a target text
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P063
  statement: Balance typicality against accuracy when rendering a collocation, accepting
    that some loss, addition, or skewing is unavoidable and judging any change by
    its significance in context; favour established target patterns that keep the
    text reading like an original, and do not reproduce source detail that carries
