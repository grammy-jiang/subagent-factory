  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P084
  statement: 'Distinguish morphology from syntax and remember the key point for translation:
    grammatical choices come from closed systems and are largely obligatory, ruling
    out alternatives by default, whereas lexical choices are open and largely optional.'
  derived_from_claims:
  - C00119
  - C00120
  confidence: medium
  applies_when:
  - weighing a grammatical against a lexical choice
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P085
  statement: Render modality by its function rather than its literal form, since certainty,
    possibility, and obligation take different forms across languages, and investigate
    how other categories, mood, direct and indirect speech, and causativity, and their
    meanings are expressed in both languages.
  derived_from_claims:
  - C00150
  - C00151
  confidence: medium
  applies_when:
  - rendering modal or other grammatical-category meaning
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P086
  statement: 'Treat word order as significant beyond grammar: languages differ in
    how much they rely on it, fixed in English and Chinese but freer with case inflection
    as in Russian, and it plays a major role in maintaining a coherent point of view
    and orienting messages across the whole text.'
  derived_from_claims:
  - C00152
  - C00153
  confidence: medium
  applies_when:
  - deciding the ordering of clause elements in the target
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P087
  statement: Analyse a text through its levels of connection, thematic and information
    structures for topic development, cohesion for surface links, and coherence and
    implicature for underlying meaning, and use genre and text type, classified by
    institutional context or by rhetorical mode, to define translation problems and
    justify strategies.
  derived_from_claims:
  - C00161
  - C00162
  confidence: medium
  applies_when:
  - approaching a whole text for translation or review
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P088
  statement: Preserve the source's thematic patterning when its elements sit naturally
    in target theme position, but when preserving it would distort the target, abandon
    it and give the target its own method of development and continuity, since a pattern
    natural in one language, such as an ego-centred series of I themes, may need a
    different one, such as process-centred thematized verbs, in another.
  derived_from_claims:
  - C00176
  - C00177
  confidence: medium
  applies_when:
  - the source's thematic pattern may not transfer naturally
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P089
  statement: Recognise that word order serves syntactic, semantic, and communicative
    functions at once and that languages prioritise them differently by how fixed
    their order is, English leading with syntax and free-order languages following
    communicative perspective, so translating between them necessarily skews information
    flow to some degree.
  derived_from_claims:
  - C00225
  - C00226
  confidence: medium
  applies_when:
  - translating between languages of differing word-order freedom
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P090
  statement: Present the target text from a similar perspective to the source where
    possible, but where word-order restrictions, end-weight, or natural phraseology
    prevent it, give the target text its own thematic organization rather than copying
    the source's every clause, ensuring it reads naturally, does not distort the original's
    information structure, preserves any special emphasis of marked structures where
    possible, and maintains a coherent point of view in its own right.
  derived_from_claims:
  - C00231
  - C00232
  confidence: medium
  applies_when:
  - the source's thematic organization cannot be fully preserved
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P091
  statement: Decide whether to follow source cohesion patterns or approximate target
    ones by the translation's purpose and the licence to rechunk, knowing that following
    source norms minimizes meaning change while deviating from target patterns produces
    a foreign-sounding text, and take special care when a writer's conjunction use
    is a stylistic hallmark that is unremarkable in the target language.
  derived_from_claims:
  - C00258
  - C00259
  confidence: medium
  applies_when:
  - weighing fidelity to source cohesion against target naturalness
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P092
  statement: Respect the target reader's sense of what is socially and textually appropriate,
    the context for Be polite, including conventions like the expected calendar, and
    adjust modes of address, titles, name combinations, and terms of affection, to
    the target's norms to avoid unintended implicatures, except where a deliberate
    misuse of an address rule carries meaning that is hard to transfer.
  derived_from_claims:
  - C00309
  - C00310
  confidence: medium
  applies_when:
  - choosing forms of address or culturally-marked conventions
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P093
  statement: Minimize discrepancies between the source text's model of the world and
    the target reader's, calibrating how much to intervene by the reader's assessed
    knowledge, since more shared knowledge and world-model harmony mean less intervention
    and a more invisible translator, and by where the translator's loyalties lie,
    while balancing fulfilling the reader's expectations against maintaining their
    interest, so as not to over-explain and leave the reader nothing to do.
  derived_from_claims:
  - C00323
  - C00324
  confidence: medium
  applies_when:
  - deciding how far to intervene for the target reader
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P094
  statement: Use concordant terminology only where it helps readers track important
    source terms for study or interpretation, and relax it for stylistic or literary
    concordance when consistency produces unnatural or meaningless receptor text; this
    is stylistic concordance, not subject-matter terminology consistency.
  derived_from_claims:
  - C00360
  - C00361
  confidence: medium
  applies_when:
  - A key source term needs to remain visible across the translation for study or
    interpretation
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P095
  statement: Do not erase culturally embedded source items merely to sound natural;
    retain, describe, or annotate them when the foreign setting is part of the message.
  derived_from_claims:
  - C00373
  - C00374
  confidence: medium
  applies_when:
  - Source terms, objects, institutions, or themes are deeply embedded in the source
    culture
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P096
  statement: Avoid solving ambiguity or historical distance with phrasing that becomes
    technical, legalistic, anachronistic, or artificially archaic.
  derived_from_claims:
  - C00378
  - C00379
  confidence: medium
  applies_when:
  - Clarifying an ambiguous source passage or choosing historically marked terminology
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P097
  statement: Infer both the original audience and the receptor audience before targeting
    equivalent response; do not assume either audience is the general public.
  derived_from_claims:
  - C00384
  - C00385
  confidence: medium
  applies_when:
  - A phrase may have been intelligible to an insider audience or specialist community
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P098
  statement: Use expansion and redundancy to support equivalent communication load
    and decoding rate, but scope additions to the message, audience, setting, and
    publication purpose.
  derived_from_claims:
  - C00403
  - C00404
  confidence: medium
  applies_when:
  - The receptor audience would otherwise decode too slowly, miss implicit background,
    or lose cultural meaning
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P099
  statement: Treat source sound effects as effects to approximate opportunistically,
    not as forms that can normally be preserved with close similarity.
  derived_from_claims:
  - C00407
  - C00408
  confidence: medium
  applies_when:
  - The source relies on puns, acrostics, rhyme, rhythm, or similar sound-based devices
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P100
  statement: As a pedagogical illustration of structural differences, use back-translation
    only to expose a target text's morphological, syntactic, or lexical structure; used
    this way it is a theoretically unsound compromise that never reproduces the original's
    meaning, so it is not by itself a general test of translation quality.
  derived_from_claims:
  - C00016
  confidence: medium
  applies_when:
  - illustrating or checking structural differences between source and target
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P101
  statement: Perceive the meaning of words and utterances precisely in their specific
    context before rendering them, despite the inherently blurred and negotiable edges
    of word meaning.
  derived_from_claims:
  - C00033
  confidence: medium
  applies_when:
  - interpreting a source item prior to rendering it
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P102
  statement: Resolve non-equivalence by context rather than by absolute rules, because
    the suitable equivalent depends on linguistic and extra-linguistic factors and
    on how both the source writer and the translator manipulate the linguistic systems.
  derived_from_claims:
  - C00034
  confidence: medium
  applies_when:
  - selecting a strategy for a non-equivalence problem
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P103
  statement: Before deciding how to handle a non-equivalence, assess its significance
    in the given context and reproduce only what is focal to the text, rather than
    trying to render every aspect of every word in isolation.
  derived_from_claims:
  - C00056
  confidence: medium
  applies_when:
  - encountering any instance of non-equivalence
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P104
  statement: Translate by a more general word (superordinate) as a broadly applicable
    strategy for non-equivalence, especially of propositional meaning, since the hierarchical
    structure of semantic fields is not language-specific.
  derived_from_claims:
  - C00057
  confidence: medium
  applies_when:
  - the target lacks a specific equivalent but has a general term
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P105
  statement: Translate by illustration when a word lacking a target equivalent denotes
    a picturable physical entity and space constraints require the text to stay short
    and concise.
  derived_from_claims:
  - C00069
  confidence: medium
  applies_when:
  - the untranslatable item denotes a picturable physical entity under space constraints
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P106
  statement: Treat the catalogue of non-equivalence strategies as open rather than
    exhaustive, and keep studying professional translations to discover further strategies
    and to weigh each strategy's advantages and disadvantages in context.
  derived_from_claims:
  - C00070
  confidence: medium
  applies_when:
  - building translation competence or choosing among strategies
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P107
  statement: For specialized texts, learn which collocates are compatible with a term
    in both languages, because register-specific collocations extend well beyond terminology
    and native-speaker intuition alone does not guarantee correct judgement.
  derived_from_claims:
  - C00083
  confidence: medium
  applies_when:
  - translating technical or specialized material
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P108
  statement: When translating a culture-specific collocation that conveys unfamiliar
    associations, accept an unavoidable partial increase in information, since the
    unfamiliar association cannot be introduced without hinting to the reader how
    to interpret it.
  derived_from_claims:
  - C00091
  confidence: medium
  applies_when:
  - a source collocation carries culture-specific associations
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P109
  statement: Choose an idiom strategy by weighing style, register, and rhetorical
    effect, not merely whether a similar-meaning target idiom exists, and resist the
    strong urge to force in a receptor-language idiom however inappropriate.
  derived_from_claims:
  - C00108
  confidence: medium
  applies_when:
  - selecting among idiom translation strategies
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P110
  statement: Use the target language's natural phraseology, its collocations, its
    own fixed and semi-fixed expressions, and the right level of idiomaticity, to
    enhance readability and let a translation pass for an original.
  derived_from_claims:
  - C00114
  confidence: medium
  applies_when:
  - aiming for a natural, fluent target text
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P111
  statement: 'Judge whether a deviant configuration is justified from the reader''s
    point of view, not the translator''s: a rendering is not acceptable merely because
    it let the translator finish the job, since to be justified the motivation must
    be available to the reader.'
  derived_from_claims:
  - C00321
  confidence: medium
  applies_when:
  - assessing whether an unusual rendering is warranted
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P112
  statement: Guard coherence at the lexical level, since a single mistranslated polysemous
    item can shift a text's coherence when the source exploits several of its meanings
    and the target equivalent carries none of them.
  derived_from_claims:
  - C00322
  confidence: medium
  applies_when:
  - rendering a polysemous item that carries more than one relevant sense
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P113
  statement: 'Read utterances by their implicit function, not only their form, using
    speech-act theory alongside implicature: a declarative may make a request or an
    interrogative express reproof, so recover the illocutionary meaning, the speaker''s
    intention, and repair an indirect speech act by inference.'
  derived_from_claims:
  - C00325
  confidence: medium
  applies_when:
  - an utterance's literal form does not match its communicative force
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P114
  statement: Treat literary form and delivery medium as real constraints on how much
    dynamic equivalence a translation can achieve.
  derived_from_claims:
  - C00405
  confidence: medium
  applies_when:
  - The message is poetry, song, film, or another form tied to a transmission vehicle
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P115
  statement: Account for cultural expectations about faithfulness, existing translations,
    and publication format before deciding how far dynamic equivalence may go.
  derived_from_claims:
  - C00406
  confidence: medium
  applies_when:
  - A receptor community already has translation traditions, strong literalness expectations,
    or diglot/publication constraints
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P116
  statement: For song translation, fit words to the musical vehicle first, including
    phrase length, syllable count, stress, rhyme, and singable vowel quality.
  derived_from_claims:
  - C00412
  confidence: medium
  applies_when:
  - The translation must be sung to existing or specified music
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
