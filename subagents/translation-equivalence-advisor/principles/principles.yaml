  confidence: medium
  applies_when:
  - a target equivalent differs in expressive load from the source
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P081
  statement: Use cultural substitution — replacing a culture-specific item with a
    target item of similar impact but different propositional meaning — when the item
    works chiefly for expressive value, gauging its acceptability by the commissioner's
    licence, the translation's purpose, and the target community's tolerance for departing
