    signalling its mood, and a marked theme gives local clause-level prominence while
    the rheme gives overall discourse prominence.'
  derived_from_claims:
  - C00179
  - C00180
  - C00181
  confidence: medium
  applies_when:
  - judging whether a thematic choice is marked
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P066
  statement: Recognise the limits of the Hallidayan initial-position view of theme,
    its partial circularity and poor fit for verb-initial and topic-prominent languages,
    and handle topic-prominent languages such as Chinese, Japanese, and Korean carefully,
