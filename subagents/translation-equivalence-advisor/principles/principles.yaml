    skill: null
    reference: null
    test_cases: []
- principle_id: P045
  statement: Recognise that both a language's lexical resources and its grammatical
    system determine what can be said and how, since each language regularly makes
    only certain distinctions explicit, such as time, number, gender, shape, visibility,
    person, proximity, and animacy, and the once-assumed universal categories are
