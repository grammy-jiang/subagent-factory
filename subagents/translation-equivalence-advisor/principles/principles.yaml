  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P071
  statement: 'Handle implicature carefully in translation, since implicatures are
    often indeterminate and a rendering can eliminate a source interpretation or introduce
    a new one: any mistranslation of words or structures makes the original implicature
    incalculable, and a literal transfer of a language''s conventionalized implicature-bearing
    patterns, such as rhetorical questions, ironic phrases, or inverted commas, can
    distort or change the implied meaning.'
  derived_from_claims:
  - C00288
  - C00290
  - C00291
  confidence: medium
  applies_when:
  - rendering an utterance that carries implied meaning
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P072
  statement: Identify each reference well enough to interpret the associations it
    triggers, not just who or what it is, since an unknown name or culture-specific
    item breaks continuity and obscures relevance, a cultural substitute must actually
    share the referent's associations, and a pronoun such as we can turn ambiguous
