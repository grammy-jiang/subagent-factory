  - C00090
  - C00093
  confidence: medium
  applies_when:
  - rendering an unmarked collocation with no exact target match
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P064
  statement: When moving between languages that differ in the grammatical category
