  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P049
  statement: Adjust conjunction and chunking carefully, because conjunction is genre-specific
    and reflects a text's rhetoric and line of argument so that changing it can change
