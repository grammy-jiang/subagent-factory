schema_version: principles-v1
principles:
- principle_id: P001
  statement: Diagnose the specific type of word-level non-equivalence — culture-specific
    concept, unlexicalized concept, semantic complexity, differing meaning distinctions,
    a missing superordinate or hyponym, differing physical or interpersonal perspective,
    a missing form, differing frequency of a form, or a loan word or false friend
    — but do not map a type to a strategy in a fixed one-to-one way, since context
    and purpose favour some strategies and rule out others.
  derived_from_claims:
  - C00042
  - C00043
  - C00044
  - C00045
  - C00046
  - C00047
  - C00048
  - C00049
  - C00050
  - C00052
  - C00053
  - C00054
  - C00055
  confidence: medium
  applies_when:
  - handling a word with no direct target equivalent
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P002
  statement: Signal given and new information with the device the target language
    uses, definiteness, grammatical subordination, cleft or pseudo-cleft structures,
    or punctuation, rather than transferring the source's, since signalling systems
    differ across languages and the attenuation model does not fit all; failing to
    recognise how a structure marks given versus new causes distorting shifts, so
    preserve each element's status with a natural target structure.
  derived_from_claims:
  - C00201
  - C00202
  - C00203
  - C00204
  - C00205
  - C00206
  - C00207
  - C00208
  confidence: medium
  applies_when:
  - signalling given and new information in the target
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P003
  statement: Understand that theme usually coincides with given and rheme with new,
    and become familiar with at least one Functional Sentence Perspective model, its
    communicative dynamism, the theme-transition-rheme split, context-dependence,
    the verb's context-determined thematic status, and the interplay of position,
    semantics, and context, because it explains free-word-order languages better than
    the Hallidayan positional account and underlies much translation-problem analysis.
  derived_from_claims:
  - C00217
  - C00218
  - C00219
  - C00220
  - C00221
  - C00222
  - C00223
  - C00224
  confidence: medium
  applies_when:
  - analysing information flow, especially in a free-word-order language
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P004
  statement: Treat cohesion as the surface network of lexical and grammatical relations,
    reference, substitution, ellipsis, conjunction, and lexical cohesion, that links
    a text's parts, and rework it to each language's own patterns for conveying the
    interrelationships of persons and events, since these patterns cannot be ignored
    if the translation is to be understood.
  derived_from_claims:
  - C00233
  - C00234
  - C00235
  - C00260
  - C00261
  - C00262
  - C00263
  - C00264
  confidence: medium
  applies_when:
  - managing the cohesive links of a text
  - interpreting how vocabulary choices tie a text together
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P005
  statement: Weight content and form by their communicative function, preserving form
    more strongly when it carries genre, emotional force, or poetic effect.
  derived_from_claims:
  - C00329
  - C00330
  - C00331
  - C00332
  - C00333
  - C00352
  - C00356
  - C00357
  confidence: medium
  applies_when:
  - The source genre makes meter, rhythm, lyric force, or other formal effects part
    of the message
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P006
  statement: 'Aim for equivalence at the level of the whole text rather than the word
    or phrase: read the source through at least once to grasp its gist before translating,
    view the text as a whole at the start and end of the process, and produce a target
    version that reads as a coherent text in its own right by adjusting the source''s
    organization to the target language''s culture-specific discourse norms.'
  derived_from_claims:
  - C00154
  - C00155
  - C00156
  - C00157
  - C00158
  - C00159
  - C00160
  confidence: medium
  applies_when:
  - translating any complete text
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P007
  statement: Treat coherence as the reader's judgement, the conceptual relations they
    build under the surface text, not a property of the text, so cohesive markers
    alone cannot make a text cohere and a co-reference transparent to the source audience
    may need an explicit link for the target reader; take account of the target readers'
    knowledge and their expectations about the world, language, text-type conventions,
    and social behaviour, since people make sense of new information only through
    existing knowledge.
  derived_from_claims:
  - C00274
  - C00275
  - C00276
  - C00277
  - C00278
  - C00279
  - C00280
  confidence: medium
  applies_when:
  - judging whether a translation will make sense to its readers
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P008
  statement: In dynamic equivalence, make formal adjustments where literary form,
    idioms, or culturally embedded emotive meanings would otherwise block or distort
    receptor understanding.
  derived_from_claims:
  - C00386
  - C00387
  - C00388
  - C00389
  - C00390
  - C00391
  - C00392
  confidence: medium
  applies_when:
  - Source form, exocentric expression, or emotive association does not transfer naturally
    into the receptor language
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P009
  statement: 'Translate voice by function, not form: never render passive-by-passive
    and active-by-active mechanically, because the passive serves different functions
    across languages, constructing agentless clauses, projecting objectivity in scientific
    English, or signalling adversity in Japanese and Chinese, so weigh each structure''s
    frequency, stylistic value, and function in source and target.'
  derived_from_claims:
  - C00144
  - C00145
  - C00146
  - C00147
  - C00148
  - C00149
  confidence: high
  applies_when:
  - rendering active or passive voice across languages
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P010
  statement: Base translation decisions on a systematic understanding of language
    and reflect on them deliberately rather than relying on intuition or an unexplained
    flair, since theoretical knowledge only delivers its value (lower risk, readiness
    for the unpredictable, confident choices) when grounded in practical experience.
  derived_from_claims:
  - C00001
  - C00002
  - C00003
  - C00004
  - C00005
  - C00006
  confidence: medium
  applies_when:
  - making or justifying a translation decision
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P011
  statement: Distinguish the propositional, expressive, presupposed, and evoked meanings
    of a word or utterance when assessing a rendering, recognising that a charge of
    inaccuracy usually concerns propositional meaning while expressive meaning is
    separable, gradable, and truth-neutral.
  derived_from_claims:
  - C00021
  - C00022
  - C00023
  - C00024
  - C00025
  - C00026
  confidence: medium
  applies_when:
  - analysing what a word contributes to a message
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P012
  statement: Use the structure of semantic fields, comparing an item against the alternatives
    it contrasts with, to assess its value and to fill target-language gaps by moving
    up the superordinate/hyponym hierarchy, while remembering that languages encode
    only environmentally relevant distinctions and that the field concept does not
    fit all words.
  derived_from_claims:
  - C00035
  - C00036
  - C00037
  - C00038
  - C00039
  - C00040
  confidence: medium
  applies_when:
  - assessing an item's value or handling a lexical gap
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P013
  statement: Treat idioms and fixed expressions as frozen, largely invariant patterns
    whose meaning, for idioms, cannot be deduced from their parts, and make recognising
    the idiom the first step, using the cue that the less literal sense an expression
    makes in context, the more likely it is an idiom.
  derived_from_claims:
  - C00094
  - C00095
  - C00096
  - C00097
  - C00099
  - C00100
  confidence: medium
  applies_when:
  - a stretch of language may be an idiom or fixed expression
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P014
  statement: 'Apply idiom strategies by fit: a target idiom of similar meaning and
    form (rarely available, and a simultaneous literal-and-idiomatic play needs form-and-meaning
    correspondence), a similar-meaning idiom of dissimilar form, paraphrase (the commonest
    when no match exists or idiom is stylistically inappropriate), omission (no close
    match, unparaphrasable, or stylistic), or compensation (reintroduce a lost feature
    elsewhere in the text).'
  derived_from_claims:
  - C00105
  - C00109
  - C00110
  - C00111
  - C00112
  - C00113
  confidence: medium
  applies_when:
  - rendering an idiom into the target language
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P015
  statement: 'Handle grammatical gender by its function: it matters most for human
    referents where the distinction is non-arbitrary, the masculine is usually the
    unmarked term, a gender-neutral stance transfers poorly into languages where gender
    pervades concord, and when neither marked nor unmarked gender fits, restructure,
    for example with the passive, to avoid specifying it.'
  derived_from_claims:
  - C00129
  - C00130
  - C00131
  - C00132
  - C00133
  - C00134
  confidence: medium
  applies_when:
  - the target language forces a gender choice the source leaves open
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P016
  statement: Know the marked-theme devices, fronted theme (mildly marked for adjuncts
    but strongly for objects, complements, and predicators), predicated theme (an
    it-cleft presenting its thematic element as new) and identifying theme (a wh-cleft
    presenting its thematic element as known), both often implying contrast and common
    in written English because they signal given and new without stress, and distinguish
    the passive, which thematizes a would-be object without marking it, from fronting,
    which foregrounds it.
  derived_from_claims:
  - C00182
  - C00183
  - C00184
  - C00186
  - C00187
  - C00188
  confidence: medium
  applies_when:
  - a source or target text foregrounds an element for emphasis
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P017
  statement: Handle conjunction as the marking of a small set of general relations,
    additive, adversative, causal, temporal, and continuative, whose realization and
    frequency vary sharply across languages, adding or thinning typical target conjunctions
    to suit its norms, such as English small chunks with varied conjunctions versus
    Arabic large chunks with few general ones, while balancing the naturalness of
    typical conjunctions against the accuracy of precise ones.
  derived_from_claims:
  - C00248
  - C00249
  - C00250
  - C00251
  - C00252
  - C00253
  confidence: medium
  applies_when:
  - signalling relations between chunks of information
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P018
  statement: Accept that lexical-cohesion networks cannot be reproduced identically,
    since every strategy such as superordinate, paraphrase, or loan word and every
    grammatical rewording produces different chains and shifts, and idiom-controlled
    or association-building chains are often sacrificed, but ensure the target text
    builds sufficient lexical cohesion in its own right, never a random collection
    of items, using the target language's own tolerance for reiteration so it reads
    like an original.
  derived_from_claims:
  - C00265
  - C00266
  - C00267
  - C00268
  - C00269
  - C00270
  confidence: medium
  applies_when:
  - rebuilding a text's lexical networks in the target language
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P019
  statement: 'Adjust a translation to the target context''s realities and ordering
    conventions, because context supplies the premises for any implicature: a term
    that denotes a different institution or a measure taken differently can make an
    accurate rendering nonsensical, and culture-specific ordering strategies, temporal
    order or listing largest-to-smallest, should follow the target''s norm, since
    deviation is read as an implicature and repeated small disturbances accumulate
    to impede understanding.'
  derived_from_claims:
  - C00303
  - C00304
  - C00305
  - C00306
  - C00307
  - C00308
  confidence: medium
  applies_when:
  - source and target contexts or ordering conventions differ
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P020
  statement: 'Assess and supply the target reader''s background knowledge deliberately:
    decide whether to explain a reference by the reader''s assumed familiarity and
    your licence to intervene, remembering that writers and translators routinely
    misjudge reader access and the translator is often as ignorant as the reader,
    so research when feasible; build information essential to an implicature into
    the body of the text rather than a footnote, and expand or delete background to
    match what the reader is assumed to know.'
  derived_from_claims:
  - C00311
  - C00312
  - C00313
  - C00314
  - C00315
  - C00317
  confidence: medium
  applies_when:
  - deciding how much background to make explicit
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P021
  statement: Choose translation tactics from the message type, communicative purpose,
    and intended audience rather than from a single universal method.
  derived_from_claims:
  - C00328
  - C00329
  - C00334
  - C00337
  - C00339
  - C00350
  confidence: medium
  applies_when:
  - Selecting among literal, formal, functional, adaptive, or explanatory renderings
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P022
  statement: Use formal-equivalence or gloss strategies when readers need close access
    to source form, terminology, structure, and source-cultural context.
  derived_from_claims:
  - C00340
  - C00341
  - C00359
  - C00360
  - C00362
  - C00364
  confidence: medium
  applies_when:
  - The audience is studying the source context, linguistic structure, philosophical
    terminology, or formal features
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P023
  statement: For culturally nonmatching referents, choose deliberately among formal
    term plus note, functional equivalent, borrowed term with classifier, and receptor-language
    description.
  derived_from_claims:
  - C00393
  - C00394
  - C00395
  - C00396
  - C00397
  - C00398
  confidence: medium
  applies_when:
  - The receptor culture lacks the source object, uses a similar object differently,
    or has no formal or functional equivalent
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P024
  statement: 'Match thematic markedness by function, not form: convert an unmarked
    source structure to an unmarked target one and an emphatic source structure to
    a target emphasis device, replace structures far more marked in a free-word-order
    target with less marked ones, but do not reflexively normalize a marked source
    structure when a differently but similarly marked target structure would preserve
    its prominence naturally, and learn the thematization devices each language offers.'
  derived_from_claims:
  - C00185
  - C00189
  - C00190
  - C00191
  - C00192
  confidence: high
  applies_when:
  - a structure's markedness differs between source and target
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P025
  statement: 'Expect grammar to constrain the translation like a straitjacket: because
    languages differ in which notions they oblige a writer to express, grammatical
    differences add information when the target has a category the source lacks or
    omit it when the target lacks one, and obligatory target details that cannot be
    inferred from context are a genuine dilemma, since over-specifying what the target
    normally leaves implicit, or lexicalizing it, distorts weight and naturalness.'
  derived_from_claims:
  - C00121
  - C00122
  - C00123
  - C00124
  - C00125
  confidence: medium
  applies_when:
  - source and target grammars oblige different information
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P026
  statement: When translating pronouns into a language that marks formality (the T/V
    distinction), gender, or inclusive/exclusive reference, make conscious decisions
    about participants' relationships and social standing, since these dimensions
    are often not explicit in English and not recoverable from context, and the familiar/non-familiar
    dimension reflects tenor, is socially variable, and is among the hardest aspects
    of grammar to translate.
  derived_from_claims:
  - C00135
  - C00136
  - C00137
  - C00138
  - C00139
  confidence: medium
  applies_when:
  - rendering pronouns of address across differing person systems
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P027
  statement: 'Attend to a text''s information dynamics, treating each clause as a
    message whose interactional organization drives a clean progression of links:
    word order controls information flow, a sentence flows more smoothly when it starts
    from an already-established element before new information, and analysis proceeds
    via thematic and information structure using whichever model, Hallidayan or Prague,
    fits the languages involved.'
  derived_from_claims:
  - C00163
  - C00164
  - C00165
  - C00166
  - C00167
  confidence: medium
  applies_when:
  - organizing information flow across sentences
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P028
  statement: Maintain a discernible thematic method of development in the target text,
    since the overall choice and ordering of themes rather than any single theme provides
    orientation and continuity, different text types favour particular themes, and
    whatever is placed in initial position must cumulatively add up to a method of
    development or the text feels disjointed.
  derived_from_claims:
  - C00172
  - C00173
  - C00174
  - C00175
  - C00178
  confidence: medium
  applies_when:
  - producing or reviewing a stretch of connected text
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P029
  statement: Order information given-before-new, the hearer-oriented, context-dependent
    default that aids comprehension and underlies end-focus and end-weight, and resolve
    clashes between end-weight and a basic target grammatical principle, such as English
    subject-before-predicate, rather than letting a heavy-subject, light-verb result
    stand, for instance by switching passive to active and inserting a subject.
  derived_from_claims:
  - C00196
  - C00197
  - C00198
  - C00199
  - C00200
  confidence: medium
  applies_when:
  - sequencing given and new information in the target
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P030
  statement: 'Handle marked information focus by the target''s means: information
    structure is realized by tonicity, so a focus shifted for surprise or contrast,
    a marked rheme with the theme stripped to foreground the core, or a themeless
    clause must be re-signalled in writing through typography, punctuation, lexical
    emphasis, or a compensating device, since a language that lacks phonological stress
    or requires a subject with every verb cannot reproduce the English original directly.'
  derived_from_claims:
  - C00212
  - C00213
  - C00214
  - C00215
  - C00216
  confidence: medium
  applies_when:
  - the source marks its information focus for emphasis or surprise
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P031
  statement: Trace participants and entities through reference, the textual identity
    between expressions, most often pronouns, noting that a language's number and
    gender pronoun distinctions and its reliance on situational reference and world-knowledge
    co-reference shape its reference chains, which range on a continuum from full
    repetition through synonym and superordinate to pronoun, so rework reference to
    the target's preferred pattern.
  derived_from_claims:
  - C00236
  - C00237
  - C00238
  - C00239
  - C00240
  confidence: medium
  applies_when:
  - tracing a participant across a text
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P032
  statement: 'Use the Co-operative Principle and its four maxims, Quantity, Quality,
    Relevance, and Manner, as orientation points rather than strict rules: readers
    attribute relevance even to seemingly unrelated contributions, a conversational
    implicature arises from deliberately flouting a maxim while the hearer still assumes
    cooperation, and working one out draws on word meanings, the maxims, context,
    background knowledge, and the mutual availability of all these.'
  derived_from_claims:
  - C00284
  - C00285
  - C00286
  - C00287
  - C00289
  confidence: medium
  applies_when:
  - reasoning about how a hearer infers implied meaning
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P033
  statement: Treat Grice's specific maxims as culture-relative rather than universal,
    since Be polite overrides them in some cultures, discourse and rhetoric norms
    differ (German digression, Arabic repetition-by-assertion, Japanese linkless anecdote)
    and set the context in which maxims are read, and the maxims reflect English-culture
    values of sincerity, brevity, and relevance, while relying on the tenable universal
    that all discourse is cooperative and that implicature itself, not any fixed maxim
    set, is universal.
  derived_from_claims:
  - C00295
  - C00296
  - C00298
  - C00300
  - C00301
  confidence: medium
  applies_when:
  - reasoning about communicative norms across cultures
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P034
  statement: Use dynamic-equivalence strategies when the target task is to reproduce
    the receptor effect or relationship to the message rather than to display source
    form.
  derived_from_claims:
  - C00343
  - C00344
  - C00345
  - C00354
  - C00365
  confidence: medium
  applies_when:
  - The translation brief prioritizes equivalent audience response, naturalness, or
    practical comprehension
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P035
  statement: Evaluate translation adequacy by sense, source spirit and manner, natural
    receptor expression, and similar audience response, while accepting multiple valid
    solutions.
  derived_from_claims:
  - C00350
  - C00351
  - C00354
  - C00355
  - C00358
  confidence: medium
  applies_when:
  - Assessing a translation against its intended purpose and audience impact
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P036
  statement: For dynamic equivalence, test naturalness across receptor language and
    culture, the local message context, and the intended audience while preserving
    source meaning.
  derived_from_claims:
  - C00366
  - C00367
  - C00368
  - C00375
  - C00384
  confidence: medium
  applies_when:
  - Revising a translation toward natural receptor response
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P037
  statement: 'Never assume a one-to-one correspondence between words and meanings
    across languages: each language articulates the world differently, so a single
    source word may map to several target words, to none, or to a different segmentation
    entirely.'
  derived_from_claims:
  - C00017
  - C00018
  - C00019
  - C00020
  confidence: high
  applies_when:
  - rendering a source word or expression into another language
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P038
  statement: Do not transfer the source text's cohesive devices; rework the methods
    of establishing links to the target language's textual norms, because each language's
    grammar and each genre's conventions favour different devices, so Arabic agreement
    makes pronominal reference safe across clauses where English prefers lexical repetition,
    and legal texts repeat even where a pronoun would be unambiguous.
  derived_from_claims:
  - C00244
  - C00245
  - C00246
  - C00247
  confidence: high
  applies_when:
  - choosing cohesive devices for the target text
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P039
  statement: Analyse a text at both the level of its individual forms and the level
    of the whole discourse, because the linguistic levels are not discrete and a word-
    or grammar-level choice is shaped by, and has implications for, the whole text;
    both bottom-up and top-down analysis are valid.
