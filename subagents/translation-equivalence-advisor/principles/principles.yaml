    matters when abridging, expanding, or rewriting, while remembering that givenness
    is assigned by the speaker and may be presented without warrant for rhetorical
    effect.
  derived_from_claims:
  - C00209
  - C00210
  - C00211
  confidence: medium
  applies_when:
  - deciding whether an item can be treated as given
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P068
  statement: Rework reference patterns to the target language's norms, since anaphora
    varies within and across languages and by text type, English leaning on pronouns,
    Hebrew and Brazilian Portuguese on names and repetition, and Japanese and Chinese
    on subject omission, so for example turn a subject-omitting chain into an English
