  derived_from_claims:
  - C00059
  - C00060
  confidence: medium
  applies_when:
  - a culture-specific item works mainly for expressive impact
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P082
  statement: Use omission only as a last resort, when an item is not vital to the
    text and rendering it would distract the reader, or to drop expressions that betray
    a source-text orientation irrelevant to a different target audience, accepting
    that some loss of meaning is inevitable.
  derived_from_claims:
  - C00067
  - C00068
  confidence: medium
  applies_when:
  - an item is minor and would need distracting explanation
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P083
  statement: Watch for the two idiom traps, a misleading idiom that also has a plausible
    literal reading and a source idiom whose target look-alike differs in meaning,
    and examine the collocational environment of any expression whose meaning is unclear,
    since idioms carry their own collocational patterns that help reveal them.
  derived_from_claims:
  - C00101
  - C00102
  confidence: medium
  applies_when:
