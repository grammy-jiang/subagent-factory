    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P059
  statement: Translate with a loan word, optionally explained once so it can then
    stand alone, for culture-specific items, modern concepts, and buzz words, weighing
    that loan words may be chosen for evoked prestige and that the target society's
    norms bound how freely they may be used.
