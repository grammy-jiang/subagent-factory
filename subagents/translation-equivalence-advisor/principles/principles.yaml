  - C00193
  - C00194
  - C00195
  confidence: medium
  applies_when:
  - translating to or from a topic-prominent language
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P067
  statement: Judge givenness by what the speaker assumes is in the addressee's consciousness,
    and reintroduce a previously mentioned element as new, for example with an indefinite
