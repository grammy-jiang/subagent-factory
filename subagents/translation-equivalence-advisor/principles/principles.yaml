  - C00116
  - C00117
  - C00118
  confidence: medium
  applies_when:
  - comparing what source and target grammars oblige a writer to express
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P046
  statement: 'Do not map tense and aspect mechanically: their systems vary in fineness
    and some encode modal or discourse meanings rather than time, so preserve the
    target language''s natural signalling rather than imposing a textbook rule of
    consistent tense, and weigh the additional meanings the target forms can carry.'
  derived_from_claims:
  - C00140
  - C00141
  - C00142
  - C00143
