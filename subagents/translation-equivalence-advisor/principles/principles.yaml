  derived_from_claims:
  - C00292
  - C00293
  - C00294
  confidence: medium
  applies_when:
  - a reference must be understood to draw the right inference
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P073
  statement: Weigh politeness and taboo against accuracy, since in some contexts being
    polite outranks being accurate and a translator may omit or replace text that
    would offend on a taboo subject, judge for the target culture what counts as more
