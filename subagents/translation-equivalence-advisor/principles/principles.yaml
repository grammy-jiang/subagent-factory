    reference: null
    test_cases: []
- principle_id: P040
  statement: Distinguish grammatical rules (exceptionless restrictions on word classes)
    from lexical patterning (exception-admitting, individual-word regularities of
    collocation and idiom), and treat differences in lexical patterning between source
    and target as a major source of translation difficulty.
