  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P061
  statement: Recognise marked collocations, unusual combinations that challenge reader
    expectations for effect, and judge markedness relative to the register's norm,
    rendering a marked source collocation with a similarly marked target one where
    the target language and the translation's purpose allow.
  derived_from_claims:
  - C00081
  - C00082
  - C00092
  confidence: medium
  applies_when:
  - a source text uses an unusual or striking word combination
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P062
  statement: 'Guard against source-language interference: set a draft aside and re-read
    it as a target reader to avoid carrying over untypical source collocations, beware
