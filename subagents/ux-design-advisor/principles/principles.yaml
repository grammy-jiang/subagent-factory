- principle_id: P003
  statement: Judge usability by the effortless-use test (an average or below-average
    user accomplishes their goal without it being more trouble than it is worth),
    remembering usability is about people rather than technology, endures over time,
    applies to anything interactive, and that higher perceived effort makes people
    less likely to act.
