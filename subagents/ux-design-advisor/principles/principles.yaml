- principle_id: P022
  statement: Never run verbal (writing) design on a separate track from visual and
    interaction design—splitting it produces an interface of boxes later filled with
    language and disserves the whole experience—so make decisions about verbal language
    and nonverbal cues part of the same process at the same time, and give writers
    and designers a feedback loop on how successful their work was so they can learn
    and improve.
