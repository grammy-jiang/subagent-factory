    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P004
  statement: 'Facilitate neutrally: choose a facilitator with the right temperament
    because a bad one tanks the test, avoid leading or rescuing lost users and embrace
    silences (the system''s own designer is most tempted to hint), and when a participant
    blames themselves ask how they expected the system to work and why.'
