schema_version: golden-tests-v1
subagent_slug: startup-ceo-leadership-advisor
generated_at: "2026-06-09"

golden_tests:
  - test_id: GT-001
    description: >-
      Positive routing — invoke for layoff execution trigger (advise mode)
    prompt: >-
      We're a 120-person Series B company. Sales have collapsed and we need to
      cut 30 percent of headcount by end of week. I've never done a layoff
      before. What do I need to do and in what order?
    expected_route: invoke
    expected_mode: advise
    must_ask_for: []
    minimum_output: >-
      A sequenced approach to layoff execution covering at least: decision
      timing, manager preparation, company communication, and CEO presence.
      Must acknowledge what makes this situation genuinely hard.
    must_not_do:
      - Provide a generic HR checklist with no stage-specific guidance
      - Conflate company financial failure with individual performance failure
      - Offer false reassurance that the situation is straightforward
      - Include verbatim quotation from the source text

  - test_id: GT-002
    description: >-
      Positive routing — invoke for executive firing trigger (advise mode),
      verifying root-cause diagnosis requirement
    prompt: >-
      My VP of Engineering has been here three years and is a founding team
      member. Over the last six months, they've been unable to manage a team
      that has grown from 8 to 45 engineers. Deadlines keep slipping, senior
      engineers are quitting, and I've had three conversations with no
      improvement. I think I need to fire them. What should I do before I have
      that conversation?
    expected_route: invoke
    expected_mode: advise
    must_ask_for: []
    minimum_output: >-
      Guidance that covers at minimum: root-cause diagnosis (why is the
      executive failing — position definition, scaling mismatch, or
      performance?), board notification before acting, and how to structure the
      conversation to preserve dignity. Must address the founding-team
      relationship dynamic.
    must_not_do:
      - Skip the root-cause analysis step
      - Advise acting before informing the board
      - Recommend disparaging the executive in company communication
      - Provide a universal script without accounting for the founding-team context

  - test_id: GT-003
    description: >-
      Positive routing — invoke for produce mode (draft layoff communication)
    prompt: >-
      We're doing a layoff tomorrow — 25 of our 80 employees. The reason is
      purely financial: we didn't hit our revenue targets and our runway dropped
      below six months. Can you draft the message I'll send to the whole company
      after the individual conversations are done?
    expected_route: invoke
    expected_mode: produce
    must_ask_for: []
    minimum_output: >-
      A draft all-company message that clearly states the reason is financial
      (not individual performance), acknowledges the difficulty honestly, does
      not project false positivity, and treats departing employees with respect.
    must_not_do:
      - Conflate company financial failure with employee performance failure
      - Draft a message that is excessively upbeat or minimizes the impact
      - Include legal language or severance terms without flagging legal review
      - Include verbatim quotation from the source text

negative_routing_tests:
  - test_id: NR-001
    description: >-
      Negative routing — do not invoke for product strategy question
    prompt: >-
      We're a B2B SaaS startup. Should we build a mobile app version of our
      product or invest in deepening our API integrations? Our customers keep
      asking for both.
    expected_route: do_not_invoke
    expected_mode: null
    must_ask_for: []
    minimum_output: >-
      A clear explanation that this question is about product strategy and
      falls outside the scope of this advisor, which focuses on people
      management and leadership decisions.
    must_not_do:
      - Attempt to answer the product strategy question
      - Reframe the question as a people management issue to stay engaged
      - Provide generic product advice

missing_context_tests:
  - test_id: MC-001
    description: >-
      Missing required input — company stage and situation not provided; must
      request context before advising
    prompt: >-
      I need to fire someone. What should I do?
    expected_route: invoke
    expected_mode: advise
    must_ask_for:
      - >-
        A description of the specific situation including the role of the
        person involved, the reason for the firing, and the company's stage
        and size
    minimum_output: >-
      A clear statement of what additional context is needed before useful
      guidance can be given, specifically company stage and the details of
      the situation.
    must_not_do:
      - Proceed with generic firing advice as if full context was provided
      - Hallucinate details about the company or the individual to be fired
