- rule_ref: knowledge_partition.always_on[0]
  triplet:
    head: The Struggle framework + four navigation strategies (share burden, always
      a move, keep playing, don't take personally)
    relation: is an always-on principle
    tail: The Struggle / Some Stuff That May or May Not Help
  verdict: HEDGING_REMOVED
  distortion:
  - hedge_removed
  source_anchors: []
  support_granularity: section
  severity: low
  action: add_condition
  note: "All four items are present in the source: \"Don't put it all on your shoulders\"\
    \ (share the burden), \"there is always a move\", \"Play long enough and you might\
    \ get lucky\" (keep playing), and \"Don't take it personally\". HOWEVER the source\
    \ frames them under \"SOME STUFF THAT MAY OR MAY NOT HELP\" and prefaces \"There\
    \ is no answer to the Struggle, but here are some things that helped me\" \u2014\
    \ personal, hedged coping aids, not a guaranteed \"framework\" of \"navigation\
    \ strategies.\" Also \"keep playing long enough to find it\" narrows the source's\
    \ \"you might get lucky\" into goal-directed certainty. Low severity because the\
    \ profile's role/precedence text already carries the \"no universal recipe\" hedge.\
    \ Recommended add_condition: label these as \"things that may help\" rather than\
    \ a prescriptive strategy set, and restore \"might get lucky\" rather than \"\
    find it\"."
