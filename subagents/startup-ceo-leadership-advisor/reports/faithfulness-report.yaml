  distortion:
  - none
  source_anchors: []
  support_granularity: section
  severity: low
  action: accept_with_note
  note: "The layoff chapter is built around timing, messaging, manager preparation,\
    \ and CEO presence \u2014 the exact dimensions named in the trigger. Layoffs \"\
