schema_version: faithfulness-report-v1
subagent_slug: startup-ceo-leadership-advisor
findings:
- rule_ref: when_to_use[0]
  triplet:
    head: founder-CEO in the Struggle (missing plan, cash low, self-doubt, isolation)
    relation: is an in-scope trigger
    tail: The Struggle chapter
  verdict: EXACT_SUPPORT
  distortion:
  - none
  source_anchors: []
  support_granularity: section
  severity: low
  action: accept_with_note
  note: 'The Struggle chapter describes exactly this state: "self-doubt becomes self-hatred",
    "surrounded by people and you are all alone", company missing plan and going public
    with six weeks of cash. Direct distillation.'
- rule_ref: when_to_use[1]
