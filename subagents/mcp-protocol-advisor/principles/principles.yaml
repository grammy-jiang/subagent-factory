    behalf
  - a host is about to share user or resource data with a server or any external destination
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P014
  statement: 'Harden the client around tool calls: confirm sensitive operations, show
