schema_version: principles-v1
principles:
- principle_id: P001
  statement: 'Build on the MCP base protocol: exchange JSON-RPC 2.0 messages over
    stateful connections and complete client/server capability negotiation before
    using any feature.'
  derived_from_claims:
  - C00005
  - C00008
  - C00009
  - C00035
  - C00036
  - C00073
  confidence: high
  applies_when:
  - establishing or reviewing the transport and handshake layer of an MCP connection
  - defining the transport/message layer or session lifecycle
  - designing or reviewing MCP wire messages
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P002
  statement: Design MCP list operations that can return large result sets (resources/list,
    resources/templates/list, prompts/list, tools/list) to support cursor-based pagination,
    yielding results in smaller pages rather than all at once.
  derived_from_claims:
  - C00447
  - C00448
  - C00462
  - C00472
  - C00581
  - C00589
  confidence: high
  applies_when:
  - listing available prompts, especially large prompt sets
  - discovering available resources
  - implementing or reviewing an MCP list operation
  - the operation can return an unbounded or large result set
  - the server integrates external/internet services or large local data sets
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P003
  statement: Require explicit user approval of every LLM sampling request, let users
    control whether sampling occurs, the exact prompt sent, and what results the server
    may see, and limit server visibility into prompts by default.
  derived_from_claims:
  - C00028
  - C00029
  - C00030
  - C00399
  - C00400
  - C00401
  - C00402
  confidence: high
  applies_when:
  - a server initiates a sampling / recursive LLM request through the client
  - a client is about to forward a sampling request to a model
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P004
  statement: 'Handle JSON Schema dialects explicitly: default to 2020-12 when no $schema
    is declared, allow a $schema field to select another dialect, support at least
    2020-12 while documenting any additional dialects, and prefer 2020-12.'
  derived_from_claims:
  - C00090
  - C00091
  - C00092
  - C00093
  - C00627
  confidence: high
  applies_when:
  - processing JSON Schemas within MCP messages
  - Auditing schema definitions, validators, or schema dialect assumptions against
    revision 2025-11-25.
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P005
  statement: 'Route all server-originated LLM access through the client via sampling:
    let the client own model access, selection, and permissions so servers need no
    API keys of their own.'
  derived_from_claims:
  - C00052
  - C00395
  - C00396
  - C00397
  confidence: high
  applies_when:
  - a server needs an LLM completion
  - a server needs an LLM completion (text, image, or audio) inside an MCP feature
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P006
  statement: For task-augmented requests, keep using the original request's progressToken
    for the entire task lifetime — including after CreateTaskResult is returned —
    and never switch tokens mid-task; the token stays valid until the task reaches
    a terminal status.
  derived_from_claims:
  - C00237
  - C00238
  - C00239
  - C00286
  confidence: high
  applies_when:
  - the request is task-augmented
  - a long-running task should report progress
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P007
  statement: 'Treat tool annotations as untrusted input: a client must not rely on
    tool annotations for security decisions unless they come from a trusted server.'
  derived_from_claims:
  - C00025
  - C00512
  confidence: high
  applies_when:
  - consuming tool metadata such as descriptions or annotations from a server
  - a client consumes annotation metadata attached to a tool
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P008
  statement: 'Treat MCP tasks (introduced 2025-11-25) as an experimental capability:
    expect the design and behaviour to evolve and avoid hard-coding assumptions about
    unstable details.'
