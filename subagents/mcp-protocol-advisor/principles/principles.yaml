    skill: null
    reference: null
    test_cases: []
- principle_id: P009
  statement: 'Shut down through the transport rather than protocol messages: MCP defines
    no shutdown message. For stdio, the client closes the server''s input stream,
    then escalates to SIGTERM and finally SIGKILL if the server does not exit in a
    reasonable time (the server may instead close its output and exit); for HTTP,
    close the associated connection(s).'
  derived_from_claims:
  - C00135
  - C00136
  - C00137
  - C00138
  - C00139
  - C00140
  - C00141
  confidence: high
  applies_when:
