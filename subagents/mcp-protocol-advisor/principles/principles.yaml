- principle_id: P013
  statement: 'Require explicit, informed user consent before exposing or accessing
    user data: the host must obtain consent before exposing user data to a server,
    must not transmit resource data elsewhere without consent, and must protect user
    data with appropriate access controls while keeping the user in control of what
    is shared.'
