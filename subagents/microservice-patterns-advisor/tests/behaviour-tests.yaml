    requires a synchronous validation call), and have each service obtain the principal from the token,
    because a monolith''s in-memory thread-local session cannot pass identity across services; use a proven
    security or OAuth 2.0 framework rather than building your own, and cover the four security aspects
    of authentication, authorization, auditing, and TLS-secured interprocess communication'
