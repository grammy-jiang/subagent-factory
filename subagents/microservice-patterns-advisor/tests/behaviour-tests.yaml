- test_id: GT-003
  prompt: querying data across service boundaries. What do you advise, and why?
  principle_coverage:
  - P002
  expected_route: invoke
  minimum_output: Treat queries as a distinct distributed-data challenge (a query often needs data across
    services and a distributed query would violate encapsulation), implementing them with the API composition
    pattern (a composer invokes the data-owning services and combines the results, simplest and preferred
    whenever possible) or the CQRS pattern (dedicated view databases); place the API composer in a client,
    the API gateway, or a standalone service, recognizing that composition may require an inefficient
    in-memory join or be impossible for some queries
