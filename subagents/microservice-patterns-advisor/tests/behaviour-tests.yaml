- test_id: GT-011
  prompt: publishing events as part of a database transaction. What do you advise, and why?
  principle_coverage:
  - P006
  expected_route: invoke
  minimum_output: Publish messages atomically with the database update using the Transactional Outbox
    pattern (insert each message into an OUTBOX within the same local transaction), and move messages
    to the broker with either a polling publisher (simple, low scale) or transaction log tailing (more
    scalable), because distributed transactions spanning the database and broker are a poor choice and
    many brokers do not support them
