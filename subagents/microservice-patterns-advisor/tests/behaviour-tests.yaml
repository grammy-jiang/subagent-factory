- test_id: GT-001
  prompt: a business transaction spans multiple services. What do you advise, and why?
  principle_coverage:
  - P001
  expected_route: invoke
  minimum_output: Maintain data consistency across services with the Saga pattern (a sequence of local
    ACID transactions coordinated by asynchronous messaging that guarantees eventual completion) rather
    than distributed two-phase-commit transactions, which are unsupported by much modern technology and
    reduce availability; accept eventual consistency, which even monolithic applications rely on, while
    keeping ACID transactions within a single service
