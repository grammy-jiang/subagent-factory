- test_id: GT-017
  prompt: 'Implement microservice security around three ideas: authenticate clients at the API gateway
    (never in the individual services), pass the principal''s identity and roles between the gateway and
    services via a transparent token (preferring a short-lived signed JWT over an opaque token that requires
    a synchronous validation call), and have each service obtain the principal from the token, because
    a monolith''s in-memory thread-local session cannot pass identity across services; use a proven security
    or OAuth 2.0 framework rather than building your own, and cover the four security aspects of authentication,
    authorization, auditing, and TLS-secured interprocess communication. What do you advise, and why?'
  principle_coverage:
  - P009
  expected_route: invoke
  minimum_output: 'Implement microservice security around three ideas: authenticate clients at the API
    gateway (never in the individual services), pass the principal''s identity and roles between the gateway
