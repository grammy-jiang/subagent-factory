- principle_id: P012
  statement: Implement an API gateway either with an off-the-shelf product (little
    effort, least flexible, usually without API composition) or by building on a purpose-built
    gateway framework (solving routing-rule definition and correct HTTP proxying);
    require a gateway that routes on method, headers, and path (not path-only, which
    cannot serve a CQRS command/query split), structure a custom gateway into a main
    module, API packages, and proxy classes with externalized service URLs, and write
    its composition handlers in a reactive style that invokes services in parallel
    and degrades gracefully by treating non-essential providers as optional.
