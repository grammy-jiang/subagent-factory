- principle_id: P009
  statement: 'Implement microservice security around three ideas: authenticate clients
    at the API gateway (never in the individual services), pass the principal''s identity
    and roles between the gateway and services via a transparent token (preferring
    a short-lived signed JWT over an opaque token that requires a synchronous validation
    call), and have each service obtain the principal from the token, because a monolith''s
    in-memory thread-local session cannot pass identity across services; use a proven
    security or OAuth 2.0 framework rather than building your own, and cover the four
    security aspects of authentication, authorization, auditing, and TLS-secured interprocess
    communication.'
