schema_version: principles-v1
principles:
- principle_id: P001
  statement: Maintain data consistency across services with the Saga pattern (a sequence
    of local ACID transactions coordinated by asynchronous messaging that guarantees
    eventual completion) rather than distributed two-phase-commit transactions, which
    are unsupported by much modern technology and reduce availability; accept eventual
    consistency, which even monolithic applications rely on, while keeping ACID transactions
    within a single service.
  derived_from_claims:
  - C00005
  - C00072
  - C00192
  - C00193
  - C00194
  - C00195
  - C00196
  confidence: high
  applies_when:
  - a business transaction spans multiple services
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P002
  statement: Treat queries as a distinct distributed-data challenge (a query often
    needs data across services and a distributed query would violate encapsulation),
    implementing them with the API composition pattern (a composer invokes the data-owning
    services and combines the results, simplest and preferred whenever possible) or
    the CQRS pattern (dedicated view databases); place the API composer in a client,
    the API gateway, or a standalone service, recognizing that composition may require
    an inefficient in-memory join or be impossible for some queries.
  derived_from_claims:
  - C00008
  - C00073
  - C00296
  - C00297
  - C00298
  - C00299
  - C00300
  confidence: high
  applies_when:
  - querying data across service boundaries
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P003
  statement: 'Design a service to be observable (so operators can see its behavior,
    be alerted before users are impacted, and troubleshoot a request that spans many
    services) using six patterns, each split into a developer component and an operations
    component: Health check API, Log aggregation, Distributed tracing, Exception tracking,
    Application metrics, and Audit logging; in particular expose a health-check endpoint
    the infrastructure polls to avoid routing to a not-ready or failed instance and
    to replace one that does not recover.'
  derived_from_claims:
  - C00014
  - C00075
  - C00417
  - C00418
  - C00419
  - C00420
