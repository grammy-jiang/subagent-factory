- principle_id: P014
  statement: 'Apply the documented saga isolation countermeasures according to the
    anomaly and business risk: semantic lock (a *_PENDING flag cleared by a retriable
    or compensating transaction, with locked records handled by fail-and-retry or
    block-until-released), commutative updates, pessimistic view (reordering steps),
    reread value (optimistic offline lock), version file, and by value (choosing the
    concurrency mechanism per request''s risk).'
