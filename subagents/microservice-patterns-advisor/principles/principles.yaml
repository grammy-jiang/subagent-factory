    skill: null
    reference: null
    test_cases: []
- principle_id: P004
  statement: Protect every synchronous inter-service call against partial failure
    with network timeouts, an upper bound on outstanding requests, and a circuit breaker
    (using a resilience library), and decide per case how to recover from an unresponsive
    dependency by returning an error, a fallback or cached value, or degrading gracefully
    by omitting non-critical data.
  derived_from_claims:
  - C00015
  - C00156
  - C00157
  - C00158
  - C00159
  - C00160
