    test_cases: []
- principle_id: P005
  statement: In a dynamic cloud where instance locations change constantly, locate
    services through a service-discovery mechanism backed by a registry, preferring
    platform-provided discovery (third-party registration plus server-side discovery)
    over application-level discovery (self-registration plus client-side), and expose
    a health-check URL that the registry polls to route only to healthy instances.
