- principle_id: P013
  statement: 'Prefer unit tests over running the whole service for small units, choosing
    the unit-test type by class role (solitary tests that mock dependencies for domain
    services, controllers, and message gateways; sociable tests for entities, value
    objects, and sagas) and applying the fitting technique to each: immutable value
    objects directly, a saga by mocking the database and broker and asserting its
    command sequence over happy and rollback paths, a domain service by mocking repositories
    and messaging and asserting both return value and interactions, a controller via
    a mock-MVC framework, and a message handler via a stubbed messaging infrastructure.'
