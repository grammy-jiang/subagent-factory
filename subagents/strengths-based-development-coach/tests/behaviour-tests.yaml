schema_version: golden-tests-v1
subagent_slug: strengths-based-development-coach
generated_at: '2026-06-14'
golden_tests:
- test_id: GT-001
  prompt: Providing any development guidance, action ideas, or career-direction advice to an individual,
    regardless of role or industry. What do you advise, and why?
  principle_coverage:
  - P-001
  expected_route: invoke
  minimum_output: Prioritise developing dominant talents into strengths over correcting lesser-talent
    areas. Gallup's research shows people have several times more growth potential in their areas of high
    talent than in areas of low talent. Coaching energy and action ideas must therefore flow toward amplifying
    what already works, not remedying what is absent
- test_id: GT-002
  prompt: Advising managers on why a strengths-based approach to engagement matters, using quantified
    evidence. What do you advise, and why?
  principle_coverage:
  - P-002
  expected_route: invoke
  minimum_output: Employees who have daily opportunity to use their strengths are approximately six times
    more likely to be engaged at work and more than three times as likely to report an excellent quality
    of life. Conversely, those outside their strengths zone are six times less likely to be engaged and
    show measurable behavioural deterioration (dreading work, poor customer interactions, reduced creativity).
    Use these statistics to ground the business and human case when advising managers or individuals who
    question the strengths approach
- test_id: GT-003
  prompt: Advising a manager on how to engage, motivate, or interact with a direct report whose top-five
    themes are known. What do you advise, and why?
  principle_coverage:
  - P-003
  expected_route: invoke
  minimum_output: When a manager focuses on employees' strengths, active disengagement drops to approximately
    1%; focusing on weaknesses yields approximately 22% active disengagement; ignoring employees yields
    approximately 40%. Manager coaching guidance must therefore lead with strengths-focus tactics and
    flag that inattention is more damaging than weakness focus
- test_id: GT-004
  prompt: An individual or manager asks how to handle a task or responsibility that falls in a lesser-talent
    area. What do you advise, and why?
  principle_coverage:
  - P-004
  expected_route: invoke
  minimum_output: 'When a lesser-talent area must be addressed, apply the three-strategy sequence in order:
    (1) avoidance — eliminate or reduce exposure to the task where structurally possible; (2) systems
    and workarounds — build tools or processes that compensate for the gap; (3) complementary partnering
    — find a colleague whose dominant themes cover the gap. Never prescribe deficit-correction training
    as the default or primary response'
- test_id: GT-005
  prompt: Interpreting any of the 34 themes for an individual, whether in advise, produce, or extract
    mode. What do you advise, and why?
  principle_coverage:
  - P-005
  expected_route: invoke
  minimum_output: Every dominant talent theme carries characteristic over-expression risks and blind spots
    that must be named alongside the strength benefit whenever a theme is discussed. Presenting a theme
    as purely positive misrepresents the framework and may cause the individual to over-apply the talent
    in ways that damage relationships, ignore important context, or reduce effectiveness
- test_id: GT-006
  prompt: Explaining to a caller why the framework recommends strength development rather than weakness
    correction. What do you advise, and why?
  principle_coverage:
  - P-006
  expected_route: invoke
  minimum_output: 'Talent is the primary multiplier in the strengths formula (Talent x Investment = Strength).
    Knowledge and skills amplify existing talent but cannot substitute for absent talent. An individual
    with low talent who achieves maximum investment will always reach a lower ceiling than one with high
    talent and equivalent investment. Coaching guidance must reflect this asymmetry: invest where talent
    is strongest for the highest return'
- test_id: GT-007
  prompt: Any situation in which the caller has not yet taken the online assessment or has not provided
    their top-five theme names. What do you advise, and why?
  principle_coverage:
  - P-007
  expected_route: invoke
  minimum_output: Never assign, infer, or fabricate talent theme rankings for a person who has not completed
    the timed online StrengthsFinder assessment. The 20-second instinctive-response format captures the
    most stable, intense natural responses and is essential to valid measurement. Self-report, manager
    inference, or coach guessing cannot substitute for the assessment
- test_id: GT-008
  prompt: Any output that references the Gallup Q12 engagement measurement instrument or the engagement
    statistics derived from it. What do you advise, and why?
  principle_coverage:
  - P-008
  expected_route: invoke
  minimum_output: The Gallup Q12 engagement items are proprietary and legally protected; they may not
    be reproduced, quoted, or paraphrased item-by-item in any output. Engagement statistics derived from
    Q12 research (e.g., 6x engagement likelihood, 40/22/1% disengagement rates) are citable; the item
    wording itself is not
- test_id: GT-009
  prompt: 'Extract mode is active: a team leader provides multiple team members'' top-five theme names
    and asks for coverage mapping or pairing advice. What do you advise, and why?'
  principle_coverage:
  - P-009
  expected_route: invoke
  minimum_output: 'Use a team strengths grid as the structured tool for team-mapping tasks: list each
    member''s dominant themes, identify overlaps and coverage gaps across the team, and recommend complementary
    pairings by naming specific themes rather than offering vague advice to find diverse colleagues'
negative_routing_tests:
- test_id: NR-001
  prompt: A minimum-competency threshold (safety, legal compliance, or basic role prerequisite) must be
    met regardless of talent profile; in those cases a baseline floor is established before the strengths-amplification
    lens takes over. Can you handle this for us?
  principle_coverage:
  - P-001
  expected_route: do_not_invoke
  must_not_do:
  - Answer as if the request were in scope when it is not
- test_id: NR-002
  prompt: The individual's disengagement has a structural or clinical cause outside the strengths-development
    scope (e.g., mental health crisis, unsafe working conditions); in those cases refer to the appropriate
    authority rather than applying engagement statistics. Can you handle this for us?
  principle_coverage:
  - P-002
  expected_route: do_not_invoke
  must_not_do:
  - Answer as if the request were in scope when it is not
- test_id: NR-003
  prompt: The person being advised is an individual contributor with no managerial responsibility; in
    that case use P-002 framing instead of manager-focus statistics. Can you handle this for us?
  principle_coverage:
  - P-003
  expected_route: do_not_invoke
  must_not_do:
  - Answer as if the request were in scope when it is not
- test_id: NR-004
  prompt: The lesser-talent area is a non-negotiable minimum-competency requirement where avoidance is
    genuinely impossible; in that case acknowledge the gap and design a system or partner to cover it
    rather than skipping to deficit training. Can you handle this for us?
  principle_coverage:
  - P-004
  expected_route: do_not_invoke
  must_not_do:
  - Answer as if the request were in scope when it is not
- test_id: NR-005
  prompt: A brief minimum-output response where only one action idea is delivered; even then, include
    a one-sentence blind-spot note rather than omitting it entirely. Can you handle this for us?
  principle_coverage:
  - P-005
  expected_route: do_not_invoke
  must_not_do:
  - Answer as if the request were in scope when it is not
- test_id: NR-006
  prompt: The individual acknowledges the principle and asks for practical next steps; do not repeat the
    rationale at length once understood. Can you handle this for us?
  principle_coverage:
  - P-006
  expected_route: do_not_invoke
  must_not_do:
  - Answer as if the request were in scope when it is not
- test_id: NR-007
  prompt: The caller explicitly states their theme names obtained from a completed assessment; accept
    those at face value and proceed. Can you handle this for us?
  principle_coverage:
  - P-007
  expected_route: do_not_invoke
  must_not_do:
  - Answer as if the request were in scope when it is not
- test_id: NR-008
  prompt: The caller only asks about engagement statistics (these are freely citable); the restriction
    applies exclusively to the Q12 item wording. Can you handle this for us?
  principle_coverage:
  - P-008
  expected_route: do_not_invoke
  must_not_do:
  - Answer as if the request were in scope when it is not
- test_id: NR-009
  prompt: The request is for an individual rather than a group; in that case individual-level complementary
    partnering (P-004, strategy 3) applies instead of a full team grid. Can you handle this for us?
  principle_coverage:
  - P-009
  expected_route: do_not_invoke
  must_not_do:
  - Answer as if the request were in scope when it is not
