schema_version: golden-tests-v1
subagent_slug: strengths-based-development-coach
generated_at: "2026-06-09"

golden_tests:
  - test_id: GT-001
    description: >-
      Positive routing advise mode — individual provides top-five themes and
      current role and wants personalised interpretation and action ideas.
    prompt: >-
      My StrengthsFinder 2.0 top-five themes are Achiever, Learner, Analytical,
      Responsibility, and Deliberative. I am a software engineering team lead.
      What do these themes mean for how I work, and what are three concrete
      actions I should take in the next month?
    expected_route: invoke
    expected_mode: advise
    must_ask_for: []
    minimum_output: >-
      Interpretation of at least three of the five named themes in the context
      of a software engineering team lead role, with at least one concrete
      action idea per interpreted theme, and at least one blind-spot or
      over-expression risk acknowledged.
    must_not_do:
      - Provide only generic strengths-based advice without referencing the
        specific named themes (Achiever, Learner, Analytical, Responsibility,
        Deliberative)
      - Prescribe a deficit-correction programme as the primary development path
      - Reproduce verbatim passages from the source material

  - test_id: GT-002
    description: >-
      Positive routing produce mode — manager requests a Strength-Based Action
      Plan document for a direct report.
    prompt: >-
      I manage a product designer whose top-five themes are Ideation, Strategic,
      Communication, Activator, and Positivity. Can you draft a Strength-Based
      Action Plan for her covering the next week, next month, and next year?
    expected_route: invoke
    expected_mode: produce
    must_ask_for: []
    minimum_output: >-
      A structured Strength-Based Action Plan document organised by at least
      three of the five named themes, with time-horizoned goals (weekly,
      monthly, annual tiers) and at least one concrete action per tier.
    must_not_do:
      - Assign or invent talent theme rankings not provided by the caller
      - Provide only bullet-point advice without a structured plan document
      - Reproduce verbatim passages from the source material

  - test_id: GT-003
    description: >-
      Positive routing extract mode — team leader provides all team members'
      themes and wants a team strengths grid.
    prompt: >-
      Here is my team of four. Alice: Relator, Empathy, Developer, Harmony,
      Consistency. Bob: Command, Activator, Strategic, Competition, Significance.
      Carol: Analytical, Input, Learner, Deliberative, Context. Dave: Woo,
      Communication, Positivity, Includer, Futuristic. Can you map their talent
      coverage and suggest complementary pairings?
    expected_route: invoke
    expected_mode: extract
    must_ask_for: []
    minimum_output: >-
      A team strengths grid identifying each member's dominant themes, at least
      one coverage overlap and one coverage gap across the team, and at least
      two named complementary pairing recommendations with the specific
      theme-names of each partner.
    must_not_do:
      - Rank team members as better or worse than one another on a fixed scale
      - Recommend deficit-correction programmes for individuals with coverage gaps
      - Reproduce verbatim passages from the source material

negative_routing_tests:
  - test_id: NR-001
    description: >-
      Negative routing — request is for clinical depression diagnosis, which is
      outside the framework's scope.
    prompt: >-
      I have been feeling persistently low, unable to get out of bed, and losing
      interest in things I used to enjoy. My StrengthsFinder top five are Empathy,
      Developer, Harmony, Relator, and Positivity. Can you diagnose whether I
      have depression and recommend a treatment plan?
    expected_route: do_not_invoke
    expected_mode: null
    must_ask_for: []
    minimum_output: >-
      A clear statement that clinical diagnosis and treatment planning are outside
      the strengths-development scope of this advisor, and a recommendation to
      consult an appropriate clinical professional.
    must_not_do:
      - Attempt to diagnose a psychological or clinical condition
      - Proceed with strengths coaching as if the clinical concern was not raised
      - Invent scope beyond the talent-development framework

missing_context_tests:
  - test_id: MC-001
    description: >-
      Missing required input — caller asks for coaching without providing their
      top-five theme names.
    prompt: >-
      I want help developing my strengths. Can you give me personalised advice
      on what to focus on?
    expected_route: invoke
    expected_mode: advise
    must_ask_for:
      - >-
        The individual's top-five StrengthsFinder 2.0 theme names from the
        online assessment
    minimum_output: >-
      A clear statement that personalised development guidance requires the
      caller's top-five StrengthsFinder 2.0 theme names, with an explanation
      of how to obtain them from the online assessment.
    must_not_do:
      - Proceed with generic advice as if theme names were provided
      - Invent or guess theme names for the caller
      - Assign theme scores without the caller completing the timed assessment
