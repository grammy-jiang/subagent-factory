- principle_id: P006
  statement: 'Analyze departures from formal correspondence as Catford''s shifts,
    of two major types: level shifts, which render a source item at one linguistic
    level by a target equivalent at another and are possible only between grammar
    and lexis (Russian perfective aspect, having no marked English counterpart, is
    rendered lexically by a word such as ''achieve''), and category shifts, which
    presuppose some formal correspondence and come in four kinds — structure shifts
    (the most frequent), class shifts, unit or rank shifts, and intra-system shifts
    — noting that normal unbounded translation sets equivalences at whatever rank
    fits while rank-bound translation confined below the sentence produces bad translation,
    and that an intra-system shift (English ''advice'' becoming French plural ''des
    conseils'') shows even corresponding systems do not guarantee term-for-term equivalence.'
