- principle_id: P078
  statement: 'Understand why mere trans-coding will not produce a serviceable translatum:
    the source is bound to the source culture while the translatum is oriented to
    the target culture, which ultimately defines its adequacy, so the two may diverge
    considerably in content and goals and adequacy is measured against the skopos
    rather than source-fidelity; intertextual coherence is the skopos-relative relation
    that holds to the degree the translator judges the source''s form and function
    adequate for the predetermined skopos (so even an exact structural imitation can
    be a legitimate skopos), the skopos has three senses corresponding to the parts
    of an action (process/goal, result/function, mode/intention) and may have sub-skopoi,
    and assigning a skopos does not narrow a text to one reading — preserving the
    source''s breadth of interpretation is itself a legitimate skopos, since a translation
