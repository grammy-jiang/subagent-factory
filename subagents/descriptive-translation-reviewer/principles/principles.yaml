- principle_id: P009
  statement: 'Make the translation commission (the Auftrag, Vermeer) an explicit instruction stating both
    the goal and the conditions for attaining it (including deadline and fee), negotiated
    with the client — who may hold an imprecise or false picture of how the text will
    be received, so the translator should offer argued suggestions — while remembering
    that a commission''s realizability depends on the target culture''s circumstances,
    not the source''s (too great a discrepancy yields not a translation but at most
    a rewrite); this relativizes the once-dominant demand to translate ''as literally
    as possible'' into just one legitimate skopos among many, does not require adaptation
    to target expectations (a deliberately marked translation and every hybrid are
    equally accommodated), and yields a threefold value: making an often-denied aim
    explicit, expanding strategy and releasing the translator from enforced literalness,
    and enlarging the translator''s accountability to make the goal actually attained.'
