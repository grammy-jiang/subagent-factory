- principle_id: P013
  statement: Study a translation's reception through reviews and paratexts, distinguishing
    peritexts (in the same volume, from author or publisher) from epitexts (freely
    circulating reviews, marketing, and criticism) that guide the reading, analysing
    reviews synchronically or diachronically against the readers' horizon of expectation,
    and expecting reviews to prefer fluent translations, rarely discuss the translation,
    and treat the translator's words as the author's own, confirming the translator's
    invisibility.
