- principle_id: P082
  statement: 'Catch the effacement of vernacular, idiom, and superimposed languages,
    and prefer literal translation to the Platonic figure: because all great prose
    is rooted in the vernacular, effacing vernacular networks is a serious injury
    and the traditional remedy of exoticizing them (italics or rendering a foreign
    vernacular with a local one) fails, since a vernacular clings to its soil; replacing
    a source idiom or proverb with a target ''equivalent'' is an ethnocentrism, since
    equivalents do not translate an idiom and to translate is not to search for equivalences;
    and the central problem of the novel is the effacement of the superimposition
    of languages (a dialect against a koine, or coexisting languages as in Finnegans
    Wake), which the heteroglossic novel demands be preserved — so oppose to western
    translation''s Platonic embellishing restitution of meaning (separating spirit
    from letter and converging on a text clearer and purer than the original) a literal
    translation attached to the letter of the work, which both restores the work''s
    particular signifying process and transforms the translating language.'
