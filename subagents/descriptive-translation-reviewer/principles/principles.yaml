- principle_id: P022
  statement: 'Ground a feminist practice of translation in the double bind rather
    than the double standard, replacing the oedipal family model of struggle with
    a model of collaboration that is at once cooperative and subversive: faced with
    an ideologically offensive source the resisting translator subverts the text —
    playing infidelity against infidelity and following out its parodic logic rather
    than declining to translate it, since refusal would capitulate to the very logic
    that ascribes all power to the original — and gives voice rather than silence
    by becoming an independent interpreter who speaks with the work and makes the
    principles of the practice explicit (so that writing about a translation matters
    as much as the translation itself), the decisive target being not the sex of the
    author or translator but the process by which translation complies with gender
    constructs.'
