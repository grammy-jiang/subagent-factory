- principle_id: P020
  statement: 'Reject fluency (''reads as if originally written'') as the measure of
    a good translation and reject reproduction of meaning as its aim: word-for-word
    fidelity cannot reproduce connotation, literalness cannot be justified by meaning-retention,
    and what truly matters is the untranslatable nucleus — so a translation should
    incorporate the original''s mode of signification (Benjamin''s broken-vessel and
    syntax-literalism), on the understanding that the transfer can never be total.'
