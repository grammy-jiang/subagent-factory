- principle_id: P002
  statement: Expect, in Even-Zohar's polysystem theory, translated literature to assume a central, innovating position
    under three conditions (one law) — when a literature is young and being established,
    when it is peripheral or weak within a larger group, and at turning points, crises,
    or vacuums — where it introduces new models and blurs the line between original
    and translated writing; and expect it in the peripheral position to employ secondary
    models and become a major factor of conservatism, adhering to norms the centre
    has rejected, so that a vehicle for new ideas can ossify into a systeme d'antan
    (empirically the 'normal' position tends to be peripheral, and rigid systems keep
    it extremely so).
