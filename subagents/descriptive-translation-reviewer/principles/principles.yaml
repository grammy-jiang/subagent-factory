- principle_id: P014
  statement: Screen a literary translation for Berman's twelve deforming tendencies
    (rationalization, clarification, expansion, ennoblement, qualitative and quantitative
    impoverishment, destruction of rhythms, of underlying networks of signification,
    of linguistic patternings, and of vernacular networks or their exoticization,
    destruction of expressions and idioms, and effacement of the superimposition of
    languages), refusing to replace a source idiom with a target equivalent or to
    seek a target vernacular for a source vernacular, and pursue instead a positive
    labour on the letter that attends to the work's signifying process.
