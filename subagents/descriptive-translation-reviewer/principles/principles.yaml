- principle_id: P005
  statement: Model translation as Steiner's fourfold hermeneutic motion — initiative
    trust, aggression, incorporation, and restitution — which supersedes the sterile
    triad of literalism, paraphrase, and free imitation and is inherent in even the
    rudiments of translation; its first move, trust, is an a priori leap that grants
    'there is something there' to understand and that the transfer will not be void,
    a gamble on the world's coherence and symbolic plenitude that nonsense, glossolalia,
    and concrete poetry betray by being lexically non-communicative and hence untranslatable.
