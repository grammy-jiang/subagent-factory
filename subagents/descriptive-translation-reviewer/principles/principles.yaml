- principle_id: P139
  statement: 'Recognize that a culturally marked discourse such as ''camp'' may have
    constant formal resources across languages yet perform far-from-uniform functions
    and carry far-from-uniform evaluation across contexts, so a translator cannot
    merely match comparable formal resources but must read its evaluation on two dimensions
    — a micro-functional dimension set by the immediate fictional context (the same
    camp reading as stunted affect in one novel and as strength and solidarity in
    another) and a macro-functional dimension tapping the wider subcultural values
    the identity has established — and while the micro-functional evaluation may be
    apparent to any attentive reader, a good translation of the macro-functional dimension
    depends on factors beyond close reading of the source: the existence, nature,
    and visibility of the relevant identities and communities in the target culture,
    the presence of an established minority literature there, the stated objectives
    of the translation and its publication, and the sexual identity and subcultural
    positioning of the translator.'
