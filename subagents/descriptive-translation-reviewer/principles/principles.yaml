- principle_id: P011
  statement: 'Reconstruct norms rather than read them off, because norms are not directly
    observable — what is available is norm-governed behaviour and most often only
    its products (even thinking-aloud protocols yield products) — drawing on two sources
    with their proper weight: textual sources (the translated texts themselves, primary
    products of norm-regulated behaviour) and extratextual sources (prescriptive theories
    and statements by translators, editors, and critics, which are mere partial, persuasion-biased
    by-products never to be accepted at face value but explicated and confronted with
    the patterns of actual behaviour).'
