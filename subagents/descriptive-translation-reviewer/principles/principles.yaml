- principle_id: P083
  statement: Make the translator the judge of how much of a source's reference and
    allusion network to explain — delimiting the central allusions without which the
    reader could not follow the main argument or plot (Camus's allusion to Heathcliff
    was footnoted by the German translator but not the English or Hebrew) — while
    accepting that coherence can hinge on cultural presuppositions and Gricean-maxim
    violations only a culturally competent reader can decode (Hemingway's 'The Killers'
    turning on American lunchroom 'dinner' norms), a class of reader-focused loss
    largely irremediable since cultural institutions cannot easily be glossed in a
    footnote; and cast the translator in two roles — a preventive-medicine practitioner
