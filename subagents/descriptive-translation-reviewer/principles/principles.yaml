- principle_id: P015
  statement: 'Work the Vinay and Darbelnet procedure ladder: within direct translation
    use borrowing, calque, or literal translation, prescribing literal rendering as
    the basis of good translation and sacrificing literalness only for structural
    or metalinguistic reasons after checking that meaning is preserved, and when a
    literal rendering is unacceptable on grammatical, syntactic, or pragmatic grounds
    move to oblique translation through transposition (change of part of speech, the
    commonest structural change), modulation (change of viewpoint, the touchstone
    of a good translator, used when a correct rendering is unidiomatic or awkward),
    equivalence (idiomatic rendering for idioms and proverbs), or adaptation (change
    of cultural reference when the source situation is absent).'
