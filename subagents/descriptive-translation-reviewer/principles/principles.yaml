- principle_id: P024
  statement: Orient a translation on the domestication-foreignization axis, where
    domestication is an ethnocentric, fluent, invisible reduction of the foreign to
    receiving values that moves the author toward the reader and dominates Anglo-American
    culture, and foreignization chooses a foreign text and a non-fluent, estranging
    method that makes the translator visible and highlights the source's identity
    by moving the reader toward the author, realizing foreignization through text
    choice and techniques such as close adherence to structure, calques, archaisms,
    and heterogeneous discourse, and treating the two as a continuum on an ethical
    level of values and a discursive level of fluency versus resistancy while noting
    that foreignization is relative and historically contingent.
