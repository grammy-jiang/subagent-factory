- principle_id: P007
  statement: 'Treat being a translator as playing a socially allotted role whose prerequisite
    is acquiring the norms for what is suitable and for manoeuvring among competing
    constraints (not reducible to generating ''translation'' utterances): those constraints
    lie on a scale between relatively absolute rules and purely individual idiosyncrasies,
    with the vast intersubjective middle occupied by norms (themselves a graded continuum
    that shift over time as whims become norms and norms harden into rules); norms
    translate a community''s shared values into performance instructions specifying
    what is prescribed, forbidden, tolerated, and permitted, so — since there is no
    necessary identity between a norm and any verbal formulation of it, and stated
    norms are slanted by a desire to control — reconstruct the actual norms from regularities
    of behaviour rather than from what practitioners say they do.'
