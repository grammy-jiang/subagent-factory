- principle_id: P179
  statement: 'Understand dynamic equivalence (D-E) as the closest natural equivalent
    to the source-language message, built on the principle of equivalent effect: it
    makes the relationship between receptor and message substantially the same as
    that between the original receptors and their message, aiming at complete naturalness
    and relating the receptor to his own culture without requiring him to grasp the
    source culture, where ''equivalent'' points toward the source message, ''natural''
    toward the receptor language, and ''closest'' binds the two — and which must still
    clearly reflect the source''s meaning and intent rather than be a similar independent
    message.'
