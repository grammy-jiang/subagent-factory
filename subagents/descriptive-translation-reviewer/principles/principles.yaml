- principle_id: P081
  statement: 'Catch expansion and the two poles of stylistic distortion and impoverishment:
    expansion makes every translation longer than its original, but the added length
    is empty, adding only to the gross mass while muffling the work''s voice and slackening
    its rhythm (and it can mask impoverishment); ennoblement, the culmination of classic
    translation, produces ''elegant'' sentences that use the source as raw material
    at its expense, while its opposite of popularization through pseudo-slang is equally
    deforming — both annihilating the original''s authentic orality; qualitative impoverishment
    replaces terms with ones lacking their sonorous or iconic richness (a word''s
    physical density), effacing the signifying process; and quantitative impoverishment
    flattens the proliferation of unfixed signifiers (Arlt''s semblante, rostro, and
    cara for one signified) into fewer signifiers, rendering the work''s face unrecognizable
    and making it at once poorer and longer.'
