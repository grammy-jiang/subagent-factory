- principle_id: P003
  statement: Treat translation as at once interpretation and creation, involving a
    choice among the source's possible interpretations and a choice among the target's
    possible expressions of that meaning, and expect the translator in practice to
    apply a pessimistic minimax strategy — accepting the solution promising the most
    effect for the least effort provided its value clears the minimum his standards
    admit — while recognizing that the importance he assigns a stylistic device is
    a relative value weighed against competing values such as linguistic purity, that
    preserving a device is an implicit bet on what fraction of readers will feel the
    language violated, and that a preserved formal feature communicates only to the
    subset of readers competent to decode it (Sapphic metre versus apparent free verse),
    so the likely audience composition must be weighed.
