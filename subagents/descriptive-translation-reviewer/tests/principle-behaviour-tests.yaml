- test_id: PB-P001
  principle_id: P001
  mode: review
  prompt: We are reviewing a translation or translation-studies analysis where culture, ideology, power
    and rewriting is at issue. What flaw should we check for, what is the correction, and what residual
    trade-off should we carry?
  expected_behaviour:
  - 'Applies the principle: Locate the deep problem of translating a foreign work not in the dictionary
    or semantic equivalence but in a compromise between two poetics in which the receiving system''s poetics
    dominates.'
  - Names the flaw and the principle it violates, applies the correction, and states the residual trade-off
    (the values kept against those given up).
  - Cites P001.
  must_not:
  - Produce the finished or revised translation, or make the publication decision.
  - State the rule more strongly than the source supports, or accept fluency alone as proof of quality.
