schema_version: golden-tests-v1
subagent_slug: xv6-kernel-internals-reviewer
generated_at: "2026-06-13T00:00:00+00:00"

golden_tests:
  - test_id: GT-001
    description: >-
      Positive routing — advise mode: explain the trap path (uservec through
      sret) and the trampoline mapping requirement (pr-002).
    prompt: >-
      Walk me through exactly what happens in xv6 when a user process makes a
      system call — from the ecall instruction to the return to user mode.
      Which registers are involved and why must the trampoline be mapped at the
      same virtual address in every address space?
    expected_route: invoke
    expected_mode: advise
    must_do:
      - >-
        Trace the full sequence: uservec saves registers to the trapframe and
        switches to the kernel page table and stack; usertrap handles the cause;
        usertrapret/userret restores user state and executes sret
      - >-
        Name satp (active page table), sepc (saved PC), stvec (trap vector),
        and scause (trap cause) and explain their roles in the sequence
      - >-
        Explain that the trampoline must be mapped at an identical virtual
        address in every address space so execution can continue before satp
        is switched (pr-002)
      - >-
        Anchor the explanation to the xv6 source path and to principle pr-002
    must_not_do:
      - >-
        Omit the trampoline mapping rationale or skip any stage of the
        uservec/usertrap/usertrapret/userret sequence
      - >-
        Invent register semantics or trap-path behaviour xv6 does not implement
      - >-
        Present the xv6 trap design as a production-grade mechanism without
        noting simplifications

  - test_id: GT-002
    description: >-
      Positive routing — review mode: critique kernel code for concurrency
      defects — lock ordering (pr-005), missing memory barrier (pr-006), and
      lost-wakeup risk (pr-008).
    prompt: >-
      Here is a kernel function: path A acquires lock B then lock A; path B
      acquires lock A then lock B. Both paths call sleep after acquiring the
      lock without checking the condition in a loop. There is no memory barrier
      in the acquire implementation. Review it for concurrency bugs.
    expected_route: invoke
    expected_mode: review
    must_do:
      - >-
        Flag the inconsistent lock-acquisition order as a deadlock risk and
        cite the requirement for a single global order (pr-005)
      - >-
        Flag the missing memory barrier — acquire and release must call
        __sync_synchronize() to prevent reordering across the critical section
        boundary, and push_off must be called before lk->locked is set (pr-006)
      - >-
        Flag the missing condition re-check loop as a lost-wakeup or
        spurious-wakeup risk and require sleep to be called inside a loop
        that re-checks the condition (pr-008)
      - >-
        Tie each finding to the relevant principle (pr-005, pr-006, pr-008)
        rather than to general assertion
    must_not_do:
      - >-
        Approve the change while lock-ordering or barrier invariants are broken
      - >-
        Recommend a mechanism xv6 does not have as the fix without saying so
      - >-
        Treat the absence of a memory barrier as harmless

  - test_id: GT-003
    description: >-
      Positive routing — review mode: critique a filesystem change for
      crash-recovery correctness and inode concurrency (pr-011, pr-012).
    prompt: >-
      A proposed change to the xv6 filesystem writes directly to two different
      disk blocks (the inode block and the bitmap block) without wrapping the
      operation in begin_op/end_op. It also calls iget and immediately reads
      ip->size without calling ilock first. Is this correct?
    expected_route: invoke
    expected_mode: review
    must_do:
      - >-
        Flag the missing begin_op/end_op wrapper: every multi-block operation
        must be enclosed in a transaction so write-ahead logging guarantees
        atomicity; a crash between the two writes would leave on-disk structures
        inconsistent (pr-011)
      - >-
        Flag the direct read of ip->size without ilock: iget returns a pointer
        but the caller must call ilock to acquire the per-inode sleep-lock
        before touching any inode fields (pr-012)
      - >-
        Cite the relevant principles (pr-011 and pr-012) for each finding
    must_not_do:
      - >-
        Approve the change while the missing transaction or missing ilock
        represent correctness violations
      - >-
        Assert crash-recovery guarantees that the logging layer does not provide
      - >-
        Confuse the inode cache lock (icache.lock) with the per-inode sleep-lock

  - test_id: GT-004
    description: >-
      Positive routing — compare mode: contrast xv6 sleep/wakeup and its
      file-system design with production kernels.
    prompt: >-
      How does xv6's sleep/wakeup and its on-disk file-system design compare
      to what real systems like FreeBSD or Linux do?
    expected_route: invoke
    expected_mode: compare
    must_do:
      - >-
        State the xv6 simplification for sleep/wakeup and name the production
        counterpart (FreeBSD msleep takes the same approach per the source's
        Real-world discussion)
      - >-
        State the xv6 filesystem simplification and name the production
        counterpart (BSD UFS/FFS and Linux ext2/ext3 use essentially the same
        on-disk design per the source)
      - >-
        Name the trade-off each makes — what xv6 omits for clarity versus what
        production systems add
    must_not_do:
      - >-
        Present xv6 behaviour as production-grade
      - >-
        Invent production behaviour not grounded in the source's Real-world
        discussion
      - >-
        Assert durability or fairness guarantees xv6 does not make

negative_routing_tests:
  - test_id: NR-001
    description: >-
      Negative routing — production OS operations and administration is out of
      scope for a commentary on the xv6 teaching kernel.
    prompt: >-
      Which kernel build flags and sysctl settings should I tune to get the
      best throughput on my production Linux database server?
    expected_route: decline
    expected_mode: none
    must_do:
      - >-
        Decline as out of scope and state that the source is an xv6
        teaching-kernel commentary, not a production tuning or ops guide
    must_not_do:
      - >-
        Invent Linux build flags or sysctl values
      - >-
        Pretend xv6 guidance transfers directly to production Linux tuning

missing_context_tests:
  - test_id: MC-001
    description: >-
      Missing required input — no specific mechanism, code path, or change
      was provided.
    prompt: >-
      Can you review my kernel code?
    expected_route: invoke
    expected_mode: review
    must_ask_for:
      - >-
        The specific kernel mechanism or code path under discussion (for
        example the function or xv6 source file)
      - >-
        The question being asked or the change being proposed
    minimum_output: >-
      A clear statement that the concrete code path and the question or change
      are needed before the mechanism can be explained or the design critiqued.
    must_not_do:
      - >-
        Proceed as if a code path was provided
      - >-
        Hallucinate the caller's kernel code or invariants
