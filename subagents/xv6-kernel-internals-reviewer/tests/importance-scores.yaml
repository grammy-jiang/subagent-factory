schema_version: importance-scores-v1
# Phase 2.5 importance ranking for the xv6 book. Candidate units = the book's
# major subsystem discussions. Scores (1-5) judge what is worth carrying into
# the profile vs. what routes only to the provenance ledger. Run with:
#   python -m tools.subagent_factory.score_extracted_units <this file>
candidate_units:
  - id: U1
    source_id: a-simple-unix-like-t-20260608233745
    summary: >-
      Concurrency control — locks, consistent lock ordering to avoid deadlock,
      memory barriers in acquire/release, sleep/wakeup and the lost-wakeup race.
    scores: { authority: 5, actionability: 5, reusability: 5, risk_impact: 5,
              evidence_strength: 5, uniqueness: 4, transferability: 5,
              stability: 4, operational_fit: 5 }
  - id: U2
    source_id: a-simple-unix-like-t-20260608233745
    summary: >-
      Isolation and the user/kernel boundary — user vs supervisor mode, page
      tables, and validating user-supplied pointers in copyin/copyout and ELF
      addresses in exec.
    scores: { authority: 5, actionability: 5, reusability: 4, risk_impact: 5,
              evidence_strength: 5, uniqueness: 4, transferability: 4,
              stability: 4, operational_fit: 4 }
  - id: U3
    source_id: a-simple-unix-like-t-20260608233745
    summary: >-
      Page tables and address spaces on RISC-V — paging hardware, satp, PTEs,
      creating an address space, physical memory allocation, sbrk, exec.
    scores: { authority: 5, actionability: 4, reusability: 4, risk_impact: 4,
              evidence_strength: 5, uniqueness: 3, transferability: 3,
              stability: 4, operational_fit: 4 }
  - id: U4
    source_id: a-simple-unix-like-t-20260608233745
    summary: >-
      Traps, interrupts, and system calls — RISC-V trap machinery, traps from
      user/kernel space, the trampoline, system-call arguments, device drivers.
    scores: { authority: 5, actionability: 4, reusability: 3, risk_impact: 4,
              evidence_strength: 5, uniqueness: 3, transferability: 3,
              stability: 4, operational_fit: 4 }
  - id: U5
    source_id: a-simple-unix-like-t-20260608233745
    summary: >-
      Scheduling and context switching — swtch, the per-CPU scheduler thread,
      coroutine-style switching, and giving up the CPU.
    scores: { authority: 5, actionability: 4, reusability: 4, risk_impact: 4,
              evidence_strength: 5, uniqueness: 3, transferability: 4,
              stability: 4, operational_fit: 4 }
  - id: U6
    source_id: a-simple-unix-like-t-20260608233745
    summary: >-
      The layered file system — buffer cache, the logging layer that commits a
      group of writes atomically for crash recovery, inodes, directories, paths.
    scores: { authority: 5, actionability: 5, reusability: 4, risk_impact: 5,
              evidence_strength: 5, uniqueness: 4, transferability: 4,
              stability: 4, operational_fit: 4 }
  - id: U7
    source_id: a-simple-unix-like-t-20260608233745
    summary: >-
      "Real world" comparisons — how xv6's simplified design differs from BSD,
      Linux, FreeBSD msleep, and UFS/FFS/ext, and what xv6 omits for teaching.
    scores: { authority: 4, actionability: 3, reusability: 4, risk_impact: 3,
              evidence_strength: 4, uniqueness: 4, transferability: 5,
              stability: 3, operational_fit: 4 }
  - id: U8
    source_id: a-simple-unix-like-t-20260608233745
    summary: >-
      Chapter exercises (e.g. add copy-on-write fork, superpages, address-space
      randomization) — open-ended extension tasks, not settled design guidance.
    scores: { authority: 2, actionability: 2, reusability: 2, risk_impact: 2,
              evidence_strength: 2, uniqueness: 2, transferability: 2,
              stability: 2, operational_fit: 2 }
