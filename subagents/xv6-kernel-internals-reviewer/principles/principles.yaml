schema_version: principles-v1
principles:
- principle_id: pr-001
  statement: 'When reviewing process isolation, verify that every privilege boundary enforcement point
    relies on a kernel-controlled ecall entry rather than any user-reachable jump target, and that the
    process abstraction combines a mode flag, a private page table, and time-sliced scheduling — any gap
    in this triple exposes one process to corruption by another.

    '
  derived_from_claims:
  - cl-011
  - cl-013
  confidence: high
  applies_when:
  - Reviewing kernel entry paths, syscall dispatch, or privilege transitions
  - Auditing whether a process can affect another's memory or CPU state
  does_not_apply_when:
  - Reviewing inter-process communication channels that are intentionally shared
  - Evaluating microkernel designs where services run in user space
  operational_mapping:
    skill: address-space-and-trap-walkthrough
    reference: xv6-subsystem-map
    test_cases: []
- principle_id: pr-002
  statement: 'When explaining or critiquing the trap path, trace the full sequence — uservec saves registers
    to the trapframe and switches to the kernel page table and stack, usertrap handles the cause, and
    usertrapret/userret restores user state and executes sret — and check that the trampoline is mapped
    at an identical virtual address in every address space so the handler can begin executing before satp
    is switched.

    '
  derived_from_claims:
  - cl-020
  - cl-024
  confidence: high
  applies_when:
  - Explaining the user-space trap entry/exit path
  - Reviewing trampoline and trapframe mapping decisions
  - Auditing whether register save/restore is complete and correctly ordered
  does_not_apply_when:
  - Kernel-only traps that never touch user page tables
  - Timer interrupt machine-mode path (handled before reaching uservec)
  operational_mapping:
    skill: address-space-and-trap-walkthrough
    reference: xv6-subsystem-map
    test_cases: []
- principle_id: pr-003
  statement: 'When a system call receives a user-space pointer, flag any direct dereference as a privilege-escalation
    risk; the correct pattern is to validate and copy through copyinstr (or copyin), which translates
    the virtual address through the user page table in software and checks bounds before touching a single
    byte.

    '
  derived_from_claims:
  - cl-027
  confidence: high
  applies_when:
  - Reviewing any syscall implementation that accepts a pointer argument
  - Auditing kernel code that reads strings or buffers from user space
  does_not_apply_when:
  - Kernel-to-kernel pointer passing within a single address space
  - Pointers already validated and copied in an outer call on the same path
  operational_mapping:
    skill: address-space-and-trap-walkthrough
    reference: xv6-subsystem-map
    test_cases: []
- principle_id: pr-004
  statement: 'When reviewing shared data structures, check that locks protect multi-field invariants rather
    than individual variables: if an invariant spans several memory locations, all must be covered by
    one lock so no concurrent CPU ever observes a transiently violated state.

    '
  derived_from_claims:
  - cl-029
  - cl-032
  confidence: high
  applies_when:
  - Auditing any shared data structure guarded by a lock
  - Reviewing new lock introductions to verify they cover a complete invariant
  does_not_apply_when:
  - Single-field atomic updates where the invariant is trivially one variable
  - Lock-free structures that use hardware atomics as the synchronisation mechanism
  operational_mapping:
    skill: kernel-concurrency-review
    reference: xv6-subsystem-map
    test_cases: []
- principle_id: pr-005
  statement: 'When reviewing code that acquires multiple locks, verify that acquisition order follows
    the global ordering (e.g., in the filesystem path: directory lock → inode lock → buffer lock → vdisk_lock
    → p->lock) and flag any code path that acquires them in a different order as a potential deadlock.

    '
  derived_from_claims:
  - cl-033
  - cl-034
  confidence: high
  applies_when:
  - Reviewing any code path that holds two or more locks simultaneously
  - Auditing filesystem operations that traverse the lock chain
  does_not_apply_when:
  - Code paths that only ever hold one lock at a time
  - Lock-free or RCU-based designs outside xv6's spinlock model
  operational_mapping:
    skill: kernel-concurrency-review
    reference: xv6-subsystem-map
    test_cases: []
- principle_id: pr-006
  statement: 'When reviewing spinlock acquire/release, verify: (a) push_off is called strictly before
    lk->locked is set, (b) __sync_synchronize() barriers appear in both acquire and release to prevent
    reordering across critical section boundaries, and (c) no spinlock is held across a sleep or blocking
    operation.

    '
  derived_from_claims:
  - cl-035
  - cl-036
  - cl-037
  - cl-038
  confidence: high
  applies_when:
  - Reviewing spinlock acquire/release implementations
  - Auditing any critical section for ordering and barrier correctness
  - Checking interrupt-enable discipline around lock acquisition
  does_not_apply_when:
  - Sleep-lock (acquiresleep/releasesleep) critical sections, which have different rules
  - Hardware atomic operations (amoswap) used outside explicit lock primitives
  operational_mapping:
    skill: kernel-concurrency-review
    reference: xv6-subsystem-map
    test_cases: []
- principle_id: pr-007
  statement: 'When reviewing sleep-lock versus spinlock choice, flag spinlocks used for long-held operations
    (file I/O, disk wait) as a busy-wait hazard; flag sleep-locks used inside interrupt handlers or inside
    spinlock critical sections as a correctness violation because they may yield the CPU in a context
    that forbids it.

    '
  derived_from_claims:
  - cl-038
  confidence: high
  applies_when:
  - Choosing or evaluating lock types for a given critical section
  - Reviewing I/O drivers or any code that may block for disk or device completion
  does_not_apply_when:
  - Very short critical sections where spinning is cheaper than a context switch
  - Architectures with hardware queue locks that change the cost model
  operational_mapping:
    skill: kernel-concurrency-review
    reference: real-world-os-comparisons
    test_cases: []
- principle_id: pr-008
  statement: 'When reviewing sleep/wakeup usage, check: (a) the condition lock is held when checking the
    condition and passed to sleep so it is atomically released on entry — closing the lost-wakeup window;
    (b) sleep is always called inside a loop that re-checks the condition after waking, guarding against
    spurious wakeups.

    '
  derived_from_claims:
  - cl-043
  - cl-044
  - cl-045
  confidence: high
  applies_when:
  - Reviewing any producer/consumer pattern using sleep and wakeup
  - Auditing wait conditions in pipes, disk I/O, process wait, or similar
  does_not_apply_when:
  - Single-waiter patterns where spurious wakeup is structurally impossible
  - Semaphore or futex primitives that provide their own lost-wakeup guarantee
  operational_mapping:
    skill: kernel-concurrency-review
    reference: xv6-subsystem-map
    test_cases: []
- principle_id: pr-009
  statement: 'When reviewing the scheduler and context switch, verify that p->lock is acquired in yield
    (before state change) and released in the scheduler (after stack switch), not in the same thread,
    because p->lock protects invariants that span the swtch boundary; also note the known kill/sleep race
    where kill may set p->killed and call wakeup in the window between the victim''s condition check and
    its sleep call.

    '
  derived_from_claims:
  - cl-040
  - cl-041
  - cl-048
  - cl-049
  confidence: high
  applies_when:
  - Reviewing the yield/scheduler/swtch context-switch path
  - Auditing kill and process termination logic
  does_not_apply_when:
  - Non-preemptive or cooperative-only schedulers without per-CPU scheduler threads
  - Architectures where the swtch boundary is handled by hardware (e.g., coroutine-style switch)
  operational_mapping:
    skill: kernel-concurrency-review
    reference: xv6-subsystem-map
    test_cases: []
- principle_id: pr-010
  statement: 'When reviewing the filesystem, use the seven-layer model (disk, buffer cache, logging, inode,
    directory, pathname, file-descriptor) as the analytical frame; identify which layer a defect or design
    choice belongs to, and verify that each layer only invokes the one immediately below it.

    '
  derived_from_claims:
  - cl-050
  confidence: high
  applies_when:
  - Analysing any filesystem component or bug
  - Explaining how a system call traverses multiple FS layers
  does_not_apply_when:
  - Log-structured or stackless filesystem designs that merge these layers
  operational_mapping:
    skill: filesystem-crash-recovery-review
    reference: xv6-subsystem-map
    test_cases: []
- principle_id: pr-011
  statement: 'When reviewing crash-recovery correctness, verify that every multi-block operation is wrapped
    in a transaction (begin_op/end_op) so write-ahead logging guarantees atomicity: all writes go to the
    log first, the commit record is written last, and recovery replays a complete transaction or discards
    an incomplete one; also verify that log_write absorption (multiple writes to the same block within
    one transaction coalesce to one log slot) is not bypassed.

    '
  derived_from_claims:
  - cl-054
  - cl-056
  - cl-065
  confidence: high
  applies_when:
  - Reviewing any filesystem operation that touches more than one disk block
  - Auditing transaction begin/end discipline for atomicity
  - Evaluating crash-recovery tests or post-crash consistency checks
  does_not_apply_when:
  - Single-block operations where atomicity is guaranteed by the hardware sector write
  - Read-only filesystem operations that do not modify disk state
  operational_mapping:
    skill: filesystem-crash-recovery-review
    reference: xv6-subsystem-map
    test_cases: []
- principle_id: pr-012
  statement: 'When reviewing inode concurrency, verify that all four protection mechanisms are respected:
    icache.lock guards cache membership and ref counts; iget increments ref before releasing icache.lock
    so the inode cannot be evicted between pointer acquisition and locking; ilock acquires the per-inode
    sleep-lock before touching fields; nlink count prevents disk deallocation while directory entries
    exist; note that xv6 does not recover orphaned inodes (nlink==0, ref>0) after a crash — that is a
    known limitation. Also apply the two-level locking pattern check: the coarse set lock (icache.lock)
    must be released before the per-item lock (ip->lock) is held long-term to allow concurrency.

    '
  derived_from_claims:
  - cl-058
  - cl-060
  - cl-061
  - cl-066
  confidence: high
  applies_when:
  - Reviewing inode cache access patterns (iget/ilock/iunlock/iput)
  - Auditing code that manipulates ref counts or nlink counts
  - Checking for correct two-level locking discipline in any xv6 cache
  does_not_apply_when:
  - Direct disk inode access bypassing the inode cache (mkfs tool only)
  - Buffer cache, which uses a different two-level pattern with bcache.lock
  operational_mapping:
    skill: filesystem-crash-recovery-review
    reference: xv6-subsystem-map
    test_cases: []
