# Faithfulness review — Tier 2, evidence-based (authored 2026-06-28).
# Sources: Cockburn, "Writing Effective Use Cases" (2001); Cohn, "User Stories
# Applied" (2004); Jacobson et al., "Use-Case 2.0" (2011). rights_status:
# distillation-only. Scope: every operative profile rule (role, when_to_use,
# when_not_to_use, quality_bar, forbidden_behaviours, outputs.modes,
# minimum_useful_output). Each rule_ref resolves to a profile path. No rule is
# graded stronger than its evidence; no SCOPE_BROADENED/HEDGING_REMOVED/CONTRADICTED
# findings. source_anchors are intentionally omitted; provenance is carried by the
# cited principle IDs (each resolves into principles.yaml -> claims.jsonl -> anchors).

