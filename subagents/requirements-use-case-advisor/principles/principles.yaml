schema_version: principles-v1
principles:
- principle_id: P001
  statement: Provide no single best template; instead match the template density (casual
    vs fully dressed), tolerance, and ceremony — and your evaluation of quality —
    to each project's criticality, size, and communication, choosing project by project
    and knowing the cost of mistakes.
  derived_from_claims:
  - C00004
  - C00037
  - C00038
  - C00039
  - C00040
  - C00041
  - C00042
  - C00043
  - C00044
  - C00123
  - C00199
  - C00210
  - C00238
  - C00273
  - C00274
  - C00275
  - C00276
  confidence: high
  applies_when:
  - the appropriate ceremony and template depend on project criticality, size, and
    internal communication
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P002
  statement: 'Get the design scope clear and label every use case with its scope and
    level: name and broadcast the scope levels (corporate, system, subsystem), distinguish
    business from system scope, and use an in/out list to resolve ambiguity.'
  derived_from_claims:
  - C00007
  - C00011
  - C00059
  - C00060
  - C00061
  - C00062
  - C00063
  - C00064
  - C00065
  - C00164
  - C00224
  - C00225
