  applies_when: []
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P003
  statement: 'Treat the extension conditions as where the most interesting requirements
    live: brainstorm all failures and alternative successes using a failure checklist
    that includes internal failures, then reduce the list by explicit criteria, and
    when in doubt include a condition.'
  derived_from_claims:
  - C00018
  - C00035
  - C00036
  - C00135
  - C00137
  - C00138
  - C00139
  - C00140
  - C00141
  - C00142
  - C00215
  confidence: high
  applies_when: []
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P004
  statement: 'Run elicitation workshops well: get the right people in the room (too
    many beats too few, scheduled via a kick-off), cap sessions at half a workday,
    use a silent scribe, unblock writer''s block with daily-work stories, separate
    role from job title with concrete devices, keep an assumptions list and post use
    cases on the walls, and keep discussion on intentions rather than screens.'
  derived_from_claims:
  - C00261
  - C00262
  - C00263
  - C00264
  - C00265
  - C00267
  - C00268
  - C00269
  - C00270
  - C00271
  - C00272
  confidence: high
  applies_when: []
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P005
  statement: Write each step as a forward-moving succeeding goal in a single sentence
    style — present tense, active voice, simple grammar, the actor visible and clearly
    holding the ball — avoiding the missing-actor and no-real-goal anti-patterns and
    rereading each sentence for the actor's real goal.
  derived_from_claims:
  - C00014
  - C00108
  - C00111
  - C00112
  - C00113
  - C00124
  - C00125
  - C00216
  - C00218
  - C00244
  confidence: high
  applies_when: []
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P006
  statement: 'Prefer writing too little over too much: a readable approximate use
    case is valuable, diminishing returns set in fast (the first draft yields about
    two-thirds of the value and writing costs roughly 100 times reading), and the
    use case mainly serves as a marker to remind the team.'
  derived_from_claims:
  - C00001
  - C00211
  - C00212
  - C00213
  - C00234
  - C00252
  - C00253
  - C00254
  - C00256
  confidence: high
  applies_when: []
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P007
  statement: 'Keep the use case in its text: prefer plain prose over diagrams and
    formal notations (which only augment the text and cut off untrained readers),
    because prose handles complex parallel, optional, and exceptional sequencing best.'
  derived_from_claims:
  - C00003
  - C00130
  - C00131
  - C00132
  - C00133
  - C00134
  - C00240
  - C00241
  - C00250
  confidence: high
  applies_when: []
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P008
  statement: 'Treat every use case as having two exits, success and failure: write
    the Success End Condition and the Failed End Protection against all stakeholders
    before the main scenario, apply their pass/fail tests, and let writing the failure
    protection reveal the logging the main scenario needs.'
  derived_from_claims:
  - C00068
  - C00069
  - C00099
  - C00100
  - C00101
  - C00102
  - C00103
  - C00228
  - C00231
  confidence: high
  applies_when: []
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P009
  statement: Apply use cases equally to business processes, writing the organization
    black-box then white-box; because the business design does not imply the system
    specification (technology is usually only a conduit), prefer writing the business
    without technology and then contextualize it inside the system use case, while
    guarding against business-versus-system level confusion.
  derived_from_claims:
  - C00161
  - C00162
  - C00163
  - C00165
  - C00166
  - C00167
  - C00168
  - C00169
  confidence: high
  applies_when: []
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P010
  statement: Capture the actor's intent (the semantics) rather than the user-interface
    dialog, and keep the user interface out of the requirements entirely — that is
    the UI designer's job and dialog is brittle — using GUI snapshots, screen-flow
    diagrams, and form sketches only as non-requirement aids.
  derived_from_claims:
  - C00015
  - C00115
  - C00116
  - C00188
  - C00189
  - C00190
  - C00237
  - C00242
  confidence: high
  applies_when: []
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P011
  statement: 'Recognise each proxy type''s bias and compensate: the users'' manager
    and development manager have conflicting goals or atypical usage; salespeople
    over-index on the last lost sale but are great conduits to users; domain experts
    suit domain models not workflows; marketing understands markets not users; former
    users must be recent and aligned; trainers/support bias toward trainability/supportability;
    analysts must actually talk to users.'
  derived_from_claims:
  - C00385
  - C00386
  - C00387
  - C00388
  - C00389
  - C00390
  - C00392
  - C00393
  confidence: medium
  applies_when:
  - evaluating a specific user proxy
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P012
  statement: 'Apply the Stakeholders and Interests model: briefly list the stakeholders
    and their interests and use that list as a cheap check that every interest is
    satisfied at success or protected at failure — a check that catches omitted steps
    and otherwise turns up later as change requests.'
  derived_from_claims:
  - C00017
  - C00077
  - C00079
  - C00081
  - C00219
  - C00220
  - C00247
  confidence: high
  applies_when: []
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P013
  statement: Define a use case as the primary actor's goal toward the system's responsibilities
    plus the set of interaction scenarios (both goal-achieving and goal-failing) between
    the system under discussion and its external actors; together the use cases form
    one ever-unfolding story.
  derived_from_claims:
  - C00022
  - C00025
  - C00067
  - C00071
  - C00074
  - C00080
  - C00160
  confidence: high
  applies_when: []
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P014
  statement: 'Use the actor types correctly: name the primary actor as the stakeholder
    whose goal the use case serves, collect secondary actors to identify external
    interfaces (secondary does not mean unimportant), handle time-based triggers,
    and remember an element''s classification is relative to the chosen scope.'
  derived_from_claims:
  - C00045
  - C00047
  - C00048
  - C00049
  - C00050
  - C00226
  - C00246
  confidence: high
  applies_when: []
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P015
  statement: Understand how stories relate to use cases and interaction-design scenarios—a
    story is roughly one scenario and (with its tests) approximates a use case, but
    is smaller-scoped, more transient, less UI-laden, and meant to initiate rather
    than document analysis—and prefer essential use cases when use cases are used.
  derived_from_claims:
  - C00501
  - C00502
  - C00503
  - C00504
  - C00505
  - C00506
  - C00507
  confidence: medium
  applies_when:
  - comparing stories to use cases or scenarios
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P016
  statement: 'Build the release plan by allocating highest-priority stories into iterations
    up to velocity, but hold it loosely: it gives an approximate duration, not a fixed
    date, so use it to set then continually reset expectations as velocity is measured
    and stories re-estimated.'
  derived_from_claims:
  - C00309
  - C00310
  - C00311
  - C00312
  - C00463
  - C00464
  - C00465
  confidence: medium
  applies_when:
  - building or revising a release plan
  - creating and maintaining a release plan
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P017
  statement: Manage writing energy by working breadth-first and from low to high precision
    in staged passes (actors and goals, then the main scenario, then failure conditions,
    then handling), getting the goal list accurate before elaborating, and remembering
    that precision is not accuracy.
  derived_from_claims:
  - C00006
  - C00031
  - C00032
  - C00033
  - C00034
  - C00214
  confidence: high
  applies_when: []
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P018
  statement: Work with three goal levels — user-goal (blue), strategic (white), and
    subfunction (indigo, with black for too-low) — anchoring on the user-goal level
    (one person, one place, one sitting of about 2–20 minutes) and respecting how
    the levels nest.
  derived_from_claims:
  - C00082
  - C00083
  - C00089
  - C00090
  - C00091
  - C00221
  confidence: high
  applies_when: []
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P019
  statement: Adopt the fully dressed template fields and Cockburn's preferred one-column,
    numbered, plain-prose, full-sentence format, while treating format as a project
    choice since all forms carry the same information (a one-paragraph brief is the
    lightest form and scope/level icons are optional).
  derived_from_claims:
  - C00030
  - C00095
  - C00126
  - C00127
  - C00128
  - C00279
  confidence: medium
  applies_when: []
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P020
  statement: Use acceptance tests (not 'the system shall' statements) to record conversation
    details and customer assumptions, treating testing as two steps—jot test notes
    on cards anytime, then turn them into full tests that prove the story is correctly
    and fully done—so tests also define when a story is complete.
  derived_from_claims:
  - C00301
  - C00302
  - C00319
  - C00399
  - C00400
  - C00401
  confidence: medium
  applies_when:
  - recording what a story must do
  - deciding where to record agreed details
  - recording the details a story must satisfy
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P021
  statement: 'Run a story-writing workshop (developers, users, customer) before each
    release as the fastest way to trawl: combine brainstorming with low-fidelity paper
    prototyping of conceptual workflows, walk it depth-first, prompt for missing stories,
    favour quantity over quality without judging ideas, then discard the prototype
    within days.'
  derived_from_claims:
  - C00376
  - C00377
  - C00378
  - C00379
  - C00380
  - C00381
  confidence: medium
  applies_when:
  - generating an initial or release-level set of stories
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P022
  statement: Run user-role modelling as four steps—brainstorm (no discussion), organise
    by spatial overlap, consolidate equivalents and drop unimportant roles, then refine
    with attributes—keeping each role a single individual and people-focused over
    systems.
  derived_from_claims:
  - C00354
  - C00355
  - C00356
  - C00357
  - C00358
  - C00359
  confidence: medium
  applies_when:
  - identifying and refining the project's user roles
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P023
  statement: Prefer use cases and use-case slices over standalone user stories when
    the context needs scalable structure, stronger system view, test-asset management,
    impact analysis, scope control, or missing-functionality detection.
  derived_from_claims:
  - C00600
  - C00636
  - C00637
  - C00639
  - C00640
  - C00641
  confidence: medium
  applies_when:
  - Systems are larger, teams are larger, development is complex, expert access is
    limited, escaped requirements errors are severe, or future complexity may grow.
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P024
  statement: Brainstorm the actors (human and non-human) as a structured way to find
    all the goals — it is the goals, not the actor names, that matter — and err toward
    over-listing actors early because missing one is far costlier than having too
    many.
  derived_from_claims:
  - C00008
  - C00010
  - C00051
  - C00053
  - C00266
  confidence: high
  applies_when: []
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P025
  statement: Treat the system under discussion as an unopened black box whenever use
    cases serve as functional requirements, and open it into a white-box use case
    only to document how its internal parts deliver the externally visible behavior.
  derived_from_claims:
  - C00023
  - C00046
  - C00170
  - C00235
  - C00257
  confidence: high
  applies_when:
  - the use case is a functional requirements specification
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P026
  statement: Put into a precondition only what the system can guarantee and will never
    re-check, do not overstate it with conditions that are not requirements or cannot
    be enforced, detect precondition errors, and record merely-usual context in the
    Context-of-use section instead.
  derived_from_claims:
  - C00013
  - C00097
  - C00098
  - C00229
  - C00230
  confidence: high
  applies_when: []
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P027
  statement: Keep the main success scenario short — about 3 to 11 steps, typically
    3 to 8 — and when it runs long, merge steps and raise the goal level by asking
    why the actor is doing each step.
  derived_from_claims:
  - C00016
  - C00109
  - C00110
  - C00223
  - C00243
  confidence: high
  applies_when:
  - the length guideline applies to the main success scenario
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P028
  statement: Write each failure-handling scenario fragment in the same style as the
    main scenario, starting at the named step; it ends one of three ways, usually
    needs no explicit 'go to step', and any new validation it reveals belongs back
    in the main success scenario.
  derived_from_claims:
  - C00019
  - C00020
  - C00146
  - C00147
  - C00148
  confidence: high
  applies_when: []
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P029
  statement: Manage a failure within a failure by indentation, delay breaking a fragment
    into its own use case (which costs tracking and maintenance) until about three
    pages or four indent levels, handle the failure of every called sub-use case,
    and rely on failure roll-up to avoid a scenario explosion.
  derived_from_claims:
  - C00021
  - C00149
  - C00150
  - C00152
  - C00156
  confidence: high
  applies_when:
  - break out a sub-use case once inline handling exceeds about three pages or four
    indent levels
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P030
  statement: Recognize that use cases are only the functional portion (about chapter
    two, roughly a quarter) of the requirements and act as a hub linking the rest;
    do not force non-interaction requirements into them, and attach each use case's
    secondary information in a sortable table.
  derived_from_claims:
  - C00028
  - C00029
  - C00171
  - C00172
  - C00173
  confidence: high
  applies_when: []
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P031
  statement: Write at least one wide corporate or strategic use case by finding the
    outermost primary actor; these few high-level use cases serve as context and index
    and pay for themselves, but the functional requirements still reside in the blue
    (user-goal) use cases.
  derived_from_claims:
  - C00066
  - C00086
  - C00087
  - C00088
  - C00249
  confidence: high
  applies_when: []
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P032
  statement: Treat step order as a partial ordering rather than a strict sequence,
    and express repetition, arbitrary ordering, optional timing, and cross-actor control
    entirely in plain prose and idioms rather than in any loop or formal notation.
  derived_from_claims:
  - C00070
  - C00073
  - C00117
  - C00118
  - C00119
  confidence: high
  applies_when: []
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P033
  statement: Write each extension condition as a short 'what is different' phrase
    in a grammar distinct from action steps, apply the numbering conventions (letter
    and colon, step ranges, asterisk for any-time), and flatten loops into named conditions
    rather than nesting them.
  derived_from_claims:
  - C00143
  - C00144
  - C00145
  - C00217
  - C00255
  confidence: high
  applies_when: []
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P034
  statement: Use the 'includes' relation — naming the sub-use case in a step, the
    familiar subroutine call — as the default link between use cases, reserving extends
    and generalizes for rare exceptions, because writing readable text makes the relations
    come naturally.
  derived_from_claims:
  - C00155
  - C00179
  - C00180
  - C00191
  - C00232
  confidence: high
  applies_when: []
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P035
  statement: Reserve standalone extension use cases for the rare case of many asynchronous
    services that leave the main flow undisturbed (the base use case stays ignorant
    of them), and treat UML extension points as a mistake that must never be exposed
    in a diagram.
  derived_from_claims:
  - C00157
  - C00158
  - C00181
  - C00182
  - C00183
  confidence: high
  applies_when: []
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P036
  statement: Use the use cases downstream as ready design scenarios (especially with
    responsibility-based CRC design) and as a ready-made functional test suite (at
    least one test per extension, derived from the stakeholders); derive the development
    task list from them informally on projects up to about fifty people, and estimate
    with algorithmic complexity, infrastructure, and staff capability in mind (a rough
    yardstick of about eight use cases per programmer-year).
  derived_from_claims:
  - C00192
  - C00193
  - C00194
  - C00197
  - C00277
  confidence: medium
  applies_when: []
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P037
  statement: Treat software requirements as a shared communication problem and prevent
    either the business or the technical side from dominating; make resource allocation
    a jointly-owned concern.
  derived_from_claims:
  - C00280
  - C00281
  - C00282
  - C00283
  - C00284
  confidence: medium
  applies_when:
  - framing how a team gathers and negotiates requirements
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P038
  statement: Model every user story as Card, Conversation, and Confirmation—just enough
    written text to remember, estimate, and plan, with details in conversation and
    tests.
  derived_from_claims:
  - C00289
  - C00291
  - C00292
  - C00293
  - C00300
  confidence: medium
  applies_when:
  - writing or reviewing a user story
  - writing or annotating story cards
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P039
  statement: Split a compound epic into end-to-end constituent stories (grouping or
    splitting along data boundaries) without over-splitting; split a complex/uncertain
    epic into a timeboxed investigative spike plus a development story, ideally in
    separate iterations, so research can be prioritised on its own.
  derived_from_claims:
  - C00340
  - C00341
  - C00342
  - C00343
  - C00344
  confidence: medium
  applies_when:
  - breaking up an epic that is too large
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P040
  statement: Ensure every story is estimatable; when it is not, fix the specific cause—discuss
    with the customer for missing domain knowledge, run a timeboxed spike for missing
    technical knowledge, or disaggregate a too-big story.
  derived_from_claims:
  - C00333
  - C00334
  - C00335
  - C00336
  - C00337
  confidence: medium
  applies_when:
  - a story cannot be estimated
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P041
  statement: 'Do not force every requirement into a story: handle non-functional requirements
    as ''Constraint'' cards with an automated daily compliance test where feasible,
    and express more complex needs in whatever additional format (e.g. a data dictionary)
    suits them.'
  derived_from_claims:
  - C00419
  - C00421
  - C00557
  - C00558
  - C00559
  confidence: medium
  applies_when:
  - handling constraints and avoiding premature UI detail
  - expressing non-functional or hard-to-storyify requirements
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P042
  statement: Write acceptance tests only while they clarify the story (no redundant
    cases), let unit tests cover low-level cases, run all prior iterations' acceptance
    tests with the customer at least each iteration, and automate them—using tools
    like FIT/FitNesse—to contain the growing cost.
  derived_from_claims:
  - C00406
  - C00407
  - C00408
  - C00409
  - C00410
  confidence: medium
  applies_when:
  - managing the acceptance-test suite over time
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
