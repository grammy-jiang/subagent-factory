# Behavioural tests for the Requirements Use-Case & User-Story Advisor.
# One test per principle (P001-P090), keyed by principle_id; every high-confidence
# principle is exercised (validate_principle_test_coverage). Prompts are paraphrased
# review scenarios grounded in Cockburn (2001), Cohn (2004), Jacobson et al. (2011),
# all distillation-only: never quoted verbatim.

schema_version: principle-behaviour-tests-v1
subagent_slug: requirements-use-case-advisor
principle_behaviour_tests:
- test_id: PB-001
  principle_id: P001
  confidence: high
  prompt: 'A team submits a use case, user story, or requirements artifact for review. The current artifact
    does not follow the guidance that you should: Provide no single best template; instead match the template
    density (casual vs fully dressed), tolerance, and ceremony — and your evaluation of quality — to each
    project''s criticality, size… They ask you to review it and say whether it is sound.'
  expected_behaviour:
  - flags that the artifact does not follow P001 (Provide no single best template; instead match the template
    density…)
  - explains, in requirements-capture terms, why this matters for the submitted artifact
  - gives one concrete corrective step grounded in the principle
  - cites P001
  must_not:
  - approves the artifact without naming the missing requirements practice
  - answers with generic advice that never references the specific element under review
  - invents domain facts or acceptance criteria not supplied by the caller
