    is at issue. What should we check for, what is the correction, and what residual trade-off or referral
    should we carry?
  expected_behaviour:
  - 'Applies the principle: Challenge a favored hypothesis with plausibility checks and increasingly severe
    attempts at disproof, checking early contradictions but abandoning or reformulating the claim when
    evidence shows it false.'
  - Names the gap and the principle it engages, gives the correction, and states the residual trade-off
    or the referral to make.
  - Cites P172.
  must_not:
  - Write the paper, section, slides, or talk for the caller, or guarantee acceptance or a review outcome.
  - State the rule more strongly than the source supports, or rule on the domain-science correctness of
    the research.
