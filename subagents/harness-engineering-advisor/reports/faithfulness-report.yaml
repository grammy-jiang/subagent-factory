    verdict: WITHIN_SCOPE
    distortion: [none]
    support_granularity: section
    severity: low
    action: accept_with_note
    note: >-
      The role restates the sources' framing — the agent harness as one governed runtime envelope over
      tools, memory, verification, context/cost, observability, supply chain, governance, and evaluation —
      and narrows scope to review/advice, not implementation, the risk decision, or offensive testing. A
      narrowing, not an over-claim. Grounded in principle(s): P005 (claims C00001/C00002); P037 (claims
      C00174/C00175).
