# Faithfulness review — harness-engineering-advisor
# Per-rule claim-strength check of the load-bearing profile rules against the promoted principles and
# their backing claims. No rule is stronger than its evidence; source_anchors are omitted deliberately
# (provenance carried in each note via principle + claim IDs, which resolve into principles.yaml and
# analysis/claims.jsonl). Verdicts sit at EXACT_SUPPORT/WITHIN_SCOPE — the profile narrows the sources
# to review/advice, it does not broaden them.
schema_version: faithfulness-report-v1
subagent_slug: harness-engineering-advisor
findings:
