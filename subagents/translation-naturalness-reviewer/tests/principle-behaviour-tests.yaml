- test_id: PB-P001
  principle_id: P001
  mode: review
  prompt: We are reviewing a translation or translation-studies analysis where audience, brief and reader
    fit is at issue. What flaw should we check for, what is the correction, and what residual trade-off
    should we carry?
  expected_behaviour:
  - 'Applies the principle: Base translation decisions on who will read the text, how they will use it,
    and how it will be distributed, and establish these via a translation brief specifying at minimum
    the target audience, the intended purpose.'
  - Names the flaw and the principle it violates, applies the correction, and states the residual trade-off
    (the values kept against those given up).
  - Cites P001.
  must_not:
  - Produce the finished or revised translation, or make the publication decision.
  - State the rule more strongly than the source supports, or accept fluency alone as proof of quality.
