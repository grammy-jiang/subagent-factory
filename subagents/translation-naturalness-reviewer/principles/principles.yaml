- principle_id: P081
  statement: 'Do not translate from a position of monolingual superiority: the native''s
    withholding (Friday''s erased rebus in Coetzee''s Foe, the transmission marked
    ''not a story to pass on'' in Morrison''s Beloved) figures the limit of translation,
    so untranslatability can be a marked and honored condition rather than a failure
    to be overcome by the confident accessibility of the powerful; the too-easy accessibility
    of translation as a transfer of substance reduces its object, so attend instead
    to the rhetoric that points to the limits of translation in a marginalized speaker''s
    use of the dominant language, remembering that reading is itself a form of translation
    in which the post-colonial reader-as-translator reads a dominant text critically
    — using what is useful, discriminating on the terrain of the original, and noticing
    where the text swerves or keeps its argument domestic.'
