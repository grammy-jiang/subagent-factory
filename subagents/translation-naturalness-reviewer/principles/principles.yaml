- principle_id: P024
  statement: Beware that over-clarifying a culture-specific detail to help the target
    reader can destroy the indirect, figurative meaning it carries across a text (Pinter's
    Hebrew translator spelling out a casserole's ingredients lost the running metaphor
    that carries the play's marital-triangle subtext), and recognize that translation
    reverses the residual ambiguity of natural conversation — what is said becoming
    obvious while what is meant becomes vague; study cohesion shifts validly by separating
    obligatory choices dictated by the two grammars from optional stylistic ones,
    since only optional shifts are evidence of a translation trend, and study translation
    as a process that operates on texts rather than words or sentences (so that its
    products belong to discourse analysis) and as an act of communication whose processes,
    products, and effects must be validated empirically, ideally by psycholinguistic
    comparison of how source-language and target-language readers actually interpret
    the text.
