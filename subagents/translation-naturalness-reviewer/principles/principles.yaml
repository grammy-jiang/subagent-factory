- principle_id: P014
  statement: Analyse an audiovisual text across its signifying codes (Chaume's ten,
    only one linguistic, four acoustic and six visual) and through multimodal transcription
    of frames, shots, and phases with a metafunctional interpretation, remembering
    that the linguistic code is written to be spoken as if not written and demands
    an oral register, that its problems are shared with other translation types, that
    visual and colour codes constrain choices so an unfamiliar symbol may need explanation
    and coherence with the image must be kept, and that subtitling is an overt, vulnerable
    translation open to a viewer's scrutiny while the subtitler is often uncredited.
