schema_version: principles-v1
principles:
- principle_id: P001
  statement: Base translation decisions on who will read the text, how they will use
    it, and how it will be distributed, and establish these via a translation brief
    specifying at minimum the target audience, the intended purpose (information vs
    publication), and any stylistic or terminological requirements.
  derived_from_claims:
  - C00662
  - C00663
  - C00664
  - C00665
  - C00666
  - C00667
  - C01530
  - C01533
  - C01534
  confidence: high
  applies_when:
  - Starting a technical-translation or localization project.
  - starting any translation project
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P002
  statement: 'Assess and supply the target reader''s background knowledge deliberately:
    decide whether to explain a reference by the reader''s assumed familiarity and
    your licence to intervene, remembering that writers and translators routinely
    misjudge reader access and the translator is often as ignorant as the reader,
    so research when feasible; build information essential to an implicature into
    the body of the text rather than a footnote, and expand or delete background to
    match what the reader is assumed to know.'
  derived_from_claims:
  - C01488
  - C01489
  - C01490
  - C01491
  - C01492
  - C01494
  - C01845
  - C01848
  - C01854
  confidence: high
  applies_when:
  - deciding how much background to make explicit
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P003
  statement: Be a good technical writer in order to be a good technical translator
    — their principal stylistic goals coincide — and adopt technical writers' writing
    strategies and audience-analysis methods, while accepting that information design,
    typography, and layout are usually beyond the translator's remit.
  derived_from_claims:
  - C00631
  - C00644
  - C00646
  - C00650
  - C00651
  - C00652
  - C01554
  - C01555
  confidence: high
  applies_when:
  - A translator is producing or revising technical documentation for end users.
  - translating technical documentation
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P004
  statement: Test a rendering's naturalness against three areas at once — the receptor
    language and culture as a whole, the context of the particular message, and the
    receptor audience — while recognizing that grammatical adaptations are made more
    readily than lexical ones (grammar is dictated by obligatory target structures
    whereas lexis offers many alternatives with no rules) and that lexical items fall
    into three difficulty levels, from ready parallels through culturally-different-but-similar-function
    terms to cultural specialties, the last of which can rarely shed all foreign associations
    because no translation across a wide cultural gap eliminates every trace of the
    foreign setting.
  derived_from_claims:
  - C00076
  - C00077
  - C00078
  - C00079
  - C02367
  - C02368
  - C02369
  confidence: high
  applies_when:
  - Selecting wording where source grammar or vocabulary does not map cleanly into
    the receptor language
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P005
  statement: Treat translation as inferential communication, making the target optimally
    relevant so the receiver derives adequate contextual effects without unnecessary
    effort by supplying communicative clues, and decide whether and how to communicate
    the informative intention, whether to translate descriptively or interpretively,
    and the degree of resemblance to the source from the receiver's cognitive environment,
    since a translation can fail when it does not match the audience's expectations
    for form or prestige.
  derived_from_claims:
  - C01569
  - C01570
  - C01571
  - C01572
  - C01925
  - C01926
  - C01927
  confidence: high
  applies_when:
  - any translation decision that depends on the reader
  operational_mapping:
    profile_rule: true
- principle_id: P006
  statement: 'Use Toury''s structure of translational norms: preliminary norms (with
    logical and chronological precedence) govern translation policy — the non-random
    set of factors determining which text-types and texts a culture imports at a given
    time — and directness, the tolerance for indirect translation through a mediating
    language (permitted, prohibited, tolerated, or preferred, and whether the mediation
    is marked, ignored, camouflaged, or denied); operational norms govern the act
    itself, subdividing into matricial norms (the existence, fullness, location, and
    segmentation of the target material, hence omissions, additions, and relocations)
    and textual-linguistic norms (the selection of the linguistic material).'
  derived_from_claims:
  - C02027
  - C02028
  - C02029
  - C02431
  - C02432
  - C02433
  - C02434
  confidence: high
  applies_when: []
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P007
  statement: Read a translation through Toury's initial norm — the translator's basic
    choice between subjecting himself to the source text and its norms (pursuing an
    adequate translation, close to the source but liable to clash with target conventions)
    or to the target culture's norms (yielding acceptability at the price of shifts
    from the source), a priority that is logical and explanatory, not chronological
    — and treat shifts from the source as a true universal of translation that occur
    even in the most adequacy-oriented work, where both the obligatory shifts and
    the more frequent non-obligatory ones are norm-governed rather than idiosyncratic.
  derived_from_claims:
  - C01527
  - C02429
  - C02430
  confidence: high
  applies_when:
  - evaluating or producing any sci-tech translation
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
