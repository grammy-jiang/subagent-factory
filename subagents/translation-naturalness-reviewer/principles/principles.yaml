- principle_id: P130
  statement: Understand that under its severe constraints the subtitler makes coherence
    and easy readability for the mass audience the overriding priority and the interpersonal
    pragmatics of the on-screen characters only a second priority, producing a systematic
    loss of the indicators by which interlocutors accommodate each other's face-wants
    — so assess subtitling not by phrase-by-phrase comparison but by whether there
    is a consistent pattern in the kinds of values omitted — and locate interpersonal
    meaning not in the propositional content of an exchange but in what is implicated
    and in fine textural detail (lexical choice, imperative versus interrogative form,
    unfinished utterances, intonation, and ambiguity of reference), which is the best
    evidence of how a conflictual relationship is being managed.
