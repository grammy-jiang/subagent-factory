schema_version: golden-tests-v1
subagent_slug: k6-load-test-scripting-advisor
generated_at: "2026-06-12T00:00:00+00:00"

golden_tests:
  - test_id: GT-001
    description: >-
      Positive routing — advise mode: shape a ramping load profile in the k6
      options object.
    prompt: >-
      In k6 I want to ramp up to 100 virtual users over 1 minute, hold for 2
      minutes, then ramp down to 0 over 1 minute. How do I express that in the
      options object, and what is the difference between vus and stages?
    expected_route: invoke
    expected_mode: advise
    must_ask_for: []
    minimum_output: >-
      Shows a stages array with three entries (duration/target pairs) inside the
      options object; explains that target sets the VU count to ramp up or down
      to for each stage, while vus sets a fixed concurrent-user count; notes
      defaults (vus 1, iterations 1). Grounded in principle k6-p004 (stages
      ramp VUs toward a target over a duration, anchors h0012/h0016) and
      source k6-guideline-20260612112658.
    must_not_do:
      - "Invent k6 option names or executor fields not in the source"
      - "Recommend another load-testing tool"
      - "State performance numbers as authoritative limits"

  - test_id: GT-002
    description: >-
      Positive routing — compare mode: checks vs thresholds for pass/fail.
    prompt: >-
      In k6, should I use a check or a threshold to make my test fail when p95
      response time goes above 500ms? What is the difference between the two?
    expected_route: invoke
    expected_mode: compare
    must_ask_for: []
    minimum_output: >-
      Contrasts checks and thresholds: a failed check validates a condition but
      does not halt or fail the run (principle k6-p001, anchor h0022), whereas
      a threshold (e.g. http_req_duration ['p(95)<500']) ends the test in a
      failed status when unmet (principle k6-p002, anchor h0027); recommends a
      threshold for the pass/fail requirement; distinguishes the two per
      principle k6-p003. Source k6-guideline-20260612112658.
    must_not_do:
      - "Claim a failed check stops execution"
      - "Invent threshold syntax not shown in the source"
      - "Compare k6 to other tools"

  - test_id: GT-003
    description: >-
      Positive routing — advise mode: which metric type for a measurement.
    prompt: >-
      I want to track the error rate and the response-time distribution in my k6
      test. Which built-in metric types do those map to?
    expected_route: invoke
    expected_mode: advise
    must_ask_for: []
    minimum_output: >-
      Maps error rate to a Rate (tracks how often a non-zero value occurs,
      principle k6-p007, anchor h0026) and names http_req_failed as the primary
      error-rate metric (principle k6-p005); maps response-time distribution to
      a Trend (computes statistics such as mean, median, or percentile) and
      names http_req_duration as the primary response-time metric (principle
      k6-p005); notes Counters sum values and Gauges track
      smallest/largest/latest. Source k6-guideline-20260612112658.
    must_not_do:
      - "Invent metric names not in the source"
      - "Assign the wrong metric type to a measurement"
      - "Claim metrics not documented in the cheat sheet"

negative_routing_tests:
  - test_id: NR-001
    description: >-
      Negative routing — cross-tool comparison is out of scope for a k6-only
      source.
    prompt: >-
      Should we use k6 or Gatling for our load tests? Which one is faster and
      easier to maintain for a large suite?
    expected_route: do_not_invoke
    expected_mode: null
    must_ask_for: []
    minimum_output: >-
      Declines to compare k6 against other tools; explains the source is a
      k6-only cheat sheet and offers no cross-tool comparison (anchor h0062,
      forbidden_behaviours item 2); optionally points to neutral tool-selection
      guidance elsewhere.
    must_not_do:
      - "Recommend Gatling or any non-k6 tool"
      - "Fabricate a performance or maintainability comparison"
      - "Proceed as if cross-tool data were in the source"

missing_context_tests:
  - test_id: MC-001
    description: >-
      Missing required input — no script fragment or load behaviour provided.
    prompt: >-
      Can you help me fix my k6 thresholds?
    expected_route: invoke
    expected_mode: advise
    must_ask_for:
      - "The relevant k6 script or options fragment (the thresholds block) under discussion"
      - "The desired pass/fail behaviour or metric and target to express"
    minimum_output: >-
      Clear statement that the threshold configuration and the intended pass/fail
      criteria are needed before advising (principle k6-p002 applies when caller
      wants a non-zero exit code on poor performance; required input per Q5 anchors).
    must_not_do:
      - "Proceed as if a script fragment was provided"
      - "Hallucinate the caller's threshold values"
