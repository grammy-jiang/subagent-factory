  must_not_do:
  - Answer as if the request were in scope when it is not
- test_id: NR-008
  prompt: A single default scenario with the stages shortcut is sufficient for the caller's load shape.
    Can you handle this for us?
  principle_coverage:
  - k6-p008
  expected_route: do_not_invoke
  must_not_do:
  - Answer as if the request were in scope when it is not
