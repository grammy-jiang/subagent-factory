schema_version: golden-tests-v1
subagent_slug: k6-load-test-scripting-advisor
generated_at: '2026-06-14'
golden_tests:
- test_id: GT-001
  prompt: The caller asks whether a failing condition will stop the k6 run. What do you advise, and why?
  principle_coverage:
  - k6-p001
  expected_route: invoke
  minimum_output: Checks validate response conditions during a k6 run but never halt or fail the test;
    a failed check is recorded but execution continues regardless
- test_id: GT-002
  prompt: The caller wants to make the k6 run return a non-zero exit code on poor performance. What do
    you advise, and why?
  principle_coverage:
  - k6-p002
  expected_route: invoke
  minimum_output: Thresholds define pass/fail criteria against k6 metrics; when a threshold condition
    is not met the test ends with a failed status
- test_id: GT-003
  prompt: The caller must choose between checks and thresholds for a requirement. What do you advise,
    and why?
  principle_coverage:
  - k6-p003
  expected_route: invoke
  minimum_output: 'Checks and thresholds serve distinct purposes that must not be conflated: checks validate
    response conditions and never stop the run, whereas thresholds set pass/fail criteria and cause a
    failed test status when unmet'
- test_id: GT-004
  prompt: The caller wants to express a ramp-up, sustain, or ramp-down load shape. What do you advise,
    and why?
  principle_coverage:
  - k6-p004
  expected_route: invoke
  minimum_output: Stages ramp virtual users toward a target count over a specified duration, allowing
    realistic load profiles with ramp-up, sustain, and ramp-down phases; stages is a shortcut for the
    ramping-vus executor
- test_id: GT-005
  prompt: The caller is writing threshold expressions for response time or error rate. What do you advise,
    and why?
  principle_coverage:
  - k6-p005
  expected_route: invoke
  minimum_output: The http_req_duration metric measures total HTTP request duration from send to response
    receipt; the http_req_failed metric counts requests that returned non-2xx or non-3xx status codes.
    These are the primary built-in metrics for expressing performance and reliability thresholds
- test_id: GT-006
  prompt: The caller is interpreting k6 percentile output or writing p(95) threshold expressions. What
    do you advise, and why?
  principle_coverage:
  - k6-p006
  expected_route: invoke
  minimum_output: p95 (the 95th percentile response time) represents the value below which 95% of all
    requests fall and is the conventional threshold anchor for HTTP response-time SLOs; p90 is the analogous
    measure at the 90th percentile. Lower values indicate better performance
- test_id: GT-007
  prompt: The caller asks which metric type applies to a measurement such as response time, error rate,
    or request count. What do you advise, and why?
  principle_coverage:
  - k6-p007
  expected_route: invoke
  minimum_output: 'k6 metrics fall into four types: Counters (sum values), Gauges (track smallest, largest,
    and latest values), Rates (track how frequently a non-zero value occurs), and Trends (compute statistics
    such as mean, median, or percentile). Choosing the correct type is necessary to interpret aggregated
    output'
- test_id: GT-008
  prompt: The caller is defining multiple independent user journeys in one k6 test. What do you advise,
    and why?
  principle_coverage:
  - k6-p008
  expected_route: invoke
  minimum_output: Scenarios configure distinct load patterns within a single k6 script; each scenario
    executes an independent JavaScript function in parallel, and the ramping-vus executor is the underlying
    mechanism for gradual VU ramp-up or ramp-down within a scenario
negative_routing_tests:
- test_id: NR-001
  prompt: The caller asks about thresholds, which do determine pass/fail status. Can you handle this for
    us?
  principle_coverage:
  - k6-p001
  expected_route: do_not_invoke
  must_not_do:
  - Answer as if the request were in scope when it is not
- test_id: NR-002
  prompt: The caller only wants to observe response conditions without affecting run outcome (use checks
    instead). Can you handle this for us?
  principle_coverage:
  - k6-p002
  expected_route: do_not_invoke
  must_not_do:
  - Answer as if the request were in scope when it is not
- test_id: NR-003
  prompt: Checks and thresholds are being used together for complementary purposes (validating individual
    responses while also gating overall run outcome). Can you handle this for us?
  principle_coverage:
  - k6-p003
  expected_route: do_not_invoke
  must_not_do:
  - Answer as if the request were in scope when it is not
