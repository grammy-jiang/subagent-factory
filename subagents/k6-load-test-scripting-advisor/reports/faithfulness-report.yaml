schema_version: faithfulness-report-v1
subagent_slug: k6-load-test-scripting-advisor
findings:

# ── quality_bar ──────────────────────────────────────────────────────────────

- rule_ref: quality_bar[0]
  triplet:
    head: quality_bar[0]
    relation: asserts
    tail: >-
      target ramps VUs up or down over a stage; iterations is the repeat count;
      a failed threshold ends the test in a failed status; a failed check does
      not halt execution
  verdict: EXACT_SUPPORT
  distortion:
    - none
  source_anchors:
    - k6-guideline-20260612112658-h0016
    - k6-guideline-20260612112658-h0008
    - k6-guideline-20260612112658-h0027
    - k6-guideline-20260612112658-h0022
  support_granularity: section
  severity: low
  action: accept_with_note
  note: >-
    h0016 (Section 6 Target): "specifies the number of virtual users to ramp
    up or down to for a specific period." h0008 (Section 3 Iterations): "number
    of times a scenario or set of actions is repeated." h0027 (Section 11
    Thresholds): "test finishes with a failed status" when threshold is unmet.
    h0022 (Section 9 Checks): "failed test case does not halt the execution."
    All four sub-claims are exact matches to source passages.

- rule_ref: quality_bar[1]
  triplet:
    head: quality_bar[1]
    relation: asserts
    tail: >-
      Threshold guidance ties a metric to a pass/fail condition; checks only
      validate responses and do not stop the run; thresholds set the pass/fail
      outcome and cause a non-zero exit code when unmet
  verdict: WITHIN_SCOPE
  distortion:
    - none
  source_anchors:
    - k6-guideline-20260612112658-h0027
    - k6-guideline-20260612112658-h0022
  support_granularity: section
  severity: low
  action: accept_with_note
  note: >-
    h0027 defines thresholds as predefined conditions for pass/fail based on
    specific metrics; "test finishes with a failed status" when unmet. The
    "non-zero exit code" inference is technically correct (a failed k6 run
    exits non-zero) and is within scope of the source's pass/fail framing.
    h0022 defines checks as verifying "conditions or expectations in the
    response" with "failed test case does not halt the execution." The phrase
    "only validate responses" is a slight narrowing but equivalent to the
    source's HTTP-response-validation examples. Rule is within scope.

- rule_ref: quality_bar[2]
  triplet:
    head: quality_bar[2]
    relation: asserts
    tail: >-
      Counters sum values; Gauges track smallest/largest/latest; Rates track
      how often a non-zero value occurs; Trends compute statistics such as mean
      or percentile; http_req_duration and http_req_failed are identified as
      the primary built-in metrics
  verdict: SCOPE_BROADENED
  distortion:
    - scope_broadened
  source_anchors:
    - k6-guideline-20260612112658-h0026
    - k6-guideline-20260612112658-h0031
    - k6-guideline-20260612112658-h0032
  support_granularity: section
  severity: medium
  action: add_condition
  note: >-
    The four metric types are directly supported by h0026. However, the rule
    calls http_req_duration and http_req_failed "the primary built-in metrics"
    — the source at h0031 and h0032 defines each as individual metrics used in
    threshold examples (h0028/c0029) but never labels them "primary." The source
    at h0026 states k6 provides "various built-in metrics such as response time,
    throughput, error rate, and more," implying a broader set without ranking.
    The "primary" label is a scope broadening beyond the source. Recommend
    replacing "primary" with "two commonly used built-in metrics shown in the
    threshold example" or similar hedged phrasing.

- rule_ref: quality_bar[3]
  triplet:
    head: quality_bar[3]
    relation: asserts
    tail: >-
      Advice stays within what the cheat sheet documents; any gap in source
      coverage is stated rather than filled with invented k6 behaviour, option
      names, or numbers
  verdict: WITHIN_SCOPE
  distortion:
    - none
  source_anchors:
    - k6-guideline-20260612112658-h0000
  support_granularity: section
  severity: low
  action: accept_with_note
  note: >-
    This is a procedural quality constraint, not a factual claim about k6. It
    is grounded in the source's own framing at h0000: "I will cover the most
    used terms and terminologies used in K6." The cheat-sheet self-declares
    limited scope; constraining the advisor to that scope is a valid inference.
    No over-claim.

# ── forbidden_behaviours ─────────────────────────────────────────────────────

- rule_ref: forbidden_behaviours[0]
  triplet:
    head: forbidden_behaviours[0]
    relation: forbids
    tail: >-
      Stating k6 behaviour, metric semantics, executor options, or option values
      not in the source cheat sheet
  verdict: WITHIN_SCOPE
  distortion:
    - none
  source_anchors:
    - k6-guideline-20260612112658-h0000
    - k6-guideline-20260612112658-h0062
  support_granularity: section
  severity: low
  action: accept_with_note
  note: >-
    h0000 presents the cheat sheet as covering "the most used terms and
    terminologies used in K6" — a limited-scope framing. h0062 (Conclusion)
    states "above-shared list is the most commonly used terms in K6," confirming
    the source does not claim comprehensiveness. The constraint not to invent
    behaviour outside this scope is a valid safety boundary rule. No over-claim.

- rule_ref: forbidden_behaviours[1]
  triplet:
    head: forbidden_behaviours[1]
    relation: forbids
    tail: Recommending or comparing other load-testing tools
  verdict: WITHIN_SCOPE
  distortion:
    - none
  source_anchors:
    - k6-guideline-20260612112658-h0000
    - k6-guideline-20260612112658-h0062
  support_granularity: section
  severity: low
  action: accept_with_note
  note: >-
    h0000 briefly notes k6 "distinguished it from other tools in the market"
    but provides no comparative analysis. The source is entirely k6-focused.
    h0062 concludes with k6-only scope. The prohibition on cross-tool
    comparison is a valid scope inference. No over-claim.

- rule_ref: forbidden_behaviours[2]
  triplet:
    head: forbidden_behaviours[2]
    relation: forbids
    tail: >-
      Presenting threshold values or pass/fail targets as authoritative limits;
      they are caller-chosen targets, not source-prescribed numbers
  verdict: WITHIN_SCOPE
  distortion:
    - none
  source_anchors:
    - k6-guideline-20260612112658-h0027
    - k6-guideline-20260612112658-h0028
    - k6-guideline-20260612112658-c0029
  support_granularity: section
  severity: low
  action: accept_with_note
  note: >-
    h0027 (Section 11) presents threshold values as examples and states "They
    allow you to set performance targets and define acceptable levels for
    metrics" — treating them as user-defined. h0028/c0029 shows p(95)<500 and
    rate<0.1 as illustrative examples in a code block. The source never mandates
    specific numbers; the "caller-chosen" framing is a valid inference from the
    source's "you can create thresholds for any combination" language. No
    over-claim.

