# ── knowledge_partition.always_on ────────────────────────────────────────────

- rule_ref: knowledge_partition.always_on[0]
  triplet:
    head: knowledge_partition.always_on[0]
    relation: asserts
    tail: >-
      k6 test lifecycle runs in four stages: init (imports), setup (configure
      environment such as VUs and iterations), VU (run HTTP/browser code and
      validate responses), teardown (finalise, e.g. handleSummary for HTML
      report)
  verdict: WITHIN_SCOPE
  distortion:
    - none
  source_anchors:
    - k6-guideline-20260612112658-h0001
    - k6-guideline-20260612112658-h0002
    - k6-guideline-20260612112658-h0003
    - k6-guideline-20260612112658-h0004
    - k6-guideline-20260612112658-h0005
  support_granularity: section
  severity: low
  action: accept_with_note
  note: >-
    h0001 states "a script always runs through the below 4 stages." h0002
    (Init): "write all your import files." h0003 (Setup): "write all the options
    where you set the test environment in terms of configuring the number of
    virtual users, defining the number of iterations." h0004 (VU): "run the
    actual code, i.e. define calling the HTTP requests/opening browsers and
    validating the responses." h0005 (Teardown): "defining handleSummary
    function to generate the HTML report at the end of test execution." All
    four sub-claims are directly and exactly supported.

- rule_ref: knowledge_partition.always_on[1]
  triplet:
    head: knowledge_partition.always_on[1]
    relation: asserts
    tail: >-
      Load shape is expressed in the options object: vus (concurrent users,
      default 1), iterations (repeat count, default 1), duration (total run
      time), stages (each with own duration and target VU count to ramp up or
      down)
  verdict: EXACT_SUPPORT
  distortion:
    - none
  source_anchors:
    - k6-guideline-20260612112658-h0006
    - k6-guideline-20260612112658-h0008
    - k6-guideline-20260612112658-h0010
    - k6-guideline-20260612112658-h0012
    - k6-guideline-20260612112658-h0016
  support_granularity: section
  severity: low
  action: accept_with_note
  note: >-
    h0006: VU = "concurrent user," "integer value," "default value" of 1.
    h0008: iterations = "number of times a scenario or set of actions is
    repeated," integer, default 1. h0010: duration = "total time for which a
    load test is run." h0012: stages = "different phases or steps of a load
    test, with each stage having its own duration and virtual user count."
    h0016: target = "number of virtual users to ramp up or down to for a
    specific period." All sub-claims are exact matches.

- rule_ref: knowledge_partition.always_on[2]
  triplet:
    head: knowledge_partition.always_on[2]
    relation: asserts
    tail: >-
      Thresholds determine pass or fail of a run against metrics and end the
      test in failed status when unmet; checks validate response conditions
      but do not halt execution
  verdict: EXACT_SUPPORT
  distortion:
    - none
  source_anchors:
    - k6-guideline-20260612112658-h0027
    - k6-guideline-20260612112658-h0022
  support_granularity: section
  severity: low
  action: accept_with_note
  note: >-
    h0027: "If the performance of the system under test (SUT) does not meet
    the conditions of your threshold, the test finishes with a failed status."
    h0022: checks "verify specific conditions or expectations in the response";
    "failed test case does not halt the execution." Both claims have exact
    source support.

- rule_ref: knowledge_partition.always_on[3]
  triplet:
    head: knowledge_partition.always_on[3]
    relation: asserts
    tail: >-
      k6 metrics fall into four types — Counters (sum), Gauges
      (smallest/largest/latest), Rates (frequency of non-zero value), Trends
      (statistics such as mean, median, or percentile)
  verdict: SCOPE_BROADENED
  distortion:
    - specificity_inflated
  source_anchors:
    - k6-guideline-20260612112658-h0026
  support_granularity: section
  severity: medium
  action: add_condition
  note: >-
    h0026 states Trends "calculate statistics for multiple values (like mean,
    mode, or percentile)." The profile substitutes "median" for "mode." The
    source word is "mode" (which is a source error — k6 Trends actually compute
    median, min, max, and percentiles, not mode). The profile's "median" is
    technically more accurate than the source's "mode" but is not drawn from
    the source text. The package's source_of_truth_policy.precedence (anchor
    h0026 itself) makes k6.io authoritative for k6 behaviour where the cheat
    sheet and official docs differ; on that basis "median" is acceptable. The
    distortion is a specificity_inflated substitution from the source's literal
    wording; accepted here because the package's own precedence rule explicitly
    defers to official k6 docs for such discrepancies.
