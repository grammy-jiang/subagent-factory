- rule_ref: when_to_use[2]
  verdict: SCOPE_BROADENED
  distortion:
    - scope_broadened
  source_anchors:
    - k6-guideline-20260612112658-h0040
    - k6-guideline-20260612112658-h0057
  support_granularity: section
  severity: high
  action: downgrade
  note: >-
    The profile states "ramping-vus with startVUs, stages, and gracefulRampDown"
    but neither startVUs nor gracefulRampDown appears anywhere in the source
    markdown. h0057 (Section 23 Ramping VUs) only states the ramping-vus
    executor "allows for a flexible number of VUs to perform iterations for a
    set duration" and that "stages option" is a shortcut. h0040 (Section 15
    Scenario) provides context on scenarios but does not mention startVUs or
    gracefulRampDown. These are real k6 executor parameters from the official
    k6 docs but are absent from the cheat-sheet source. The rule should be
    narrowed to remove startVUs and gracefulRampDown as named parameters, or
    hedged with "see k6 docs for additional executor parameters."

