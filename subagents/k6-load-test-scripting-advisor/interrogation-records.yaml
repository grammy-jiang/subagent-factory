q17_source_of_truth: >-
  The official k6 documentation (k6.io) is authoritative for k6 behaviour,
  options, executors, and the full metrics reference; this cheat sheet is a
  secondary summary of the most commonly used terms and the source explicitly
  defers to the k6 Metrics reference for full detail (anchor h0026: "refer to
  the Metrics reference"; anchor h0062: "Ref: https://k6.io/docs/").

q18_volatile: >-
  k6 option names, executor options, and built-in metric names can change across
  k6 releases; the cheat sheet is undated, so configuration specifics should be
  re-checked against current k6 docs. Metadata sets review_cadence to annual
  and volatility to low (source metadata).

