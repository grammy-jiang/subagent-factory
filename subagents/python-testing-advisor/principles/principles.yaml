schema_version: principles-v1
principles:
- principle_id: P001
  statement: Use monkeypatch's self-cleaning helpers—setattr/delattr, setitem/delitem,
    setenv/delenv, syspath_prepend to shadow a module, and chdir for cwd-dependent
    code (plus the raising parameter)—to modify attributes, dictionary items, and
    environment variables for a test's duration with automatic restore afterwards;
    combine with unittest.mock for mock objects.
  derived_from_claims:
  - C00137
  - C00138
  - C00139
  - C00140
  - C00141
  - C00142
  - C00143
  - C00144
  - C00147
  - C00750
  confidence: high
  applies_when:
  - temporarily altering environment, attributes, or paths during a test
  - patching dict entries, environment variables, sys.path or the working directory
    in tests
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P002
