  statement: 'Test plugins like any other code using the bundled pytester plugin:
    enable it (pytest_plugins=''pytester''), generate example tests with testdir.makepyfile,
    run them via testdir.runpytest, and assert on result.stdout.fnmatch_lines and
    result.ret (0 pass / 1 fail); follow the make-example, run, examine-output, check-exit-code
    pattern, keep each test checking one thing, and install the plugin before running
    its tests.'
