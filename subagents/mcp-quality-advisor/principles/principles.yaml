- principle_id: P026
  statement: 'Prioritize remediation by measured impact on tool selection — functionality
    first (+11.6%), then accuracy (+8.8%), then information completeness (+5.9%),
    then conciseness (+1.5%) — and adjust for query specificity: emphasize a clear,
    distinct functional description for underspecified queries and thorough completeness
    for detailed queries. Because the dimensions interact, improving one (for example
    adding parameter docs) can also improve another.'
  derived_from_claims:
  - C00469
  - C00470
  - C00472
  - C00473
  - C00474
  - C00475
  - C00476
  - C00477
  - C00481
  - C00493
