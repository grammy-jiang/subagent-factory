  - The agent needs to narrow candidate tools before loading full schemas.
  - planning capacity and cost for a growing tool-augmented LLM platform
  operational_mapping:
    profile_rule: false
    skill: null
    reference: null
    test_cases: []
- principle_id: P016
  statement: Keep diagnostic and other non-protocol output off the JSON-RPC message
    stream; on the stdio transport, emitting anything other than valid JSON-RPC on
    standard output corrupts the stream and breaks client parsing.
  derived_from_claims:
  - C00521
  - C00563
  - C01284
  - C01285
  confidence: high
  applies_when:
  - the server emits diagnostic or logging output
  - especially when using the stdio transport binding
  - the server uses the local stdio transport
