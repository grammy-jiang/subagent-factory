    skill: null
    reference: null
    test_cases: []
- principle_id: P027
  statement: When building tasks to ground or evaluate a tool, write self-contained
    plain-English questions with a single unambiguous answer reachable in one tool
    call, specifying all inputs, varying values across tasks, and spanning medium/hard/very-hard
    difficulty; then synthesize Examples and Limitations strictly from the observed
    executions, each example a real observation with exact arguments and response
    (preferring edge and error cases) and each limitation a tool-specific fact seen
    in a trace, never invented, never generic API advice, and never a verbatim repeat
    of the description.
  derived_from_claims:
  - C00417
  - C00418
  - C00419
  - C00420
  - C00422
  - C00423
  - C00424
  - C00425
  - C00426
