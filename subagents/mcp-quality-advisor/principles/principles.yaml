  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P014
  statement: Keep sensitive and intermediate data out of the model context by default,
    exposing only explicitly logged, returned, or policy-approved values through least-exposure
    controls such as tokenization, read-only mode, or metadata-only secret access.
  derived_from_claims:
  - C00726
  - C00727
  - C00728
  - C01070
  - C01071
  confidence: high
  applies_when:
  - The harness separates execution-state visibility from model-visible output.
  - The workflow handles private, regulated, or otherwise sensitive fields.
  - The harness supports tokenization and controlled untokenization at tool-call boundaries.
  - Sensitive values need to move between authorized systems.
  - the server runs in shared environments or exposes secret resources
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P015
  statement: Provide intelligent, searchable tool discovery with adjustable detail
    levels once tool catalogs grow large enough that browsing or static exposure is
    inefficient.
  derived_from_claims:
  - C00719
  - C00721
  - C00824
  - C00856
  - C00858
