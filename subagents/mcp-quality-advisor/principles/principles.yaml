    skill: null
    reference: null
    test_cases: []
- principle_id: P007
  statement: Diagnose agent failures into distinct categories - query errors (poor
    or wrong-granularity queries from weak task decomposition), retrieve errors (retriever
    misses a semantically equivalent tool), tool errors (correct tool invoked with
    wrong parameters), and other errors (unhandled transient failures) - and route
    each to its own remediation.
  derived_from_claims:
  - C00078
  - C00079
  - C00080
  - C00081
  - C00082
  - C00083
  - C00111
  - C00124
  confidence: high
  applies_when:
  - analyzing why a tool-use agent failed
  - designing or reviewing an agent tool-use / MCP evaluation or benchmark
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P008
  statement: 'Minimize the number of tools an MCP server exposes: every tool''s name,
    description, parameter schema, and annotations load into the model''s context
    on connect and tax reasoning before any prompt, and benchmark evidence shows task
    efficiency drops (>10 points) as tool-selection complexity rises. Consolidating
    many narrow tools into a few higher-level ones (e.g. 130+ to 11) can cut tool-definition
    context from roughly 26% to about 1.6%.'
  derived_from_claims:
  - C00033
  - C01044
  - C01045
  - C01050
  - C01051
  - C01052
  - C01054
  confidence: high
  applies_when:
  - configuring which tools/servers an agent can access for a task
  - an MCP server exposes dozens or hundreds of tools
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P009
  statement: Choose a strong judge model for LLM-as-a-Judge evaluation, and when any
    single evaluator's reliability is uncertain use multi-model majority voting; relative
    agent rankings are robust to evaluator bias even though absolute agreement varies
    by judge.
  derived_from_claims:
  - C00073
  - C00075
  - C00076
  - C00077
  - C00128
  - C00141
  - C00142
  confidence: high
  applies_when:
  - scoring agent trajectories with an LLM judge
  - designing or reviewing an agent tool-use / MCP evaluation or benchmark
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P010
  statement: 'Treat an MCP tool''s name, description, and parameter specification
    as the primary lever for correct tool selection: keep instructions simple and
    precise, and expect that even small description edits — tightening wording, adding/removing
    a tool, or merging similar tools — can move evaluation results significantly,
    while inaccurate descriptions cause wrong-tool choices, skipped steps, and malformed
    or missing arguments.'
  derived_from_claims:
  - C00281
  - C00282
  - C00303
  - C00680
  - C00681
  - C00682
  - C00683
  confidence: high
  applies_when:
  - Reviewing or authoring an MCP tool description
  - designing or revising an MCP tool surface
  - diagnosing why a model picks the wrong tool or bad arguments
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P011
  statement: Persist intermediate state, reusable task code, and agent memory outside
    the transient prompt when workflows need resume capability, repeated execution,
    continuity, provenance, or auditability.
  derived_from_claims:
  - C00729
  - C00730
  - C00983
  - C00984
  - C00987
  - C00988
  - C00990
  confidence: high
  applies_when:
  - The execution environment provides durable storage between operations.
  - The task pattern is likely to recur or span multiple steps.
  - multi-turn conversational sessions on a stateless serverless platform
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P012
  statement: 'Treat per-turn MCP tool-schema injection as a first-class recurring
    cost (the Tools Tax): quantify it as approximately turns x catalog-size x ~200-500
    tokens per tool, because stateless chat-completions APIs re-inject the full catalog
    on every turn and audits place it in the tens of thousands of tokens.'
  derived_from_claims:
  - C00781
  - C00782
  - C00860
  - C00861
  - C00862
  - C00865
  - C00870
  confidence: high
  applies_when:
  - measuring end-to-end MCP overhead
  - designing or reviewing an agent that connects to many MCP tools
  - estimating token cost or budget of a multi-server tool deployment
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P013
  statement: Validate tool-call parameters against each tool's constraints before
    invoking it; a common failure is violating parameter rules such as setting identical
    start and end dates where the tool requires them to differ.
