schema_version: principles-v1
principles:
- principle_id: P001
  statement: Do not statically expose the entire tool catalog to the LLM; retrieve
    only a small, semantically relevant subset (typically 3-5 tools) per query via
    dense-embedding similarity search. Static provisioning wastes tokens (a 100-tool
    catalog is ~20K-80K tokens before any query), degrades accuracy through context
    bloat, and hits context-window limits; manual curation is inflexible.
  derived_from_claims:
  - C00820
  - C00821
  - C00822
  - C00823
  - C00825
  - C00831
  - C00855
  - C00871
  - C00872
  - C00878
  - C01087
  - C01088
  - C01089
  - C01091
  confidence: high
  applies_when:
  - a tool-augmented LLM or MCP deployment exposes many tools (dozens to hundreds
    or more), often across multiple servers
  - choosing how tool definitions reach the model in an agentic system
  - designing a dynamic/large MCP toolset
  - tool input schemas are large or numerous
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P002
  statement: Use deferred tool loading with a small always-loaded core and searchable
    long tail so full tool definitions stay out of context until needed and tool metadata
    remains within the context budget.
  derived_from_claims:
  - C00734
  - C00735
  - C00736
  - C00737
  - C00738
  - C00739
  - C00740
  - C00741
  - C00742
  - C00766
  - C01048
  - C01049
  - C01053
  - C01493
  confidence: high
  applies_when:
  - Tool definitions are large enough to materially consume context, tool-selection
    errors are likely, multiple MCP servers are connected, or the available library
    has roughly ten or more tools.
  - A stable set of critical or frequently used tools exists alongside many lower-frequency
    tools.
  - Deferred definitions are excluded from the initial prompt and can be expanded
    after search.
  - multiple MCP servers run in one client
  - the IDE or model enforces a tool cap
  - designing an agent harness with a large tool surface
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P003
  statement: 'Make tool summaries self-documenting and query-shaped: descriptive names
    and intent-voiced summaries substantially raise retrieval quality, and an LLM
    can regenerate cryptic implementer-voiced summaries to be shorter yet more retrievable.'
  derived_from_claims:
  - C00743
  - C00744
  - C00885
  - C00886
  - C01082
  - C01083
  - C01084
  - C01085
  confidence: high
  applies_when:
  - Tools are discovered by matching against names and descriptions, especially when
    many capabilities are deferred.
  - authoring or improving tool names and descriptions for a routed catalog
  - using semantic/embeddings-based tool discovery
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P004
  statement: 'Prefer intent-gated two-phase loading over both naive full-schema injection
    and simple top-k retrieval of full schemas: it can cut measured per-turn tool
    tokens by roughly 95% while keeping effective context utilization high, and unlike
    static manual pruning it does not starve tasks of tools they need.'
  derived_from_claims:
  - C00776
  - C00782
  - C00790
  - C00792
  - C00874
  - C00878
  - C00879
  - C00898
  - C00900
  - C00901
  - C00902
  - C00904
  confidence: high
  applies_when:
  - many tools are registered and their schemas are injected into the planning prompt
  - designing how much of each tool's specification is carried in context
  - choosing a tool-context strategy for an agent with a large tool catalog
  - deciding how much of a selected tool's specification to reveal at call time
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P005
  statement: 'Treat MCP tools as untrusted and map each threat vector to its defense:
    prompt injection via image metadata to sanitization and semantic filters, schema
    bypass to strict enforcement and audit logs, remote code execution to capability
    scoping and sandboxing, privilege escalation to role-based tool binding, stale
    memory to TTL and garbage collection, cross-tool leakage to secure memory zones,
    provenance loss to output tagging, and command injection to input escaping.'
  derived_from_claims:
  - C00088
  - C00581
  - C00596
  - C00597
  - C00598
  - C00599
  - C00600
  - C00601
  - C00602
  - C00603
  - C00604
  confidence: high
  applies_when:
  - deploying an agent that can invoke external or local tools with real side effects
  - an MCP deployment exposes tools with dynamic registration, shared memory, or shell-bound
    wrappers
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P006
  statement: 'Keep tool descriptions accurate and precise: state only implemented
    behavior, concrete constraints, parameter meanings, and boundaries, while removing
    ambiguous, contradictory, or self-referential wording.'
