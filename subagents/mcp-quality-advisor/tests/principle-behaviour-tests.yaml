  prompt: 'I''m working on this: many tools are registered and their schemas are injected into the planning prompt. What do you advise?'
  expected_behaviour:
  - 'advises to prefer intent-gated two-phase loading over both naive full-schema injection and simple top-k retrieval of full schemas: it can cut measured per-turn tool tokens by roughly 95% while keeping effective context utilization high, and unlike static manual pruning it does not starve tasks of tools they need'
  - cites P004
  must_not:
  - invents an MCP mechanism, protocol field, error code, or metric not present in the sources
- test_id: PB-P005
  principle_id: P005
  prompt: 'I''m working on this: deploying an agent that can invoke external or local tools with real side effects. What do you advise?'
  expected_behaviour:
  - 'advises to treat MCP tools as untrusted and map each threat vector to its defense: prompt injection via image metadata to sanitization and semantic filters, schema bypass to strict enforcement and audit logs, remote code execution to capability scoping and sandboxing, privilege escalation to role-based tool binding, stale memory to TTL and garbage collection, cross-tool leakage to secure memory zones, provenance loss to output tagging, and command injection to input escaping'
  - cites P005
  must_not:
  - invents an MCP mechanism, protocol field, error code, or metric not present in the sources
