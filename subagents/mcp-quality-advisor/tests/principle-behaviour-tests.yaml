schema_version: principle-behaviour-tests-v1
subagent_slug: mcp-quality-advisor
principle_behaviour_tests:
- test_id: PB-P001
  principle_id: P001
  prompt: 'I''m working on this: a tool-augmented LLM or MCP deployment exposes many tools (dozens to hundreds or more), often across multiple servers. What do you advise?'
  expected_behaviour:
  - advises to do not statically expose the entire tool catalog to the LLM; retrieve only a small, semantically relevant subset (typically 3-5 tools) per query via dense-embedding similarity search
  - cites P001
  must_not:
  - invents an MCP mechanism, protocol field, error code, or metric not present in the sources
- test_id: PB-P002
  principle_id: P002
  prompt: 'I''m working on this: Tool definitions are large enough to materially consume context, tool-selection errors are likely, multiple MCP servers are connected, or the available library has roughly ten or more tools. What do you advise?'
  expected_behaviour:
  - advises to use deferred tool loading with a small always-loaded core and searchable long tail so full tool definitions stay out of context until needed and tool metadata remains within the context budget
  - cites P002
  must_not:
  - invents an MCP mechanism, protocol field, error code, or metric not present in the sources
- test_id: PB-P003
  principle_id: P003
  prompt: 'I''m working on this: Tools are discovered by matching against names and descriptions, especially when many capabilities are deferred. What do you advise?'
  expected_behaviour:
  - 'advises to make tool summaries self-documenting and query-shaped: descriptive names and intent-voiced summaries substantially raise retrieval quality, and an LLM can regenerate cryptic implementer-voiced summaries to be shorter yet more retrievable'
  - cites P003
  must_not:
  - invents an MCP mechanism, protocol field, error code, or metric not present in the sources
- test_id: PB-P004
