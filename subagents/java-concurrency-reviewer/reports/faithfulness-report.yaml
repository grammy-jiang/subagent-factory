- rule_ref: knowledge_partition.always_on[1]
  verdict: EXACT_SUPPORT
  distortion:
  - none
  support_granularity: section
  severity: low
  action: accept_with_note
  note: Thread lifecycle states and the start-once / no-restart-after-termination
    rule are Oaks' lifecycle section (oaks L1359-1363 lifecycle, L7792 exiting state).
    State-name set (NEW/RUNNABLE/BLOCKED/WAITING/TIMED_WAITING/TERMINATED) is the
    standard Thread.State enum, consistent with the source's lifecycle figure.
- rule_ref: knowledge_partition.always_on[2]
  verdict: EXACT_SUPPORT
  distortion:
  - none
  support_granularity: section
  severity: low
  action: accept_with_note
  note: Lock reentrancy — a thread holding a lock re-enters synchronized blocks on
    the same object without blocking — Lea (concurrent-programmi L1842 "Java locks
    are reentrant", L2035 "without blocking (due to reentrancy)"); Oaks L2902-2908
    confirms.
- rule_ref: knowledge_partition.always_on[3]
  verdict: EXACT_SUPPORT
  distortion:
  - none
  support_granularity: section
  severity: low
  action: accept_with_note
  note: wait holds the lock + guarded loop + atomic release-and-suspend; notify()
    lost if no waiter; notifyAll safer for general use — Lea (concurrent-programmi
    L2898-2902, L9578-9600, L8428/L10064 missed signals). "notifyAll is safer than
    notify for general use" matches the source's default-notifyAll / notify-only-when-conditions-hold
    guidance.
- rule_ref: knowledge_partition.always_on[4]
  verdict: EXACT_SUPPORT
  distortion:
  - none
  support_granularity: section
  severity: low
  action: accept_with_note
  note: Circular lock-acquisition order is the canonical deadlock cause; resource-ordering
    the remedy; Java does not auto-resolve cross-object deadlock — Lea (concurrent-programmi
    L2071-2128, L8865-8867).
- rule_ref: knowledge_partition.always_on[5]
  verdict: EXACT_SUPPORT
  distortion:
  - none
  support_granularity: section
  severity: low
  action: accept_with_note
  note: Immutable objects never change state and are always safe and live without
    locking — Lea (concurrent-programmi L1562-1563 "Immutable objects never change
    state / Actions ... are always safe and live").
- rule_ref: knowledge_partition.always_on[6]
  verdict: EXACT_SUPPORT
  distortion:
  - none
  support_granularity: section
  severity: low
  action: accept_with_note
  note: 'Fully synchronized objects: all methods synchronized; unsynchronized methods
