q16_caller_supplied:
  - "The Java version in use (pre-5.0 vs J2SE 5.0+) — the source is organized
    around J2SE 5.0 features (Executor, atomic classes, explicit locks); older
    versions require different APIs (source: Preface lines 219-227)."
  - "Project-specific thread-pool sizing constraints or latency/throughput SLA
    targets that govern ThreadPoolExecutor configuration choices (source: lines
    8346-8435)."
  - "Whether the codebase uses Swing or AWT, as Swing imposes its own thread-safety
    restriction (event-dispatch-thread-only rule) that the reviewer must apply
    (source: Chapter 7 outline lines 115-119)."

q17_source_of_truth: >
  Scott Oaks & Henry Wong, 'Java Threads' (O'Reilly, 3rd ed., 2004) is the
  authoritative source for the Thread-API-level principles and practices used
  by this reviewer. For normative Java platform guarantees, the Java Language
  Specification and the java.util.concurrent package Javadoc are the normative
  complements. Neither source is fetched at runtime; knowledge is distilled
  from the Oaks/Wong text.

q18_volatile: >
  Low volatility overall (source review_cadence: annual). The Thread-API semantics
  and memory model rules are stable. The volatile area is the Executor framework
  and concurrent collections introduced in J2SE 5.0 — later Java versions (Java 7,
  8, 9, 21) added CompletableFuture, ForkJoinPool, virtual threads (Project Loom),
  and structured concurrency which are not covered in the 2004 source. Review
  annually or when the caller's Java version introduces new concurrency constructs
  (especially virtual threads in Java 21+).

