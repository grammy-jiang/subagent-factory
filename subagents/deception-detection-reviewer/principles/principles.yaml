- principle_id: P002
  statement: Keep a minute, continuous record of every case, the enemy traffic plus
    a log of the agent's conversations, journeys, and actions, yet prune it periodically
    so essentials are not buried under redundant detail, because counterespionage
    succeeds through patient study of records and only a well-kept record prevents
    the blunder or inconsistency that blows an agent.
  derived_from_claims:
  - C00049
  - C00050
  - C00078
  - C00082
  - C00084
  - C00086
  - C00090
  - C00111
  - C00121
  - C00135
  - C00138
  - C00237
  - C00303
  confidence: high
  applies_when: []
  operational_mapping:
    profile_rule: true
    test_cases: []
- principle_id: P003
  statement: Never announce a deception baldly; embed within a large flow of genuine
    reporting the facts from which the enemy will himself deduce the conclusion you
    want, and, since a controlled agent answers rather than volunteers, steer his
    future questions in the direction you want through the answers you give.
  derived_from_claims:
  - C00006
  - C00040
  - C00145
  - C00146
  - C00147
  - C00148
  - C00193
  - C00194
  - C00208
  - C00262
  - C00284
  - C00285
  confidence: high
  applies_when: []
  operational_mapping:
    profile_rule: true
    test_cases: []
- principle_id: P004
  statement: Recognise that an enemy handler can become so invested in your agent's
    welfare that he manages his own superiors to reward and protect the agent, even
    securing him an enemy decoration; this deep investment is the strongest guarantor
    of the case and the surest proof of the enemy's belief.
  derived_from_claims:
  - C00057
  - C00074
  - C00083
  - C00108
  - C00112
  - C00120
  - C00156
  - C00157
  - C00167
  - C00253
  - C00281
  confidence: high
  applies_when:
  - the enemy service is trusted by its own high command
  operational_mapping:
    profile_rule: true
    test_cases: []
- principle_id: P005
  statement: For the decisive deception, restrict definite deception material to your
    most-trusted channels while keeping lesser agents running for corroboration and
    confusion, because even the most trusted channel can collapse unexpectedly and
    no operation should rest on one.
  derived_from_claims:
  - C00178
  - C00181
  - C00185
  - C00186
  - C00218
  - C00247
  - C00248
  - C00249
  - C00268
  confidence: high
  applies_when: []
  operational_mapping:
    profile_rule: true
    test_cases: []
- principle_id: P006
  statement: 'Staff a double-agent section with distinct roles: a small directorate
    for policy and accept-or-reject decisions, dedicated case officers for the agents''
    lives and traffic, a technical wireless officer, records and analysis officers,
    and an officer to collect the intelligence arising from the cases.'
  derived_from_claims:
  - C00022
  - C00053
  - C00056
  - C00071
  - C00100
  - C00123
  - C00134
  - C00210
  confidence: high
  applies_when: []
  operational_mapping:
    profile_rule: true
    test_cases: []
- principle_id: P007
  statement: Compartmentalise your best secret-source intelligence from any agent
    who will re-enter enemy hands, because a returned agent may be coerced or persuaded
    into betraying your association and may take unforeseeable initiatives whose loyalty
    you can never be certain of.
  derived_from_claims:
  - C00047
  - C00048
  - C00184
  - C00204
  - C00205
  - C00206
  - C00223
  - C00233
  confidence: high
  applies_when: []
  operational_mapping:
    profile_rule: true
    test_cases: []
- principle_id: P008
  statement: Never relax vigilance on a converted agent out of premature confidence,
    because a single lapse can let him escape or turn and wreck the system, and an
    agent left without close psychological supervision will eventually destroy his
    own case in despair or in a belated effort to restore his self-esteem.
  derived_from_claims:
  - C00068
  - C00069
  - C00070
  - C00116
  - C00117
  - C00118
  - C00234
  - C00280
  confidence: high
  applies_when: []
  operational_mapping:
    profile_rule: true
    test_cases: []
- principle_id: P009
  statement: Practise order-of-battle deception by feeding the enemy staff concrete
    facts, unit locations, identifications, headquarters, and assembly areas, from
    which they deduce the false picture themselves, because the object is to create
    in his mind a belief in the existence and location of notional forces and let
    his own logic lead him wrong.
  derived_from_claims:
  - C00219
  - C00246
  - C00259
  - C00260
  - C00263
  - C00266
  - C00295
  confidence: high
  applies_when: []
  operational_mapping:
    profile_rule: true
    test_cases: []
- principle_id: P010
  statement: Keep every agent clear and independent of the others, so that one blown
    agent does not bring down the rest and a single agent can be risked alone; allow
    a linkage only when it cannot be avoided, and remember that agents run in parallel
    tend to deduce each other's status over time.
  derived_from_claims:
  - C00013
  - C00019
  - C00085
  - C00106
  - C00129
  - C00139
  confidence: high
  applies_when: []
  operational_mapping:
    profile_rule: true
    test_cases: []
- principle_id: P011
  statement: 'Recognise the wartime asymmetry: the dice are loaded against the spy,
    so espionage in the enemy''s home country is difficult and usually unprofitable
    while counterespionage is comparatively easy and yields the richest returns, and
    the reverse holds in peacetime; a straight agent can succeed in enemy-occupied
    country aided by resistance or goodwill but is almost hopeless in the enemy''s
    home country.'
  derived_from_claims:
  - C00023
  - C00059
  - C00060
  - C00061
  - C00301
  - C00302
  confidence: high
  applies_when: []
  operational_mapping:
    profile_rule: true
    test_cases: []
- principle_id: P012
  statement: Make a fixed and generous financial agreement with each agent as early
    as possible, letting voluntary agents share a percentage of the enemy's payments
    as an incentive, while establishing that all such money belongs to the controlling
    service and the percentage is a reward for collaboration.
  derived_from_claims:
  - C00024
  - C00025
  - C00043
  - C00044
  - C00072
  - C00073
  confidence: high
  applies_when: []
  operational_mapping:
    profile_rule: true
    test_cases: []
- principle_id: P013
  statement: Continuously assess how far the enemy trusts each agent, using the questions
    asked, the payments made, the sensitivity and reuse of the codes and methods entrusted
    to him, the training and resources invested in him, remarks in personal contact,
    and secret intelligence, because an agent's standing oscillates and you must know
    it before relying on him for a critical task.
  derived_from_claims:
  - C00143
  - C00144
  - C00250
  - C00267
  - C00276
  - C00279
  confidence: high
  applies_when: []
  operational_mapping:
    profile_rule: true
    test_cases: []
- principle_id: P014
  statement: Build a cover plan only after the real plan is shared in outline with
    the deceivers, and make it continuously track every change in the real plan, because
    deception is downstream of and dependent on operational planning.
  derived_from_claims:
  - C00188
  - C00190
  - C00191
  - C00192
  - C00217
  - C00226
  confidence: high
  applies_when: []
  operational_mapping:
    profile_rule: true
    test_cases: []
- principle_id: P015
  statement: Confirm that you control an entire enemy network only gradually, by accumulating
    evidence from secret sources and cross-references between agents, such as the
    enemy routing payments or emergency lifelines through your controlled men or one
    agent naming another as his best.
  derived_from_claims:
  - C00026
  - C00027
  - C00126
  - C00256
  - C00286
  confidence: high
  applies_when: []
  operational_mapping:
    profile_rule: true
    test_cases: []
- principle_id: P016
  statement: Assess every release of information to the enemy case by case as a profit-and-loss
    judgment, made jointly by those who know the agent's potential and those with
    technical knowledge of the subject, because the agent cannot ignore a question
    without destroying his case.
  derived_from_claims:
  - C00045
  - C00065
  - C00133
  - C00166
  - C00215
  confidence: high
  applies_when: []
  operational_mapping:
    profile_rule: true
    test_cases: []
- principle_id: P017
  statement: Recognise that large-scale deception fails without coordinated top-level
    direction of the desired strategic effect, because local operators can execute
    a deception well but cannot originate strategic goals they are never told.
  derived_from_claims:
  - C00150
  - C00182
  - C00189
  - C00214
  - C00294
  confidence: high
  applies_when: []
  operational_mapping:
    profile_rule: true
    test_cases: []
- principle_id: P018
  statement: When staging a controlled sabotage, leave surviving evidence that points
    to sabotage, steer local investigation and the press toward the intended explanation,
    and reap the additional domestic benefit that the publicity stimulates vigilance
    in real installations; too effective an explosion destroys the very clues the
    enemy needs to credit it.
  derived_from_claims:
  - C00212
  - C00213
  - C00220
  - C00222
  - C00265
  confidence: high
  applies_when: []
  operational_mapping:
    profile_rule: true
    test_cases: []
- principle_id: P019
  statement: For a wireless agent, determine whether the enemy recorded his sending
    style during training, and in any case let the agent construct and key his own
    messages, because stylistic idiosyncrasies are easily recognised but not easily
    reproduced.
  derived_from_claims:
  - C00018
  - C00076
  - C00079
  - C00115
  confidence: high
  applies_when: []
  operational_mapping:
    profile_rule: true
    test_cases: []
- principle_id: P020
  statement: Have the agent obey his handler's instructions as closely as possible
    and not switch his declared line of interest, yet within those instructions retain
    the initiative to provoke the questions you are prepared to answer rather than
    those you must avoid.
  derived_from_claims:
  - C00062
  - C00063
  - C00137
  - C00168
  confidence: high
  applies_when: []
  operational_mapping:
    profile_rule: true
    test_cases: []
- principle_id: P021
  statement: Expect that a well-established, trusted agent is extremely hard to blow,
    because when a deception is exposed the enemy prefers benign explanations, that
    the agent was misled, that the plan was abandoned, or that the cover fooled him,
    over the truth, and established trust resists even blatant contrary evidence.
  derived_from_claims:
  - C00087
  - C00088
  - C00172
  - C00275
  confidence: high
  applies_when: []
  operational_mapping:
    profile_rule: true
    test_cases: []
- principle_id: P022
  statement: 'Judge an agent''s grade by the verifiable facts he can supply, not by
    his social access: a well-connected agent relaying only gossip or embassy rumour
    is low-grade, while a lowly placed seaman or wireless operator who observes hard
    facts is often the most valuable, because the enemy staff needs facts on which
    to base its appreciations.'
  derived_from_claims:
  - C00093
  - C00094
  - C00095
  - C00203
  confidence: high
  applies_when: []
  operational_mapping:
    profile_rule: true
    test_cases: []
- principle_id: P023
  statement: Recognise that a double-agent case starves and dies without a steady
    supply of good feed material and a clear policy on what to send; a case acquired
    before you can nourish it is wasted.
  derived_from_claims:
  - C00122
  - C00202
  - C00241
  - C00277
  confidence: high
  applies_when: []
  operational_mapping:
    profile_rule: true
    test_cases: []
- principle_id: P024
  statement: Retire a notional subagent positioned to observe something you must not
    report by giving him a plausible illness or death backed by real corroboration
    such as a planted obituary, and structure a notional network so subagents report
    outward but all receive their tasking through the controlled head.
  derived_from_claims:
  - C00198
  - C00199
  - C00238
  - C00239
  confidence: high
  applies_when: []
  operational_mapping:
    profile_rule: true
    test_cases: []
- principle_id: P025
  statement: Set case policy at the section level, not by the case officer alone,
    because a zealous officer becomes obsessed with the impeccability of his own cases
    and what is best for a single case is not always best for the system as a whole.
  derived_from_claims:
  - C00058
  - C00066
  - C00067
  confidence: high
  applies_when: []
  operational_mapping:
    profile_rule: true
    test_cases: []
- principle_id: P026
  statement: Act decisively and rapidly at the start of a case even at considerable
    risk, balancing the competing needs of a quick start and a complete debrief by
    starting once the main lines of the agent's story are fairly certain and altering
    his early messages in nonessentials such as dating and word order to defeat any
    undisclosed warning signal.
  derived_from_claims:
  - C00075
  - C00077
  - C00081
  confidence: high
  applies_when: []
  operational_mapping:
    profile_rule: true
    test_cases: []
- principle_id: P027
  statement: Keep the double-agent system multi-purpose, with its owner running the
    agents while the deception director merely uses the channel, separate from any
    operational body that would spend agents for short-term gains, because the channel's
    value is its long-term credibility and it also serves counterespionage and intelligence.
  derived_from_claims:
  - C00096
  - C00183
  - C00187
  confidence: high
  applies_when:
  - the purpose is deception rather than intelligence collection
  operational_mapping:
    profile_rule: true
    test_cases: []
- principle_id: P028
  statement: Structure double-agent governance in two tiers, a senior board holding
    ultimate approval authority and a weekly working-level inter-departmental committee
    acting as clearing-house, approving authority, and liaison, and include a civil
    or political approving authority alongside the military ones.
  derived_from_claims:
  - C00128
  - C00130
  - C00131
  confidence: high
  applies_when: []
  operational_mapping:
    profile_rule: true
    test_cases: []
- principle_id: P029
  statement: Seed a deception with verifiable true reports that events will later
    confirm, such as real units the enemy can check against prisoners, so that when
    the checkable parts prove accurate he extends his belief to the unverifiable notional
    parts.
  derived_from_claims:
  - C00196
  - C00197
  - C00261
  confidence: high
  applies_when: []
  operational_mapping:
    profile_rule: true
    test_cases: []
- principle_id: P030
  statement: Have the case officer immerse himself completely in the agent's persona;
    the most profitable cases are those in which the officer achieves total psychological
    empathy with his agent.
  derived_from_claims:
  - C00009
  - C00298
  confidence: high
  applies_when: []
  operational_mapping:
    profile_rule: true
    test_cases: []
- principle_id: P031
  statement: Keep a trained substitute able to imitate an agent's sending style so
    the channel survives his illness, removal, or loss of trust, and separate message-drafting
    from key-operation once his reliability becomes doubtful.
  derived_from_claims:
  - C00016
  - C00170
  confidence: high
  applies_when:
  - the agent may die, be removed, or otherwise need a substitute operator
  operational_mapping:
    profile_rule: true
    test_cases: []
- principle_id: P032
  statement: Build a notional source's credibility by feeding through him advance
    true information the enemy cannot yet have and will later independently confirm;
    verifiable scoops raise a source's standing.
  derived_from_claims:
  - C00020
  - C00296
  confidence: high
  applies_when: []
  operational_mapping:
    profile_rule: true
    test_cases: []
- principle_id: P033
  statement: 'Route all outgoing traffic through a single approval gate: no message
    reaches the enemy without the documented, written approval of a competent central
    authority, which is the lifeline of the whole system.'
  derived_from_claims:
  - C00046
  - C00055
  confidence: high
  applies_when: []
  operational_mapping:
    profile_rule: true
    test_cases: []
- principle_id: P034
  statement: Position agents far in advance through their notional business or private
    lives and stay several moves ahead by anticipating events, because plans and cover
    plans cannot be fixed long in advance and an agent cannot be moved plausibly at
    a moment's notice.
  derived_from_claims:
  - C00064
  - C00169
  confidence: high
  applies_when: []
  operational_mapping:
    profile_rule: true
    test_cases: []
- principle_id: P035
  statement: Never commit an irrevocable act against a doubtful case if it can be
    avoided; refraining demands patience, confidence, and a willingness to be charged
    with lacking initiative, but almost always proves right, and a case left intact
    tends to revive in an unexpected way.
  derived_from_claims:
  - C00089
  - C00091
  confidence: high
  applies_when: []
  operational_mapping:
    profile_rule: true
    test_cases: []
- principle_id: P036
  statement: Keep a captured spy alive even if he cannot transmit, because a live
    spy remains useful as a reference source while a dead spy is of no use.
  derived_from_claims:
  - C00114
  - C00119
  confidence: high
  applies_when: []
  operational_mapping:
    profile_rule: true
    test_cases: []
- principle_id: P037
  statement: Do not try to close an uncontrollable exfiltration channel such as the
    diplomatic bag; since the material will leave anyway, seed it with your own dictated
    content to convert the leak into a deception channel, and exploit well-placed
    neutrals as couriers by piggybacking secret writing on their legitimate outgoing
    traffic.
  derived_from_claims:
  - C00124
  - C00125
  confidence: high
  applies_when: []
  operational_mapping:
    profile_rule: true
    test_cases: []
- principle_id: P038
  statement: Choreograph your recovery efforts to escalate gradually and appear not
    frightened while making it plain you are, so the enemy infers the material is
    genuinely important without suspecting a plant.
  derived_from_claims:
  - C00151
  - C00228
  confidence: high
  applies_when: []
  operational_mapping:
    profile_rule: true
    test_cases: []
- principle_id: P039
  statement: Anticipate that a thorough enemy will consider whether planted material
    is a deception, so it must withstand scrutiny at the level of every phrase and
    every corroborating detail.
  derived_from_claims:
  - C00152
  - C00229
  confidence: high
  applies_when: []
  operational_mapping:
    profile_rule: true
    test_cases: []
- principle_id: P040
  statement: Weigh the danegeld, the genuine information you must pay to keep a channel
    alive, against the channel's value, and consider deliberately closing a channel
    whose price has grown too high, forcing the enemy to rebuild from scratch.
  derived_from_claims:
  - C00176
  - C00201
  confidence: high
  applies_when: []
  operational_mapping:
    profile_rule: true
    test_cases: []
- principle_id: P041
  statement: Build a planted deception carried by a corpse or courier around an exhaustively
    documented personality, with real personal letters, tickets, and identity papers,
    because the documents are believed only if the man is believed.
  derived_from_claims:
  - C00224
  - C00225
  confidence: high
  applies_when: []
  operational_mapping:
    profile_rule: true
    test_cases: []
- principle_id: P042
  statement: Treat absolute personal integrity and the exclusion of all personal considerations,
    profit, prestige, or self-interest, among every officer as the first and fundamental
    condition of success in secret intelligence work, because corrupt self-interest
    destroys honest judgment and is the root of most failures, and is the flaw to
    exploit in the adversary.
  derived_from_claims:
  - C00257
  - C00300
  confidence: high
  applies_when: []
  operational_mapping:
    profile_rule: true
    test_cases: []
- principle_id: P043
  statement: Do not prematurely dissolve a proven capability on a wave of optimism
    when its main task is done, because its uses rotate over time and experience shows
    a useful multi-purpose weapon will be needed again, probably in an unforeseen
    way.
  derived_from_claims:
  - C00269
  - C00272
  confidence: high
  applies_when: []
  operational_mapping:
    profile_rule: true
    test_cases: []
- principle_id: P044
  statement: Shift an enemy's aim by selectively over-reporting overshoots and suppressing
    undershoots, or the reverse, biasing his correction in the direction that moves
    his mean point of impact away from the vital target.
  derived_from_claims:
  - C00288
  - C00290
  confidence: high
  applies_when: []
  operational_mapping:
    profile_rule: true
    test_cases: []
- principle_id: P045
  statement: Do not assume future operations will enjoy the same favourable conditions,
    and treat evolved control methods as adaptable guides rather than fixed rules,
    because circumstances change.
  derived_from_claims:
  - C00030
  - C00031
  confidence: medium
  applies_when: []
  operational_mapping:
    profile_rule: true
    test_cases: []
- principle_id: P046
  statement: Do not over-invest in a single communication technology or abandon older
    channels because the newest one seems dominant; the attack-defence contest keeps
    shifting, so preserve personal contact, secret writing, and wireless as alternatives.
  derived_from_claims:
  - C00033
  - C00171
  confidence: medium
  applies_when: []
  operational_mapping:
    profile_rule: true
    test_cases: []
- principle_id: P047
  statement: Build a controlled-agent capability toward a single decisive deception,
    accepting that the whole network may be spent in that one coup for a payoff that
    repays years of effort.
  derived_from_claims:
  - C00141
  - C00243
  confidence: medium
  applies_when: []
  operational_mapping:
    profile_rule: true
    test_cases: []
- principle_id: P048
  statement: Exploit the chaos of newly liberated territory, where a stay-behind enemy
    agent is hard to hide and many will offer to turn, by preparing in advance trained
    officers ready to capture and turn stay-behind networks the moment territory is
    retaken.
  derived_from_claims:
  - C00252
  - C00273
  confidence: medium
  applies_when: []
  operational_mapping:
    profile_rule: true
    test_cases: []
- principle_id: P049
  statement: Treat inter-departmental and inter-service cooperation as the one essential
    condition for success, and structure the operation to secure it.
  derived_from_claims:
  - C00017
  confidence: high
  applies_when: []
  operational_mapping:
    profile_rule: true
    test_cases: []
- principle_id: P050
  statement: Exploit the enemy's habit of giving each new spy a fallback contact,
    since that lifeline is often one of your already-controlled men and delivers the
    newcomer straight to you.
  derived_from_claims:
  - C00038
  confidence: high
  applies_when: []
  operational_mapping:
    profile_rule: true
    test_cases: []
- principle_id: P051
  statement: A long period of truthful reporting is usually a necessary precondition
    for passing over a lie; the force of any misinformation depends on the established
    reputation of the sender, so build a truthful record before you deceive.
  derived_from_claims:
  - C00042
  confidence: high
  applies_when: []
  operational_mapping:
    profile_rule: true
    test_cases: []
- principle_id: P052
  statement: Do not sacrifice a long-built double-agent case for an immediate intelligence
    or penetration bonus, because cashing out early can lose a channel of far greater
    long-term deception value.
