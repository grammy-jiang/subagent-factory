schema_version: principles-v1
principles:
- principle_id: P001
  statement: 'Stage a controlled act of sabotage through an agent to reestablish his
    standing, secure his payment, learn the enemy''s other sabotage plans, and obtain
    samples of his latest equipment, remembering it is far harder than it sounds:
    to convince the enemy the event must draw genuine press coverage, so you must
    deceive your own media too, making it real enough to be reported yet controlled
    enough to do no serious harm.'
  derived_from_claims:
  - C00001
  - C00002
  - C00003
  - C00004
  - C00005
  - C00007
  - C00008
