# Faithfulness review — deception-detection-reviewer
# Per-rule claim-strength check of the load-bearing profile rules against the promoted
# principles and their backing claims. No rule is stronger than its evidence. source_anchors
# are omitted deliberately: provenance is carried in each note via principle + claim IDs,
# which resolve into principles.yaml (P###) and analysis/claims.jsonl (C#####). Verdicts sit
# at EXACT_SUPPORT / WITHIN_SCOPE — the profile restates the source's double-agent /
# counter-deception tradecraft and narrows it to review and advice; it does not broaden it.
schema_version: faithfulness-report-v1
subagent_slug: deception-detection-reviewer
