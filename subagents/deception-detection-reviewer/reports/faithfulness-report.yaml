- rule_ref: role
  verdict: WITHIN_SCOPE
  distortion:
  - none
  support_granularity: section
  severity: low
  action: accept_with_note
  note: 'The role restates the source''s subject — running double agents and detecting deception — and
    narrows the posture to review and advice, explicitly disclaiming running the operation, making the
    command decision, or certifying a channel (un)compromised. A narrowing, not an over-claim. Grounded
    in principle(s): P001 (claims C00001, C00002); P025 (claims C00058, C00066); P070 (claims C00299);
    P013 (claims C00143, C00144).'
