  - C00210
  - C00211
  - C00212
  - C00220
  - C00221
  - C01797
  - C02526
  - C02527
  - C02532
  - C02533
  - C02534
  - C04339
  confidence: high
  applies_when:
  - A curriculum adds distinguishable concepts or procedures over time.
  - Learners have enough competence to attempt mixed practice.
  - Learners need to discriminate among several previously taught methods
  - Learners have enough initial familiarity to choose among related procedures or
    categories.
  - Practice sequencing can be adjusted as learners gain fluency.
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
