- rule_ref: quality_bar[6]
  verdict: WITHIN_SCOPE
  distortion:
  - none
  severity: low
  action: accept_with_note
  note: Authored output floor — cites no principle by design. It restates outputs.primary_format and minimum_useful_output
    (the finding-with-gap/principle/correction/condition-or-trade-off structure, and the never-a-bare-verdict/diagnosis/taught-content
    exclusion) as a single adapter-facing floor rather than deriving a new empirical claim from the sources;
    it is not stronger than any source support because it makes no source-attributed claim. Grade WITHIN_SCOPE
    as an authored structural constraint, consistent with how outputs.primary_format and minimum_useful_output
    are graded elsewhere in this report.
- rule_ref: forbidden_behaviours[5]
  verdict: WITHIN_SCOPE
  distortion:
  - none
  severity: low
  action: accept_with_note
  note: Authored evidence guardrail — cites no principle by design. The ban on citing an effect size,
    statistic, or numeric benchmark not carried in the invoked principle's own statement (direction and
    strength of support stated in words instead) constrains the agent's own output discipline; it makes
    no source-attributed claim about learning, so it cannot be stronger than source support. It is
    strictly self-limiting — it can only narrow what the agent asserts, never widen it — and is distinct
    from forbidden_behaviours[3], which fences over-claimed certainty and generality rather than invented
    precision. Grade WITHIN_SCOPE as an authored guardrail, consistent with how the other authored
    boundaries are graded in this report.
- rule_ref: forbidden_behaviours[6]
  verdict: WITHIN_SCOPE
  distortion:
  - none
  severity: low
  action: accept_with_note
  note: Authored scope boundary mirroring when_not_to_use[4] and handoff_rules[2] — no principle grants
    or withholds this authority; it is a self-limiting jurisdictional statement (the advisor will not rule
    on education law, accreditation, safeguarding, or institutional policy), not a claim about what the
    sources establish. Grade WITHIN_SCOPE as an authored boundary, not a source-derived rule that could
    exceed its evidence.
- rule_ref: forbidden_behaviours[7]
  verdict: WITHIN_SCOPE
  distortion:
  - none
  severity: low
  action: accept_with_note
  note: Authored scope boundary mirroring when_not_to_use[3] — the advisor will not supply or rule on the
    subject-matter answer itself (the correct chemistry, translation, or legal position) rather than how
    to teach, practise, or assess it. No principle grants or withholds authority over the subject matter
    a course teaches; the statement is self-limiting jurisdiction, not an empirical claim, so it cannot
    exceed its evidence. Grade WITHIN_SCOPE as an authored boundary.
- rule_ref: handoff_rules[2]
  verdict: WITHIN_SCOPE
  distortion:
  - none
  severity: low
  action: accept_with_note
  note: Authored scope boundary matching forbidden_behaviours[6] and when_not_to_use[4] — routes education-law/accreditation/safeguarding/institutional-policy
    rulings to the responsible institutional, legal, or accrediting authority. No principle grants this
