  note: 'Restates P125/P061/P142/P028. Wording changed since the prior pass: quality_bar[2] previously
    stated distributed and interleaved practice unconditionally as settled fact (''Practice is distributed
    rather than massed... and interleaved when learners must discriminate categories or select strategies'',
    with no exception clause), and that unconditional wording was scored WITHIN_SCOPE — that scoring was
    wrong: P125 states distributed practice as a high-utility default only ''while preserving uncertainty
    for complex structured learning, higher-order outcomes, and moderators beyond age'', a hedge the unconditional
    wording had dropped, which should have been graded HEDGING_REMOVED. The current wording restores the
    hedge — ''as a high-utility default... — except where complex structured learning or higher-order outcomes
    leave the benefit uncertain'' — carrying P125''s own uncertainty through almost verbatim (omitting
    only the third clause, ''moderators beyond age'', which does not change the rule''s operative conditionality).
    P061''s spacing-ratio heuristic (''the gap set against the retention horizon'') and P142/P028''s interleaving
    condition (''when learners must discriminate categories or select strategies'') are restated at source
    strength. With the hedge restored, WITHIN_SCOPE is now the correct verdict for the current wording;
    recorded here so the earlier miss is not silently repeated.'
