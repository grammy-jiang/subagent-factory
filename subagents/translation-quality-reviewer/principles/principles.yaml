- principle_id: P003
  statement: 'Choose the corpus type by the question: use a parallel corpus (source
    texts aligned with their translations) to investigate equivalence, shifts, and
    alignment; a monolingual comparable corpus (translated versus non-translated texts
    in the same target language, matched for domain, register, and period) to investigate
    translation universals and translationese; and a multilingual comparable corpus
    (comparable original texts across several languages) for cross-linguistic feature
    contrasts; all are now supported by dedicated tools.'
  derived_from_claims:
  - C00511
  - C00512
  - C00570
  - C00571
  - C00573
  - C00577
  - C00591
  - C00592
  confidence: high
  applies_when:
