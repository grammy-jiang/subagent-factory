schema_version: principles-v1
principles:
- principle_id: P001
  statement: When analysing translated text, probe for the recurring candidate universals
    — a rise in explicitness (explicitation), disambiguation and simplification, a
    preference for conventional grammaticality, avoidance of source-text repetition,
    exaggeration of target-language features, and a distinctive distribution of common
    features — as hypotheses to be measured against evidence, without presuming any
    of them holds in a given corpus.
  derived_from_claims:
  - C00490
  - C00491
  - C00492
  - C00494
  - C00495
  - C00496
  - C00497
  - C00498
  - C00503
  - C00608
  - C00609
  - C00611
  - C00612
  - C00613
  - C00614
  confidence: high
  applies_when:
  - a study proposes, assumes, or relies on a translation universal
  - deciding what features to measure in a corpus of translated text
  - interpreting an observed difference between translated and original text
  - Using or reporting claims about explicitation, simplification, normalisation,
    or other regularities.
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P002
