    skill: null
    reference: null
    test_cases: []
- principle_id: P009
  statement: 'Treat command injection as a top-severity risk and defend it with least
    privilege and meticulous sanitization: because injected commands run against the
    host OS (often as superuser on Unix) and can read or write critical files, exfiltrate
    data, tamper with logs, or take over the server, run each API as an unprivileged
    user with only the permissions it needs and never concatenate unparameterized
    user input into a system command or any CLI or interpreter — which may be application-specific
    and less defended than SQL.'
  derived_from_claims:
  - C00376
  - C00377
  - C00378
  - C00379
  - C00380
  - C00381
  - C00382
  - C00383
