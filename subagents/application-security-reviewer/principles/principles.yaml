- principle_id: P025
  statement: 'Defend against CSRF application-wide: verify the origin and referer
    headers against trusted origins as a first line (but not the only one, since an
    XSS on a trusted origin bypasses it), make anti-CSRF tokens the primary defense
    (cryptographic, per-session, returned on every request and verified server-side,
    built statelessly from user id, timestamp, and a server-only nonce for stateless
    APIs), never modify server state via GET, and enforce all of this through pre-route
    middleware with the token automatically injected on the client.'
