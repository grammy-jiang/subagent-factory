  applies_when:
  - reviewing how user input is incorporated into a query, command, or interpreter
    call
  - reviewing how an application builds queries or invokes interpreters and CLIs from
    user input
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P004
  statement: Manage a reported vulnerability by reproducing it first in an automated
    production-like staging environment (to confirm it is real and find the root cause),
    scoring it with a system such as CVSS (base, temporal, and environmental, customized
    for IoT or physical risk) while treating the score as one input alongside contracts
    and relationships, then resolving it with a permanent application-wide fix — opening
    a follow-up bug for any remaining surface rather than closing on a partial fix
    — and shipping a regression test with every closed bug.
  derived_from_claims:
  - C00406
  - C00407
  - C00408
  - C00409
  - C00441
  - C00442
  - C00443
  - C00444
  - C00445
