- principle_id: P003
  statement: Defend against injection by never letting a client send a query or command
    to be executed on the server, using prepared statements with bind variables as
    the first-line SQL defense (with database-specific escapers only as a fallback
    for unparameterizable queries), applying secure-by-default coding and least authority
    to every injection target (schedulers, compression and backup utilities, loggers,
    host-OS calls, interpreters, and dependencies), and whitelisting any unavoidable
    user commands together with an acceptable syntax.
  derived_from_claims:
  - C00371
  - C00372
  - C00373
  - C00374
  - C00375
  - C00474
