- principle_id: P031
  statement: 'Layer automated vulnerability discovery against production code, since
    even well-architected and reviewed applications still ship flaws: combine static
    analysis (source-level, configured for the OWASP top 10, strong on common patterns
    but weak on dynamic languages and noisy with false positives), dynamic analysis
    (post-execution, finding actual vulnerabilities and side-effects at higher cost),
    and vulnerability regression tests run on commit or push hooks — while knowing
    automation misses logic-specific and chained vulnerabilities.'
