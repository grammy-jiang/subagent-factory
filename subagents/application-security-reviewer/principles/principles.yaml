- principle_id: P013
  statement: Understand that XSS exists because applications execute scripts in users'
    browsers, that any dynamically created script modifiable by a user is a risk,
    and that its three OWASP categories (stored, reflected, DOM-based) can run without
    user interaction to steal session tokens for account takeover, exfiltrate data,
    or mount undetectable phishing — with stored XSS reaching many users and reflected
    XSS evading detection, and the risk extending to any client-side display technology.
  derived_from_claims:
  - C00343
