schema_version: principles-v1
principles:
- principle_id: P001
  statement: 'Defend the DOM against XSS by never passing unsanitized user data into
    it — treat DOM injection as a last resort and pass user data as text, preferring
    innerText over innerHTML — and by avoiding the javascript: URL scheme and text-to-DOM
    or text-to-script sinks (innerHTML, outerHTML, Blob, SVG, document.write, DOMParser.parseFromString,
    document.implementation), building nodes with createElement and appendChild, and
    sanitizing links through the browser''s built-in anchor handling and encodeURIComponent
    rather than a home-brewed solution, recognizing that complete sanitization is
    extremely hard.'
  derived_from_claims:
  - C00345
  - C00348
  - C00350
  - C00352
  - C00353
  - C00354
  - C00355
  - C00449
  - C00450
  - C00451
  - C00452
  - C00453
  - C00454
  - C00455
  confidence: high
  applies_when:
  - reviewing how user-supplied data is rendered into the DOM
  - reviewing or writing code that inserts user-supplied data or links into the DOM
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
