- principle_id: P007
  statement: Integrate open source dependencies securely by isolating risky code (a
    decentralized server or constrained environment over embedding it in core code),
    choosing the integration method by size, dependency chain, and upstream activity,
    avoiding one-click installers that run setup scripts as admin, and scanning the
    full transitive dependency tree against a CVE database — recognizing that package
    managers pull in unaudited recursive dependencies and have themselves been attack
    vectors through compromised maintainer credentials or malicious sub-dependencies.
  derived_from_claims:
  - C00391
  - C00392
  - C00393
  - C00394
  - C00395
  - C00396
  - C00397
  - C00398
  confidence: high
  applies_when:
  - selecting and wiring a third-party or open source dependency into an application
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P008
  statement: 'Secure the whole dependency tree through automation and pinning, because
    third-, fourth-, and deeper-party dependencies cannot be manually reviewed and
    each unique dependency and version must be checked: model the tree and scan it
    automatically against a long-lived CVE database such as NIST NVD, isolate risky
    packages (a dedicated server behind an HTTP/JSON boundary or hardware-defined
    process and memory limits), and audit-then-pin versions with shrinkwrapping and
    Git SHAs or a private mirror, knowing that a simple version lock neither stops
    a maintainer reusing a version number nor pins descendant dependencies.'
  derived_from_claims:
  - C00488
  - C00489
  - C00490
  - C00491
  - C00492
  - C00493
  - C00494
  - C00495
  confidence: high
