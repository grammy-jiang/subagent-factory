- principle_id: P029
  statement: 'Protect credentials and sensitive data: enforce password strength by
    entropy (reject common-list passwords and any derived from the user''s name, birthdate,
    or address rather than counting special characters), never store passwords in
    plain text but hash them with a deliberately slow algorithm such as BCrypt or
    PBKDF2, offer two-factor authentication (a hardware token beats SMS, and any 2FA
    beats none), and store PII or financial data in a legally compliant, non-abusable-on-breach
    form, outsourcing to a compliant specialist when appropriate.'
