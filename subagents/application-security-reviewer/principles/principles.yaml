    test_cases: []
- principle_id: P015
  statement: Understand and defend against denial of service across its classes —
    regex (catastrophic backtracking from greedy expressions), logical (targeting
    resource-intensive operations), and distributed (network-level traffic floods)
    — by identifying which server resources are most valuable, watching logs during
    suspected attacks, and testing DoS only in a local development environment so
    real users are not disrupted.
