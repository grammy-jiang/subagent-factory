- principle_id: P023
  statement: 'Avoid the core secure-coding anti-patterns: do not ship temporary mitigations
    without a planned permanent fix, do not rely on blacklists (prefer whitelists,
    easing their maintenance with vetting), do not launch unevaluated boilerplate
    or default framework configuration (which can leak version information or ship
    dangerously open), do not run a whole application under one over-privileged account
    (give each module least privilege), and do not tightly couple client and server
    (develop them independently over a predefined protocol).'
  derived_from_claims:
  - C00427
  - C00428
  - C00429
  - C00430
