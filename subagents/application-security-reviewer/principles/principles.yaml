- principle_id: P012
  statement: Use several reconnaissance techniques together because no single one
    is comprehensive, preferring cheap low-noise methods first (a zone-transfer attempt,
    then a dictionary of common subdomains) and treating noisy brute force as a last
    resort fired asynchronously, while paying special attention to less-scrutinized
    behind-the-scenes servers and keeping organized notes to prioritize.
