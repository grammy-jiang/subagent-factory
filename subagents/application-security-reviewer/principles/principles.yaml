- principle_id: P046
  statement: 'Output-encode untrusted data for its context and treat CSS as an attack
    vector: HTML entity encoding of the big-five characters lets user data display
    safely only inside a div-like node and does not protect script, CSS, or URL contexts;
    and because CSS can exfiltrate data through background:url GET requests and conditional
    selectors, prevent it by disallowing user-uploaded stylesheets, generating stylesheets
    server-side from permitted fields, or sanitizing HTTP-initiating CSS attributes.'
