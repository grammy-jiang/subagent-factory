- principle_id: P006
  statement: Discover API endpoints and payloads methodically — probe HTTP verbs against
    known resources, try OPTIONS, reverse-engineer the authentication scheme and token,
    start from common endpoints (sign in/up, password reset), and shrink an unknown
    value's search space by learning its rules — but obtain explicit owner permission
    first because verb brute-forcing can delete or alter data.
