  - triaging, scoring, and resolving a reported vulnerability
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P005
  statement: Prefer modern public-key-backed transport security for network APIs,
    validate key ownership, avoid plain symmetric-key use over networks, and use TLS
    over SSL whenever possible.
