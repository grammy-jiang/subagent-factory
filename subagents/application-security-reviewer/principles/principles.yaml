- principle_id: P016
  statement: Begin security in the architecture phase, before any code is written,
    by collecting and risk-evaluating all business requirements, building communication
    between security and engineering, and focusing on data flow — securing data in
    transit (require all network data encrypted, preferring TLS over deprecated SSL
    to thwart man-in-the-middle) and at rest from point A to point B — because a flaw
    fixed in design costs 30 to 60 times less than in production and re-architecture
    after adoption is severely limited.
