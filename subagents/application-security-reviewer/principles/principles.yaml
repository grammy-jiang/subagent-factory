    test_cases: []
- principle_id: P014
  statement: Recognize that CSRF abuses the browser's trust model (the browser attaches
    authentication data to a request regardless of where the link came from) to make
    an authenticated user issue requests unknowingly, combining privilege escalation
    with stealth, and that it can be delivered through links, src-bearing tags such
    as a 0-by-0 image that needs no interaction, and auto-submitting hidden forms
    that ride the victim's session and even reach internal-network servers.
