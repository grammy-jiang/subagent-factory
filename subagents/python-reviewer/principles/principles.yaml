    __getitem__, __setitem__, __delitem__, __contains__), where slicing passes a slice
    object as the key and an extended or multidimensional slice passes a tuple of
    slice and Ellipsis objects (multidimensional slicing and Ellipsis being reserved
    for third-party libraries such as numpy).
