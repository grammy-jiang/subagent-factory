- principle_id: P004
  statement: 'Adopt gradual typing: add type hints incrementally where they pay off
    (public APIs, complex data shapes), run a static checker such as Mypy in CI, and
    remember that hints have no runtime effect — they neither validate nor coerce
    values unless you add explicit runtime checks.'
