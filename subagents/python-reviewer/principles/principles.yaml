- principle_id: P015
  statement: Use __slots__ (listing the fixed instance attribute names) to replace
    the per-instance __dict__ with a compact layout for substantial memory savings
    when many instances are created, while being mindful that a slotted base's subclass
    must also define __slots__, that it is incompatible with multiple nonempty-slot
    bases, and that it removes the instance __dict__.
