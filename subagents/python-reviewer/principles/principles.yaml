- principle_id: P006
  statement: 'Treat multiple inheritance as a specialized tool for organizing type
    and interface relations or mixins rather than combining unrelated classes: name
    a mixin with a Mixin suffix, have it call super() and rely on a sibling for missing
    behavior, give cooperating mixins a common parent with default implementations,
    keep mixin-method signatures compatible, and always use super() so the cooperative
    call chain is not broken.'
