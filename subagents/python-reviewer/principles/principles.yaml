- principle_id: P012
  statement: Do not rely on __del__ for resource cleanup, since objects are reclaimed
    by reference counting plus cyclic GC at times you do not control (a reference
    cycle can prevent it firing); instead provide an explicit close() method with
    context-manager support, and use weakref to break cycles or hold caches and back-references.
