- principle_id: P005
  statement: 'Understand the Method Resolution Order (__mro__): a linear search order
    computed by C3 linearization in which a child precedes its parents and parents
    keep their written order (inconsistent hierarchies raise TypeError and object
    is last), where super() delegates to the next class on the instance''s MRO so
    which method runs depends on the instance''s type.'
