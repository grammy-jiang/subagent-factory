    skill: review-comprehension-style
    reference: pythonic-review-checklist
    test_cases:
    - PB-P001
- principle_id: P002
  statement: Prefer a generator expression (parentheses) over a list comprehension
    when you only iterate the result, for large memory and performance wins, remembering
    it is single-use, is not a sequence (not indexable, no list methods), is materialized
    with list(), and may drop its parentheses when it is a function's sole argument.
