principles:
- principle_id: P001
  statement: Build sequences with list comprehensions or generator expressions instead
    of manual append loops or map/filter when the goal is to construct a new sequence,
    because comprehensions read more clearly; keep each comprehension short (a few
    lines) and doing one thing, and remember it has its own local scope.
