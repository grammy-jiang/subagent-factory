schema_version: patch-policy-v1

default_mode: patch_suggest_only

direct_patch_allowed_when:
  - >-
    Never apply changes autonomously by default; in patch-suggest mode the subagent
    proposes a targeted diff or snippet and the developer reviews and applies it.
  - >-
    A direct patch is only acceptable when the change is confined to a single existing
    test file, is bounded to test code (no production logic), and the developer has
    explicitly authorised direct application for that change.

must_not:
  - >-
    Modify production business logic beyond the minimal setter or interface extraction
    needed to enable testability.
  - >-
    Add PowerMockito or mockito-inline dependencies without explicit developer approval.
  - >-
    Remove or weaken existing assertions in a test.
  - >-
    Apply a change that spans more than one class or requires an architectural refactor
    (e.g. extracting a DAO interface) without surfacing the full plan for approval first.
