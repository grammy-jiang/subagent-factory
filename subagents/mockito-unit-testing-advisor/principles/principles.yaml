schema_version: principles-v1
principles:

  - principle_id: PRP-001
    statement: >-
      Mock every external collaborator (database, SMTP, HTTP, file I/O) so that unit tests
      execute in isolation and complete in milliseconds; never let a unit test touch a real
      external resource, because that makes it an integration test and introduces
      non-determinism through varying state in those resources.
    derived_from_claims:
      - CL004
      - CL006
      - CL007
    confidence: high
    applies_when:
      - Writing a unit test for a class that has dependencies on databases, messaging,
        network services, or any other stateful external resource.
      - The goal is fast, deterministic feedback (TDD inner loop, CI pre-merge gate).
    does_not_apply_when:
      - Writing an integration test that intentionally verifies end-to-end behaviour
        against real infrastructure (e.g., a Spring integration test with a real data source).
      - The collaborator is a pure value object or utility with no external side effects.
    operational_mapping:
      profile_rule: true
      skill: test-double-selection
      reference: null
      test_cases:
        - PBT-001
        - PBT-002

  - principle_id: PRP-002
    statement: >-
      Declare mocks with the @Mock annotation and activate them by running the test class
      with @RunWith(MockitoJUnitRunner.class) (JUnit 4) or @ExtendWith(MockitoExtension.class)
      (JUnit 5); alternatively call MockitoAnnotations.openMocks(this) in @Before/@BeforeEach.
      This is the standard, declarative creation pattern; Mockito.mock() is reserved for
      programmatic creation where the annotation style is inconvenient.
    derived_from_claims:
      - CL008
      - CL009
    confidence: high
    applies_when:
      - Any JUnit-based Mockito test class that needs one or more mock collaborators.
    does_not_apply_when:
      - Test is run with @RunWith(SpringJUnit4ClassRunner.class) for Spring TestContext
        integration tests, where @MockBean (Spring Boot) or ReflectionTestUtils injection
        is the correct approach; MockitoJUnitRunner and SpringJUnit4ClassRunner cannot be
        combined on the same class.
    operational_mapping:
      profile_rule: true
      skill: mock-initialisation
      reference: null
      test_cases:
        - PBT-003

  - principle_id: PRP-003
    statement: >-
      Stub query methods (methods that return a value) using
      when(mock.method(args)).thenReturn(value). For exception scenarios on non-void methods
      use thenThrow(exception). Choose thenAnswer(answer) only when the return value must be
      computed dynamically from the arguments, and thenCallRealMethod() only for partial
      mocks of spies. Unstubbed mock methods silently return false, null, or 0; rely on this
      default only when the return value is irrelevant to the scenario under test.
    derived_from_claims:
      - CL012
      - CL013
      - CL014
    confidence: high
    applies_when:
      - Stubbing a collaborator method that returns a value so the class under test
        can proceed down a specific code path.
      - Controlling the return value for query methods in Arrange-Act-Assert tests.
    does_not_apply_when:
      - The method to stub is void — use the doThrow/doReturn/doAnswer family instead
        (see PRP-004).
      - The method belongs to the class under test; never stub the subject itself.
    operational_mapping:
      profile_rule: true
      skill: stub-query-methods
      reference: null
      test_cases:
        - PBT-004
        - PBT-005

  - principle_id: PRP-004
    statement: >-
      Verify void/command methods (methods that return nothing and act by side effect) using
      verify(mock).method(args) after the act phase. Void mock methods are auto-stubbed and
      never connect to the real implementation, so the only way to assert their invocation
      is via verify(). To make a void method throw an exception use
      doThrow(exception).when(mock).voidMethod(args) — the when().thenThrow() syntax is
      invalid for void methods.
    derived_from_claims:
      - CL015
      - CL016
      - CL020
      - CL024
    confidence: high
    applies_when:
      - The collaborator method under verification returns void and the contract under test
        is that a specific side-effecting call is (or is not) made.
      - Testing error-handling branches when a void DAO or service method fails.
    does_not_apply_when:
      - The method returns a value — use when/thenReturn stubbing and assert the result
        directly; avoid verify() on query methods as it couples tests to implementation.
    operational_mapping:
      profile_rule: true
      skill: interaction-verification
      reference: null
      test_cases:
        - PBT-006
        - PBT-007

  - principle_id: PRP-005
    statement: >-
      Plain Mockito (without the mockito-inline extension) cannot mock final classes or
      methods, static methods, enums, private methods, equals()/hashCode(), primitive types,
      or anonymous classes. When a dependency under test falls into one of these categories,
      the preferred response is to refactor the production code to remove the constraint
      (e.g., extract an interface, introduce an indirection, or replace static calls with
      instance delegation) rather than reaching for PowerMockito. Using PowerMockito to mock
      private or static members violates encapsulation and produces brittle tests.
    derived_from_claims:
      - CL010
      - CL011
    confidence: high
    applies_when:
      - Using standard Mockito without the mockito-inline module (Mockito 3 and earlier,
        or when the inline mock maker is not on the classpath).
      - The class or method to be mocked is declared final, static, or private.
    does_not_apply_when:
      - mockito-inline (Mockito 4+) is on the classpath, which enables final-class mocking
        natively without PowerMockito.
      - The team has explicitly accepted the PowerMockito dependency after evaluating the
        refactoring cost.
    operational_mapping:
      profile_rule: true
      skill: mockito-limitations
      reference: null
      test_cases:
        - PBT-008

  - principle_id: PRP-006
    statement: >-
      In a layered Spring web application (controller / service / DAO), each layer's unit
      tests must mock the layer directly below it and construct the class under test
      directly — without loading a Spring ApplicationContext. The controller test mocks the
      service, the service test mocks the DAO interface, and the DAO test mocks JdbcTemplate
      (or the Spring data template in use). No layer's unit test starts the real
      implementation of another layer. To enable service-layer mocking, introduce a DAO
      interface between the service and its data-access implementation; Mockito then mocks
      that interface, completely decoupling the service test from any database.
    derived_from_claims:
      - CL041
      - CL042
      - CL021
      - CL023
      - CL025
    confidence: high
    applies_when:
      - Unit testing any class in a layered Spring MVC application (web / service / DAO).
      - The goal is to test a single layer in complete isolation from Spring DI and from
        real infrastructure.
    does_not_apply_when:
      - Writing a Spring integration test that intentionally loads the full ApplicationContext
        to verify cross-layer wiring or database interaction.
      - Using MockMvc with a full WebApplicationContext to verify HTTP-level behaviour
        (that is an integration or slice test, not a plain unit test).
    operational_mapping:
      profile_rule: true
      skill: spring-unit-isolation
      reference: null
      test_cases:
        - PBT-009
        - PBT-010
        - PBT-011

  - principle_id: PRP-007
    statement: >-
      Use verify() invocation-count modes (times(n), never(), atLeastOnce(), atLeast(n),
      atMost(n), only()) to assert precisely how many times a collaborator method was called.
      Use ArgumentCaptor.forClass(T.class) with captor.capture() inside a verify() call to
      capture the actual arguments passed to a mock method; getAllValues() returns captured
      arguments in invocation order, enabling assertion of argument content and sequencing.
      Apply verifyNoMoreInteractions() selectively after all expected verify() calls to
      guard against unexpected extra calls; avoid it as a blanket default because it
      over-specifies interaction and makes tests fragile.
    derived_from_claims:
      - CL016
      - CL017
      - CL026
      - CL019
    confidence: high
    applies_when:
      - Asserting that a command method was called exactly n times (or never) under a
        given scenario.
      - Verifying that the correct argument values or ordering were passed to a collaborator,
        especially when the argument is constructed internally (e.g., SQL parameter arrays).
      - Guarding a specific code path against unintended side-effecting calls.
    does_not_apply_when:
      - The test is already failing a return-value assertion; adding interaction assertions
        on top would make it test the same thing twice and couple the test to implementation.
      - verifyNoMoreInteractions() would be applied globally as a default to every test
        method; it should only be used when unexpected calls are a meaningful risk in the
        specific scenario.
    operational_mapping:
      profile_rule: true
      skill: interaction-verification
      reference: null
      test_cases:
        - PBT-012
        - PBT-013
