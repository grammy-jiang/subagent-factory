schema_version: golden-tests-v1
subagent_slug: mockito-unit-testing-advisor
generated_at: '2026-06-14'
golden_tests:
- test_id: GT-001
  prompt: Writing a unit test for a class that has dependencies on databases, messaging, network services,
    or any other stateful external resource. What do you advise, and why?
  principle_coverage:
  - PRP-001
  expected_route: invoke
  minimum_output: Mock every external collaborator (database, SMTP, HTTP, file I/O) so that unit tests
    execute in isolation and complete in milliseconds; never let a unit test touch a real external resource,
    because that makes it an integration test and introduces non-determinism through varying state in
    those resources
- test_id: GT-002
  prompt: Any JUnit-based Mockito test class that needs one or more mock collaborators. What do you advise,
    and why?
  principle_coverage:
  - PRP-002
  expected_route: invoke
  minimum_output: Declare mocks with the @Mock annotation and activate them by running the test class
    with @RunWith(MockitoJUnitRunner.class) (JUnit 4) or @ExtendWith(MockitoExtension.class) (JUnit 5);
    alternatively call MockitoAnnotations.openMocks(this) in @Before/@BeforeEach. This is the standard,
    declarative creation pattern; Mockito.mock() is reserved for programmatic creation where the annotation
    style is inconvenient
- test_id: GT-003
  prompt: Stubbing a collaborator method that returns a value so the class under test can proceed down
    a specific code path. What do you advise, and why?
  principle_coverage:
  - PRP-003
  expected_route: invoke
  minimum_output: Stub query methods (methods that return a value) using when(mock.method(args)).thenReturn(value).
    For exception scenarios on non-void methods use thenThrow(exception). Choose thenAnswer(answer) only
    when the return value must be computed dynamically from the arguments, and thenCallRealMethod() only
    for partial mocks of spies. Unstubbed mock methods silently return false, null, or 0; rely on this
    default only when the return value is irrelevant to the scenario under test
- test_id: GT-004
  prompt: The collaborator method under verification returns void and the contract under test is that
    a specific side-effecting call is (or is not) made. What do you advise, and why?
  principle_coverage:
  - PRP-004
  expected_route: invoke
  minimum_output: Verify void/command methods (methods that return nothing and act by side effect) using
    verify(mock).method(args) after the act phase. Void mock methods are auto-stubbed and never connect
    to the real implementation, so the only way to assert their invocation is via verify(). To make a
    void method throw an exception use doThrow(exception).when(mock).voidMethod(args) — the when().thenThrow()
    syntax is invalid for void methods
- test_id: GT-005
  prompt: Using standard Mockito without the mockito-inline module (Mockito 3 and earlier, or when the
    inline mock maker is not on the classpath). What do you advise, and why?
  principle_coverage:
  - PRP-005
  expected_route: invoke
  minimum_output: Plain Mockito (without the mockito-inline extension) cannot mock final classes or methods,
    static methods, enums, private methods, equals()/hashCode(), primitive types, or anonymous classes.
    When a dependency under test falls into one of these categories, the preferred response is to refactor
    the production code to remove the constraint (e.g., extract an interface, introduce an indirection,
    or replace static calls with instance delegation) rather than reaching for PowerMockito. Using PowerMockito
    to mock private or static members violates encapsulation and produces brittle tests
- test_id: GT-006
  prompt: Unit testing any class in a layered Spring MVC application (web / service / DAO). What do you
    advise, and why?
  principle_coverage:
  - PRP-006
  expected_route: invoke
  minimum_output: In a layered Spring web application (controller / service / DAO), each layer's unit
    tests must mock the layer directly below it and construct the class under test directly — without
    loading a Spring ApplicationContext. The controller test mocks the service, the service test mocks
    the DAO interface, and the DAO test mocks JdbcTemplate (or the Spring data template in use). No layer's
    unit test starts the real implementation of another layer. To enable service-layer mocking, introduce
    a DAO interface between the service and its data-access implementation; Mockito then mocks that interface,
    completely decoupling the service test from any database
- test_id: GT-007
  prompt: Asserting that a command method was called exactly n times (or never) under a given scenario.
    What do you advise, and why?
  principle_coverage:
  - PRP-007
  expected_route: invoke
  minimum_output: Use verify() invocation-count modes (times(n), never(), atLeastOnce(), atLeast(n), atMost(n),
    only()) to assert precisely how many times a collaborator method was called. Use ArgumentCaptor.forClass(T.class)
    with captor.capture() inside a verify() call to capture the actual arguments passed to a mock method;
    getAllValues() returns captured arguments in invocation order, enabling assertion of argument content
    and sequencing. Apply verifyNoMoreInteractions() selectively after all expected verify() calls to
    guard against unexpected extra calls; avoid it as a blanket default because it over-specifies interaction
    and makes tests fragile
negative_routing_tests:
- test_id: NR-001
  prompt: Writing an integration test that intentionally verifies end-to-end behaviour against real infrastructure
    (e.g., a Spring integration test with a real data source). Can you handle this for us?
  principle_coverage:
  - PRP-001
  expected_route: do_not_invoke
  must_not_do:
  - Answer as if the request were in scope when it is not
- test_id: NR-002
  prompt: Test is run with @RunWith(SpringJUnit4ClassRunner.class) for Spring TestContext integration
    tests, where @MockBean (Spring Boot) or ReflectionTestUtils injection is the correct approach; MockitoJUnitRunner
    and SpringJUnit4ClassRunner cannot be combined on the same class. Can you handle this for us?
  principle_coverage:
  - PRP-002
  expected_route: do_not_invoke
  must_not_do:
  - Answer as if the request were in scope when it is not
- test_id: NR-003
  prompt: The method to stub is void — use the doThrow/doReturn/doAnswer family instead (see PRP-004).
    Can you handle this for us?
  principle_coverage:
  - PRP-003
  expected_route: do_not_invoke
  must_not_do:
  - Answer as if the request were in scope when it is not
- test_id: NR-004
  prompt: The method returns a value — use when/thenReturn stubbing and assert the result directly; avoid
    verify() on query methods as it couples tests to implementation. Can you handle this for us?
  principle_coverage:
  - PRP-004
  expected_route: do_not_invoke
  must_not_do:
  - Answer as if the request were in scope when it is not
- test_id: NR-005
  prompt: mockito-inline (Mockito 4+) is on the classpath, which enables final-class mocking natively
    without PowerMockito. Can you handle this for us?
  principle_coverage:
  - PRP-005
  expected_route: do_not_invoke
  must_not_do:
  - Answer as if the request were in scope when it is not
- test_id: NR-006
  prompt: Writing a Spring integration test that intentionally loads the full ApplicationContext to verify
    cross-layer wiring or database interaction. Can you handle this for us?
  principle_coverage:
  - PRP-006
  expected_route: do_not_invoke
  must_not_do:
  - Answer as if the request were in scope when it is not
- test_id: NR-007
  prompt: The test is already failing a return-value assertion; adding interaction assertions on top would
    make it test the same thing twice and couple the test to implementation. Can you handle this for us?
  principle_coverage:
  - PRP-007
  expected_route: do_not_invoke
  must_not_do:
  - Answer as if the request were in scope when it is not
