schema_version: principle-behaviour-tests-v1
subagent_slug: mockito-unit-testing-advisor

principle_behaviour_tests:

  - test_id: PBT-001
    principle_id: PRP-001
    prompt: >-
      Write a unit test for OrderService.placeOrder(), which calls a real JDBC
      OrderDao and an SMTP MailSender.
    expected_behaviour:
      - "replaces OrderDao and MailSender with @Mock instances"
      - "no real database, JDBC, or SMTP connection is opened"
      - "cites PRP-001"
    must_not:
      - "wires a real DataSource or live MailSender into the test"

  - test_id: PBT-002
    principle_id: PRP-001
    prompt: >-
      My unit test for a service is slow and intermittently fails when the CI box
      has no network. How do I make it deterministic?
    expected_behaviour:
      - "identifies the real external collaborator as the cause"
      - "recommends replacing it with a Mockito mock so the test runs in milliseconds offline"
    must_not:
      - "advises adding retries or sleeps instead of mocking the collaborator"

  - test_id: PBT-003
    principle_id: PRP-002
    prompt: >-
      My @Mock fields are null at runtime with a NullPointerException. What is wrong?
    expected_behaviour:
      - "explains @Mock fields must be activated by MockitoJUnitRunner or initMocks(this)"
      - "cites PRP-002"
    must_not:
      - "suggests combining MockitoJUnitRunner and SpringJUnit4ClassRunner on the same class"

  - test_id: PBT-004
    principle_id: PRP-003
    prompt: >-
      How do I make a mocked BookDao.findById(id) return a specific Book in my test?
    expected_behaviour:
      - "uses when(dao.findById(id)).thenReturn(book) to stub the query method"
    must_not:
      - "uses doReturn/doThrow syntax where when().thenReturn() is the idiomatic choice"

  - test_id: PBT-005
    principle_id: PRP-003
    prompt: >-
      I need a stubbed method to throw an exception on the second call but return a
      value on the first. What stubbing action do I use?
    expected_behaviour:
      - "explains the thenReturn/thenThrow/thenAnswer/thenCallRealMethod stubbing actions"
      - "chains consecutive stubs for the first-then-second behaviour"
    must_not:
      - "claims a single when().thenReturn() can express different per-call behaviour"

  - test_id: PBT-006
    principle_id: PRP-004
    prompt: >-
      How do I assert that auditLog.record(event) — a void method — was actually called?
    expected_behaviour:
      - "uses verify(auditLog).record(event) to assert the interaction"
      - "cites PRP-004"
    must_not:
      - "tries to stub the void method with when().thenReturn()"

  - test_id: PBT-007
    principle_id: PRP-004
    prompt: >-
      I want my mocked void method dao.delete(id) to throw an exception. How?
    expected_behaviour:
      - "uses doThrow(ex).when(dao).delete(id) for the void-method exception stub"
    must_not:
      - "uses when(dao.delete(id)).thenThrow(ex), which is invalid for a void method"

  - test_id: PBT-008
    principle_id: PRP-005
    prompt: >-
      Generate a plain-Mockito mock of the final class PaymentGateway so I can test
      against it.
    expected_behaviour:
      - "states plain Mockito cannot mock a final class"
      - "recommends refactoring (e.g. extract an interface) instead of PowerMockito"
      - "cites PRP-005"
    must_not:
      - "emits Mockito.mock(PaymentGateway.class) as if it would work"

  - test_id: PBT-009
    principle_id: PRP-006
    prompt: >-
      Write a unit test for a Spring MVC controller whose method delegates to a
      BookService.
    expected_behaviour:
      - "mocks BookService (the layer directly below) and constructs the controller directly"
      - "loads no Spring ApplicationContext"
      - "cites PRP-006"
    must_not:
      - "loads applicationContext.xml or uses @ContextConfiguration in a unit test"

  - test_id: PBT-010
    principle_id: PRP-006
    prompt: >-
      How should my service-layer unit test handle the DAO that talks to the database?
    expected_behaviour:
      - "mocks the DAO interface so the service is tested without a real database"
      - "recommends a DAO interface to decouple the service from the database"
    must_not:
      - "tests the service against a real or in-memory database in a unit test"

  - test_id: PBT-011
    principle_id: PRP-006
    prompt: >-
      Review this test: it uses @RunWith(SpringJUnit4ClassRunner.class),
      @ContextConfiguration, and an @Autowired DataSource, and the author calls it a unit test.
    expected_behaviour:
      - "identifies it as an integration test, not a unit test"
      - "explains a unit test mocks the layer below and loads no real context"
    must_not:
      - "accepts the class as a valid unit test"

  - test_id: PBT-012
    principle_id: PRP-007
    prompt: >-
      How do I assert that notifier.send() was called exactly twice and never with null?
    expected_behaviour:
      - "uses verify(notifier, times(2)).send(...) and an appropriate verify mode"
    must_not:
      - "asserts the count with manual counters instead of verify() invocation modes"

  - test_id: PBT-013
    principle_id: PRP-007
    prompt: >-
      I need to assert the exact User object passed to dao.save(user). How?
    expected_behaviour:
      - "uses ArgumentCaptor.forClass(User.class), capture(), and getValue()/getAllValues()"
      - "cites PRP-007"
    must_not:
      - "asserts on the captor before capturing via a verify() call"
