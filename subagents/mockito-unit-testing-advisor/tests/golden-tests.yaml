schema_version: golden-tests-v1
subagent_slug: mockito-unit-testing-advisor

golden_tests:

  - test_id: GT-001
    description: >-
      Produce mode — generate a unit test for a Spring service with a mocked DAO.
    routing: positive
    input:
      mode: produce
      caller_message: >-
        I have a RegistrationService that depends on a RegistrationDao interface.
        The service has a register(User user) method that calls dao.create(user).
        Please produce a JUnit 4 unit test for the happy-path scenario where
        dao.create() succeeds.
      context:
        layer: service
        class_under_test: RegistrationService
        dependencies:
          - RegistrationDao (interface, method: void create(User user))
    expected:
      routed_to: mockito-unit-testing-advisor
      mode_activated: produce
      output_must_contain:
        - "@RunWith(MockitoJUnitRunner.class)"
        - "@Mock"
        - "RegistrationDao"
        - "when("
        - "verify("
      output_must_not_contain:
        - "@ContextConfiguration"
        - "DataSource"
        - "PowerMockito"
      principle_references:
        - PRP-002
        - PRP-003
        - PRP-006

  - test_id: GT-002
    description: >-
      Advise mode — explain how to verify a void method call with ArgumentCaptor.
    routing: positive
    input:
      mode: advise
      caller_message: >-
        My DAO has a void insert(String sql, Object[] params) method. I want to
        verify it was called with params in the right order. How do I use
        ArgumentCaptor for that?
      context: {}
    expected:
      routed_to: mockito-unit-testing-advisor
      mode_activated: advise
      output_must_contain:
        - "ArgumentCaptor"
        - "getAllValues"
        - "verify"
        - "capture"
      output_must_not_contain:
        - "PowerMockito"
        - "@ContextConfiguration"
      principle_references:
        - PRP-007

  - test_id: GT-004
    description: >-
      Review mode — identify anti-pattern where integration test is submitted as a unit test.
    routing: positive
    input:
      mode: review
      caller_message: >-
        Please review this test class. It uses @RunWith(SpringJUnit4ClassRunner.class),
        @ContextConfiguration("classpath:applicationContext-test.xml"), and
        @Autowired DataSource dataSource. I consider it a unit test.
      context:
        provided_test_class: |
          @RunWith(SpringJUnit4ClassRunner.class)
          @ContextConfiguration("classpath:applicationContext-test.xml")
          public class UserServiceTest {
              @Autowired DataSource dataSource;
              @Autowired UserService userService;
              @Test public void testCreate() { userService.create(new User()); }
          }
    expected:
      routed_to: mockito-unit-testing-advisor
      mode_activated: review
      output_must_contain:
        - "integration test"
        - "not a unit test"
      output_must_not_contain:
        - "This is a unit test"
      principle_references:
        - PRP-001
        - PRP-006

negative_routing_tests:

  - test_id: GT-003
    description: >-
      Negative routing — request to mock a final class with plain Mockito.
    routing: negative
    input:
      mode: produce
      caller_message: >-
        I need to mock a final class FinalEmailClient using plain Mockito.
        Please generate the mock setup.
      context:
        class_under_test: FinalEmailClient
        is_final: true
    expected:
      routed_to: mockito-unit-testing-advisor
      mode_activated: produce
      output_must_not_contain:
        - "Mockito.mock(FinalEmailClient.class)"
        - "mock(FinalEmailClient"
      output_must_contain:
        - "cannot mock"
        - "final"
        - "refactor"
      refusal_reason: >-
        Plain Mockito cannot mock final classes (PRP-005, CL010). The advisor must
        refuse to generate the mock and recommend refactoring the production design
        (e.g., extract an interface) instead of using PowerMockito.
      principle_references:
        - PRP-005
