# Q17 — Source of truth
q17_source_of_truth: >
  Official Mockito documentation and source (https://github.com/mockito/mockito)
  and the Spring Framework Reference Documentation are the authoritative sources
  named in the book. The book itself (Sujoy Acharya, 'Mockito for Spring', Packt 2015)
  is a secondary practical guide; API behaviour details should always be confirmed
  against the version-specific Mockito and Spring javadoc, because the book targets
  Spring 4 / Mockito 2.0.2-beta and API details may differ in later versions.
# Source anchor: t0061 (Resources: Spring Framework Reference Documentation),
#   t0085 (Mockito GitHub), t0097 (companion books for advanced topics)

# Q18 — Volatile / likely to drift
q18_volatile: >
  All version-specific API details are volatile: Mockito 2.x → 3.x → 4.x / 5.x
  introduced inline mocking (final classes mockable by default), new annotation
  support (@ExtendWith for JUnit 5 / Mockito JUnit 5 extension), and deprecated
  MockitoJUnitRunner in favour of MockitoExtension. Spring 5/6 dropped
  @TransactionConfiguration, renamed MockMvc setup APIs, and the book's
  Eclipse/Luna setup steps are entirely obsolete. The conceptual core (stub,
  verify, ArgumentCaptor, layer isolation) is stable; all concrete API calls and
  setup instructions should be verified against the version in use.
# Source metadata: volatility=low (conceptual), but review_cadence=annual is appropriate
#   because ecosystem (Mockito, Spring, JUnit) evolves rapidly.

