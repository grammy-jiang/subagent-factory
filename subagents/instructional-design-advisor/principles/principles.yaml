schema_version: principles-v1
principles:
- principle_id: P001
  statement: Use taxonomy as an adaptable analytic heuristic, not a literal reality,
    source of educational aims, guaranteed solution, or unique teaching prescription.
  derived_from_claims:
  - C03642
  - C03643
  - C03646
  - C03647
  - C03648
  - C03649
  - C03650
  - C03651
  - C03652
  - C03653
  - C03654
  - C03655
  - C05008
  - C05009
  confidence: medium
  applies_when:
  - Applying or adapting the framework for curriculum, instruction, assessment, or
    alignment.
  - Choosing or translating classifications for an instructional goal.
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P002
  statement: 'Diagnose the cause before prescribing a fix: extraneous processing is
    caused by confusing instructional design, essential processing by the inherent
    complexity of the material, and generative underuse by an unmotivating communication
    style. Each of the three scenarios has a different remedy.'
  derived_from_claims:
  - C06252
  - C06253
  - C06254
  - C06255
  - C06323
  - C06330
  - C06331
  - C06332
  - C06333
  - C06398
  - C06399
  - C06400
  confidence: high
  applies_when:
  - a lesson underperforms and a design change must be chosen
  - a lesson is underperforming and a remedy must be chosen
  - a lesson is judged too hard, too dense, or too passive
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P003
  statement: Keep the unit as the design focus — small enough to guide day-to-day
    teaching, large enough to avoid isolated lessons — while designing course syllabi
    and programme frameworks backward with the same elements so they serve as a blueprint
    for all units and their connections.
  derived_from_claims:
  - C00040
  - C00041
  - C01062
  - C01063
  - C03355
  - C03356
  - C03357
  - C03358
  - C03359
  confidence: high
  applies_when:
  - choosing the grain size at which to design for understanding
  - relating unit design to macro design
  - A substantive objective requires several lessons, materials, activities, or assessment
    opportunities.
  operational_mapping:
    profile_rule: true
- principle_id: P004
  statement: Ground any claim that instruction is adequate in evidence about what
    students actually learn and how much they grow, not in demand, enrolment, or satisfaction,
    because input-and-resource measures of excellence do not answer the question.
  derived_from_claims:
  - C02354
  - C02361
  - C02362
  - C02363
  - C02391
  - C06769
  - C06776
  - C06777
  - C06778
  confidence: high
  applies_when:
  - assessing the quality of a course, programme, or institution
  - course ratings or learner preference are offered as evidence of effectiveness
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P005
  statement: Add prerequisite instruction for demonstrated deficits, move broadly
    mastered capabilities into entry checks, and branch learners to only the teaching
    or review their profiles warrant.
  derived_from_claims:
  - C03849
  - C05348
  - C05349
  - C05350
  - C05351
  - C05523
  - C05524
  - C05695
  - C05696
  confidence: high
  applies_when:
  - an assumed prerequisite proves not to be held by the learners
  - Readiness and prior mastery vary materially across target learners.
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P006
  statement: Prefer replicated results synthesized across studies — review journals,
    handbooks, and meta-analyses — over any single study, and note that meta-analysis
    also pinpoints the conditions under which an effect is strong.
  derived_from_claims:
  - C06158
  - C06166
  - C06167
  - C06431
  - C06432
  - C06433
  - C06951
  - C06953
  - C06956
  confidence: high
  applies_when:
  - two candidate techniques are backed by different amounts of evidence
  - appraising the evidence behind a proposed method
  - weighing competing evidence about an instructional method
  operational_mapping:
    profile_rule: true
- principle_id: P007
  statement: Design against the three assumptions of the cognitive theory of multimedia
    learning — dual channels, limited capacity, active processing — and reject designs
    that implicitly assume a single-channel, unlimited-capacity, passive learner.
  derived_from_claims:
  - C06249
  - C06260
  - C06261
  - C06262
  - C06271
  - C06272
  - C06396
  - C06397
  - C06401
  confidence: high
  applies_when:
  - reviewing a busy, dense, or heavily decorated presentation
  - a design assumes modality does not matter as long as information is presented
  - explaining why a design will or will not work
  - choosing among media and layout options
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P008
  statement: Check alignment with a three-column worksheet — every primary goal, the
    assessment that will show it was achieved, and the activities students need to
    achieve it — because that is what catches the easy trap of giving lip service
    to a goal while teaching in a way that does not support it.
  derived_from_claims:
  - C01641
  - C01642
  - C01643
  - C01644
  - C01645
  - C01650
  - C02693
  - C02694
  - C02695
  confidence: medium
  applies_when:
  - reviewing a constructively aligned course or programme
  - verifying that a design's components actually support each other
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P009
  statement: Ensure students understand what the learning eventually requires them
    to do, since knowing the topic, readings, activity directions, and that a test
    is coming does not suffice to focus attention and guide effort, and give them
    the key questions and performance specifics as early as possible.
  derived_from_claims:
  - C00761
  - C00762
  - C00765
  - C00768
  - C00863
  - C00864
  - C03455
  - C03456
  confidence: high
  applies_when:
  - communicating expectations at the start of a unit
  - launching a unit built around a text or body of content
  - structuring the run-up to a culminating task
  - A complex product unfolds through dependent stages.
  operational_mapping:
    profile_rule: true
- principle_id: P010
  statement: Choose representative samples of objectives within each outcome domain
    at intermediate planning levels rather than listing complete performance objectives
    everywhere, while recognising the fuller procedure can be followed and is sometimes
    desirable.
  derived_from_claims:
  - C03130
  - C03131
  - C03132
  - C03138
  - C03139
  - C03140
  - C03141
  - C04209
  confidence: high
  applies_when:
  - Translating long-range goals into unit or lesson objectives.
  - full enumeration at every planning level would be impractical
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P011
  statement: 'Recognize that rules for teaching mental operations are conditional
    rather than absolute: a method that succeeds under one set of conditions may fail
    under another, so state the conditions with the rule.'
  derived_from_claims:
  - C06465
  - C06466
  - C06502
  - C06509
  - C06906
  - C06907
  - C06944
  - C07236
  confidence: high
  applies_when:
  - advising on or reviewing any application of a multimedia principle
  - giving any principle-based recommendation
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P012
  statement: 'Match the assessment procedure to the kind of learning: personal reflections,
    portfolios, and problem-based performance for learning how to learn; interest,
    attitude, or value questionnaires for caring; before-and-after self-confidence
    instruments and teammate reports for the human dimension; concept maps, interdisciplinary
    cases, and capstones for integration; and simulations, demonstrations, team projects,
    and case studies judged against clear criteria for application.'
  derived_from_claims:
  - C01930
  - C01931
  - C01932
  - C01934
  - C01950
  - C01951
  - C02801
  - C02802
  confidence: medium
  applies_when:
  - selecting among examinations, essays, short answers, and objective formats
  - a course needs evidence for a non-traditional learning goal
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P013
  statement: Understand backward design as called backward only because many teachers
    begin with the means, and follow its order — desired results, then the evidence
    needed to determine they were achieved, then the enabling knowledge and skill,
    and only then the teaching — since objectives become the criteria by which materials,
    content, procedures, and tests are chosen.
  derived_from_claims:
  - C00081
  - C00083
  - C00086
  - C01297
  - C01298
  - C01299
  - C03800
  confidence: high
  applies_when:
  - designing learning for any audience
  - explaining or applying the method's sequence
  - starting the design of any course, topic, or lesson
  operational_mapping:
    profile_rule: true
- principle_id: P014
  statement: Sort content into three nested priority tiers — worth being familiar
    with, important to know and do, and the innermost big ideas and core tasks — because
    a course always contains more content than can reasonably be addressed.
  derived_from_claims:
  - C00276
  - C00278
  - C00279
  - C03101
  - C03102
  - C03103
  - C03104
  confidence: high
  applies_when:
  - prioritizing the content of a unit or course
  - The number or breadth of possible objectives exceeds available instructional time.
  operational_mapping:
    profile_rule: true
- principle_id: P015
  statement: 'Design for a schematic pictorial model, not a photographic copy: the
    mental representation the learner builds is a structured spatial abstraction,
    so visual realism beyond what the structure requires buys nothing.'
  derived_from_claims:
  - C06306
  - C06307
  - C06552
  - C06553
  - C06554
  - C06555
  - C06556
  confidence: high
  applies_when:
  - choosing the fidelity or realism level of a graphic
  - the instructional goal is conceptual understanding
  - a highly realistic simulation or interface is being proposed
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P016
  statement: Anchor assessment in authentic tasks — realistic, demanding judgment
    and innovation on an unstructured problem, requiring the student to do the subject,
    replicating a real context with its constraints, purposes, and audiences, and
    exercising a whole repertoire rather than isolated elements — because authentic
    tasks supply direction, coherence, and motivation for daily work.
  derived_from_claims:
  - C00312
  - C00313
  - C02576
  - C02577
  - C02578
  - C02579
  confidence: high
  applies_when:
  - identifying the culminating demands of a subject
  - designing the major assessments of a course
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P017
  statement: Require explicit criteria for evaluation, using internal consistency
    for checking and external standards for critique, and identify strengths and weaknesses
    before judgment.
  derived_from_claims:
  - C00670
  - C03291
  - C03292
  - C03293
  - C03294
  - C03295
  confidence: high
  applies_when:
  - scoring open-ended prompts and performance tasks
  - A learner must judge a plan, argument, product, method, or solution.
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P018
  statement: Write each standard on a rubric scale as a description of what performance
    at that level looks like rather than as a bare numeric label, and derive the criteria
    from the verbs in the learning goal — an application goal naming design, construct,
    and assess yields three criteria clusters, each with its own multi-point standards.
  derived_from_claims:
  - C00675
  - C00676
  - C02592
  - C02593
  - C02594
  - C02595
  confidence: high
  applies_when:
  - building a scoring tool
  - building criteria and standards for a course or an assignment
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P019
  statement: Prompt each example with attention-focusing information linking its specific
    attributes to the labels the definition uses, then fade that prompting in the
    later stages, because constantly available help lets learners stop studying examples
    and gives them the illusion of understanding while fading is what produces the
    mental effort real understanding requires.
  derived_from_claims:
  - C00812
  - C00813
  - C00814
  - C07523
  - C07524
  - C07525
  confidence: high
  applies_when:
  - teaching a strategy or routine
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P020
  statement: Answer the coverage problem by identifying the fundamental knowledge
    of the subject, ensuring students master that, and teaching them how to keep learning
    afterwards, since no course covers everything and cramming more in does not produce
    learning that lasts.
  derived_from_claims:
  - C01228
  - C01229
  - C02483
  - C02502
  - C02504
  - C02505
  confidence: high
  applies_when:
  - making the depth decision under score pressure
  - a teacher objects that there is no room for new kinds of learning
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P021
  statement: 'Protect criterion-based outcome judgement from administrative constraints:
    separate relative selection from achievement, use valid supervised performances
    when invigilation is mandated, and convert qualitative grades to required numbers
    only after substantive judgement.'
  derived_from_claims:
  - C01646
  - C01647
  - C02090
  - C02091
  - C02092
  - C02401
  confidence: medium
  applies_when:
  - large classes or institutional rules constrain alignment
  - grading, invigilation, or reporting policy constrains an aligned assessment
  - designing or revising a course's grading and assessment system
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P022
  statement: Plan for adjustment in light of goals, feedback, and predictable problems,
    since a plan impervious to feedback is not a virtue and excellent results are
    unreachable without improved diagnostic skill and adaptive planning.
  derived_from_claims:
  - C00031
  - C00039
  - C00772
  - C00773
  - C03048
  confidence: high
  applies_when:
  - teaching a designed unit and receiving evidence of learning
  - reacting to diagnostic or formative data
  - a design is being executed
  operational_mapping:
    profile_rule: true
- principle_id: P023
  statement: Recognize that no additional fact tells the learner which fact to use
    when — that requires understanding of essentials, purpose, audience, strategy,
    and tactics — so drill and direct instruction can build automaticity but cannot
    by themselves make a learner able.
  derived_from_claims:
  - C00151
  - C00152
  - C00528
  - C06212
  - C06213
  confidence: high
  applies_when:
  - deciding whether more content or more application is needed
  - choosing between drill-centred and understanding-centred skill instruction
  - a design relies on prompt-response-feedback loops to teach conceptual material
  operational_mapping:
    profile_rule: true
- principle_id: P024
  statement: Have the component concepts and rules recalled just before the new learning,
    since most new learning is the combining of previously learned ideas and they
    must be highly accessible at that moment — using a recognition or, better, a recall
    question, and a chain of such questions to lead the learner toward the new rule.
  derived_from_claims:
  - C04234
  - C04235
  - C06282
  - C06299
  - C06308
  confidence: high
  applies_when:
  - the new capability is assembled from prior concepts and rules
  - the lesson depends on background the learner already possesses
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P025
  statement: Plan instruction deliberately at nested levels — lesson inside topic
    inside course or curriculum — rather than leaving it to moment-to-moment improvisation,
    since the authors hold that unplanned and undirected learning is very likely to
    leave many individuals unable to derive personal satisfaction from living in society.
  derived_from_claims:
  - C00996
  - C00997
  - C03674
  - C03678
  - C03681
  confidence: high
  applies_when:
  - defending planning against spontaneity
  - any instruction intended to be effective rather than incidental
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P026
  statement: 'Reject the search for a universally best medium: research on media utilisation
    supports the conclusion that no one medium is superior for all outcomes and all
    learners, and media cannot be identified as particularly effective for a single
    subject at a single grade level — both design work and research suggest selecting
    media for specific purposes within a single lesson.'
  derived_from_claims:
  - C04299
  - C04300
  - C06198
  - C06200
  - C06202
  confidence: high
  applies_when:
  - a medium is proposed as generally superior for a subject or grade
  - an evaluation is framed as one delivery technology versus another
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P027
  statement: 'Require a defined concept to be demonstrated rather than stated: classifying
    an instance in accordance with the definition is a different mental process from
    reciting the definition, and asking what a term means is always open to the learner
    repeating a verbalisation without knowing the meaning.'
  derived_from_claims:
  - C03862
  - C03864
  - C07327
  - C07328
  - C07329
  confidence: high
  applies_when:
  - assessing a defined-concept objective
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P028
  statement: 'Apply the sequencing principle proper to each outcome type: precede
    each new intellectual skill by prior mastery of its subordinate skills; involve
    recall of relevant intellectual skills in problem-solving situations; treat the
    order of major verbal-information subtopics as unimportant while preceding new
    facts with a meaningful context; establish respect for the source and mastery
    of the involved intellectual skills before an attitude''s choice situation; and
    for motor skills practise the critical part skills intensively and the total skill
    too, with the executive subroutine learned first.'
  derived_from_claims:
  - C04185
  - C07040
  - C07041
  - C07042
  - C07043
  confidence: high
  applies_when:
  - sequencing across mixed outcome types
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P029
  statement: 'Sequence like a zoom lens: open with a wide-angle epitome showing the
    major parts and their relationships without detail, zoom in on one part, then
    zoom back out to review the whole and that part''s context before zooming in again,
    repeating the elaborate-summarize-synthesize cycle until the desired complexity
    is reached.'
  derived_from_claims:
  - C04163
  - C04164
  - C07564
  - C07565
  - C07567
  confidence: high
  applies_when:
  - sequencing the content of a whole course
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P030
  statement: Set the challenge from accurate information about what these students
    can and cannot do at the start, so it stretches them a bit but not too far, and
    always pair a challenging activity with activities that build the skills needed
    to meet it.
  derived_from_claims:
  - C02754
  - C02756
  - C02757
  - C05764
  - C05765
  confidence: medium
  applies_when:
  - introducing a demanding task into a course
  - Learners can safely make choices and inspect results during instruction.
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P031
  statement: Use the objective to set up the assessment situation directly, since
    it describes what must be observed to verify the learning and can equally ground
    a teacher-made test or a student self-test, and treat objectives as both the guideline
    for developing instruction and the basis for the measures that determine whether
    they were reached.
  derived_from_claims:
  - C04110
  - C04111
  - C05032
  - C05033
  confidence: high
  applies_when:
  - moving from objectives to assessment
  - Designing evidence for varied learning outcomes.
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P032
  statement: Introduce a concept only after learners have experienced the phenomenon
    it names, and open the section with a question arising from what they have just
    observed, so the definition labels something already seen and the new content
    is motivated by a discrepancy in their own experience.
  derived_from_claims:
  - C00548
  - C00549
  - C07157
  - C07158
  confidence: high
  applies_when:
  - sequencing definitions and criteria within a unit
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P033
  statement: Give students opportunities to rehearse, consult resources, get feedback,
    and refine, and run learning as cycles of performance, feedback, revision, and
    new performance; the secure secret test retains a role but must coexist with educative
    assessment if performance is to improve.
  derived_from_claims:
  - C00608
  - C00609
  - C02580
  - C02581
  confidence: high
  applies_when:
  - structuring how students work toward a performance
  - a course's assessment is entirely one-shot and closed-book
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P034
  statement: Integrate teaching of metacognitive skills across subject areas and make
    the processes explicit, because metacognition takes the form of an internal dialogue
    that many students never recognize as important.
  derived_from_claims:
  - C00829
  - C06836
  - C06837
  - C06838
  confidence: high
  applies_when:
  - building reflective capability into a curriculum
  - training a problem-solving, diagnostic, or judgment-based skill
  operational_mapping:
    profile_rule: true
- principle_id: P035
  statement: Replace an abstract statement of objectives with a concrete demonstration
    of the terminal capability the learner will acquire, since research shows stated
    objectives are often of little value because they are too abstract to communicate
    meaningfully, and the demonstration also previews, motivates and synthesizes.
  derived_from_claims:
  - C04802
  - C04803
  - C07676
  - C07677
  confidence: high
  applies_when:
  - introducing a module or lesson
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P036
  statement: Employ repetition as spaced occasions for the learner to recall what
    was learned rather than as mere re-presentation, since retrieval processes are
    apparently the most important factor in remembering both isolated facts and larger
    bodies of information.
  derived_from_claims:
  - C03949
  - C04258
  - C05753
  - C05754
  confidence: high
  applies_when:
  - planning review for retention
  - intellectual skills must be retained beyond the lesson
  - The learned performance must be recalled after instruction.
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P037
  statement: Teach a concrete concept by presenting instances that vary widely in
    their non-relevant characteristics together with negative instances, so correct
    performance is shown by both selecting members and rejecting non-members, and
    ensure first that the underlying discriminations are recallable.
  derived_from_claims:
  - C03860
  - C03861
  - C05338
  - C05339
  confidence: high
  applies_when:
  - the objective is a concrete concept
  - Learners must generalize a category distinction over time.
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P038
  statement: 'Design for a small working memory: only a few items are held per channel
    at one time, memory span averages about five to seven chunks, and what is held
    is a selection of portions rather than a copy of the presentation.'
  derived_from_claims:
  - C03893
  - C06266
  - C06267
  - C06268
  confidence: high
  applies_when:
  - the material presents more separate items than working memory can hold
  - deciding how much material to present at once
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P039
  statement: 'Treat the nine events of instruction as a design checklist to be considered
    for any desired learning, not a mandatory script: each event is a candidate to
    weigh, the order may vary, some may be omitted, and the form each takes depends
    on the learning task and the learners.'
  derived_from_claims:
  - C04225
  - C07003
  - C07004
  - C07026
  confidence: high
  applies_when:
  - deciding which events a lesson will actually carry
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P040
  statement: Treat the appeal to individual learning styles as resting on a phrase
    whose specific meaning is not entirely clear, since research has identified few
    intellectual and personality characteristics relatable to success with specific
    forms or media — while allowing that a material may work better for a learner
    because of matching entering capabilities, fuller provision of the events that
    individual needs, or design features such as small versus large steps, inductive
    versus deductive, and concrete versus abstract.
  derived_from_claims:
  - C04312
  - C04640
  - C04641
  - C06952
  confidence: high
  applies_when:
