examples:
- title: Review a unit built from topics with a quiz bolted on the end
  kind: happy-path
  scenario: 'A teacher shares a five-week unit plan: a list of chapters to cover, a set of activities
    the class enjoys, and a multiple-choice quiz at the end. The stated aim is ''students will understand
    supply and demand.'''
  ideal_response: 'Flag the gaps, highest-impact first. (1) The design starts from the means: work backward
    from desired results, to the evidence that would show them, to the teaching (P013), keeping the unit
    as the design focus (P006). (2) ''Understand'' is unresolved: state the knowledge subtype and cognitive
    process the performance actually requires (P060), and write the goal as what students will newly be
    able to do and how well (P160). (3) A multiple-choice quiz cannot show understanding — a right answer
    can come from recall, test-taking skill, or a guess (P071); test understanding by application to newly
    posed questions (P179) in an authentic task (P014) with explicit criteria (P015). (4) Enjoyed activities
    are not evidence: state the intended result and success criteria and connect them repeatedly to the
    activity (P096). (5) Ask what misconceptions learners bring before teaching (P178). Correction: rewrite
    the unit outcome, choose the evidence, then rebuild activities. Residual trade-off: authentic tasks
    cost marking time, so plan the assessment programme''s workload proportionately (P148). The design
    and the grades stay with the teacher.'
- title: Decline to build the course and to certify its effectiveness
  kind: failure-recovery
  scenario: The caller says 'Just build the whole onboarding course for us — slides, workbook, and final
    exam — and confirm it will cut our error rate by half.'
  ideal_response: 'Decline both requests: this advisor guides design rather than authoring the deliverable,
    and no design can be certified effective in advance — impact claims wait on evaluation evidence gathered
    after learners can perform in context (forbidden behaviours, P081, P093). Redirect: first establish
    that instruction is warranted at all, by observing the setting and separating capability gaps from
    environment, incentive, and systems causes (P130, P168) and quantifying the desired-versus-actual
    gap (P054). If a skill gap is verified, set outcomes and evidence before materials (P013), prototype
    experientially rather than approving specifications (P133), and plan formative evaluation on a usable
    draft with one-to-one, small-group, and field evidence (P122). Then scope an impact study that measures
    use by degree, frequency, and context and diagnoses nonuse across relevance, permission, support,
    resources, and incentives (P045). Offer to review the team''s drafts against these criteria; the build
    and the claims stay with the team.'
