schema_version: principles-v1
principles:
- principle_id: P001
  statement: Establish a clear visual hierarchy by ranking controls and data from
    scenarios into instantly-needed, secondary, and by-exception, then distinguishing
    levels with hue, saturation, value, size, and position so the most important elements
    are larger and higher-contrast; adjust with restraint (often one property suffices,
    and prefer turning the less-important element down over turning the important
    one up), knowing a good hierarchy goes unnoticed while its absence causes glaring
    confusion.
  derived_from_claims:
  - C00023
  - C00024
  - C00030
  - C00382
  - C00383
  - C00384
  - C01337
  - C01338
  - C01339
  - C01340
  confidence: high
  applies_when:
  - Multiple UI elements compete for attention or the page feels noisy.
  - laying out any screen
  - laying out a screen with elements of differing importance
  operational_mapping:
    profile_rule: true
- principle_id: P002
  statement: Use smart defaults and prefills deliberately to reduce user work, deriving
    them from context and choosing them in users' interests, but omit defaults for
    sensitive choices or when no option fits most people.
  derived_from_claims:
  - C00667
  - C00668
  - C00669
  - C00670
  - C00704
  - C00862
  - C00863
  - C00864
  - C00865
  - C00866
  - C00867
  confidence: high
  applies_when:
  - you can reasonably guess a field's value
  - a field has an option that suits the majority
  - a field has a likely majority answer
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P003
  statement: Match selection and input controls to the question type, expected behavior,
    and learned conventions, respecting the trade-offs of radio buttons, checkboxes,
    drop-downs, list controls, and explicit commit actions.
  derived_from_claims:
  - C00781
  - C00782
  - C00783
  - C00784
  - C00785
  - C00786
  - C00787
  - C01490
  - C01491
  - C01492
  - C01493
  confidence: high
  applies_when:
  - selecting an input control
  - designing checkboxes, radio buttons, and toggles
  operational_mapping:
    profile_rule: true
- principle_id: P004
  statement: Support navigation and wayfinding with clear, consistent signposts such
    as titles, breadcrumbs, progress indicators, menus, persistent objects, and labels
    or terms that match users' mental models.
  derived_from_claims:
  - C00304
  - C00305
  - C00306
  - C01267
  - C01268
  - C01269
  - C01270
  - C01271
  confidence: high
  applies_when:
  - helping users know where they are and where to go
  - helping users find their way and find controls
  operational_mapping:
    profile_rule: true
- principle_id: P005
  statement: Use empirical user research, especially qualitative observation and interviews,
    to understand users' behavior, expectations, vocabulary, and mental models; use
    quantitative methods for validation rather than as a substitute for design insight.
  derived_from_claims:
  - C00169
  - C00172
  - C00173
  - C00179
  - C00948
  - C00995
  - C00996
  confidence: high
  applies_when:
  - you need to characterize an audience or validate assumptions about them
  - choosing research methods to inform design
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P006
  statement: 'Design forms to respect the user''s time: make them short, minimize
    and deduce inputs, make the purpose clear (why, how used, what the user gets),
    minimize clutter, and confirm success with a clear next step.'
  derived_from_claims:
  - C00627
  - C00628
  - C00629
  - C00630
  - C00642
  - C00695
  - C00716
  confidence: high
  applies_when:
  - designing a form that collects information
  - any form design decision
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P007
  statement: Design software to behave like a considerate, supportive human colleague,
    because people unconsciously treat interactive products as sentient and inconsiderate
    products irritate regardless of features, and it is not substantially harder to
    build, following the ideal division of labor in which the computer does the work
    and the person does the thinking.
  derived_from_claims:
  - C00154
  - C00156
  - C01277
  - C01278
  - C01279
  - C01280
  confidence: high
  applies_when:
  - designing how a system responds to and communicates with the user
  - setting the overall behavioral character of a product
  operational_mapping:
    profile_rule: true
- principle_id: P008
  statement: Solve input validation at the source by using bounded controls that communicate
    the acceptable boundaries and make an invalid entry impossible (a drop-down of
    months rather than requiring the user to spell February), rather than an unbounded
    field that accepts anything only to reject it afterward with a rude error; and
    where values are finite use a bounded numeric control such as a slider — good
    for relative or zoom values by analogy of position but poor for precise numbers,
    for which a spinner is better — or a list control, so users are not forced to
    type.
  derived_from_claims:
  - C00673
  - C00676
  - C01501
  - C01502
  - C01503
  - C01504
  confidence: high
  applies_when:
  - a form has required fields or constrained inputs
  - a field accepts a value from a known or bounded set
  operational_mapping:
    profile_rule: true
- principle_id: P009
  statement: Identify and prioritize user goals before tasks, and base the persona
    hypothesis on likely behavior patterns and their differentiating factors rather
    than purely on demographics, which should serve only as a proxy for behavior.
  derived_from_claims:
  - C00175
  - C00176
  - C01013
  - C01014
  confidence: high
  applies_when:
  - synthesizing research into a design-guiding model of the audience
  - forming an initial model of who the users are
  operational_mapping:
    profile_rule: true
- principle_id: P010
  statement: Prevent data-loss interruptions by replacing destructive confirmation
    or Save Changes dialogs with timely validation and Undo, so users can recover
    changes in the context where they made them.
  derived_from_claims:
  - C00806
  - C01403
  - C01404
  - C01405
  confidence: high
  applies_when:
  - a form has a destructive action like Reset
  - a design confronts users with saving or discarding changes
  operational_mapping:
    profile_rule: true
- principle_id: P011
  statement: Keep users' goals as the bedrock throughout the pressures of the development
    cycle, treating features and functions as a limited way to define a product, because
    a goal-directed process supplies a clear rationale that makes the design not guesswork
    or personal preference.
  derived_from_claims:
  - C00910
  - C00937
  - C00938
  - C00940
  - C00941
  - C00942
  - C00943
  - C00944
  - C00946
  - C00947
  - C00961
  - C00962
  - C00963
  - C01094
  confidence: high
  applies_when:
  - defining or evaluating what a product should do
  - choosing what to optimize a design around
  - setting the design target for a productivity product
  - maintaining design focus during development
  - a design is being organized around organizational workflow
  operational_mapping:
    profile_rule: true
- principle_id: P012
  statement: Synthesize personas from observed behavior rather than fiction, keeping
    detail no deeper than the research supports, inferring goals from behavioral connections
    (about three to five end goals, zero or one life goal, zero to two experience
    goals), making each persona distinct in at least one significant behavior, expanding
    into a one-to-two-page narrative, and remembering personas are design tools, not
    an end in themselves.
  derived_from_claims:
  - C01077
  - C01078
  - C01079
  - C01080
  - C01081
  - C01082
  - C01083
  - C01084
  - C01085
  - C01086
  - C01087
  - C01088
  confidence: high
  applies_when:
  - building a persona set from research
  - fleshing out and documenting personas
  operational_mapping:
    profile_rule: true
- principle_id: P013
  statement: Avoid stopping the proceedings for normalcy, confirmations, or high-excise
    reports; let software take a good-enough action, keep users informed with modeless
    feedback, and make actions adjustable or reversible with Undo.
  derived_from_claims:
  - C01236
  - C01237
  - C01238
  - C01254
  - C01255
  - C01256
  - C01257
  - C01568
  - C01569
  - C01570
  - C01571
  - C01572
  confidence: high
  applies_when:
  - deciding whether to report an event or ask before acting
  - reviewing interactions for needless interruption
  - a design is tempted to ask for confirmation or show an alert
  operational_mapping:
    profile_rule: true
- principle_id: P014
  statement: 'Use interface metaphors sparingly: prefer idiomatic designs over implementation-centric
    or metaphoric paradigms, and never bend or limit the interface to preserve a metaphor
    unless a truly powerful one fits naturally.'
  derived_from_claims:
  - C01307
  - C01308
  - C01309
  - C01310
  - C01311
  - C01312
  - C01313
  - C01317
  - C01318
  - C01319
  - C01320
  - C01321
  confidence: high
  applies_when:
  - choosing the conceptual basis of an interface
  - tempted to organize an interface around a real-world metaphor
  operational_mapping:
    profile_rule: true
- principle_id: P015
  statement: Use ethnographic interviews by observing and interviewing users in their
    own context, avoiding fixed or leading questionnaires and solution proposals,
    eliciting specific stories, keeping recording unobtrusive, and verifying interpretations
    with users.
  derived_from_claims:
  - C00994
  - C01007
  - C01008
  - C01009
  - C01010
  - C01012
  - C01021
  - C01022
  - C01023
  - C01024
  - C01025
  confidence: high
  applies_when:
  - gathering qualitative data about users
  - conducting a user interview
  operational_mapping:
    profile_rule: true
- principle_id: P016
  statement: 'Make a product considerate by embodying the traits of a caring person:
    take an interest and remember what the user tells it, defer and submit to the
    user, be forthcoming, use common sense, be conscientious about the larger goal,
    keep quiet about its own problems, be perceptive by remembering preferences, be
    self-confident rather than asking Are you sure while staying ready to undo, fail
    gracefully, know when to bend the rules with suspense states, and take responsibility
    for the work it hands to other devices.'
  derived_from_claims:
  - C01281
  - C01282
  - C01283
  - C01284
  - C01285
  - C01286
  - C01287
  - C01288
  - C01289
  - C01290
  - C01291
  confidence: high
  applies_when:
  - designing a product's behavior toward the user
  operational_mapping:
    profile_rule: true
- principle_id: P017
  statement: 'Design accessible forms by getting semantic content and structure right
    first (so assistive tech can convey them) and following core rules: text alternatives
    and labels for everything, unique meaningful links, never color alone, sufficient
    contrast, full keyboard operability, no seizure-risk flashing, adjustable timing,
    skip links, and naming objects by function—benefits reach all users.'
  derived_from_claims:
  - C00751
  - C00752
  - C00753
  - C00754
  - C00755
  - C00756
  - C00757
  - C00758
  - C00759
  - C00760
  confidence: high
  applies_when:
  - building any web form
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P018
  statement: 'Separate the storage system from the retrieval system rather than forcing
    users to conform to a rigid relational schema: keep records in a database-like
    digital soup that accepts any record and returns a token, build retrieval as an
    unlimited number of attribute indices each keyed to one concept, fill those indices
    both by automatic extraction and by easy manual pointers, and never demand that
    users configure their information in advance, because they rarely can express
    their needs ahead of time and often change their minds.'
  derived_from_claims:
  - C01372
  - C01373
  - C01374
  - C01375
  - C01376
  - C01380
  - C01381
  - C01382
  - C01383
  - C01384
  confidence: high
  applies_when:
  - designing how users locate their documents or data
  - architecting how unpredictable or unstructured information is stored and found
  operational_mapping:
    profile_rule: true
- principle_id: P019
  statement: 'Ruthlessly minimize the questions you ask—fewer questions mean faster
    completion: test every question (need it, infer it, better time), infer answers
    where possible (e.g., card type from number), challenge legacy paper questions,
    and apply Keep/Cut/Postpone/Explain.'
  derived_from_claims:
  - C00721
  - C00722
  - C00723
  - C00724
  - C00725
  - C00726
  - C00856
  - C00857
  - C00858
  confidence: high
  applies_when:
  - deciding what to include on a form
  - auditing a form's questions
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P020
  statement: Use inline validation only where users may need help, time feedback after
    the answer is complete, and provide suggestions, reformatting, counters, or quality
    indicators from data already given.
  derived_from_claims:
  - C00847
  - C00848
  - C00849
  - C00850
  - C00851
  - C00852
  - C00853
  - C00854
  - C00855
  confidence: high
  applies_when:
  - answers are uncertain, formatted, or hard to get right
  - implementing inline validation feedback
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P021
  statement: 'Use usability testing to evaluate a concrete candidate design, not to
    create it: do qualitative research before ideation, test late enough to have something
    real but early enough to change it, and make findings measurable and actionable.'
  derived_from_claims:
  - C01031
  - C01032
  - C01033
  - C01034
  - C01038
  - C01141
  - C01142
  - C01143
  - C01144
  confidence: high
  applies_when:
  - deciding when and how to evaluate a design with users
  - placing evaluation within the design process
  operational_mapping:
    profile_rule: true
- principle_id: P022
  statement: 'Treat visual interface design as a critical, unique communication discipline
    conducted alongside interaction and industrial design, not as afterthought skinning:
    place aesthetics within a functional framework driven by user-experience and business
    goals, and match the visual structure to the logical structure of the users''
    mental models and the program''s behavior so the display communicates behavior
    clearly.'
  derived_from_claims:
  - C01115
  - C01116
  - C01117
  - C01137
  - C01327
  - C01328
  - C01329
  - C01330
  - C01331
  confidence: high
  applies_when:
  - beginning to design a product's structure
  - designing the visual layer of an interactive product
  operational_mapping:
    profile_rule: true
- principle_id: P023
  statement: Make transient-posture applications simple, clear, and obvious, limited
    to a single window and view with instructions built into the surface and taking
    no more space than needed, and give them a memory so they relaunch to their previous
    size, position, and configuration; treat dialog boxes and the interactive parts
    of daemonic applications as transient, showing a daemon icon only for continuous
    useful status and providing a control panel plus inline access.
  derived_from_claims:
  - C01173
  - C01174
  - C01175
  - C01176
  - C01177
  - C01178
  - C01179
  - C01180
  - C01181
  confidence: high
  applies_when:
  - designing transient or daemonic applications and dialog boxes
  operational_mapping:
    profile_rule: true
- principle_id: P024
  statement: 'Treat design principles and interface standards as contextual guidelines:
    understand the actual target users, goals, and working conditions, follow a standard''s
    spirit, and depart only when a clearly better idiom serves those users.'
  derived_from_claims:
  - C00918
  - C00919
  - C00945
  - C01367
  - C01368
  - C01369
  - C01370
  - C01371
  confidence: high
  applies_when:
  - evaluating whether a design is good
  - deciding whether and how to follow an interface standard
  operational_mapping:
    profile_rule: true
- principle_id: P025
  statement: Run the five-step iterative Requirements Definition, connecting business
    to usability in a problem and vision statement, brainstorming to clear preconceptions,
    recording each persona's expectations, keeping context scenarios broad, shallow,
    and textual, pretending the interface is magic in early stages, and extracting
    requirements as objects, actions, and contexts.
  derived_from_claims:
  - C01105
  - C01106
  - C01107
  - C01108
  - C01109
  - C01110
  - C01111
  - C01112
  confidence: high
  applies_when:
  - turning models into requirements
  operational_mapping:
    profile_rule: true
- principle_id: P026
  statement: 'Design embedded systems by their guiding principles: do not think of
    the product as a computer or bring desktop idioms to it, design the hardware and
    software interface together from a goal-directed and ergonomic perspective, let
    environmental context drive the design, use modes judiciously, limit the scope
    to a specific set of tasks done well, balance navigation against display density,
    and limit and simplify input.'
  derived_from_claims:
  - C01190
  - C01191
  - C01192
  - C01193
  - C01194
  - C01195
  - C01197
  - C01198
  confidence: high
  applies_when:
  - designing an appliance, kiosk, handheld, or other embedded device
  operational_mapping:
    profile_rule: true
- principle_id: P027
  statement: Provide multiple parallel command vectors — menus, toolbars, keyboard
    accelerators, and direct manipulation — so users of different skill sets can command
    the program the way that suits them, giving immediate vectors to the minimal working
    set of frequently used functions identified from persona scenarios and pedagogic
    vectors to beginners, and understanding that information in the world (menus,
    dialogs) is dependable but slow while information in the head (accelerators) is
    fast but must be learned, so beginners rely on world vectors and experts increasingly
    on head vectors; as an exception, deny dangerous commands like Erase All easy
    parallel vectors and protect them within menus and dialogs like hidden ejector-seat
    levers.
  derived_from_claims:
  - C01517
  - C01518
  - C01519
  - C01520
  - C01577
  - C01578
  - C01579
  - C01580
  confidence: high
  applies_when:
  - designing an application's menu system
  - deciding how functions can be invoked
  operational_mapping:
    profile_rule: true
- principle_id: P028
  statement: Size content and sections to their optimal width instead of stretching
    them just because space exists; use grids as aids and prefer fixed or max-width
    sizing where content has a natural width.
  derived_from_claims:
  - C00047
  - C00048
  - C00049
  - C00050
  - C00051
  - C00052
  - C00053
  - C00054
  confidence: medium
  applies_when:
  - A large viewport or canvas tempts the design to widen forms, text, or sections
    unnecessarily.
  - Column grids, fluid containers, sidebars, cards, forms, or responsive layouts
    are being sized.
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P029
  statement: 'Design kiosks for infrequent, often one-time public users without keyboards:
    optimize for first-time use with a transient posture, distinguish transactional
    kiosks that let users reach a specific goal fast from explorational kiosks that
    must engage through an interesting experience, show process orientation and escape
    hatches, plan placement and wayfinding with industrial design, and keep touch
    targets large with sparing text input and no drag or scroll, keeping hardware-button
    mappings consistent.'
  derived_from_claims:
  - C01204
  - C01205
  - C01206
  - C01207
  - C01208
  - C01209
  - C01210
  - C01211
  confidence: medium
  applies_when:
  - designing kiosk interfaces
  operational_mapping:
    profile_rule: true
- principle_id: P030
  statement: 'Prefer top-aligned labels for speed: eye-tracking (Penzo ~50ms vs ~500ms
    left / ~240ms right) and live-site tests (>10% higher completion) show them fastest,
    and they flex for long/localized labels—accepting more vertical space, and noting
    the evidence is for familiar data.'
  derived_from_claims:
  - C00766
  - C00767
  - C00768
  - C00769
  - C00770
  - C00771
  - C00772
  confidence: high
  applies_when:
  - completion speed is the priority and vertical space allows top labels
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P031
  statement: Minimize optional fields, and when marking required/optional status indicate
    only the minority case with clear text (not just an asterisk), placing indicators
    next to labels for easy scanning.
  derived_from_claims:
  - C00706
  - C00707
  - C00790
  - C00791
  - C00792
  - C00793
  - C00794
  confidence: high
  applies_when:
  - a form mixes required and optional fields
  - a form has required and optional fields
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P032
  statement: Involve the programming team intimately throughout Refinement and construction,
    deliver a form and behavior specification detailed enough to code from, and stay
    vigilant that the design vision is translated faithfully into the final product.
  derived_from_claims:
  - C00908
  - C00909
  - C00933
  - C00934
  - C01138
  - C01139
  - C01140
  confidence: high
  applies_when:
  - framing the scope of a design effort
  - carrying a design into implementation
  operational_mapping:
    profile_rule: true
- principle_id: P033
  statement: Design the represented model around the user's mental model rather than
    the implementation model, keeping it simpler than the actual implementation because
    it is the model designers most control.
  derived_from_claims:
  - C00964
  - C00965
  - C00966
  - C00967
  - C00968
  - C00969
  - C00970
  confidence: high
  applies_when:
  - deciding how to present a product's workings to users
  - designing how an interface represents the product's function
  operational_mapping:
    profile_rule: true
- principle_id: P034
  statement: 'Apply memory concretely: use the previous setting as the default and
    remember options until manually changed without re-offering turned-off features,
    remember file locations per file type and window position, remember repeated action
    patterns, remember essentially everything since storage is cheap, remember deduced
    information for silent reasonableness checks, persist the undo stack across sessions,
    and auto-fill past entries to reduce errors.'
  derived_from_claims:
  - C01297
  - C01298
  - C01299
  - C01300
  - C01301
  - C01302
  - C01303
  confidence: high
  applies_when:
  - implementing a product's memory
  operational_mapping:
    profile_rule: true
- principle_id: P035
  statement: 'Treat each window, pane, or dialog box as a separate room and do not
    add one unless it serves a purpose existing windows cannot: put functions in the
    window where they are used, so a task integral to the application''s purpose belongs
    in the main window rather than a dialog (one of the most frequently violated UI
    principles), reserve a separate room such as a dialog for functions performed
    outside the user''s normal sequence (purging a database, importing clip art),
    and avoid windows pollution from putting a single function in each dialog, since
    a goal involves a series of functions whose connections many windows cannot show.'
  derived_from_claims:
  - C01479
  - C01480
  - C01481
  - C01482
  - C01536
  - C01537
  - C01538
  confidence: high
  applies_when:
  - deciding where a function lives in the interface
  - deciding what belongs in a dialog box
  operational_mapping:
    profile_rule: true
- principle_id: P036
  statement: 'Deliver application-quality interaction design when complex behavior
    runs in a browser: know the Web spectrum of informational, transactional, and
    application, set an informational site''s sovereign-versus-transient balance by
    visit frequency, optimize for common display sizes, avoid forcing unnecessary
    navigation since perceived load time tracks goal achievement more than actual
    time, do not assume Web apps are easier to build or more usable for free, and
    design sovereign Web applications like desktop applications.'
  derived_from_claims:
  - C01182
  - C01183
  - C01184
  - C01185
  - C01186
  - C01187
  - C01188
  confidence: medium
  applies_when:
  - designing web sites and web applications
  operational_mapping:
    profile_rule: true
- principle_id: P037
  statement: 'Choose the right action affordance for the job: buttons and button groups
    for always-visible related actions, links for low-emphasis actions, hover tools
    for per-item mouse actions, and an Action Panel for discoverable, richly organized
    commands; keep pop-up menus short and never use drop-downs for actions.'
  derived_from_claims:
  - C00539
  - C00541
  - C00542
  - C00554
  - C00555
  - C00557
  confidence: high
  applies_when:
  - deciding how to present actions on a screen
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P038
  statement: 'Serve minority needs with additional inputs that don''t burden the majority:
    map inputs to prioritized use cases, expose extras via clearly worded user-activated
    triggers with easy removal, keep the approach consistent, and minimize page jumping.'
  derived_from_claims:
  - C00868
  - C00869
  - C00870
  - C00878
  - C00879
