schema_version: golden-tests-v1
subagent_slug: advertising-effectiveness-advisor
generated_at: "2026-06-09"

golden_tests:
  - test_id: GT-001
    description: >-
      Positive routing — advise mode; caller about to commit spend and needs it
      justified by selling return rather than awareness
    prompt: >-
      We have a $2M budget for next quarter and the agency wants to put most of it
      into a brand-awareness TV campaign to lift unaided recall. Our category sales
      have been flat for a year. Our buyers are mostly women aged 35-50 who already
      know the brand. How should we spend this to actually move sales?
    expected_route: invoke
    expected_mode: advise
    must_ask_for: []
    minimum_output: >-
      A recommendation that ties the spend to a measurable selling outcome, starts
      from who the real customer is and what would make them buy, and challenges
      awareness-for-its-own-sake as the goal
    must_not_do:
      - Endorse the awareness campaign on recall lift alone without a selling target
      - Recommend trying to reach everyone instead of the relevant buyers
      - Produce finished ad copy or a media buy in place of strategy direction

  - test_id: GT-002
    description: >-
      Positive routing — compare mode; bounded either/or sponsorship-vs-endorser
      decision
    prompt: >-
      We can either sponsor a regional sports tournament for the year or sign a
      mid-tier celebrity endorser for the same money. Our goal is to sell more of
      our energy drink to 18-24 year-old men. Which is the better choice and why?
    expected_route: invoke
    expected_mode: compare
    must_ask_for: []
    minimum_output: >-
      A side-by-side ranking of the two options by expected selling return, naming
      the preferred choice and the condition under which the rejected one would win
    must_not_do:
      - Pick an option on visibility or prestige rather than expected selling return
      - Treat the sponsorship as worthwhile merely for name exposure
      - Ignore who the relevant, winnable customer is

  - test_id: GT-003
    description: >-
      Positive routing — validate mode; gate a completed campaign against a selling
      criterion
    prompt: >-
      Our last campaign got us 400 million media impressions and a feature in two
      national newspapers, and the team is calling it a success. Sales were
      unchanged. Can you check whether this spend was actually justified?
    expected_route: invoke
    expected_mode: validate
    must_ask_for: []
    minimum_output: >-
      A pass-or-fail verdict on whether the spend was accountable to a measurable
      selling result, naming the result that would prove or disprove success
    must_not_do:
      - Accept impressions or press coverage as proof of success
      - Treat "any publicity is good publicity" as a valid justification
      - Issue a verdict without naming the selling result it should be measured against

negative_routing_tests:
  - test_id: NR-001
    description: >-
      Negative routing — request to produce finished creative; outside scope per Q4
    prompt: >-
      Can you write us a 30-second TV ad script and storyboard for our new soda
      flavour, with the jingle and the tagline ready to shoot?
    expected_route: do_not_invoke
    expected_mode: null
    must_ask_for: []
    minimum_output: >-
      A clear statement that producing finished creative is outside scope — this
      advisor critiques and directs advertising strategy for selling accountability,
      it does not produce the ad asset
    must_not_do:
      - Proceed to write the ad script, jingle, or storyboard
      - Pretend the request is a strategy-accountability question

missing_context_tests:
  - test_id: MC-001
    description: >-
      Missing required input — no selling situation, customer, or goal provided;
      advisor must request it before engaging
    prompt: Is our advertising any good?
    expected_route: invoke
    expected_mode: review
    must_ask_for:
      - >-
        The advertising or marketing decision under question, the brand and its
        current selling situation, who the actual and target customers are, and what
        selling result the spend is meant to produce
    minimum_output: >-
      A clear statement of what information is missing and why the selling situation,
      customer, and selling goal are required before the advisor can judge the
      advertising
    must_not_do:
      - Proceed as if a campaign and selling goal were described
      - Invent a brand or campaign to critique
      - Issue a selling-accountability verdict without any concrete situation
