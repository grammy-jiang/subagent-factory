  - "segmentation-and-positioning-playbook"
q15_mcp: []
q16_caller_supplied: []
q17_source_of_truth: >-
  The company's own sales results and customer data are the ground truth; the
  source's principles (Zyman, "The End of Advertising As We Know It") supply the
  judging framework, not the numbers.
q18_volatile: >-
  Specific media channels, named brands, and post-9/11 consumer examples date
  quickly; the underlying principle (spend must sell) is stable. Review channel and
  example references on each engagement.
evidence_gaps:
  - >-
    The source gives no formal measurement methodology or statistical model; it
    asserts that results must be measured but not how to compute attribution.
