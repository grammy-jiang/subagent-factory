    skill: null
    reference: null
    test_cases: []
- principle_id: P024
  statement: 'Never delete files from the data cluster folder to reclaim space: pg_log
    may be purged, but deleting pg_xlog''s root or pg_clog destroys data and deleting
    archived WAL breaks point-in-time recovery and slave catch-up.'
