  applies_when:
  - writing database functions
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P012
  statement: Treat missing or wrong indexing as the first suspect for bad PostgreSQL
    performance; verify the expected indexes exist before tuning memory or hardware,
    and watch for over-indexing that slows writes.
  derived_from_claims:
  - C00313
  - C00320
  - C00378
  - C00519
  - C01414
  - C01418
  - C01447
  confidence: high
  applies_when:
  - Diagnosing a slow query or slow system
  - a query is slow or scans far more rows than it returns
  - triaging a newly reported performance regression
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P013
  statement: 'Drive tuning with EXPLAIN: use EXPLAIN (ANALYZE[, BUFFERS, VERBOSE]),
    wrap data-changing EXPLAIN ANALYZE in BEGIN/ROLLBACK, compare costs only on the
    same server, and read a large estimate-vs-actual row gap as a sign of stale statistics.'
  derived_from_claims:
  - C00314
  - C00329
  - C00402
  - C00712
  - C00713
  - C00714
  - C00715
  confidence: high
  applies_when:
  - Investigating why a specific query is slow
  - analyzing a query plan
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P014
  statement: Grant USAGE on a schema or table/function grants are inert; do not assume
    database ownership grants access to all objects; and consider revoking risky PUBLIC
    defaults (CONNECT, EXECUTE, etc.).
  derived_from_claims:
  - C00460
  - C00461
  - C00465
  - C00579
  - C00580
  - C00581
  - C00582
  confidence: high
  applies_when:
  - assigning object privileges
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P015
  statement: Plan replication for availability and read scalability with one master
    and read-only slaves shipping WAL; choose synchronous (waits for a slave) versus
    asynchronous (lower latency but possible lag/loss); use streaming/cascading to
    reduce coupling; and note all servers must share the same version and unlogged
    tables are excluded.
  derived_from_claims:
  - C00498
  - C00499
  - C00735
  - C00736
  - C00737
  - C00738
  - C00739
  confidence: high
  applies_when:
  - Data-loss tolerance must be minimized for some or all transactions
  - designing a replication topology
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P016
  statement: Reserve index-organized / clustered-index tables for tables that need
    a single index; a secondary index on an index-organized table requires two tree
    traversals per row and is very inefficient, so multi-index tables usually fare
    better as heap tables.
  derived_from_claims:
  - C01042
  - C01043
  - C01044
  - C01045
  - C01046
  - C01585
  - C01586
  confidence: high
  applies_when:
  - write-heavy workload with multiple secondary indexes (favour indirection)
  - choosing between a heap table and an index-organized/clustered-index table
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P017
  statement: Avoid LIKE patterns with a leading wildcard; only the prefix before the
    first wildcard is an access predicate, and a leading wildcard forces a full table
    scan unless another access predicate exists — use a dedicated full-text index
    instead.
  derived_from_claims:
  - C00344
  - C00345
  - C00346
  - C00347
  - C01508
  - C01510
  confidence: high
  applies_when:
  - a query uses a LIKE filter
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P018
  statement: Run space-reclamation maintenance (vacuum/compaction) as an asynchronous
    background process and persist the free-page list so free space survives crashes
    and is not leaked.
  derived_from_claims:
  - C00305
  - C00306
  - C00307
  - C01037
  - C01084
  - C01087
  confidence: high
  applies_when: []
  operational_mapping:
    profile_rule: true
    test_cases: []
- principle_id: P019
  statement: Prefer jsonb (binary, faster, GIN-indexable, key-deduping) over json
    unless you must preserve exact text, whitespace, key order, or duplicate keys;
    index containment queries with @> plus a GIN index.
  derived_from_claims:
  - C00638
  - C00639
  - C00640
  - C01356
  - C01357
  - C01390
  confidence: high
  applies_when:
  - storing/querying JSON in PostgreSQL
  - queries use the JSONB key-exists/containment operators
  - the workload is full-text search
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P020
  statement: Keep the number of indexes small to protect write performance — insert
    cost is dominated by index count and the first index already costs the most —
    and consider dropping non-essential indexes during large bulk loads.
  derived_from_claims:
  - C01333
  - C01339
  - C01351
  - C01601
  - C01602
  - C01603
  confidence: high
  applies_when:
  - a table carries indexes that are rarely or never used by the planner
  - write throughput matters for the workload
  - a table is write-heavy or undergoes bulk loading
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P021
  statement: Use functional indexes for case-insensitive or expression searches (always
    querying with the same function) and partial indexes for hot subsets (WHERE must
    be IMMUTABLE and the query's WHERE must be a superset of the index condition).
  derived_from_claims:
  - C00332
  - C00333
  - C00665
  - C00666
  - C00667
  confidence: high
  applies_when:
  - indexing computed values or row subsets
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P022
  statement: Use a partial index (an index with a WHERE clause) for workloads that
    consistently filter on the same constant predicate to get a smaller, faster index,
    but do not create hundreds or thousands of partial indexes because that slows
    down planning.
  derived_from_claims:
  - C01404
  - C01405
  - C01406
  - C01518
  - C01519
  confidence: high
  applies_when:
  - the workload repeatedly filters with the same constant predicate (e.g. deleted_at
    IS NULL)
  - a frequent query filters on a constant value (e.g. a status flag)
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P023
  statement: 'Terminate connections sparingly: pg_cancel_backend cancels a query without
    dropping the connection, pg_terminate_backend kills it; clear affected connections
    before a backup or restore.'
