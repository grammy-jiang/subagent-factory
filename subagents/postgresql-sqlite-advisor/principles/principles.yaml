- principle_id: P025
  statement: Understand storage classes and type affinity - SQLite has five storage
    classes, a column may hold mixed classes across rows, sort order is NULL then
    numbers then TEXT then BLOB, and each column has NUMERIC/INTEGER/TEXT/NONE affinity
    derived from its declared type (an unrecognized type defaults to NUMERIC, no type
    gives NONE).
