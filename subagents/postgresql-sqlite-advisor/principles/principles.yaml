schema_version: principles-v1
principles:
- principle_id: P001
  statement: Use an index-only scan (covering index) to skip table access for read-heavy
    aggregating queries, but add select-clause columns to an index only when needed
    (memory and update cost), and avoid SELECT * so a slim covering index suffices.
  derived_from_claims:
  - C00330
  - C01346
  - C01399
  - C01574
  - C01575
  - C01576
  - C01578
  - C01580
  - C01581
  - C01582
  confidence: high
  applies_when:
  - A hot query selects only columns that can fit in an index
  - a query's returned columns can be served entirely from the index
  - a query reads many rows but few columns
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P002
  statement: 'Select the index method to fit the data and operators: B-Tree as the
    general default, GiST for spatial/full-text/exclusion (lossy), GIN for jsonb/full-text
    (faster reads, slower writes), and avoid legacy hash indexes (not WAL-logged,
    unusable in replication).'
  derived_from_claims:
  - C00337
  - C00338
  - C00339
  - C00340
  - C00342
  - C00508
  - C00657
  - C00658
  - C00659
  - C00660
  - C00661
  confidence: high
  applies_when:
  - choosing an index type
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P003
  statement: Do not trust that an index is 'used' — verify access-versus-filter predicates
    in the predicate information, since the optimizer picks an index only because
    it beats a full scan, which does not make it optimal.
  derived_from_claims:
  - C01429
  - C01430
  - C01442
  - C01443
  - C01444
  - C01445
  - C01446
  - C01483
  - C01550
  - C01616
  confidence: high
  applies_when:
  - analyzing why a specific query is slow
  - confirming whether an index actually optimizes a query
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P004
  statement: Back up with pg_dump for selective day-to-day backups (compressed/TAR/directory
    formats enable parallel restore) and run pg_dumpall --globals-only daily to capture
    roles and tablespaces.
  derived_from_claims:
  - C00472
  - C00476
  - C00478
  - C00484
  - C00485
  - C00486
  - C00587
  - C00588
  - C00589
  - C00592
  confidence: high
  applies_when:
  - designing a backup routine
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P005
  statement: Choose a concatenated index's column order from how the application queries
    the data (leftmost-prefix usability), not from per-column selectivity; a non-leading
    column alone cannot use the index tree.
  derived_from_claims:
  - C00331
  - C01471
  - C01472
  - C01475
  - C01476
  - C01477
  - C01506
  - C01512
  - C01515
  confidence: high
  applies_when:
  - designing or reviewing a multi-column index
  - deciding between one composite index and several single-column indexes
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P006
  statement: Choose the isolation level by the anomalies you must prevent (dirty/nonrepeatable/phantom
    reads, lost update/dirty write/write skew), remembering snapshot isolation prevents
    lost updates but not write skew and that serializability requires coordination.
  derived_from_claims:
  - C00298
  - C00299
  - C00300
  - C00301
  - C00302
  - C01114
  - C01115
  - C01116
  - C01117
  confidence: high
  applies_when: []
  operational_mapping:
    profile_rule: true
    test_cases: []
- principle_id: P007
  statement: Never wrap an indexed column in a function, arithmetic, or implicit type
    conversion in the where clause; convert the search term instead, or add a function-based
    index on the exact expression, because the optimizer treats any column-side function
    as an opaque black box.
  derived_from_claims:
  - C01402
  - C01403
  - C01485
  - C01486
  - C01527
  - C01528
  - C01530
  - C01532
  - C01543
  confidence: high
  applies_when:
  - queries filter on a function or expression of a column rather than the bare column
  - a where-clause predicate transforms the indexed column
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P008
  statement: Implement top-N and pagination with a pipelined order by and tell the
    database you need only N rows; prefer the seek (keyset) method over offset for
    deep paging, and always page on a deterministic sort order.
  derived_from_claims:
  - C01372
  - C01373
  - C01374
  - C01595
  - C01596
  - C01597
  - C01598
  - C01599
  - C01600
  confidence: high
  applies_when:
  - a query needs ordered output, especially combined with LIMIT or keyset pagination
  - retrieving only the first rows or paging through a result set
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P009
  statement: Use pg_stat_statements to find the most expensive queries, ordering by
    total cumulative time, and reset its statistics when you need a clean measurement
    window.
  derived_from_claims:
  - C00383
  - C00384
  - C00518
  - C01420
  - C01421
  - C01423
  - C01424
  - C01425
  confidence: high
  applies_when:
  - identifying which queries to optimize first
  - pg_stat_statements is installed or can be enabled
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P010
  statement: Manage roles with CREATE ROLE (not the deprecated CREATE USER/GROUP),
    keep group roles login-less, state INHERIT/NOINHERIT explicitly, and rely on SET
    ROLE for the never-inherited superuser rights.
  derived_from_claims:
  - C00455
  - C00456
  - C00457
  - C00458
  - C00568
  - C00569
  - C00570
  - C00571
  confidence: high
  applies_when:
  - creating or organizing database roles
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P011
  statement: Mark function volatility correctly (IMMUTABLE/STABLE/VOLATILE) so the
    planner can optimize, apply STRICT cautiously (it can block index use), and prefer
    SQL functions for planner inlining while using PL/pgSQL when control flow or dynamic
    SQL is needed.
