- principle_id: P007
  statement: 'Know Vinay & Darbelnet''s four oblique procedures: Transposition (replacing
    one word class with another without changing the meaning, chosen when it fits
    the utterance better or preserves a nuance, the transposed form generally more
    literary), Modulation (varying the message by a change of point of view when a
    correct literal version is unidiomatic, the best free modulation yielding the
    rendering a native calls exactly right), Equivalence (rendering the same situation
    by wholly different structural and stylistic means, above all idioms and proverbs,
    drawing on the established repertoire rather than coining new calques), and Adaptation
    (the extreme limit, creating a new situationally-equivalent situation when the
    source situation is unknown in the target culture).'
  derived_from_claims:
  - C01644
