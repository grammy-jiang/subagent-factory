  applies_when:
  - The audience is studying the source context, linguistic structure, philosophical
    terminology, or formal features
  - formal equivalence for academic and legal texts; dynamic equivalence for texts
    aimed at natural reception
  operational_mapping:
    profile_rule: true
- principle_id: P006
  statement: 'Reject cross-code identity as the basis of translation: the referential
    argument fails because a word signifies through its systematic relations within
    its code, not through the object, the conceptual argument fails for lack of any
    grammar-cognition correlation, and the universals argument yields only trivial
    universals; point-by-point identity would turn translation into copying, mimicry,
    or transliteration because it cannot capture the surrounding code structure (a
    sentential adverb acceptable in Spanish is despised in written English), and identity
    is useless because universal grammar is a matter of absolute competence whereas
    translation is a matter of probabilistic performance — its very interest springing
    from the structural mismatch of codes, so that where whole structures are identical
    the recoding is academic and not even worthy of the name translation.'
  derived_from_claims:
  - C01830
