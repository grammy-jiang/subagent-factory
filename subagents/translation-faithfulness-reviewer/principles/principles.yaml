- principle_id: P123
  statement: Hold a good translation to the synthesized requirements — it must make
    sense, convey the spirit and manner of the original, have a natural and easy form
    of expression, and produce on its readers a response similar to that produced
    by the original on its readers — which presupposes understanding the source thematically
    and stylistically, overcoming the two structures' differences, and reconstructing
    the source's stylistic structures (Prochazka); to translate a poem whole is to
    compose another poem, faithful to the matter, approximating the form, and having
    a life of its own.
