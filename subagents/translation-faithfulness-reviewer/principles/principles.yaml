- principle_id: P126
  statement: 'Complete the hermeneutic motion with restitution, its ethical crux:
    because the translator has taken from the source and added to his own language,
    throwing the whole system off balance, an authentic translation must mediate into
    exchange and restored parity — so redefine fidelity not as literalism or a technical
    device for rendering the vague ''spirit'' but as the restoration of the balance
    of forces that appropriative comprehension disrupted (an act of ethical and economic
    double-entry in which the books must balance), while remembering that translation
    is not only inevitable loss but also enhancement, magnifying the original''s stature
    where it equalizes and revealing the source''s unrealized potential where it surpasses.'
