- principle_id: P020
  statement: Locate the deep problem of translating a foreign work not in the dictionary
    or semantic equivalence but in a compromise between two poetics in which the receiving
    system's poetics dominates (translators of Brecht made explicit what he wanted
    the audience to piece together, added italics and stage directions, and padded
    songs into the Broadway-musical register), against which refractors of an alien
    poetics deploy four strategies — accepting the works while dismissing the poetics,
    psychologizing the poetics as rationalized temperament, assimilating it by translating
    its concepts into the old terminology, or explaining it and showing the system
    can accommodate it; therefore do not judge translations in isolation as simply
    good or bad, since a later source-faithful version can afford its fidelity only
    because earlier compromising translations first established a bridgehead and started
    the critical debate, expect no necessary progression toward a single definitive
    translation (language, politics, and the refracting spectrum keep shifting, and
    literary systems are stochastic), and account for the many changes explicable
    only by ideology rather than comprehension — playing down or omitting charged
    content, raising loaded words to a nobler register, and removing profanity to
    satisfy the receiving system's codes.
  derived_from_claims:
