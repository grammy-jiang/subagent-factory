- principle_id: P028
  statement: 'Catch the subtractive changes that flatten a carefully constructed source
    text: paratextual and typographic losses (dropping the italics that set off terms,
    adding quotation marks the source lacks, inserting unmarked translator''s notes),
    mishandling the source''s own foreign and translated words (dropping bracketed
    Greek or German originals or italicized foreign terms and making do with the target
    word alone), morphological simplification that strips a term of its systemic value
    (rendering ''metaphorique'' as ''metaphor'' rather than ''metaphorics'', or ''philosopheme''
    as ''an element of philosophy''), semantic-neighbour substitution when a more
    literal alternative exists (''effect'' for ''phenomenon'', ''valeur'' as ''notion'',
    ''articulation'' as ''joint''), phrase-level changes that set aside a concept
    or reverse an argument (converting ''metaphoricite par analogie'' to ''analogy
    producing metaphor'', or a single ''condition of impossibility'' to ''the conditions
    which make it in principle impossible''), assimilation to target discourse norms
    that gives a theoretical text a falsely immediate, practical tenor (added conjunctions
    and adversatives, a conditional turned assertive, elliptical utterances expanded,
    an unmotivated participial agent), and the dropping of repetition, parallelism,
    or a key term''s polysemy that carry argumentative structure rather than mere
    elegance (losing a repeated ''seul... seul... seul'', collapsing a polysemous
    shifter such as ''tour'', or suppressing one load-bearing word such as ''history'').'
