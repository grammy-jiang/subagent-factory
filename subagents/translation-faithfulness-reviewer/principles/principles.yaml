- principle_id: P005
  statement: 'Choose the equivalence orientation by purpose: use formal equivalence,
    which matches source form and content closely as in gloss translations, for academic
    or legal texts that give the reader access to the source language and customs,
    and use dynamic or functional equivalence, the closest natural equivalent tailored
    to the receptor with adjustments of grammar, lexicon, and cultural references
    and no source interference, elsewhere, noting that dynamic equivalence minimizes
    source foreignness in a way culturally oriented theorists criticize.'
  derived_from_claims:
  - C00015
  - C00016
  - C00034
  - C00035
