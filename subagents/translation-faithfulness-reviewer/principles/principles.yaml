- principle_id: P008
  statement: Recognize that conventional translation of expository writing privileges
    the capture of signifieds — giving primacy to message and concept over language
    texture, so it works by substitution while losing the order of syntax and metonymy
    that carries the original's textual work — and adopt Lewis's new axiomatics of
    fidelity, which demands fidelity to far more than semantic substance (the chain
    of signifiers, syntactic processes, discursive structures, and rhetorical strategies)
    and shifts the translator's problem from avoiding inevitable failures to compensating
    for losses and renewing signifying energy; direct any abusive move not at just
    any element but at a key operator or decisive textual knot — a cluster of textual
    energy that resists the preponderant values of the usual and useful — since abusive
    translation foreignizes in two directions at once, forcing the target language
    from within and directing a critical thrust back at the source so that the original
    is rendered still more foreign to itself.
  derived_from_claims:
  - C02081
  - C02082
