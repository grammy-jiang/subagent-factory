- principle_id: P129
  statement: Diagnose most 'unnaturalness' as gratuitous processing effort (rendering
    'Ich habe keine Ahnung' as 'I have no premonition' gives the word too much particularity,
    so the audience expects a payoff that never comes), and therefore render common
    expressions by equally common ones without appealing to a separate 'naturalness'
    principle — but do not simplify an original's complexity as merely unnatural,
    because the more complex structure may be intentional and yield special contextual
    effects with the right assumptions and apparent unnaturalness can stem from the
    reader or translator supplying the wrong contextual assumptions; and note that
    simultaneous and oral interpretation must instead prioritize instant clarity,
    never hesitating to depart considerably from the original when it makes the message
    clearer, because the aural stream flows on and gives the audience no time to ponder.
