- principle_id: P125
  statement: 'Take Reiss''s frame: interlingual translation is bilingual mediated
    communication aiming at a target text functionally equivalent to the source, with
    the translator as a secondary sender, so some change of message is inevitable
    (a communicative difference present even in monolingual communication); distinguish
    unintentional changes (from differing language structures and limits of competence)
    from intentional ones (made when the translation''s aims or readership deliberately
    differ from the original''s), and note that when they do differ the goal shifts
    from functional equivalence with the source to adequacy of the reverbalization
    to a new foreign function — which is why a translation typology, not only a text
    typology, is needed.'
