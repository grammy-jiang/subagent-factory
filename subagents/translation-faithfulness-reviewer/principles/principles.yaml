- principle_id: P011
  statement: Never assume a translated text is representative of the target language
    or of any overall textual tradition thereof, because translational norms may differ
    from the norms governing non-translational text production and their identity
    must not be taken for granted; and take Toury's central thesis that norms determine
    the type and extent of equivalence a translation manifests, which turns equivalence
    from an ahistorical, prescriptive concept into a historical one — not a single
    invariant relation but any relation found to characterize translation under a
    specified set of circumstances.
  derived_from_claims:
  - C00120
