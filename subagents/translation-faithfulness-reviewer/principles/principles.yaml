- principle_id: P127
  statement: Note that merely reversing the hierarchy — treating writing itself as
    a 'creative misreading' of a strong precursor (Bloom, Eagleton) — does not remove
    the gender bias, since the creative mechanism stays coded as male, and that the
    originality myth is better dissolved by theories of intertextuality that disperse
    origins into history and codes and by feminist recovery of marginalized women's
    writing; Derrida recasts translation's impossibility as a function of the law
    of translation rather than the translation's infidelity, a double bind in which
    a text both requires and forbids its translation so that translation is at once
    original and secondary and the difference between an original and its reproduction
    becomes undecidable — translation being productive writing called forth by the
    original, which binds the two in an impossible but necessary contract that makes
    each the debtor of the other and subverts the privilege of the 'original'.
