- principle_id: P130
  statement: Locate the real barriers to literal translation as specific and local
    rather than deep, since strong linguistic determinism is false and one can have
    a thought without the language that names it, so a concept, referent, or social
    practice simply absent in the target language (burnt sienna in Twi, a particular
    curse) is important but not theoretically puzzling; and handle the case where
    a genre convention cancels an utterance's literal intentions but implies a different
    one to be reconstructed (recognizing that a proverb is being made, as 'Once upon
    a time' cancels the belief-implication), from which the hearer, building on the
    cancelled literal meaning and on mutually known, context-bound fact, works out
    the target thought the speaker does intend — for a proverb's or metaphor's literal
    meaning is real yet is not what the speaker means by it.
