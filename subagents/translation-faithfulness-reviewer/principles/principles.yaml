- principle_id: P124
  statement: 'Expect the dispersion of possible translation variants to track the
    two languages'' relative lexical segmentation — the broader the source''s segmentation
    compared to the target''s, the greater the divergence of variants — and to depend
    on genre and on the source''s interpretive richness: a prose ''gooseberry'' demands
    exact one-to-one equivalents while a line of verse tolerates near-synonyms and
    so admits far more renderings, and a semantically broad, richly interpretable
    source (Shakespeare''s complex characters) generates multiple parallel versions
    where a minutely segmented single-meaning source (Moliere''s Harpagon) does not.'
