- principle_id: P010
  statement: Preserve source markedness in the target text when it carries a communicative
    function, since a marked source item usually needs a similarly marked rendering
    but not always and the translator should find the reason behind the markedness,
    and recognize the translator's own discursive presence, since translational stylistics
    can recover the translator's style and intentions from the target choices.
