- principle_id: P122
  statement: 'Understand formal equivalence (F-E) as a source-oriented rendering that
    focuses on the message in both form and content and constantly compares the receptor
    message to the source for accuracy: its typifying case is a gloss translation
    (as literal and meaningful as possible, with numerous footnotes) that lets the
    reader identify with the source context, and it reproduces grammatical units,
    consistency of word usage (terminological concordance, always rendering a source
    term by the same receptor term), and source-context meanings (idioms rendered
    literally) — supplemented with marginal notes for features such as puns, chiasmus,
    and acrostics that defy equivalent rendering.'
