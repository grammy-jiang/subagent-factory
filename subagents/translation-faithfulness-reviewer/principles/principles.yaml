schema_version: principles-v1
principles:
- principle_id: P001
  statement: 'Recognize that 1960s-70s equivalence theory is fundamentally normative
    — it supplies standards to evaluate translations, not merely tools to describe
    them — and that equivalence is multi-dimensional: Koller''s denotative, connotative,
    text-normative, and pragmatic kinds, and a family of binary oppositions (Nida''s
    dynamic/formal, Newmark''s communicative/semantic, House''s covert/overt, all
    descended from sense-for-sense vs word-for-word) that contrast a pragmatic equivalence
    so familiar it conceals the translation with a formal equivalence so close it
    reveals itself as one.'
  derived_from_claims:
  - C01488
  - C01489
  - C01491
  - C01856
  - C01857
  - C01858
  - C02303
  - C02304
  - C02305
  confidence: high
  applies_when:
  - reasoning about how a target text should relate to its source
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P002
  statement: 'Orient every translation toward a set of addressees even when that set
    is indeterminate and fuzzy (it may be envisaged as an addressee-type or inferred
    from the commissioning publisher''s range), and recognize that functional constancy
    between source and target is the exception rather than the rule — the neuralgic
    point where practice and theory diverge is precisely where texts are lifted out
    of their environment for comparison, ignoring their process aspect, so that a
    skopos is always already present in any translation (assimilating or deliberately
    marked) and the theory requires only that one translate consciously and consistently
    according to some target-respecting principle: a source text has no single correct
    or best translation, and every translation is carried out according to an explicit
    or implicit commission, possibly one the translator sets himself.'
  derived_from_claims:
  - C01496
  - C01497
  - C01926
  - C01927
  - C02430
