- principle_id: P128
  statement: 'Model translation, with Gutt, as interlingual interpretive use — a receptor-language
    text that interpretively resembles the original, the only stipulation being that
    the two texts belong to different languages — where how much and in what respects
    a rendering resembles its original is not fixed but set by relevance to the audience
    (as reporting ''what Pike said'' can range from a one-line gist to the full paper),
    so that faithfulness is optimal resemblance: the rendering resembles the original
    closely enough in the relevant respects to offer adequate contextual effects without
    gratuitous processing effort, consistent with the presumption of optimal relevance.'
