    test_cases: []
- principle_id: P003
  statement: Decide whether a translation is overt (its source is tied to its culture
    and time, so it cannot pretend to be an original and seeks second-level functional
    equivalence at the level of language, register, and genre, letting target receivers
    eavesdrop) or covert (its source is not culture-bound, so it should read as an
    original through a cultural filter that adapts cultural elements at the levels
    of language and register), treat the distinction as a cline, and produce a version
    rather than a translation when the source genre has no equivalent target form.
  derived_from_claims:
  - C00314
