- test_id: PB-P001
  principle_id: P001
  mode: review
  prompt: We are reviewing a translation or translation-studies analysis where equivalence theory and
    orientation is at issue. What flaw should we check for, what is the correction, and what residual
    trade-off should we carry?
  expected_behaviour:
