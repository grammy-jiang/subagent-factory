schema_version: principles-v1
principles:
- principle_id: P001
  statement: Start persuasion by recognising exactly what is being asserted and by
    fixing the main assertion the data supports before deciding how to graph or present
    it, because an audience believes an argument far more readily when they know and
    appreciate its assertions and because every detail spoken and shown should then
    drive toward that assertion.
  derived_from_claims:
  - C00235
  - C00236
  - C00237
  - C01124
  - C01129
  - C01130
  confidence: high
  applies_when:
  - a slide will present data
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
- principle_id: P002
  statement: Replace a bulleted list with the visual form of the relationship it actually
    holds — a timeline for chronological details, call-outs around an image for spatial
    ones, a pie graph for relative sizes, and a diagram for a flow — because the list
    presents details without showing how they connect and leaves the audience to work
    the relation out.
  derived_from_claims:
  - C00362
  - C00363
  - C00364
  - C00365
  - C00366
  - C00901
  confidence: high
  applies_when:
  - a slide consists of bullet points that belong together for unexamined reasons
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
- principle_id: P003
  statement: Blank the screen deliberately with the black or white key, or with an
    inserted black slide when the keyboard is out of reach, because a pause creates
    drama and meaning, gives the audience time to contemplate, and makes them feel
    they are interacting solely with the presenter.
  derived_from_claims:
  - C00257
  - C00258
  - C00584
  - C01318
  - C01319
  confidence: high
  applies_when:
  - a portion of the talk needs no visual support
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P004
  statement: Open blank space between a slide's elements, since too little does three
    separate kinds of damage — the slide feels crowded, the viewing order becomes
    ambiguous, and the audience bounces inefficiently between elements — and the default
    master causes it by reserving obsolete transparency-era gutters and by setting
    text larger than it needs to be.
  derived_from_claims:
  - C00406
  - C00407
  - C00408
  - C01180
  - C01181
  confidence: high
  applies_when: []
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
- principle_id: P005
  statement: Do not open presentation software during idea generation; collect and
    create content first, keep generating along a theme until possibilities are exhausted,
    and expect the genuinely clever ideas to appear in the third or fourth round rather
    than the first.
  derived_from_claims:
  - C00826
  - C00827
  - C00828
  - C01082
  - C01083
  confidence: high
  applies_when:
  - starting work on a new presentation
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P006
  statement: Account for all three Aristotelian appeals — logical evidence, the audience's
    emotion, and the speaker's own credibility of character — rather than logic alone,
    because facts by themselves do not persuade, scientists systematically underrate
    the other two, and many decisions about science are made by non-technical people
    whom character and emotion sway.
  derived_from_claims:
  - C00242
  - C00243
  - C00249
  - C00832
  confidence: high
  applies_when:
  - the presentation aims to persuade, especially a non-technical decision-maker
  - auditing a presentation's persuasive coverage
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
- principle_id: P007
  statement: Force a large minimum type size, because small type comes from not knowing
    the material well enough or believing more text is more convincing, while the
    size floor compels the presenter to find and explain the most salient points.
  derived_from_claims:
  - C00378
  - C00380
  - C00381
  - C01327
  confidence: high
  applies_when: []
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P008
  statement: 'Keep logos secondary rather than putting one on every slide: identify
    the institution and presenter on the first and last slides and on any distributed
    slide, place a logo in a bottom corner rather than the upper-left space the assertion
    headline claims, and remove any logo that crowds the visual evidence.'
  derived_from_claims:
  - C00397
  - C00398
  - C00399
  - C01188
  confidence: high
  applies_when:
  - brand rules mandate a logo on every slide
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
- principle_id: P009
  statement: 'When the content really is a document, change the format rather than
    the slides: hold a meeting, circulate the document beforehand or let the audience
    read it at the start, and spend the rest of the time on discussion and action
    plans — and if the goal is only to convey facts and figures, cancel the meeting
    and send a report.'
  derived_from_claims:
  - C00708
  - C00709
  - C01047
  - C01052
  confidence: high
  applies_when:
  - deciding whether a piece of material should be delivered live or circulated
  - the content cannot be reduced to a visual aid
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P010
  statement: Judge a presentation by whether the audience looks enlightened, moved
    to act, or willing to change behaviour, and get there by reviewing the content
    through their eyes, showing them something they have never seen, and combining
    strong stories with convincing information delivered humanly.
  derived_from_claims:
  - C00747
  - C01353
  - C01354
  confidence: high
  applies_when:
  - defining success criteria for a presentation
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P011
  statement: Verify the colour palette by projecting it in the room rather than judging
    it on the authoring screen — checking contrast against the background and among
    the chosen colours and tweaking manually while projecting — because a contrast
    that looks adequate on the author's monitor can be entirely unreadable when projected;
    bring your own projector or arrive early enough to adjust the venue's.
  derived_from_claims:
  - C00387
  - C01205
  - C01206
  confidence: high
  applies_when:
  - the deck will be projected
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P012
  statement: Reduce an overloaded slide by asking what can be removed without changing
    the meaning and where the content can be split, because a slide's value is the
    clarity of its message, not the amount of information it holds — clear space is
    fine and clutter is a design failure.
  derived_from_claims:
  - C00975
  - C01182
  - C01183
  confidence: high
  applies_when:
  - preparing slides for a scientific or technical audience
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P013
  statement: Abandon the goal of satisfying a mixed audience throughout the whole
    talk — no design achieves it — and aim instead for everyone satisfied by the end,
    addressing the different audiences at different moments.
  derived_from_claims:
  - C00082
  - C00885
  confidence: high
  applies_when:
  - the audience mixes technical levels
  - the audience is mixed in background and interest
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
- principle_id: P014
  statement: 'Apply the assertion-evidence structure as a pair of substitutions: a
    succinct sentence stating the slide''s main assertion — a hypothesis, assumption,
    insight, or result — in place of the phrase headline, and visual evidence in place
    of the bulleted list, with bulleted lists not occurring at all.'
  derived_from_claims:
  - C00004
  - C00005
  - C00006
  - C00013
  - C00014
  - C00281
  - C00282
  - C00304
  - C00657
  - C00658
  - C00659
  confidence: high
  applies_when:
  - the slide carries technical content
  - the slide carries a technical assertion
  - the message matters enough to justify the preparation
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
- principle_id: P015
  statement: 'Follow the headline rules concretely: no more than two lines, left justified,
    capitalised as a sentence with the period optional, starting in the upper-left
    corner where Western audiences look first, set at 28 points, and broken so that
    noun, verb, and prepositional phrases stay together with no single word orphaned
    on the second line.'
  derived_from_claims:
  - C00307
  - C00332
  - C00333
  - C00335
  - C00336
  - C00337
  - C00338
  - C00339
  confidence: high
  applies_when:
  - the slide uses a sentence-assertion headline
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
- principle_id: P016
  statement: Accept that no single delivery style is correct — a poised professional
    manner and an unpolished but passionate one both hold audiences, and a speaker
    who violates every prescribed rule of dress, eye contact, and stance can still
    distinguish themselves through sincere passion, deep knowledge, and sensitivity
    to the audience — so develop a style from what the speaker is actually comfortable
    giving.
  derived_from_claims:
  - C00001
  - C00002
  - C00022
  - C00493
  - C00496
  - C00497
  confidence: high
  applies_when:
  - critiquing or coaching a speaker whose style differs from the reviewer's own
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
- principle_id: P017
  statement: Treat the presentation software's defaults as an unvalidated inheritance
    rather than guidance — they were never founded on research and are baked into
    institutional templates — and instead assess every default against the actual
    audience, purpose, and occasion, proactively changing what does not serve them
    rather than either following the defaults or avoiding the software.
  derived_from_claims:
  - C00262
  - C00263
  - C00264
  - C00409
  - C00410
  - C00412
  confidence: high
  applies_when: []
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
- principle_id: P018
  statement: Keep the word count low enough to serve only as a mnemonic the presenter
    is comfortable delivering, because a wordy slide is read faster than it can be
    explained and makes the presenter irrelevant to their own presentation — recognizing
    that the application's default template is already a document, not a visual aid.
  derived_from_claims:
  - C01046
  - C01048
  - C01051
  - C01063
  - C01222
  - C01223
  confidence: high
  applies_when:
  - auditing an existing deck for whether it is a presentation or a document
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P019
  statement: Strip every phrase and decorative image that does not connect directly
    to the spoken content, since audiences understand and remember more when extraneous
    information is removed; the working target is the slide's signal-to-noise ratio.
  derived_from_claims:
  - C00003
  - C00023
  - C00024
  - C00277
  - C00279
  confidence: high
  applies_when:
  - the speaker knows far more than the talk can carry
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
- principle_id: P020
  statement: Walk through the whole presentation beforehand even in a mumble, because
    practice smooths the transitions between assertions, works out the explanations
    of difficult concepts, and above all dispels the greatest source of a speaker's
    nervousness — the fear of standing before an audience with nothing to say.
  derived_from_claims:
  - C00523
  - C00524
  - C00616
  - C00617
  - C00618
  confidence: high
  applies_when: []
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
- principle_id: P021
  statement: 'Recognise the ease of bulleted lists as their real danger: they let
    the speaker skip deciding how the details relate, requiring only parallel grammar,
    so a list is brainstorming dressed as a finished presentation — surface thinking
    that should be a presenter''s last choice, not their first.'
  derived_from_claims:
  - C00106
  - C00107
  - C00370
  - C00371
  - C00411
  confidence: high
  applies_when: []
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
- principle_id: P022
  statement: 'Run a closing sequence that gives the audience time to compose questions:
    a headline beginning ''In closing'' or ''In summary'' so they start as the slide
    appears, a strong final sentence, a pause for applause with a thank-you to cue
    it if none comes, and only then the word Questions animated in — because an abrupt
    ending produces silence that reads as though nobody understood or cared.'
  derived_from_claims:
  - C00154
  - C00161
  - C00225
  - C00436
  - C00437
  confidence: high
  applies_when: []
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
- principle_id: P023
  statement: 'Set layout to guide the eye: text blocks and especially headlines to
    no more than two lines, any list or set of call-outs to two, three, or four items,
    animation only where it serves the audience and never gimmicky, and enough blank
    space between elements that the slide breathes.'
  derived_from_claims:
  - C00314
  - C00330
  - C00331
  - C00345
  - C00346
  confidence: high
  applies_when: []
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
- principle_id: P024
  statement: Make the final projected slide summarise the talk's most important takeaway,
    because it is displayed longest while questions are taken and it gives the audience
    content from which to fashion questions; an empty one is worse than a blank screen,
    a Thank You slide wastes the screen when voice and expression convey the thanks
    better, and a Questions slide tells the audience what they already know.
  derived_from_claims:
  - C00431
  - C00432
  - C00433
  - C00434
  - C00435
  confidence: high
  applies_when: []
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
- principle_id: P025
  statement: Measure a slide against projected words per minute rather than against
    a per-slide word rule, because a slide projected for about a minute competes with
    the 120 to 140 words the speaker delivers in that same minute — which is why even
    a 6-by-6-compliant slide carries too many words.
  derived_from_claims:
  - C00272
  - C00297
  - C00298
  - C00534
  - C00535
  confidence: high
  applies_when: []
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
- principle_id: P026
  statement: 'Give the presenter structure without a script: slides should scaffold
    the talk rather than put words in the presenter''s mouth, because a detailed script
    blocks connection with the audience.'
  derived_from_claims:
  - C01044
  - C01045
  - C01049
  - C01050
  - C01103
  confidence: high
  applies_when:
  - a slide is being designed for live delivery by a presenter
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P027
  statement: Reserve the Lessig style — short phrases and images flashed for about
    a second each in synch with the speech — for keynotes and after-dinner talks delivered
    on multiple occasions, because audiences perceive it as light-hearted and one
    15-minute talk can run to more than 300 slides requiring continual practice to
    hold the timing.
  derived_from_claims:
  - C00456
  - C00457
  - C00458
  - C00459
  - C00460
  confidence: high
  applies_when:
  - the occasion welcomes wit and the material will be reused
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
- principle_id: P028
  statement: Never attempt a live demonstration without rehearsing it on the actual
    equipment, since an unpractised demonstration can injure the presenter, hijack
    the lesson, or cost a contract outright at the culminating moment of a bid, and
    rehearsal exposes both the pitfalls that would startle the presenter mid-performance
    and the device-specific traps that strike at the start — it guarantees nothing,
    since practised demonstrations still fail, but it greatly increases the odds.
  derived_from_claims:
  - C00474
  - C00475
  - C00481
  - C00482
  - C00483
  confidence: high
  applies_when:
  - the talk includes a live demonstration
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
- principle_id: P029
  statement: 'Be transparent so the audience can see past the presenter to the idea,
    which requires three things: be honest — sharing failures and how they were overcome
    rather than posing as flawless; be unique — surfacing the differences that bring
    new insight instead of concealing them to fit in; and do not compromise — speaking
    confidently and accepting that ridicule or rejection is sometimes the price.'
  derived_from_claims:
  - C01006
  - C01007
  - C01008
  - C01009
  - C01010
  confidence: high
  applies_when:
  - the presenter's instinct is to project authority and hide uncertainty
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P030
  statement: 'Pair facts with emotional appeal rather than choosing between them:
    use plenty of evidence but accompany it with appeals to desire, since logical
    agreement alone does not produce action and stacking more proof does not convert
    a determined skeptic.'
  derived_from_claims:
  - C00687
  - C00688
  - C00689
  - C00690
  - C00692
  confidence: high
  applies_when:
  - the audience must decide or act, not merely understand
  - competing options are functionally equivalent
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P031
  statement: 'Weigh a presentation against a document on five advantages — fielding
    questions, reading expressions, delivery emphasis, richer visual aids, and evidenced
    receipt — against five disadvantages: one pass only, no time to look things up,
    the audience held to the speaker''s pace, success hostage to delivery, and the
    difficulty of assembling everyone.'
  derived_from_claims:
  - C00016
  - C00017
  - C00031
  - C00032
  - C00039
  confidence: medium
  applies_when:
  - the communication channel is still open to choice
  - choosing or justifying the communication medium
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
- principle_id: P032
  statement: Include title, outline, and conclusion slides only where they earn their
    place, since they carry organisation rather than content and the shorter the talk
    the less each is needed; a research-conference talk needs no outline slide, and
    opening on a blank black slide with the focus on the speaker can be effective
    when the audience already holds a concrete image of the topic.
  derived_from_claims:
  - C00415
  - C00416
  - C00417
  - C00422
  confidence: high
  applies_when: []
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
- principle_id: P033
  statement: 'Keep the balance between what is shown and what is said: the headline
    carries the main message, the body carries the evidence, and the secondary details
    such as how the experiment was run are supplied aloud — which both builds credibility
    by demonstrating ownership and lets the same slide sequence flex to the audience
    and the time available.'
  derived_from_claims:
  - C00305
  - C00317
  - C00318
  - C00323
  confidence: high
  applies_when: []
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
- principle_id: P034
  statement: Choose the type of visual evidence from the assertion it must support
    — a map and photographs for a background fact, photographs with a timeline and
    graph for a trend, a diagram for a process, a line or bar graph for a quantitative
    relationship — because well-chosen visual evidence lets the audience grasp the
    connections at a glance where a bulleted list cannot.
  derived_from_claims:
  - C00341
  - C00342
  - C00354
  - C00358
  confidence: high
  applies_when: []
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
- principle_id: P035
  statement: 'Settle the story before opening the slide software: write the main message
    and each supporting assertion on separate sticky notes, arrange them into the
    order that tells the best story, and treat that as the argument — the steps that
    carry the audience to the main message — after which any detail supporting none
    of them is excluded.'
  derived_from_claims:
  - C00515
  - C00516
  - C00517
  - C00518
  confidence: high
  applies_when: []
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
- principle_id: P036
  statement: Critique a talk from four separate perspectives — speech, structure,
    visual aids, and delivery — while remembering that strength in one can offset
    weakness in another; the decisive test is whether a weak area distracts the audience
    from the content.
  derived_from_claims:
  - C00049
  - C00050
  - C00052
  - C00663
  confidence: high
  applies_when:
  - reviewing a colleague's or one's own presentation
  - reviewing a colleague's, a student's, or one's own presentation
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
- principle_id: P037
  statement: Emphasise deliberately, because listeners remember only a fraction of
    what they hear and a well-organised talk without emphasis leaves them carrying
    away its least important details; the available mechanisms are repetition, illustration,
    and placement, plus the delivery moves of pausing, changing volume — often lowering
    it — and stepping closer.
  derived_from_claims:
  - C00156
  - C00157
  - C00180
  - C00181
  confidence: high
  applies_when: []
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
- principle_id: P038
  statement: Assess the audience's prior bias first, because it sets both the strategy
    and the energy an argument requires and can be the overriding determinant of the
    outcome regardless of the speaker's stature — the same argument succeeding with
    one audience and failing with another on bias alone.
  derived_from_claims:
  - C00060
  - C00232
  - C00233
  - C00234
  confidence: high
  applies_when:
  - the presentation asks an audience to change or defer a decision
  - the presentation aims to persuade
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
- principle_id: P039
  statement: Design against the three specific ways audiences get lost — gaps in the
    logic they cannot bridge, an unsignalled change of direction, and exhaustion from
    too many details — and assume listeners will drift even with sound structure,
    so build in a way for them to recover.
  derived_from_claims:
  - C00213
  - C00214
  - C00222
  - C00226
  confidence: high
  applies_when: []
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
- principle_id: P040
  statement: Engineer contrast against the audience's own environment and expectations,
    because obscurity rather than opposition is what defeats an idea and nothing carries
    intrinsic attention-grabbing power apart from how far it stands out from its context.
  derived_from_claims:
  - C00682
  - C00683
  - C00684
  - C00686
  confidence: high
  applies_when:
  - the idea competes for attention with other messages the audience already receives
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P041
  statement: Use stories for two specific jobs — creating the anticipation that makes
    an audience lean in, and supplying the frame that lets them recall the sequence
    of details hours later — while keeping the talk a blend of document and story
    rather than a story outright.
  derived_from_claims:
  - C00110
  - C00111
  - C00112
  - C00115
  confidence: high
  applies_when: []
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
- principle_id: P042
  statement: Anchor any concept the audience does not know in a specific physical
    example or analogy rather than an abstract or mathematical treatment, because
    a concrete image is what carries most listeners through the mathematical stretches
    — and attaching a physical example to a derivation can even expose errors that
    listeners tracking only the algebra would miss.
  derived_from_claims:
  - C00116
  - C00117
  - C00118
  - C00201
  confidence: high
  applies_when:
  - the concept is unfamiliar to the audience
  - the talk contains abstract or mathematical passages
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
- principle_id: P043
  statement: 'Signal every transition through at least one of three channels — the
    wording of the speech, a change in the visual aids, or the delivery — at all the
    points that need it: introduction to middle, between each pair of middle sections,
    and middle to conclusion.'
  derived_from_claims:
  - C00152
  - C00153
  - C00223
  - C00224
  confidence: high
  applies_when: []
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
- principle_id: P044
  statement: Judge a headline type by which one leads the speaker to prepare a more
    focused talk with fewer words overall and which better re-orients a listener who
    missed the transition onto the slide — not by which is shorter.
  derived_from_claims:
  - C00265
  - C00266
  - C00267
  - C00326
  confidence: high
  applies_when: []
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
- principle_id: P045
  statement: 'Reject the bulleted list on three grounds at once: it does not show
    connections, does not reveal hierarchy, and leaves the critical assertions unspecified
    — while its word count makes reading and listening simultaneously difficult and
    its position squeezes out the space for graphics.'
  derived_from_claims:
  - C00268
  - C00269
  - C00270
  - C00310
  confidence: high
  applies_when: []
