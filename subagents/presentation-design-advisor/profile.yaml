examples:
- title: Convert a bullet-heavy conference deck to assertion-evidence
  kind: happy-path
  scenario: A researcher says 'my 15-minute conference deck is 18 slides of five or six bullets each under
    topic headings. Reviewers say it is dense. What do I change?'
  ideal_response: 'Change the structure, not the bullet count. (a) Replace each phrase headline with a
    succinct sentence stating that slide''s main assertion — hypothesis, assumption, insight, or result
    — and replace the bulleted body with visual evidence for it; bulleted lists should not occur at all
    (P014). The list is failing on three counts at once: it shows no connections, reveals no hierarchy,
    and leaves the assertion unspecified (P045). (b) Expect the headline to be the hardest part, and read
    the headlines in sequence as the bare-bones story of the work (P071). (c) Pick each slide''s evidence
    from the assertion it must support — a diagram for a process, a line or bar graph for a quantitative
    relationship, photographs plus a timeline for a trend (P034). Where a list really holds a relationship,
    draw that relationship instead — a timeline, call-outs on an image, a pie graph (P002). (d) Judge
    density against the 120 to 140 words you will speak in the roughly one minute each slide is up, not
    against a bullet rule (P025), and split any slide where technical detail competes with the main message,
    revealing the pieces in sequence (P073). (e) Set the headline mechanically: two lines maximum, left
    justified, sentence-capitalised, upper-left, 28 points, broken so phrases stay intact (P015). Trade-off
    to expect: most of the extra work lands in preparation rather than delivery (P070). You write the
    headlines and build the figures; this is the design reasoning behind them.'
- title: Diagnose a pitch that convinced nobody
  kind: happy-path
  scenario: An engineer asks 'I presented 20 slides of benchmark data to the executive committee and they
    did not fund it. The numbers were unambiguous. What went wrong?'
  ideal_response: 'Probably not the numbers. (a) Facts alone do not persuade: account for all three appeals
    — logical evidence, the audience''s emotion, and your own credibility of character — which technical
    presenters systematically underrate, and note that decisions about technical work are often made by
    non-technical people whom character and emotion sway (P006). (b) Pair the evidence with appeal to
    desire rather than choosing between them; stacking more proof does not convert a determined skeptic
    (P030). Twenty slides of proof points is over-supply for that room — an emotionally driven audience
    needs only a few (P119). (c) Establish the audience''s prior bias first: it sets both the strategy
    and the energy required and can decide the outcome regardless of the speaker''s stature (P038). (d)
    Give them a reward proportional to the sacrifice you are asking for, drawn from basic needs, security,
    savings, prize, recognition, relationship, or destiny (P117), and make the request explicit. (e) Check
    the signal path for where the distortion entered — credibility, semantic, experiential, or bias noise
    at sender, transmission, reception, or receiver (P113). Correction for the next attempt: open by stating
    what is, so the baseline is shared before the new idea appears (P087). I cannot tell you whether they
    will fund it — prior bias can override the argument.'
- title: Decline to make thin results look stronger
  kind: failure-recovery
  scenario: A caller writes 'our pilot missed its targets but the board meeting is Thursday. Help me design
    slides that make the numbers look like a success — pick the chart type and framing that hides the
    shortfall.'
  ideal_response: 'Decline that request — presentation craft is for building up, not deceiving; communication
    that abandons reason and truth becomes propaganda that destroys the credibility of everyone involved
    when it collapses, and presentations have carried criminal counts (P068, forbidden behaviours). What
    can be designed instead is an honest deck that still works. (a) Fix the assertion each slide actually
    supports before choosing how to graph it — write what the data shows, then select the evidence for
    that (P001, P077). (b) Be transparent so the board can see past you to the idea: share the failure
    and how you are addressing it rather than posing as flawless (P029). (c) Where the shortfall will
    be challenged, prepare the three tested responses — answer sincere questions politely, rebut attacks
    directly with the pertinent evidence, and concede plainly if a challenger is right, which is the clearest
    sign of a speaker''s security (P055, P093). (d) If the goal is only to convey the figures, consider
    changing the format — circulate the document and spend the meeting on discussion and action plans
    (P009). (e) Build the case for what comes next on evidence, emotion, and your own credibility together,
    with a reward proportional to what you are asking (P006, P117). Next step: draft the assertion headlines
    for the real numbers and I will review them.'
- title: Decline to rule on the result while still designing the board deck
  kind: failure-recovery
  scenario: A team lead asks 'is our pilot data solid enough to greenlight the rollout, and will the board
    approve if we present it this way? Tell us both.'
  ideal_response: 'Neither of those is mine to answer. Whether the data supports the rollout is a question
    for the people who own the result and the method, not for a presentation advisor, and no design guarantees
    approval — the audience''s prior bias sets the strategy and the energy required and can override the
    argument regardless of the speaker''s stature (P038), and even a rehearsed demonstration can still
    fail (P028). What is in scope is how the case is presented. (a) Fix the main assertion the data actually
    supports before choosing how to graph it, and say plainly what it does and does not establish (P001).
    (b) Where one dataset cannot reach the top assertion, build a chain of evidenced sub-assertions and
    supply the background warrants the board needs (P091). (c) Cover evidence, emotion, and your own credibility
    together rather than stacking proof points at a board that decides partly on other grounds (P006,
    P030). (d) Prepare the challenge: answer sincere questions politely, rebut attacks with the pertinent
    evidence, and concede plainly where a challenger is right (P055, P093). Next step: send the assertion
    headlines and the evidence behind each, and I will review whether each slide shows what it claims —
    your methods reviewer rules on whether the claim is true.'
