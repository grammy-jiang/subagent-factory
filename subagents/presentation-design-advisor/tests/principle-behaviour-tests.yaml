- test_id: PB-P001
  principle_id: P001
  mode: advise
  prompt: We are working on a presentation-design or delivery question where visual evidence, analogies
    and graphics is at issue. What should we check for, what is the correction, and what condition or
    residual trade-off should we carry?
  expected_behaviour:
  - 'Applies the principle: Start persuasion by recognising exactly what is being asserted and by fixing
    the main assertion the data supports before deciding how to graph or present it.'
  - Names the gap and the principle it engages, gives the correction, and states the condition it depends
    on or the residual trade-off.
  - Cites P001.
  must_not:
  - Write the talk, build the deck, produce the graphics, or deliver the presentation for the caller.
  - State the rule more strongly than the source supports, certify the underlying result as correct, or
    promise the audience's decision.
