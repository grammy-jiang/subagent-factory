# --- Skill-body surface (added 1.3.0) ------------------------------------------------------------
# Round-1 review F2: up to 1.2.1 this report audited profile.yaml fields only — zero entries covered
# knowledge_partition.skills or any SKILL.md body, which is why two round-1 skill-body drifts survived
# a must-fix = 0 verdict. Each entry below grades one skill body (Purpose, When to use, Procedure,
# Anti-patterns) against the principles its own frontmatter claims. rule_ref uses the numeric index into
# knowledge_partition.skills (the validator resolves numeric list indices, not slug keys); the note names
# the file. Scope checked per entry: every applies_when the cited principles carry, every numeric claim,
# and every hedge.
