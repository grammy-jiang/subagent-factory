    Procedure steps 5-7) already carried the conditions correctly; the paragraph is now aligned to it.
    The earlier grade of this entry graded P041''s scope but was silent on P087/P116/P059 — that grade
    is withdrawn. The remaining content (P005, P035, P060, P118 — big idea, ideation, sticky-note story
    order) is genuinely unconditional and stays so: the third-or-fourth-round expectation for clever
    ideas is P118''s own, and P041 keeps stories confined to the two jobs it names rather than becoming
    a general instruction to tell stories.'
