    test_cases: []
- principle_id: P014
  statement: When adopting TDD on a legacy codebase, do not test and refactor the
    whole system at once; limit the scope of changes, leave working-but-ugly parts
    alone, and break the test/refactoring deadlock with other feedback such as a careful
    partner and imperfect system-level tests.
  derived_from_claims:
  - C00224
  - C00225
  - C00226
  confidence: high
  applies_when:
  - introducing TDD into a large legacy codebase
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P015
  statement: Treat a red bar as concrete progress; in the green phase aim only to
    pass the test, then generalize a limited implementation before moving to the next
    test.
  derived_from_claims:
  - C00025
  - C00026
  - C00027
  confidence: high
  applies_when: []
  operational_mapping:
    profile_rule: true
