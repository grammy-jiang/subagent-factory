- principle_id: P016
  statement: Integrate at each passing test with duplication removed to shorten CI
    cycles to roughly 15 to 30 minutes, achieving simple design by coding only what
    the tests need and removing all duplication, while a growing test suite lets you
    attempt more aggressive large-scale refactorings.
