    test_cases: []
- principle_id: P025
  statement: When a test turns out too big, write a smaller child test for the broken
    part, get it running, then reintroduce the larger test, first pausing to learn
    what would have made it smaller; maintaining the rhythm and minimizing time at
    a red bar is worth extra effort.
  derived_from_claims:
  - C00137
  - C00138
  - C00139
