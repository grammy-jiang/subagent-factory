  derived_from_claims:
  - C00186
  - C00187
  - C00188
  confidence: high
  applies_when: []
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P028
  statement: Unify two similar pieces of code by gradually bringing them closer and
    merging only when absolutely identical, applying this at every scale (loops, conditional
    branches, methods, classes) and sometimes working backward by making the last
    step trivial.
  derived_from_claims:
  - C00203
  - C00205
  - C00206
  confidence: high
