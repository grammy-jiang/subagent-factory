  - C00090
  - C00091
  - C00092
  confidence: high
  applies_when: []
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P023
  statement: Write a test's assertions first and work backward to create the setup
    they require, building a system from the stories you want to tell, a feature from
    the tests it should pass, and a test from the asserts that should pass — which
    separates 'what is the right answer?' and 'how will I check it?' from the other
    problems.
  derived_from_claims:
  - C00118
  - C00119
  - C00120
  confidence: high
  applies_when: []
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P024
  statement: Choose test data that makes the test easy to read for a future human,
    making any difference between values meaningful and never using the same constant
    to mean more than one thing so a reversed-argument bug cannot hide.
  derived_from_claims:
  - C00121
  - C00123
  - C00125
  confidence: high
  applies_when: []
  operational_mapping:
    profile_rule: true
    skill: null
