schema_version: principles-v1
principles:
- principle_id: P001
  statement: Design a Value Object by setting state at creation and never changing
    it, returning a new object from every operation and implementing equality (and
    usually hashing), to defeat the aliasing problem; address allocation performance
    only with realistic data, usage, profiling, and actual complaints.
  derived_from_claims:
  - C00036
  - C00037
  - C00038
  - C00039
  - C00040
  - C00181
  - C00182
  - C00183
  - C00184
  confidence: high
  applies_when:
  - the object's identity is unimportant and it is widely shared
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P002
  statement: 'Follow the red-green-refactor cycle: write a small failing test, make
    it pass as quickly as possible even with expedient code, then remove all introduced
    duplication; run all tests after each small change.'
  derived_from_claims:
  - C00004
  - C00005
  - C00006
  - C00007
  - C00008
  - C00011
  confidence: high
  applies_when: []
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P003
  statement: 'Keep tests fully isolated: they must not affect one another, must be
    fast enough to run yourself often, and should be sought at a smaller scale than
    the whole application, which forces a highly cohesive, loosely coupled design.'
  derived_from_claims:
  - C00103
  - C00104
  - C00105
  - C00106
  - C00107
  confidence: high
  applies_when: []
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P004
  statement: Attack dependency by removing its symptom, duplication — including duplication
    between test data and code — before writing the next test, so the next test passes
    with a single change.
  derived_from_claims:
  - C00028
  - C00029
  - C00030
  - C00031
  - C00032
  confidence: high
  applies_when: []
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P005
  statement: Choose a get-to-green strategy deliberately — Fake It (return a constant,
    then replace with variables), Obvious Implementation (type the real code when
    confident and quick), or Triangulation (generalize only with two or more examples)
    — and downshift to Fake It on an unexpected red bar, reserving Triangulation for
    when you are unsure how to refactor.
  derived_from_claims:
  - C00042
  - C00043
  - C00044
  - C00045
  - C00046
  confidence: high
  applies_when: []
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P006
  statement: Do not implement all tests at once; instead, in pure TDD stay never more
    than one change from green, writing newly-implied tests and refactorings onto
    the list and handling every leftover item at session end while never deferring
    a test you suspect might fail.
  derived_from_claims:
  - C00112
  - C00113
  - C00114
  - C00115
  confidence: high
  applies_when: []
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P007
  statement: Drive abstraction conservatively with Triangulation once two or more
    examples demand it, reserving it for when you are very unsure of the abstraction
    and otherwise typing the Obvious Implementation while downshifting to smaller
    steps when red bars surprise you.
  derived_from_claims:
  - C00160
  - C00161
  - C00162
  - C00163
  confidence: high
  applies_when: []
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P008
  statement: 'Eliminate duplication structurally: introduce factory methods to decouple
    clients from concrete subclasses, reconcile near-duplicate methods to a common
    supertype, and push identical members up into a superclass.'
  derived_from_claims:
  - C00053
  - C00054
  - C00055
  - C00056
  confidence: high
  applies_when: []
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P009
  statement: Never change real model code without a supporting test; the conservative
    response to a red bar is to back out to green, write the test, fix, and reapply
    — though writing a little code without a test first is acceptable for immediately-visible
    low-risk output or while already on a red bar, and prefer not to author a new
    test while red.
  derived_from_claims:
  - C00063
  - C00064
  - C00065
  - C00067
  confidence: high
  applies_when: []
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P010
  statement: Before coding, write down a list of all the tests you know you will need
    — examples of every operation, null or degenerate versions of operations that
    do not yet exist, and the refactorings needed for clean code — rather than holding
    it in your head, and never take a step without knowing where your foot will land.
  derived_from_claims:
  - C00108
  - C00109
  - C00110
  - C00111
  confidence: high
  applies_when: []
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P011
  statement: Test an object that depends on an expensive or complicated resource with
    a Mock Object that returns constants, gaining performance, reliability, readability,
    and lower coupling, while mitigating the risk of divergence with a shared test
    set run against both mock and real object.
  derived_from_claims:
  - C00140
  - C00141
  - C00142
  - C00143
  confidence: high
  applies_when:
  - the real resource is slow, fragile, or hard to set up
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P012
  statement: End a solo session by leaving the last test broken as a concrete bookmark,
    but on a team end with all tests passing, always making every test pass before
    check-in and never commenting out a test to make the suite pass.
  derived_from_claims:
  - C00151
  - C00152
  - C00153
  - C00154
  confidence: high
  applies_when: []
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P013
  statement: 'Use application-level tests to capture what users actually want, while
    accepting their fixturing and organizational challenges: establish red-green-refactor
    in your own practice first, keep programmer-level TDD for immediate green bars
    and simpler design, and spread the practice afterward.'
  derived_from_claims:
  - C00220
  - C00221
  - C00222
  - C00223
  confidence: high
  applies_when: []
  operational_mapping:
    profile_rule: true
