# Structure-first map of Kent Beck, "Test-Driven Development By Example" (Addison-Wesley,
# 2002). The converted markdown covers the Introduction + Part I (The Money Example,
# Chapters 1-17 incl. the Money Retrospective). Part II (the xUnit Example) and Part III
# (Patterns for TDD) are absent from this conversion. The operational TDD method is stated
# in the Introduction (the rhythm + the two rules) and in Chapter 2 (the general cycle +
# the three get-to-green strategies); the chapters demonstrate it on a worked example.

