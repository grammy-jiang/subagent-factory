- principle_id: P003
  statement: Treat translation as purpose-driven human interaction that guides cooperation
    across cultural barriers (translatorial action), map its roles of initiator, commissioner,
    source-text producer, target-text producer, target-text user, and target-text
    receiver, and guide the target text's form and genre by what is functionally suitable
    in the target culture as the expert determines rather than by copying the source
    profile.
