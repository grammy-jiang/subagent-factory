- principle_id: P007
  statement: 'Explain a translation''s minimization or amplification of a marked identity-discourse
    by the target culture''s prevailing conception of human subjectivity: French Enlightenment
    universalism, suspicious of subcultural identity labels and of ''the temptation
    of the community'', leads a French translator to suppress camp where Anglo-American
    identity politics would foreground it — so whether a marked discourse can accrue
    positive value in translation depends on the target polysystem''s categories (where
    the identity category and an established minority literature are disabled, the
    associated register stays marginalized), and source categories such as French
    ''pederastic literature'' must not be conflated with the target''s understanding
    of ''gay literature''.'
