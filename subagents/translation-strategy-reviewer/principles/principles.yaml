- principle_id: P005
  statement: 'Keep the ethics of the foreign in view: translating is at once sympathetic
    and violent, exploitive and ethically restorative (Steiner), so great translation
    must carry the most precise possible sense of the resistant — the barriers intact
    at the heart of understanding — rather than erase the text''s difficulty, and
    beware that the maxim that a translation should not seem translated mystifies
    its own appropriation (Meschonnic), masking an annexation of the foreign under
    an illusion of transparency that, forgetting its history, risks imperialism.'
