- principle_id: P006
  statement: Critique a translation by analyzing its concrete textual features — lexicon,
    syntax, prosody, discourse — and explaining them through the translator's literary
    habits, the traditions of the translating language, and the cultural values and
    political interests those choices invest in, rather than by an abstract fidelity
    score.
