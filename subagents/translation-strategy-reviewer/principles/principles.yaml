- principle_id: P014
  statement: 'Treat translation as identity-forming and politically inscriptive: it
    creates representations of foreign texts that answer to the interests of the translating
    culture and are determined by ethnicity, gender, class, and nation, so strongly
    ethnocentric translating has underwritten imperialism (rendering Native American
    kinship into the European identity of property, or inscribing colonial translations
    with a stereotype that rationalized British domination in India), and although
    translation can be turned to forge a national cultural identity (Quebecois translators
    raising their French through world dramatists), a struggle against one linguistic
    hierarchy can install another, since versions that reduce the foreign''s differences
    cultivate a homogeneous sameness in which doing away with any ambiguity of identity
    means getting rid of the Other.'
