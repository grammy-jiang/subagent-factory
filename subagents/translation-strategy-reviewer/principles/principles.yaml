- principle_id: P002
  statement: Recognize that translating identity-marked discourse such as 'camp' is
    target-culture-dependent (a French translator omitted the camp of an American
    gay novel while an American translator amplified it) and that a tool-kit approach,
    using whatever analytical concept proves useful, shows universalizing linguistic
    models such as politeness theory's rational, face-protecting 'Model Person' must
    be revised for specific communities; and take Venuti's argument that prevailing
    fluent strategies produce an illusion of transparency that lets a translation
    pass for the original and renders the translator invisible — masking an appropriative,
    potentially imperialistic domestication that extends the global hegemony of English
    — which can be countered by a foreignizing, experimentalist translation that registers
    the foreign text's irreducible differences, though only in domestic terms by deviating
    from currently dominant target values, so that the ethical choice is between sameness
    (ethnocentric translating that smooths institutions) and difference (ethnodeviant
    translating that prizes innovation to stimulate institutional change), an ethics
    of location whose valuation shifts with the translating culture's position in
    local, national, and global hierarchies.
