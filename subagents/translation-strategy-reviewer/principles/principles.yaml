- principle_id: P037
  statement: Study translational norms with their two complicating features in mind
    — socio-cultural specificity (a norm need not apply across sectors of a society,
    let alone across cultures, so apparent cross-cultural sameness is coincidence
    or interference) and basic instability (norms change substantially within a lifetime)
    — expecting three competing sets to coexist at once (dominant mainstream norms
    at the centre, dated remnants of previous norms, and avant-garde rudiments at
    the periphery, so that beginners often behave epigonically by following still-existing
    but dated norms); model the norms distributionally on a return-potential curve
    with a tripartite gradient (mandatory basic norms of maximum intensity, favoured-but-not-mandatory
    secondary tendencies, and merely tolerated behaviour), read a more frequent phenomenon
