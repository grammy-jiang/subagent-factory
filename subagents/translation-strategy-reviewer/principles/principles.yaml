schema_version: principles-v1
principles:
- principle_id: P001
  statement: 'Locate translation within the literary system''s two controls: patronage,
    the regulatory body with ideological, economic, and status components (usually
    exerted through critics, and either undifferentiated under one ideology or differentiated
    among competing ideologies), and poetics, the code with an inventory component
    (genres, symbols, characters, prototypical situations) and a functional component
    (how literature may function in society) that is singular under undifferentiated
    patronage but plural and stratified into ''high'' and ''low'' under differentiated
    patronage.'
  derived_from_claims:
  - C01980
  - C01982
  - C01983
  - C01984
  - C02017
  - C02018
  - C02019
