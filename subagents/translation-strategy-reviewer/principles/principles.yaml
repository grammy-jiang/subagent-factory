- principle_id: P021
  statement: Preserve, with Spivak, the rhetoricity of the language of Third World
    literatures (rhetoric's disruption of logic and grammar), because rendering such
    works into an immediately accessible 'with-it translatese' strips them of their
    linguistic, cultural, and geopolitical differences and enacts a neocolonialist
    construction of the non-Western scene — favouring a literalist 'in-between discourse'
    that gives a tough sense of the original's terrain, while heeding her warning
    that political valence is contingent, so what seems resistant in English may be
    reactionary in the original; and consider Appiah's 'thick translation', which
    uses annotations and glosses to locate a text in a rich cultural context on the
    view that a literary translation creates a relationship to the target conventions
    matching the foreign text's relationship to its own culture — a match that may
    be unfaithful to literal intentions in order to preserve formal features, and
    whose value is ultimately settled in pedagogy.
