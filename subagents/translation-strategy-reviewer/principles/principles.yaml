- principle_id: P022
  statement: Recognize that a colonial writer's or translator's dilemma is sharpened
    by diglossia rather than bilingualism — the distance between an indigenous spoken
    language and a foreign written one that share the same heritage — and that populist
    rhetoric urging writers to 'give the power of speech back to the people' can mask
    an elite institutional reappropriation, since the writers do not themselves speak
    that language and the demand really serves to prove a group's absolute difference
    and secure institutional recognition; apply instead Luther's grassroots principle
    of observing how ordinary people actually speak (seeking the mother at home, the
    children in the streets, the common man in the marketplace), because the success
    of a translation and of any institution built on it depends on a real public recognizing
    its own speech, and note that a language shared with a rival culture can be deliberately
    re-defined as 'foreign' to assert its illegitimacy, with the chosen genre staging
    that difference (theatre's primacy of the oral making the phonetic difference
    between a referential and a vernacular form audible).
