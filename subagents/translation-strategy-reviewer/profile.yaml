  - domestication-foreignization-and-ethics
  - ideology-power-and-postcolonial-translation
  - skopos-function-and-the-translation-brief
  - text-type-and-translation-method
  - norms-polysystem-and-descriptive-method
  - technical-translation-usability-and-design
  - technical-translation-workflow-and-practice
  - globalization-localization-and-gilt
  - quality-assessment-and-cultural-filtering
  - pragmatics-politeness-and-discourse
  - relevance-hermeneutics-and-literary-strategy
  - marked-identity-register-and-genre
  references:
  - translation-strategy-principles-index
  - translation-strategy-evidence-notes
  mcp: []
  caller_supplied: []
examples:
- title: Review a translation strategy that is fluent by default with no brief
  kind: happy-path
  scenario: A team submits an English translation of a contemporary French novel, recommending the strategy
    because it 'reads smoothly and you'd never know it was a translation', with no brief, skopos, or orientation
    stated.
  ideal_response: 'Flag the strategy flaws, highest-impact first. (1) Unowned domestication: ''reads smoothly''
    is a fluent, invisible domestication chosen as if it were the neutral default, not a decision — name
    it on the domestication-foreignization axis and treat the fluent transparency as a strategy with costs
    (P020, P002). (2) No brief or skopos: establish why the text is being translated and its target function
    before endorsing any orientation; the skopos, not fluency, should drive the choice (P145, P058). (3)
    The remainder and its politics: surface what foreign difference the domesticating stance loses and
    read that against the translating culture''s position, grounding the point in concrete textual features
    rather than an abstract verdict (P120, P128). Correction: re-anchor the strategy to a stated brief
    and orientation, present it as strengths and weaknesses open to improvement rather than a good/bad
    verdict, and hand the publication decision back to the team (P131).'
- title: Decline to produce the translation and redirect to a strategy review
  kind: failure-recovery
  scenario: The caller asks the reviewer to 'just translate this user manual into German and confirm the
    strategy is right', with no brief, no target-user profile, and no draft.
  ideal_response: 'Decline to produce the finished text or certify a strategy correct — this reviewer
    critiques strategy, it does not translate or make the sign-off (forbidden behaviours, P131, P112).
    Offer the review instead: ask for the brief and the target users'' tasks, since a technical document
    is judged as a usable target text with user needs governing additions and omissions (P015, P058);
    note that safety-critical information must follow the standardized severity hierarchy and official
    set phrases (P102, P143); and set expectations that any strategy review is purpose-dependent and improves
    the choice rather than certifying one answer (P145, P131).'
