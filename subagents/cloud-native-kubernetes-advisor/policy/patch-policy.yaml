schema_version: patch-policy-v1
# This package grants a produce mode (Dockerfile / kubectl command sequences).
# Default to proposing starter artefacts only; never apply or deploy silently.
# See .claude/rules and step-6 patch-safety for full policy context.
default_mode: patch_suggest_only
direct_patch_allowed_when:
  - user_explicitly_requests_patch
  - target_files_are_supplied
  - validation_command_exists
  - patch_scope_is_bounded
must_not:
  - silently_edit_canonical_artifacts
  - deploy_or_apply_kubernetes_manifests_without_approval
  - patch_without_risk_explanation
  - patch_on_weak_evidence
  - present_produced_artefact_as_production_final_without_caveat
