    verdict: WITHIN_SCOPE
    distortion:
      - none
    source_anchors:
      - cloud-native-devops-ed89eef5-h0027
    support_granularity: heading
    severity: low
    action: accept_with_note
    note: >-
      CL020 (EV009, h0027) supports "usually more cost-effective" to use managed DB, with
      evidence_strength "moderate" and support_level "partially_supported" in the evidence
      record. The limitation notes "cost-effectiveness depends heavily on organizational
