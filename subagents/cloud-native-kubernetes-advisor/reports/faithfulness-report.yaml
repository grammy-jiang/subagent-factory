      engineering investment" rather than an absolute prohibition. Within scope.

  - rule_ref: forbidden_behaviours[2]
    triplet:
      head: container_images
      relation: must_not_be_treated_as
      tail: Interchangeable with VM images; differ on performance, size, layered FS, attack surface.
    verdict: WITHIN_SCOPE
    distortion:
      - none
    source_anchors:
      - cloud-native-devops-ed89eef5-h0019
      - cloud-native-devops-ed89eef5-h0020
    support_granularity: heading
    severity: low
    action: accept_with_note
    note: >-
      CL009 (h0019) covers size differences. CL010 (h0019) covers performance (30% slower
      VMs). CL011 (EV017, h0020) covers container as unit of deployment and reuse.
      No direct evidence record for this forbidden behaviour (tagged Q10 in profile not
      mapped to a named EV record), but the underlying claims CL009/CL010/CL011 are
      present. The four-attribute list (performance, size, layered filesystem, attack
      surface) is fairly comprehensive and grounded; CL032 (EV005) grounds attack surface.
      Acceptable.

  - rule_ref: forbidden_behaviours[3]
    triplet:
      head: cloud_adoption
      relation: must_not_assert
      tail: Leads to NoOps; source refutes; DevOps work does not disappear in cloud.
    verdict: EXACT_SUPPORT
    distortion:
      - none
    source_anchors:
      - cloud-native-devops-ed89eef5-h0013
    support_granularity: heading
    severity: low
    action: accept_with_note
    note: >-
      CL006 (h0013) explicitly names "The NoOps view... is a fallacy." This is a
      "major_claim" in claims.jsonl, certainty "asserted." The forbidden behaviour
      mirrors the source refutation accurately. Fully supported.

  - rule_ref: forbidden_behaviours[4]
    triplet:
      head: managed_service_features_pricing_HA
      relation: must_not_be_treated_as
      tail: Static; landscape changes rapidly; verify current provider docs.
    verdict: WITHIN_SCOPE
    distortion:
      - none
    source_anchors:
      - cloud-native-devops-ed89eef5-h0115
      - cloud-native-devops-ed89eef5-h0117
      - cloud-native-devops-ed89eef5-h0139
    support_granularity: heading
    severity: low
    action: accept_with_note
    note: >-
      The profile tags this Q17/Q18 but no evidence records are assigned those IDs.
      EV013 (CL060, h0139) notes "Tool recommendations reflect state of the Kubernetes
      ecosystem at the time of writing (2022); the landscape evolves rapidly." EV015
      (CL055, h0134) notes minor per-provider tweaks are possible. The "landscape changes
      rapidly" framing is supported by EV013's limitation text and by the book's own
      vintage (2022). The directive to verify current docs is a reasonable operational
      inference. Acceptable as WITHIN_SCOPE.

