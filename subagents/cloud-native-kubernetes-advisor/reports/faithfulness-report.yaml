      self-hosting is not a one-time cost. The "frequently underestimated" phrasing is an
      authorial gloss on CL043's content rather than a verbatim source assertion, but is
      within scope. Supported.

  - rule_ref: forbidden_behaviours[1]
    triplet:
      head: stateful_database_on_k8s
