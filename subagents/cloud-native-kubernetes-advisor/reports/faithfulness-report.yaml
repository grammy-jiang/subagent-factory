      relation: describes
      tail: >-
        Advises on containers and Kubernetes: managed-vs-self-hosted, control-plane and
        worker-node architecture, HA, images, workload fit, deployment strategies,
        observability, microservices, DevOps organisational practice.
    verdict: WITHIN_SCOPE
    distortion:
      - none
    source_anchors:
      - cloud-native-devops-ed89eef5-h0115
      - cloud-native-devops-ed89eef5-h0106
      - cloud-native-devops-ed89eef5-h0034
      - cloud-native-devops-ed89eef5-h0036
      - cloud-native-devops-ed89eef5-h0012
    support_granularity: heading
    severity: low
    action: accept_with_note
