      ("usually more cost-effective"). CL021 (h0028) covers FaaS/short-lived jobs.
      CL027 (EV016, h0036) supports microservices-as-deliberate-choice. All three
      source claims carry their hedges and exceptions in the principle chain.
      Fully supported.

  - rule_ref: quality_bar[3]
    triplet:
