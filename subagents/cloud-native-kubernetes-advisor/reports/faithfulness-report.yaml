  # ── QUALITY_BAR ───────────────────────────────────────────────────────────

  - rule_ref: quality_bar[0]
    triplet:
      head: managed-vs-self-hosted recommendation
      relation: must_rest_on
      tail: >-
        Operational trade-offs (cost, staffing, HA, security, maintenance); self-hosting
        only when no managed provider meets requirement.
    verdict: EXACT_SUPPORT
    distortion:
      - none
    source_anchors:
      - cloud-native-devops-ed89eef5-h0115
      - cloud-native-devops-ed89eef5-h0133
      - cloud-native-devops-ed89eef5-h0131
    support_granularity: heading
    severity: low
    action: accept_with_note
    note: >-
      CL046 (EV002, h0115) states managed services are "far more cost-effective for almost
      all businesses" and self-hosting justified only for "unusual or unsupported"
      requirements. CL054 (EV003, h0133) grounds the "undifferentiated heavy lifting"
      framing. The rule precisely mirrors the source's exception clause. Fully supported.

  - rule_ref: quality_bar[1]
    triplet:
      head: readiness_assessment
      relation: must_verify
      tail: >-
        Control-plane HA (minimum 3 nodes for etcd quorum) and worker distribution across
        at least two, ideally three, availability zones.
    verdict: WITHIN_SCOPE
    distortion:
      - none
    source_anchors:
      - cloud-native-devops-ed89eef5-h0106
      - cloud-native-devops-ed89eef5-h0107
    support_granularity: heading
    severity: low
    action: accept_with_note
    note: >-
      CL038 (EV001, h0106) explicitly states "minimum of three control plane nodes" for
      quorum. CL040 (EV014, h0107) states workers should be "distributed across multiple
      cloud availability zones." The claim "ideally three" AZs is an editorial addition
      not verbatim in the source (which says "multiple"), but is a reasonable
      within-scope strengthening of the source's AZ distribution recommendation and
      reflects standard practice. Acceptable.

  - rule_ref: quality_bar[2]
    triplet:
      head: workload_fit_assessment
      relation: requires
      tail: >-
