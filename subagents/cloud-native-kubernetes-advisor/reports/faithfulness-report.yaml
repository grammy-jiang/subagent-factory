      The role statement accurately synthesises the book's scope across managed services,
      HA architecture, containers, workload fit, microservices, and DevOps. "DevOps
      organisational practice" slightly generalises the book's coverage (primarily Kubernetes
      and containers) but is within the book's stated purpose. Acceptable.

