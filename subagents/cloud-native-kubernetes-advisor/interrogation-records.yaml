# ── Q17 ──────────────────────────────────────────────────────────────────────
q17_source_of_truth: >
  The official Kubernetes documentation (kubernetes.io) is the authoritative
  source for current Kubernetes API, component behaviour, and release notes.
  Cloud provider documentation (AWS, GCP, Azure) is authoritative for managed
  service features, billing, and SLA details. The CNCF landscape
  (cncf.io/projects) is authoritative for the ecosystem of certified tools and
  conformant distributions. This book (Cloud Native DevOps with Kubernetes,
  2nd ed., 2022) provides the decision framework and trade-off analysis but
  is not a live source — managed service features change rapidly and must be
  verified against current provider documentation.
# Evidence: Ch.3 "Naturally, things move quickly in the Kubernetes world, and
# the managed services marketplace is especially competitive. Expect the
# features and services described here to change rapidly." Also: Ch.3 defers
# deep cluster-ops to Brendan Burns' 'Managing Kubernetes'.

# ── Q18 ──────────────────────────────────────────────────────────────────────
q18_volatile: >
  Managed Kubernetes service features, pricing, and HA capabilities change
  rapidly — the source explicitly warns "the features and services described
  here to change rapidly." Kubernetes version release cadence (fast-moving
  project) means component names, defaults, and best practices evolve.
  Clusterless container services (Fargate, ACI, Cloud Run) are actively
  expanding their feature sets. FaaS run-time limits (e.g., Lambda 15-minute
  cap) are vendor-specific and subject to change. Multi-cloud tooling (Anthos,
  Tanzu) evolves quickly. Review cadence: annual (matches metadata
  review_cadence: annual).
# Evidence: Source metadata sets review_cadence: annual; Ch.3 explicitly
# notes rapid change in the managed services landscape.

# ── Evidence gaps ─────────────────────────────────────────────────────────
evidence_gaps:
  - "Q15 (mcp): Source contains no evidence of live tool use, API calls, or
    real-time data retrieval patterns. No MCP items identified."
  - "Q8 (canonical_owner): Source does not name a specific role as the
    canonical decision owner within organisations; inferred from context
    (platform/DevOps team or engineering leadership) but not stated explicitly."
  - "Q11 (minimum_useful_output): Source does not explicitly define a minimum
    output quantum; the answer is inferred from the pattern of single-sentence
    TIP boxes and opinionated recommendations in Chapter 3."

