    skill: null
    reference: null
    test_cases: []
- principle_id: P031
  statement: Separate components that change at different rates — binaries, runtime
    environment, libraries, service config, feature config, and user config — and
    use feature-flag or experiment frameworks to separate feature launches from binary
    releases, so you can enable features one at a time and selectively disable a misbehaving
