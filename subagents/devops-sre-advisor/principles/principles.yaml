    appear after deployment.
  - The team needs to infer internal application state from runtime outputs.
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P006
  statement: Add code-quality analysis as gates within CI so a component failing the
    checks goes no further even if its build and tests pass, building your own analysis
    where mainstream tools do not cover your stack.
