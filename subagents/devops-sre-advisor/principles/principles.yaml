    skill: null
    reference: null
    test_cases: []
- principle_id: P003
  statement: Build a generative (Westrum) culture of trust, information flow, shared
    risk, and inquiry-not-blame, because it predicts delivery performance, organizational
    performance, and job satisfaction.
