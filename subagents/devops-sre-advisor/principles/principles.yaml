- principle_id: P027
  statement: Organize incident response into three roles — Incident Commander (leads/coordinates
    and assumes any undelegated role), Operations Lead (applies operational tools
    to mitigate and resolve), and Communications Lead (public face giving periodic
    stakeholder updates) — with the person who declares the incident typically becoming
    the Incident Commander.
