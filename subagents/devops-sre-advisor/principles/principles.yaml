schema_version: principles-v1
principles:
- principle_id: P001
  statement: Keep postmortems blameless by attributing failure to systemic and process
    causes (e.g. nothing stopped a human from running unsafe automation and no documentation
    warned of the gotcha) rather than an individual's 'careless ignorance', focusing
    the root-cause section on what went wrong not who, and aiming action items at
    improving the system rather than improving people.
  derived_from_claims:
  - C00910
  - C00926
  - C01726
  - C02046
  - C03613
  - C03614
  - C03615
  - C03619
  - C03620
  - C03621
  - C03622
  - C03623
  - C03624
  confidence: high
  applies_when:
  - writing the root-cause and analysis sections of a postmortem
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P002
  statement: Keep all configuration (system and application) in version control, not
    just application code, since configuration in version control correlates more
    strongly with performance.
  derived_from_claims:
