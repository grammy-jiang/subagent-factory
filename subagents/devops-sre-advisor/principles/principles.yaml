  - C00875
  - C02030
  confidence: high
  applies_when:
  - assigning incident-response roles
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P028
  statement: Use DNS as the first and simplest layer of load balancing, but treat
    it as insufficient on its own because it depends on client cooperation to expire
    and refetch records and gives weak control over client behaviour (the authoritative
    server sees the recursive resolver, not the user).
  derived_from_claims:
  - C00943
  - C02147
  confidence: high
  applies_when:
  - designing DNS-based load balancing
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P029
  statement: Health-check backends and give each an explicit 'lame-duck' state in
    which it keeps serving in-flight requests but asks clients to stop sending new
    ones (propagated to active and, via periodic health checks, inactive clients),
    so backends can be drained, removed, or updated without disrupting user requests.
  derived_from_claims:
  - C00947
  - C02160
  confidence: high
  applies_when:
  - gracefully removing or updating backends
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P030
  statement: Set deliberate deadlines on RPC requests — without one a process holds
    resources for every in-flight request up to a large default, raising latency and
    risking exhaustion and crashes — having servers terminate over-long requests and
    clients cancel requests no longer useful to them.
  derived_from_claims:
  - C00971
  - C02216
  confidence: high
  applies_when:
