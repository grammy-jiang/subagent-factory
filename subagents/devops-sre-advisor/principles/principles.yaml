    test_cases: []
- principle_id: P008
  statement: 'Adopt a blame-slow, learn-quickly culture: when mistakes happen, help
    people learn, prevent recurrence, and share lessons without a fuss, and do not
    blame those who quickly fix issues, because a blame culture erodes the good behaviors
    while reducing blame grows learning.'
  derived_from_claims:
  - C00465
  - C00466
  - C00467
  - C00468
  - C00592
  - C00593
  confidence: high
  applies_when:
  - responding to or reviewing a failure
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P009
  statement: Recognize that burn-rate alerting over-pages low-traffic services (one
    failure in ten requests is a 10% error rate, a 1,000x burn against 99.9%) and
    handle them by generating artificial traffic, combining related services that
    share a failure domain, or changing the product so a single failure carries less
    weight or takes more requests to qualify.
  derived_from_claims:
  - C00731
  - C00732
  - C00733
  - C00734
  - C01950
  confidence: high
  applies_when:
  - applying SLO alerting to a low-traffic service
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P010
  statement: Set the SLO as the target level of reliability for customers (above it
    almost all users are happy, below it they complain or leave) and do not chase
    extra nines, because each additional nine costs more for marginal utility approaching
    zero, customers never experience your internal 100%, and change is the number
    one source of outages.
  derived_from_claims:
  - C00620
  - C00621
  - C00622
  - C01727
  confidence: high
  applies_when:
  - choosing a reliability target
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P011
  statement: Base the SLO framework on the small consistent signal set services already
    monitor — volume, availability, latency, errors, and tickets (VALET, aligned with
    the Four Golden Signals) — and standardize their naming and measurement across
    services.
  derived_from_claims:
  - C00680
  - C00681
  - C00688
  - C01844
  confidence: high
  applies_when:
  - choosing which signals an SLO framework standardizes on
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P012
  statement: Use a standard postmortem template that consistently captures the incident
    root cause and trigger, because doing so enables trend analysis that targets improvements
    against systemic root-cause types such as faulty software interface design or
    immature change deployment planning — and prioritize accordingly given that across
    thousands of Google postmortems (2010-2017) the top outage triggers were binary
    pushes (37%) and configuration pushes (31%), together about 68%, followed by user-behavior
    change, processing pipeline, service-provider change, performance decay, capacity
    management, and hardware, while the top contributing root-cause categories were
    software (~41%), development-process failure (~20%), complex system behaviors
    (~17%), deployment planning (~7%), and network failure (~3%).
  derived_from_claims:
  - C01311
  - C01312
  - C01313
  - C02516
  confidence: high
  applies_when:
  - standardizing postmortems for trend analysis and prioritization
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P013
  statement: Build a canary process with three parts — a way to deploy the change
    to a subset of the population, an evaluation deciding good or bad, and integration
    of those evaluations into the release process — deploying to a small labeled production
    segment that receives only a small portion of traffic (split via application versions,
    load-balancer backend weights, proxy configs, or round-robin DNS), so it demonstrates
    value by detecting bad candidates with high confidence and identifying good releases
    without false positives.
  derived_from_claims:
  - C00949
  - C01121
  - C01122
  - C02076
  confidence: high
  applies_when:
  - rolling out a new version safely
  - constructing a canary deployment process
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P014
  statement: Prefer simple releases of small batches over large simultaneous batches,
    because the impact of a single change is far easier to measure and attribute than
    that of many changes released at once.
  derived_from_claims:
  - C00042
  - C00043
  - C01933
  confidence: high
  applies_when: []
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P015
  statement: Break down organizational silos between development and operations rather
    than relying on tooling alone, because separate teams and siloed incentives, not
    tools, are the root of delivery pain.
  derived_from_claims:
  - C00313
  - C00314
  - C00591
  confidence: high
  applies_when:
  - organizing teams that build and run a service
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P016
  statement: Make changes small and frequent — splitting large changes into smaller
    pieces and supporting them with automated testing and reliable rollback — because
    small changes carry small risk while infrequent large releases carry large risk.
  derived_from_claims:
  - C00483
  - C00594
  - C00595
  confidence: high
  applies_when:
  - designing a change and release process
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P017
  statement: Engage SRE as early as the design phase, because the earlier the engagement
    the lower the cost to onboard and the more reliable the service is out of the
    gate, since you avoid spending time unwinding suboptimal design and implementation.
  derived_from_claims:
  - C00611
  - C02474
  - C02476
  confidence: high
  applies_when:
  - a new service or major change is being designed
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P018
  statement: Use the error-budget/SLO model as a shared, fact-based language that
    removes subjectivity so ops and dev reach the same decision from the same data,
    embracing the differences between the disciplines rather than converting one into
    the other.
