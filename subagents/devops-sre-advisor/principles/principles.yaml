  - C00667
  - C00677
  - C01791
  confidence: high
  applies_when:
  - ops and dev must jointly decide reliability vs feature velocity
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P019
  statement: Treat latency and most other metrics as distributions and report percentiles
    (such as the 90th, 95th, or 99th) rather than arithmetic averages, because a mean
    masks long-tail behaviour like a slow tail of requests.
  derived_from_claims:
  - C00683
  - C00697
  - C01806
  confidence: high
  applies_when:
  - setting or measuring latency SLOs
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P020
  statement: When automating toil, do not transcribe the human workflow verbatim or
    let automation erase human understanding of failures; instead decompose documented
    manual work into separable, well-defined, reusable, composable software components
    that other automation can reuse across system generations.
  derived_from_claims:
  - C00765
  - C00773
  - C01878
  confidence: high
  applies_when:
  - designing automation for an operational workflow
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P021
  statement: 'Pursue simplicity as a primary reliability lever: simple software breaks
    less, is faster to fix, and is easier to understand, maintain, and test, and treat
    simplicity as an end-to-end goal spanning code, system architecture, and the tools
    and processes of the software lifecycle.'
  derived_from_claims:
  - C00790
  - C00791
  - C01934
  confidence: high
  applies_when:
  - designing or evaluating a system for reliability
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P022
  statement: 'Protect engineering capacity: SREs should spend at least 50% of time
    on project work (roughly one-third operational, two-thirds project), which also
    sets an on-call rotation size where engineers are on-call about one-third of the
    time, and review the balance against a clear rubric to produce trackable team-health
    metrics.'
  derived_from_claims:
  - C00813
  - C00814
  - C02508
  confidence: high
  applies_when:
  - balancing operational and project work and sizing rotations
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P023
  statement: 'Guard against operational underload as well as overload: when a team
    spends too little time on operations, take more risks and move faster (shorter
    release cycles, more features per release, more disaster-recovery testing), and
    if it stays underloaded, onboard related services or hand a service that no longer
    needs SRE back to development; let operational issues feed strategic, time-bounded
    project work in a continuous feedback loop.'
  derived_from_claims:
  - C00815
  - C00816
  - C01980
  confidence: high
  applies_when:
  - a team's operational load is too low
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P024
  statement: 'Support on-call engineers with psychological safety and fair incentives:
    provide procedures and escalation paths that make their lives easier, and compensate
    out-of-hours work (time-off-in-lieu or capped cash) both to incentivize participation
    and to stop engineers taking too many shifts for economic reasons.'
  derived_from_claims:
  - C00820
  - C00821
  - C01973
  confidence: high
  applies_when:
  - supporting and compensating on-call engineers
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P025
  statement: Set response-time expectations by severity rather than demanding an immediate
    response to everything (e.g. five minutes for a revenue-impacting outage, thirty
    for a stuck batch system, a work-hours ticket for a failing pre-launch backup),
    and audit what currently pages — anything better served by automated repair or
    a ticket should not page a human, since a computer fixing a problem beats requiring
    a person.
  derived_from_claims:
  - C00836
  - C00837
  - C01962
  confidence: high
  applies_when:
  - deciding what should page and how fast it must be answered
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P026
  statement: 'Recognize for operational decisions: Distinguish three terms precisely:
    an SLI is a quantitative measure of a service level, an SLO is a target value
    or range for an SLI, and an SLA is a contract with explicit consequences for meeting
    or missing SLOs.'
  derived_from_claims:
  - C00624
  - C01797
  confidence: high
  applies_when:
  - defining reliability commitments
  operational_mapping:
    profile_rule: true
    skill: null
