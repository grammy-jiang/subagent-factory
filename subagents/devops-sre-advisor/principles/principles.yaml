    skill: null
    reference: null
    test_cases: []
- principle_id: P007
  statement: Lint code in the pipeline and let lint failures break the build (fixing
    or configuring rules rather than ignoring them), and publish coverage reports
    that fail the build when missing.
  derived_from_claims:
  - C01545
  - C01546
  - C01552
  - C01553
  - C02945
  - C02946
  - C02947
  confidence: high
  applies_when:
