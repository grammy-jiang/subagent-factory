schema_version: principle-behaviour-tests-v1
subagent_slug: devops-sre-advisor
principle_behaviour_tests:
- test_id: PBT-P001
  principle_id: P001
  prompt: writing the root-cause and analysis sections of a postmortem. What do you advise, and why?
  expected_behaviour: Keep postmortems blameless by attributing failure to systemic and process causes
    (e.g. nothing stopped a human from running unsafe automation and no documentation warned of the gotcha)
    rather than an individual's 'careless ignorance', focusing the root-cause section on what went wrong
    not who, and aiming action items at improving the system rather than improving people.
  must_not:
  - Give advice that contradicts this principle
- test_id: PBT-P002
  principle_id: P002
  prompt: rolling out a new version safely. What do you advise, and why?
  expected_behaviour: Build a canary process with three parts — a way to deploy the change to a subset
    of the population, an evaluation deciding good or bad, and integration of those evaluations into the
    release process — deploying to a small labeled production segment that receives only a small portion
    of traffic (split via application versions, load-balancer backend weights, proxy configs, or round-robin
    DNS), so it demonstrates value by detecting bad candidates with high confidence and identifying good
    releases without false positives.
  must_not:
  - Give advice that contradicts this principle
- test_id: PBT-P003
  principle_id: P003
  prompt: designing a change and release process. What do you advise, and why?
  expected_behaviour: Reduce cycle time, the time from deciding on a change to it being available to users,
    by making frequent, automated releases; if a process is not automated it is not repeatable, and frequent
    releases keep the delta small, reduce risk, and speed feedback.
  must_not:
  - Give advice that contradicts this principle
- test_id: PBT-P004
  principle_id: P004
  prompt: shaping team culture or responding to incidents. What do you advise, and why?
  expected_behaviour: Build a generative (Westrum) culture of trust, information flow, shared risk, and
    inquiry-not-blame, because it predicts delivery performance, organizational performance, and job satisfaction.
  must_not:
  - Give advice that contradicts this principle
- test_id: PBT-P005
  principle_id: P005
  prompt: Operating an application in production or staging where user-facing failures can appear after
    deployment. What do you advise, and why?
  expected_behaviour: Build observability — white-box metrics and structured logs — into every component
    from the ground up, and design well-understood, observable interfaces between components, to make
    troubleshooting faster.
  must_not:
  - Give advice that contradicts this principle
- test_id: PBT-P006
  principle_id: P006
  prompt: deciding whether and how to split an application into components. What do you advise, and why?
  expected_behaviour: Design loosely coupled, discrete, independently deployable components (for example
    services or SOA, using abstraction layers such as SQL views to break hard dependencies) to enable
    small frequent releases and large-team collaboration.
  must_not:
  - Give advice that contradicts this principle
- test_id: PBT-P007
  principle_id: P007
  prompt: adding security and quality inspection to a CI pipeline. What do you advise, and why?
  expected_behaviour: Add code-quality analysis as gates within CI so a component failing the checks goes
    no further even if its build and tests pass, building your own analysis where mainstream tools do
    not cover your stack.
  must_not:
  - Give advice that contradicts this principle
- test_id: PBT-P008
  principle_id: P008
  prompt: adding code-quality checks to a pipeline. What do you advise, and why?
  expected_behaviour: Lint code in the pipeline and let lint failures break the build (fixing or configuring
    rules rather than ignoring them), and publish coverage reports that fail the build when missing.
  must_not:
  - Give advice that contradicts this principle
- test_id: PBT-P009
  principle_id: P009
  prompt: a full-time team working on a shared codebase. What do you advise, and why?
  expected_behaviour: Develop new features incrementally and commit to trunk or mainline regularly and
    frequently (at least once a day), rather than branching for new functionality, because you cannot
    safely refactor unless everybody commits frequently to mainline.
  must_not:
  - Give advice that contradicts this principle
- test_id: PBT-P010
  principle_id: P010
  prompt: validating a deployment within the pipeline. What do you advise, and why?
  expected_behaviour: Run deployment tests, a small fail-fast smoke suite asserting the environment is
    configured and inter-component communication works, at the start of the acceptance stage, and fail
    the whole stage immediately if they fail rather than waiting for the lengthy suite.
  must_not:
  - Give advice that contradicts this principle
- test_id: PBT-P011
  principle_id: P011
  prompt: Keep all configuration (system and application) in version control, not just application code,
    since configuration in version control correlates more strongly with performance. What do you advise,
    and why?
  expected_behaviour: Keep all configuration (system and application) in version control, not just application
    code, since configuration in version control correlates more strongly with performance.
  must_not:
  - Give advice that contradicts this principle
- test_id: PBT-P012
  principle_id: P012
  prompt: assessing the complexity of code or a system. What do you advise, and why?
  expected_behaviour: Measure code complexity (for example cyclomatic complexity) while understanding
    the metric's underlying principles and limitations — it cannot distinguish necessary from accidental
    complexity — before setting or interpreting thresholds.
  must_not:
  - Give advice that contradicts this principle
- test_id: PBT-P013
  principle_id: P013
  prompt: deploying an application that depends on configuration and external services. What do you advise,
    and why?
  expected_behaviour: Validate service readiness with real-world unit tests that confirm all dependencies
    are available and correctly configured, that configurations are consistent with other deployments,
    and that every configuration exception is intended, aborting dependent tests when one fails.
  must_not:
  - Give advice that contradicts this principle
- test_id: PBT-P014
  principle_id: P014
  prompt: Prefer simple releases of small batches over large simultaneous batches, because the impact
    of a single change is far easier to measure and attribute than that of many changes released at once.
    What do you advise, and why?
  expected_behaviour: Prefer simple releases of small batches over large simultaneous batches, because
    the impact of a single change is far easier to measure and attribute than that of many changes released
    at once.
  must_not:
  - Give advice that contradicts this principle
- test_id: PBT-P015
  principle_id: P015
  prompt: organizing teams that build and run a service. What do you advise, and why?
  expected_behaviour: Break down organizational silos between development and operations rather than relying
    on tooling alone, because separate teams, siloed knowledge, and incentives for local optimization
    worsen delivery outcomes.
  must_not:
  - Give advice that contradicts this principle
- test_id: PBT-P016
  principle_id: P016
  prompt: a new service or major change is being designed. What do you advise, and why?
  expected_behaviour: Engage SRE as early as the design phase, because the earlier the engagement the
    lower the cost to onboard and the more reliable the service is out of the gate, since you avoid spending
    time unwinding suboptimal design and implementation.
  must_not:
  - Give advice that contradicts this principle
- test_id: PBT-P017
  principle_id: P017
  prompt: setting or measuring latency SLOs. What do you advise, and why?
  expected_behaviour: Prefer percentiles/distributions (for example 90th, 95th, and 99th) over arithmetic
    averages when measuring latency and most metrics, because an average masks long-tail behavior such
    as a slow tail of requests.
  must_not:
  - Give advice that contradicts this principle
- test_id: PBT-P018
  principle_id: P018
  prompt: designing automation for an operational workflow. What do you advise, and why?
  expected_behaviour: When automating toil, do not transcribe the human workflow verbatim or let automation
    erase human understanding of failures; instead decompose documented manual work into separable, well-defined,
    reusable, composable software components that other automation can reuse across system generations.
  must_not:
  - Give advice that contradicts this principle
- test_id: PBT-P019
  principle_id: P019
  prompt: designing or evaluating a system for reliability. What do you advise, and why?
  expected_behaviour: 'Pursue simplicity as a primary reliability lever: simple software breaks less,
    is faster to fix, and is easier to understand, maintain, and test, and treat simplicity as an end-to-end
    goal spanning code, system architecture, and the tools and processes of the software lifecycle.'
  must_not:
  - Give advice that contradicts this principle
- test_id: PBT-P020
  principle_id: P020
  prompt: supporting and compensating on-call engineers. What do you advise, and why?
  expected_behaviour: 'Support on-call engineers with psychological safety and fair incentives: provide
    procedures and escalation paths that make their lives easier, and compensate out-of-hours work (time-off-in-lieu
    or capped cash) both to incentivize participation and to stop engineers taking too many shifts for
    economic reasons.'
  must_not:
  - Give advice that contradicts this principle
- test_id: PBT-P021
  principle_id: P021
  prompt: deciding what should page and how fast it must be answered. What do you advise, and why?
  expected_behaviour: Set response-time expectations by severity rather than demanding an immediate response
    to everything (e.g. five minutes for a revenue-impacting outage, thirty for a stuck batch system,
    a work-hours ticket for a failing pre-launch backup), and audit what currently pages — anything better
    served by automated repair or a ticket should not page a human, since a computer fixing a problem
    beats requiring a person.
  must_not:
  - Give advice that contradicts this principle
- test_id: PBT-P022
  principle_id: P022
  prompt: a project depends on third-party libraries. What do you advise, and why?
  expected_behaviour: Use hermetic builds that are insensitive to whatever software is installed on the
    build machine and depend only on known versions of build tools and dependencies, so the same source
    revision produces identical results on any machine.
  must_not:
  - Give advice that contradicts this principle
- test_id: PBT-P023
  principle_id: P023
  prompt: defining reliability commitments. What do you advise, and why?
  expected_behaviour: 'Recognize for operational decisions: Distinguish three terms precisely: an SLI
    is a quantitative measure of a service level, an SLO is a target value or range for an SLI, and an
    SLA is a contract with explicit consequences for meeting or missing SLOs.'
  must_not:
  - Give advice that contradicts this principle
- test_id: PBT-P024
  principle_id: P024
  prompt: assigning incident-response roles. What do you advise, and why?
  expected_behaviour: Organize incident response into three roles — Incident Commander (leads/coordinates
    and assumes any undelegated role), Operations Lead (applies operational tools to mitigate and resolve),
    and Communications Lead (public face giving periodic stakeholder updates) — with the person who declares
    the incident typically becoming the Incident Commander.
  must_not:
  - Give advice that contradicts this principle
- test_id: PBT-P025
  principle_id: P025
  prompt: designing DNS-based load balancing. What do you advise, and why?
  expected_behaviour: Use DNS as the first layer of load balancing (it balances load before a connection
    starts), but treat it as insufficient on its own because it relies on client cooperation to expire
    and refetch records and gives weak control over client behavior.
  must_not:
  - Give advice that contradicts this principle
- test_id: PBT-P026
  principle_id: P026
  prompt: gracefully removing or updating backends. What do you advise, and why?
  expected_behaviour: Give backends an explicit 'lame-duck' state and health-check them, so a backend
    still serves in-flight requests while signaling clients to stop sending new ones, allowing it to be
    gracefully removed or updated without disrupting user requests.
  must_not:
  - Give advice that contradicts this principle
- test_id: PBT-P027
  principle_id: P027
  prompt: setting RPC timeouts and cancellation. What do you advise, and why?
  expected_behaviour: Set deliberate deadlines on RPC requests — without one a process holds resources
    for every in-flight request up to a large default, raising latency and risking exhaustion and crashes
    — having servers terminate over-long requests and clients cancel requests no longer useful to them.
  must_not:
  - Give advice that contradicts this principle
- test_id: PBT-P028
  principle_id: P028
  prompt: decoupling feature launches from binary releases. What do you advise, and why?
  expected_behaviour: Separate components that change at different rates — binaries, runtime environment,
    libraries, service config, feature config, and user config — and use feature-flag or experiment frameworks
    to separate feature launches from binary releases, so you can enable features one at a time and selectively
    disable a misbehaving feature without waiting for the next build-and-release cycle.
  must_not:
  - Give advice that contradicts this principle
- test_id: PBT-P029
  principle_id: P029
  prompt: Automate security tests inside developer workflows and pipelines with actionable feedback and
    false-positive management. What do you advise, and why?
  expected_behaviour: Automate security tests inside developer workflows and pipelines with actionable
    feedback and false-positive management.
  must_not:
  - Give advice that contradicts this principle
- test_id: PBT-P030
  principle_id: P030
  prompt: Integrate security telemetry into production observability so hostile behavior is visible to
    the teams that design and run services. What do you advise, and why?
  expected_behaviour: Integrate security telemetry into production observability so hostile behavior is
    visible to the teams that design and run services.
  must_not:
  - Give advice that contradicts this principle
- test_id: PBT-P031
  principle_id: P031
  prompt: Design audit evidence with auditors from actual regulations and expose it through telemetry,
    logs, and documentation linked to controls. What do you advise, and why?
  expected_behaviour: Design audit evidence with auditors from actual regulations and expose it through
    telemetry, logs, and documentation linked to controls.
  must_not:
  - Give advice that contradicts this principle
- test_id: PBT-P032
  principle_id: P032
  prompt: instrumenting or benchmarking a delivery process. What do you advise, and why?
  expected_behaviour: Measure software delivery performance with four global-outcome metrics (delivery
    lead time from commit to production, deployment frequency, time to restore service, change fail rate)
    to avoid pitting functions against each other.
  must_not:
  - Give advice that contradicts this principle
- test_id: PBT-P033
  principle_id: P033
  prompt: Apply Lean, Agile, continuous delivery, and constraints thinking through small batches, deployable
    states, daily improvement, and fast feedback. What do you advise, and why?
  expected_behaviour: Apply Lean, Agile, continuous delivery, and constraints thinking through small batches,
    deployable states, daily improvement, and fast feedback.
  must_not:
  - Give advice that contradicts this principle
- test_id: PBT-P034
  principle_id: P034
  prompt: Make approved security libraries, configurations, images, secrets patterns, and services reusable
    through shared repositories and platforms. What do you advise, and why?
  expected_behaviour: Make approved security libraries, configurations, images, secrets patterns, and
    services reusable through shared repositories and platforms.
  must_not:
  - Give advice that contradicts this principle
- test_id: PBT-P035
  principle_id: P035
  prompt: Modernize regulated platforms through customer-centered slices, standardized tools, and CI/CD
    controls that can block noncompliant releases. What do you advise, and why?
  expected_behaviour: Modernize regulated platforms through customer-centered slices, standardized tools,
    and CI/CD controls that can block noncompliant releases.
  must_not:
  - Give advice that contradicts this principle
- test_id: PBT-P036
  principle_id: P036
  prompt: assessing the health of a scaling delivery process. What do you advise, and why?
  expected_behaviour: 'Watch for the slow, often-unnoticed symptoms of delivery decay as an organization
    scales: slower and more complex releases, developers distanced from production, last-minute changes,
    dead code, diverted resource, and deployment downtime that erodes trust.'
  must_not:
  - Give advice that contradicts this principle
- test_id: PBT-P037
  principle_id: P037
  prompt: deploying Jenkins or build infrastructure on a cloud network. What do you advise, and why?
  expected_behaviour: Harden build VMs by disabling password authentication in favor of SSH keys and placing
    them in private subnets reachable only through a bastion (using a managed bastion service where available,
    restricting its ingress).
  must_not:
  - Give advice that contradicts this principle
- test_id: PBT-P038
  principle_id: P038
  prompt: Protect CI/CD infrastructure as a production-critical attack surface with hardening, review,
    suspicious-test detection, isolation, and read-only credentials. What do you advise, and why?
  expected_behaviour: Protect CI/CD infrastructure as a production-critical attack surface with hardening,
    review, suspicious-test detection, isolation, and read-only credentials.
  must_not:
  - Give advice that contradicts this principle
- test_id: PBT-P039
  principle_id: P039
  prompt: Satisfy separation-of-duty intent through review, pair work, inspection, and telemetry while
    avoiding low-trust controls that destroy visibility. What do you advise, and why?
  expected_behaviour: Satisfy separation-of-duty intent through review, pair work, inspection, and telemetry
    while avoiding low-trust controls that destroy visibility.
  must_not:
  - Give advice that contradicts this principle
- test_id: PBT-P040
  principle_id: P040
  prompt: choosing how to assess and improve a technology organization. What do you advise, and why?
  expected_behaviour: Drive improvement through a capabilities model selected by research evidence, not
    through maturity models or vendor/consultant bias.
  must_not:
  - Give advice that contradicts this principle
- test_id: PBT-P041
  principle_id: P041
  prompt: Measure developer productivity holistically across well-being, performance, activity, collaboration,
    and flow instead of relying on activity counts. What do you advise, and why?
  expected_behaviour: Measure developer productivity holistically across well-being, performance, activity,
    collaboration, and flow instead of relying on activity counts.
  must_not:
  - Give advice that contradicts this principle
- test_id: PBT-P042
  principle_id: P042
  prompt: planning an organizational transformation. What do you advise, and why?
  expected_behaviour: Do not buy, copy, outsource, or 'implement' culture change; develop your own coaches,
    lead by example, and proceed with discipline and patience, because high performance must be grown
    for your context.
  must_not:
  - Give advice that contradicts this principle
- test_id: PBT-P043
  principle_id: P043
  prompt: keeping an application releasable while under constant change. What do you advise, and why?
  expected_behaviour: Make all changes incrementally rather than branching, since the bigger the apparent
    reason to branch the more you should not, use branch by abstraction for changes too hard to make incrementally,
    and protect large-scale changes with a comprehensive automated acceptance suite.
  must_not:
  - Give advice that contradicts this principle
- test_id: PBT-P044
  principle_id: P044
  prompt: a team deploys software to any environment. What do you advise, and why?
  expected_behaviour: Aim for a completely automated, button-press release and back-out; control every
    bit deployed by locking production down so changes go only through automated processes, and use the
    same process for testing environments as for production.
  must_not:
  - Give advice that contradicts this principle
- test_id: PBT-P045
  principle_id: P045
  prompt: addressing team exhaustion, cynicism, or attrition. What do you advise, and why?
  expected_behaviour: Prevent burnout by fixing the work environment (Maslach's six risk factors) rather
    than the person, since the causes are organizational factors management controls.
  must_not:
  - Give advice that contradicts this principle
- test_id: PBT-P046
  principle_id: P046
  prompt: Invest in people and identity, because engagement and satisfaction drive loyalty, reduce burnout,
    and predict profitability, productivity, and market share. What do you advise, and why?
  expected_behaviour: Invest in people and identity, because engagement and satisfaction drive loyalty,
    reduce burnout, and predict profitability, productivity, and market share.
  must_not:
  - Give advice that contradicts this principle
- test_id: PBT-P047
  principle_id: P047
  prompt: building a strong team culture. What do you advise, and why?
  expected_behaviour: 'Support team culture through the three highly-correlated levers: cross-functional
    collaboration built on trust, a climate of learning made safe to fail via blameless postmortems, and
    good tools and proactive monitoring.'
  must_not:
  - Give advice that contradicts this principle
- test_id: PBT-P048
  principle_id: P048
  prompt: designing surveys or system metrics. What do you advise, and why?
  expected_behaviour: 'Design measurement well: use latent constructs with multiple measures, define precisely
    what you measure first, measure at the team level, periodically retest, and remember all measures
    are proxies.'
  must_not:
  - Give advice that contradicts this principle
- test_id: PBT-P049
  principle_id: P049
  prompt: assessing perceptions, culture, or whether a practice is truly followed. What do you advise,
    and why?
  expected_behaviour: Use surveys to capture perceptions and feelings, collect anonymously and for improvement,
    measure the core behaviors of a practice rather than its label, and avoid weak proxies like turnover
    and biased question forms.
  must_not:
  - Give advice that contradicts this principle
- test_id: PBT-P050
  principle_id: P050
  prompt: Postmortem actions must be owned, prioritized, incremental, and tied to prevention, faster detection,
    or faster recovery metrics. What do you advise, and why?
  expected_behaviour: Postmortem actions must be owned, prioritized, incremental, and tied to prevention,
    faster detection, or faster recovery metrics.
  must_not:
  - Give advice that contradicts this principle
- test_id: PBT-P051
  principle_id: P051
  prompt: Reserve explicit time and community structures for improvement, learning, and debt reduction
    across Development, Operations, and Security. What do you advise, and why?
  expected_behaviour: Reserve explicit time and community structures for improvement, learning, and debt
    reduction across Development, Operations, and Security.
  must_not:
  - Give advice that contradicts this principle
- test_id: PBT-P052
  principle_id: P052
  prompt: Shift security into daily value-stream work through automation, pipeline integration, and early
    feature-team engagement. What do you advise, and why?
  expected_behaviour: Shift security into daily value-stream work through automation, pipeline integration,
    and early feature-team engagement.
  must_not:
  - Give advice that contradicts this principle
- test_id: PBT-P053
  principle_id: P053
  prompt: Sustained improvement requires psychological safety, resources, learning capacity, and continuous
    reevaluation of the current bottleneck. What do you advise, and why?
  expected_behaviour: Sustained improvement requires psychological safety, resources, learning capacity,
    and continuous reevaluation of the current bottleneck.
  must_not:
  - Give advice that contradicts this principle
- test_id: PBT-P054
  principle_id: P054
  prompt: a team is deciding where developers commit their work. What do you advise, and why?
  expected_behaviour: Practice continuous integration by developing on trunk/mainline and merging any
    active branch back at least once a day rather than using long-lived feature or team branches (the
    antithesis of CI); reserve branches for release.
  must_not:
  - Give advice that contradicts this principle
- test_id: PBT-P055
  principle_id: P055
  prompt: writing automated acceptance tests for an application with a UI. What do you advise, and why?
  expected_behaviour: Layer acceptance tests into criteria, domain-language implementation, and an application
    driver layer, using aliases and a well-designed driver so tests are independent, reliable, parallelizable,
    and built incrementally, with a window driver decoupling GUI-facing tests from the UI.
  must_not:
  - Give advice that contradicts this principle
- test_id: PBT-P056
  principle_id: P056
  prompt: managing state and setup for acceptance tests. What do you advise, and why?
  expected_behaviour: Minimize each test's dependence on the whole universe of application data, distinguish
    test-specific, test-reference, and application-reference data for acceptance tests, and put the application
    into the correct initial state through its public API rather than application code or database dumps.
  must_not:
  - Give advice that contradicts this principle
- test_id: PBT-P057
  principle_id: P057
  prompt: testing an application that integrates with external systems. What do you advise, and why?
  expected_behaviour: Never let tests hit a real external system unless in production, isolating access
    with a firewall and a configuration switch to a simulated version, and make the integration test harness
    replicate pathological as well as expected responses so you can harden the application.
  must_not:
  - Give advice that contradicts this principle
- test_id: PBT-P058
  principle_id: P058
  prompt: building reusable machine images for build infrastructure. What do you advise, and why?
  expected_behaviour: Bake immutable golden machine images with Packer, keeping secrets out of the template
    via runtime variables, selecting the newest base image dynamically, and giving each image a unique
    name.
  must_not:
  - Give advice that contradicts this principle
- test_id: PBT-P059
  principle_id: P059
  prompt: selecting metrics to evaluate software teams or developers. What do you advise, and why?
  expected_behaviour: Define a valid, reliable, outcome-focused, global measure of delivery performance
    before improving it, and reject output-based vanity metrics such as lines of code, velocity-as-productivity,
    and maximized utilization.
  must_not:
  - Give advice that contradicts this principle
- test_id: PBT-P060
  principle_id: P060
  prompt: building constructs from survey or system data. What do you advise, and why?
  expected_behaviour: Establish that measures are valid (convergent and divergent validity) and reliable
    via psychometric checks before running any correlation or prediction analysis on them.
  must_not:
  - Give advice that contradicts this principle
- test_id: PBT-P061
  principle_id: P061
  prompt: adopting or assessing continuous delivery. What do you advise, and why?
  expected_behaviour: 'Implement continuous delivery as five principles: build quality in, work in small
    batches, automate repetitive work so people solve problems, make continuous improvement everyone''s
    daily work, and make everyone responsible for system-level outcomes.'
  must_not:
  - Give advice that contradicts this principle
- test_id: PBT-P062
  principle_id: P062
  prompt: deployments are feared, manual, or must run outside business hours. What do you advise, and
    why?
  expected_behaviour: Treat deployment pain as a leading signal of poor performance and reduce it through
    technical practices, deployable system design, automation, and reproducible-from-version-control environments.
  must_not:
  - Give advice that contradicts this principle
- test_id: PBT-P063
  principle_id: P063
  prompt: documenting an SLO and error budget policy. What do you advise, and why?
  expected_behaviour: Structure an SLO document with metadata (status, author, reviewers, approvers, approval
    date, and revisit date), a service overview, a precise definition of each SLI including its exact
    measurement formula and SLO target, a rationale, and a clarifications-and-caveats section, documenting
    when the numbers are not strongly evidence-based so future readers understand it and can decide whether
    collecting more evidence is worth the investment, and give each SLO objective a separate error budget
    defined as 100% minus that objective's goal, enacting the error budget policy when any one objective
    has exhausted its budget.
  must_not:
  - Give advice that contradicts this principle
- test_id: PBT-P064
  principle_id: P064
  prompt: Collect centralized events, logs, and metrics across business logic, applications, infrastructure,
    and customer-impact periods. What do you advise, and why?
  expected_behaviour: Collect centralized events, logs, and metrics across business logic, applications,
    infrastructure, and customer-impact periods.
  must_not:
  - Give advice that contradicts this principle
- test_id: PBT-P065
  principle_id: P065
  prompt: tooling and preparing for incident response. What do you advise, and why?
  expected_behaviour: Decide and rehearse the single incident communication channel beforehand (preferably
    a familiar one) so the Incident Commander never chooses it mid-incident, prepare two or three ready-to-use
    public-announcement templates with a known send path and an agreed draft/review/approve/release flow,
    prepare distribution lists for an 'all hands on deck' call, and establish explicit criteria — derived
    from past outages and high-risk areas — for when an issue is truly an incident.
  must_not:
  - Give advice that contradicts this principle
- test_id: PBT-P066
  principle_id: P066
  prompt: configuring how IaC authenticates to a cloud provider. What do you advise, and why?
