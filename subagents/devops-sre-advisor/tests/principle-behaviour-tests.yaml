  must_not:
  - Give advice that contradicts this principle
- test_id: PBT-P165
  principle_id: P165
  prompt: A team operates shared production services or multiple people own different application areas.
    What do you advise, and why?
  expected_behaviour: Assign and route alerts to the accountable owner before or as incidents occur so
    response does not depend on improvised coordination during an outage.
  must_not:
  - Give advice that contradicts this principle
- test_id: PBT-P166
  principle_id: P166
  prompt: Exceptions are frequent enough to require team-level workflow management. What do you advise,
    and why?
  expected_behaviour: 'Manage exceptions with an explicit processing workflow: acknowledge each unique
    exception, decide the action, and drive it toward elimination instead of treating events in isolation.'
  must_not:
  - Give advice that contradicts this principle
- test_id: PBT-P167
  principle_id: P167
  prompt: managing network infrastructure that an application depends on. What do you advise, and why?
  expected_behaviour: Version-control all networking infrastructure configuration and push it from version
    control so systems are autonomic, monitor every port your application uses, log connection events,
    smoke-test connections at deploy time, and mirror the production network topology in the integration
    environment.
  must_not:
  - Give advice that contradicts this principle
- test_id: PBT-P168
  principle_id: P168
  prompt: building operations dashboards and alerts. What do you advise, and why?
  expected_behaviour: Give operations a big visible incident display, avoid dashboard noise by working
    from a risk list ranked by probability and impact, aggregate to red-amber-green thresholds, and practice
    behavior-driven monitoring by plugging application smoke tests into the monitoring system.
  must_not:
  - Give advice that contradicts this principle
- test_id: PBT-P169
  principle_id: P169
  prompt: Sustain DevOps transformation through cross-functional coalitions and small teams that can independently
    validate and safely deploy code. What do you advise, and why?
  expected_behaviour: Sustain DevOps transformation through cross-functional coalitions and small teams
    that can independently validate and safely deploy code.
  must_not:
  - Give advice that contradicts this principle
- test_id: PBT-P170
  principle_id: P170
  prompt: refining SLOs after initial measurement. What do you advise, and why?
  expected_behaviour: 'Continuously improve SLO targets: gather a cheap source of user-satisfaction information
    and iterate from it, validate the SLO by correlating outages and ticket spikes with error-budget drops,
    treat coverage gaps as normal and refine SLIs and SLOs over time, and when tightening an SLO balance
    recall against precision so the team is not flooded with unimportant events.'
  must_not:
  - Give advice that contradicts this principle
- test_id: PBT-P171
  principle_id: P171
  prompt: a team is deciding between monolithic, microservices, or cloud-native architecture. What do
    you advise, and why?
  expected_behaviour: Match the architecture choice (monolith, microservices, cloud-native, serverless)
    to the team's automation maturity, because microservices and cloud-native add operational complexity
    that demands heavy automation and a DevOps/Agile culture.
  must_not:
  - Give advice that contradicts this principle
- test_id: PBT-P172
  principle_id: P172
  prompt: Use automated resilience, latency, conformity, security, health, and cleanup checks to exercise
    and maintain cloud systems continuously. What do you advise, and why?
  expected_behaviour: Use automated resilience, latency, conformity, security, health, and cleanup checks
    to exercise and maintain cloud systems continuously.
  must_not:
  - Give advice that contradicts this principle
- test_id: PBT-P173
  principle_id: P173
  prompt: planning organizational change or starting a program of work. What do you advise, and why?
  expected_behaviour: Improve delivery using a maturity model driven by the Deming cycle, implementing
    organizational change incrementally and measuring its impact, and never begin a program without a
    business case and exactly one business sponsor per project.
  must_not:
  - Give advice that contradicts this principle
- test_id: PBT-P174
  principle_id: P174
  prompt: defining the branching and promotion workflow. What do you advise, and why?
  expected_behaviour: Choose a branching model that fits team size (GitFlow for large teams, a simpler
    3-branch model for small ones) and provide a dedicated hotfix path merged back to both develop and
    master.
  must_not:
  - Give advice that contradicts this principle
- test_id: PBT-P175
  principle_id: P175
  prompt: provisioning build infrastructure. What do you advise, and why?
  expected_behaviour: Tag all cloud resources for cost tracking and size instance/disk types to the project's
    actual build workload.
  must_not:
  - Give advice that contradicts this principle
