- test_id: PBT-P026
  principle_id: P026
  prompt: defining reliability commitments. What do you advise, and why?
  expected_behaviour: Recognize for operational decisions
  must_not:
  - Give advice that contradicts this principle
- test_id: PBT-P027
  principle_id: P027
  prompt: assigning incident-response roles. What do you advise, and why?
  expected_behaviour: Organize incident response into three roles — Incident Commander (leads/coordinates
    and assumes any undelegated role), Operations Lead (applies operational tools to mitigate and resolve),
    and Communications Lead (public face giving periodic stakeholder updates) — with the person who declares
    the incident typically becoming the Incident Commander.
  must_not:
  - Give advice that contradicts this principle
- test_id: PBT-P028
  principle_id: P028
  prompt: designing DNS-based load balancing. What do you advise, and why?
  expected_behaviour: Use DNS as the first and simplest layer of load balancing, but treat it as insufficient
    on its own because it depends on client cooperation to expire and refetch records and gives weak control
    over client behaviour (the authoritative server sees the recursive resolver, not the user).
  must_not:
  - Give advice that contradicts this principle
- test_id: PBT-P029
  principle_id: P029
  prompt: gracefully removing or updating backends. What do you advise, and why?
  expected_behaviour: Health-check backends and give each an explicit 'lame-duck' state in which it keeps
    serving in-flight requests but asks clients to stop sending new ones (propagated to active and, via
    periodic health checks, inactive clients), so backends can be drained, removed, or updated without
    disrupting user requests.
  must_not:
  - Give advice that contradicts this principle
- test_id: PBT-P030
  principle_id: P030
  prompt: setting RPC timeouts and cancellation. What do you advise, and why?
  expected_behaviour: Set deliberate deadlines on RPC requests — without one a process holds resources
    for every in-flight request up to a large default, raising latency and risking exhaustion and crashes
    — having servers terminate over-long requests and clients cancel requests no longer useful to them.
  must_not:
  - Give advice that contradicts this principle
- test_id: PBT-P031
  principle_id: P031
  prompt: decoupling feature launches from binary releases. What do you advise, and why?
  expected_behaviour: Separate components that change at different rates — binaries, runtime environment,
    libraries, service config, feature config, and user config — and use feature-flag or experiment frameworks
    to separate feature launches from binary releases, so you can enable features one at a time and selectively
    disable a misbehaving feature without waiting for the next build-and-release cycle.
  must_not:
  - Give advice that contradicts this principle
