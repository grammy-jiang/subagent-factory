- test_id: PBT-P002
  principle_id: P002
  prompt: Keep all configuration (system and application) in version control, not just application code,
    since configuration in version control correlates more strongly with performance.. What do you advise,
    and why?
  expected_behaviour: Keep all configuration (system and application) in version control, not just application
    code, since configuration in version control correlates more strongly with performance.
  must_not:
  - Give advice that contradicts this principle
- test_id: PBT-P003
  principle_id: P003
  prompt: shaping team culture or responding to incidents. What do you advise, and why?
  expected_behaviour: Build a generative (Westrum) culture of trust, information flow, shared risk, and
    inquiry-not-blame, because it predicts delivery performance, organizational performance, and job satisfaction.
  must_not:
  - Give advice that contradicts this principle
- test_id: PBT-P004
  principle_id: P004
  prompt: deployments are feared, manual, or must run outside business hours. What do you advise, and
    why?
  expected_behaviour: Treat deployment pain as a leading signal of poor performance and reduce it through
    technical practices, deployable system design, automation, and reproducible-from-version-control environments.
  must_not:
  - Give advice that contradicts this principle
- test_id: PBT-P005
  principle_id: P005
  prompt: Operating an application in production or staging where user-facing failures can appear after
    deployment.. What do you advise, and why?
  expected_behaviour: Build observability — white-box metrics and structured logs — into every component
    from the ground up, and design well-understood, observable interfaces between components, to make
    troubleshooting faster.
  must_not:
  - Give advice that contradicts this principle
- test_id: PBT-P006
  principle_id: P006
  prompt: adding security and quality inspection to a CI pipeline. What do you advise, and why?
  expected_behaviour: Add code-quality analysis as gates within CI so a component failing the checks goes
    no further even if its build and tests pass, building your own analysis where mainstream tools do
    not cover your stack.
  must_not:
  - Give advice that contradicts this principle
- test_id: PBT-P007
  principle_id: P007
  prompt: adding code-quality checks to a pipeline. What do you advise, and why?
  expected_behaviour: Lint code in the pipeline and let lint failures break the build (fixing or configuring
    rules rather than ignoring them), and publish coverage reports that fail the build when missing.
  must_not:
  - Give advice that contradicts this principle
- test_id: PBT-P008
  principle_id: P008
  prompt: responding to or reviewing a failure. What do you advise, and why?
  expected_behaviour: Adopt a blame-slow, learn-quickly culture
  must_not:
  - Give advice that contradicts this principle
- test_id: PBT-P009
  principle_id: P009
  prompt: applying SLO alerting to a low-traffic service. What do you advise, and why?
  expected_behaviour: Recognize that burn-rate alerting over-pages low-traffic services (one failure in
    ten requests is a 10% error rate, a 1,000x burn against 99.9%) and handle them by generating artificial
    traffic, combining related services that share a failure domain, or changing the product so a single
    failure carries less weight or takes more requests to qualify.
  must_not:
  - Give advice that contradicts this principle
- test_id: PBT-P010
  principle_id: P010
  prompt: choosing a reliability target. What do you advise, and why?
  expected_behaviour: Set the SLO as the target level of reliability for customers (above it almost all
    users are happy, below it they complain or leave) and do not chase extra nines, because each additional
    nine costs more for marginal utility approaching zero, customers never experience your internal 100%,
    and change is the number one source of outages.
  must_not:
  - Give advice that contradicts this principle
- test_id: PBT-P011
  principle_id: P011
  prompt: choosing which signals an SLO framework standardizes on. What do you advise, and why?
  expected_behaviour: Base the SLO framework on the small consistent signal set services already monitor
    — volume, availability, latency, errors, and tickets (VALET, aligned with the Four Golden Signals)
    — and standardize their naming and measurement across services.
  must_not:
  - Give advice that contradicts this principle
- test_id: PBT-P012
  principle_id: P012
  prompt: standardizing postmortems for trend analysis and prioritization. What do you advise, and why?
  expected_behaviour: Use a standard postmortem template that consistently captures the incident root
    cause and trigger, because doing so enables trend analysis that targets improvements against systemic
    root-cause types such as faulty software interface design or immature change deployment planning —
    and prioritize accordingly given that across thousands of Google postmortems (2010-2017) the top outage
    triggers were binary pushes (37%) and configuration pushes (31%), together about 68%, followed by
    user-behavior change, processing pipeline, service-provider change, performance decay, capacity management,
    and hardware, while the top contributing root-cause categories were software (~41%), development-process
    failure (~20%), complex system behaviors (~17%), deployment planning (~7%), and network failure (~3%).
  must_not:
  - Give advice that contradicts this principle
- test_id: PBT-P013
  principle_id: P013
  prompt: rolling out a new version safely. What do you advise, and why?
  expected_behaviour: Build a canary process with three parts — a way to deploy the change to a subset
    of the population, an evaluation deciding good or bad, and integration of those evaluations into the
    release process — deploying to a small labeled production segment that receives only a small portion
    of traffic (split via application versions, load-balancer backend weights, proxy configs, or round-robin
    DNS), so it demonstrates value by detecting bad candidates with high confidence and identifying good
    releases without false positives.
  must_not:
  - Give advice that contradicts this principle
- test_id: PBT-P014
  principle_id: P014
  prompt: Prefer simple releases of small batches over large simultaneous batches, because the impact
    of a single change is far easier to measure and attribute than that of many changes released at once..
    What do you advise, and why?
  expected_behaviour: Prefer simple releases of small batches over large simultaneous batches, because
    the impact of a single change is far easier to measure and attribute than that of many changes released
    at once.
  must_not:
  - Give advice that contradicts this principle
- test_id: PBT-P015
  principle_id: P015
  prompt: organizing teams that build and run a service. What do you advise, and why?
  expected_behaviour: Break down organizational silos between development and operations rather than relying
    on tooling alone, because separate teams and siloed incentives, not tools, are the root of delivery
    pain.
  must_not:
  - Give advice that contradicts this principle
- test_id: PBT-P016
  principle_id: P016
  prompt: designing a change and release process. What do you advise, and why?
  expected_behaviour: Make changes small and frequent — splitting large changes into smaller pieces and
    supporting them with automated testing and reliable rollback — because small changes carry small risk
    while infrequent large releases carry large risk.
  must_not:
  - Give advice that contradicts this principle
- test_id: PBT-P017
  principle_id: P017
  prompt: a new service or major change is being designed. What do you advise, and why?
  expected_behaviour: Engage SRE as early as the design phase, because the earlier the engagement the
    lower the cost to onboard and the more reliable the service is out of the gate, since you avoid spending
    time unwinding suboptimal design and implementation.
  must_not:
  - Give advice that contradicts this principle
- test_id: PBT-P018
  principle_id: P018
  prompt: ops and dev must jointly decide reliability vs feature velocity. What do you advise, and why?
  expected_behaviour: Use the error-budget/SLO model as a shared, fact-based language that removes subjectivity
    so ops and dev reach the same decision from the same data, embracing the differences between the disciplines
    rather than converting one into the other.
  must_not:
  - Give advice that contradicts this principle
- test_id: PBT-P019
  principle_id: P019
  prompt: setting or measuring latency SLOs. What do you advise, and why?
  expected_behaviour: Treat latency and most other metrics as distributions and report percentiles (such
    as the 90th, 95th, or 99th) rather than arithmetic averages, because a mean masks long-tail behaviour
    like a slow tail of requests.
  must_not:
  - Give advice that contradicts this principle
- test_id: PBT-P020
  principle_id: P020
  prompt: designing automation for an operational workflow. What do you advise, and why?
  expected_behaviour: When automating toil, do not transcribe the human workflow verbatim or let automation
    erase human understanding of failures; instead decompose documented manual work into separable, well-defined,
    reusable, composable software components that other automation can reuse across system generations.
  must_not:
  - Give advice that contradicts this principle
- test_id: PBT-P021
  principle_id: P021
  prompt: designing or evaluating a system for reliability. What do you advise, and why?
  expected_behaviour: Pursue simplicity as a primary reliability lever
  must_not:
  - Give advice that contradicts this principle
- test_id: PBT-P022
  principle_id: P022
  prompt: balancing operational and project work and sizing rotations. What do you advise, and why?
  expected_behaviour: Protect engineering capacity
  must_not:
  - Give advice that contradicts this principle
- test_id: PBT-P023
  principle_id: P023
  prompt: a team's operational load is too low. What do you advise, and why?
  expected_behaviour: Guard against operational underload as well as overload
