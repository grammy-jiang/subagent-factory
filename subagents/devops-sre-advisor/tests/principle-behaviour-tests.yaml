  principle_id: P125
  prompt: Extend communication and visibility beyond the immediate team to the wider organization through
    internal comms and PR, because in larger organizations most people are outsiders who can unknowingly
    obstruct the work, and good PR can win senior recognition and sway dissenters. What do you advise,
    and why?
  expected_behaviour: Extend communication and visibility beyond the immediate team to the wider organization
    through internal comms and PR, because in larger organizations most people are outsiders who can unknowingly
    obstruct the work, and good PR can win senior recognition and sway dissenters.
  must_not:
  - Give advice that contradicts this principle
- test_id: PBT-P126
  principle_id: P126
  prompt: Work with the owners of regulatory, SLA, change-management, and auditability rules to find wriggle
    room and adapt them rather than ignoring or breaking them, recognizing the rules provide a real safety
    gate and audit record, that some are overkill, and that defensive owners need help understanding what
    they can safely change. What do you advise, and why?
  expected_behaviour: Work with the owners of regulatory, SLA, change-management, and auditability rules
    to find wriggle room and adapt them rather than ignoring or breaking them, recognizing the rules provide
    a real safety gate and audit record, that some are overkill, and that defensive owners need help understanding
    what they can safely change.
  must_not:
  - Give advice that contradicts this principle
- test_id: PBT-P127
  principle_id: P127
  prompt: Never forget the original goal and vision, refining direction as you are sidetracked, and as
    you near the goal expect original issues to be replaced by new smaller ones, treating their surfacing
    as positive progress and inspecting and adapting the goal rather than starting over or declaring failure.
    What do you advise, and why?
  expected_behaviour: Never forget the original goal and vision, refining direction as you are sidetracked,
    and as you near the goal expect original issues to be replaced by new smaller ones, treating their
    surfacing as positive progress and inspecting and adapting the goal rather than starting over or declaring
    failure.
  must_not:
  - Give advice that contradicts this principle
- test_id: PBT-P128
  principle_id: P128
  prompt: advising on whether and how SRE fits an organization. What do you advise, and why?
  expected_behaviour: Treat SRE as an opinionated, concrete implementation of DevOps that is complementary
    to it (not in conflict) and applicable at any scale, not only at Google's scale or culture.
  must_not:
  - Give advice that contradicts this principle
- test_id: PBT-P129
  principle_id: P129
  prompt: establishing an error budget policy. What do you advise, and why?
  expected_behaviour: Derive an error budget from the SLO and write a policy specifying the actions to
    take and who takes them when the budget is exhausted; getting that policy approved by the product
    manager, developers, and SREs tests whether the SLO is fit for purpose, and everyone must understand
    that lowering the SLO also lowers the number of situations to which SREs respond.
  must_not:
  - Give advice that contradicts this principle
- test_id: PBT-P130
  principle_id: P130
  prompt: deciding which data source drives alerting versus diagnosis. What do you advise, and why?
  expected_behaviour: 'Treat metrics and structured logging as the two primary monitoring data sources
    for distinct jobs: use near-real-time metrics for alerting and dashboards (even for single rare events,
    by incrementing a counter and alerting on it) and use more granular but delayed logs for root-cause
    analysis and detailed reports.'
  must_not:
  - Give advice that contradicts this principle
- test_id: PBT-P131
  principle_id: P131
  prompt: deciding what and how to monitor and log. What do you advise, and why?
  expected_behaviour: Gather monitoring data from hardware, operating system, middleware, and applications,
    instrument applications with hooks for what operations and business users care about plus version
    reporting, set log levels by recoverability, and treat logging as first-level requirements in a single-line,
    grep-able format.
  must_not:
  - Give advice that contradicts this principle
- test_id: PBT-P132
  principle_id: P132
  prompt: designing capacity tests and their environment. What do you advise, and why?
  expected_behaviour: Prefer scenario-based, composable capacity tests over isolated benchmarks, set pass
    thresholds by ratcheting above a minimum, base load calculations on peak load, and isolate the capacity
    environment, avoiding virtualization unless production is virtual.
  must_not:
  - Give advice that contradicts this principle
- test_id: PBT-P133
  principle_id: P133
  prompt: applying SLO alerting to a low-traffic service. What do you advise, and why?
  expected_behaviour: Recognize that burn-rate alerting over-pages low-traffic services (one failure in
    ten requests is a 10% error rate, a 1,000x burn against 99.9%) and handle them by generating artificial
    traffic, combining related services that share a failure domain, or changing the product so a single
    failure carries less weight or takes more requests to qualify.
  must_not:
  - Give advice that contradicts this principle
- test_id: PBT-P134
  principle_id: P134
  prompt: hardening automation against its own failures. What do you advise, and why?
  expected_behaviour: Make destructive automation idempotent and guard it with sanity checks and rate
    limits, since a bug treating an empty filter list as 'act on all' rather than 'act on none', combined
    with weak rate limits, disk-erased every machine globally; and defend destructive operations with
    layered safety patterns — a separate safety-check/approval service, rejecting operations that omit
    an expected-present constraint, disallowing one operation from spanning namespace/class boundaries,
    capping affected nodes, an emergency-stop 'big red button', workflow rate limits, and alerting when
    more than a set percentage of machines are removed.
  must_not:
  - Give advice that contradicts this principle
- test_id: PBT-P135
  principle_id: P135
  prompt: deprecating, decommissioning, or migrating off a legacy system. What do you advise, and why?
  expected_behaviour: 'Deprecate and retire legacy systems data-driven and low-touch: gather usage data
    (daily/monthly active users, job families, accessed features) plus surveys to validate alternatives,
    decompose a generalized system into a handful of specialized alternatives when no single replacement
    fits, first stop/slow/discourage new adoption and migrate the lightest users first, and run it all
    through a self-service portal rather than manual tickets.'
  must_not:
  - Give advice that contradicts this principle
- test_id: PBT-P136
  principle_id: P136
  prompt: training teams for incident response. What do you advise, and why?
  expected_behaviour: Practice incident management with regular drills — controlled customer-safe emergencies
    (company-wide disaster-recovery testing), Wheel-of-Misfortune role-plays, or deliberately escalating
    a minor problem — using real tools as much as possible, follow each with a report of what went well,
    poorly, and how to improve, and establish and rehearse procedures while the world is not on fire to
    build the muscle memory to stay calm, securing leadership support for dedicated practice time.
  must_not:
  - Give advice that contradicts this principle
- test_id: PBT-P137
  principle_id: P137
  prompt: introducing or sustaining a postmortem practice. What do you advise, and why?
  expected_behaviour: 'Adopt a blameless postmortem culture as a cultural as much as technical change:
    start small with a basic procedure then reflect and tune it to your organization (no one size fits
    all), because well-written, acted-upon, widely-shared postmortems drive positive change and prevent
    repeat outages, with action items measurably reducing the blast radius and rate of similar future
    incidents.'
  must_not:
  - Give advice that contradicts this principle
- test_id: PBT-P138
  principle_id: P138
  prompt: choosing language and tone in a postmortem. What do you advise, and why?
  expected_behaviour: 'Keep postmortems blameless and factual: avoid finger-pointing (which makes people
    risk-averse and prone to covering up critical facts), strip personal judgments, dramatic or animated
    wording (justify any severity with verifiable data), use non-leading language that does not put recipients
    on the defensive, and redirect even senior-leader blame into generic questions like ''were there warning
    signs we could have heeded, and why did we dismiss them?''.'
  must_not:
  - Give advice that contradicts this principle
- test_id: PBT-P139
  principle_id: P139
  prompt: placing TCP/SSL termination and managing backend connections. What do you advise, and why?
  expected_behaviour: Terminate TCP and SSL at a Layer 7 reverse-proxy/edge front end close to the user
    (forwarding to backends over long-lived, pre-warmed encrypted connections) to minimize HTTPS handshake
    round trips and to mitigate low-level attacks a packet-level balancer cannot.
  must_not:
  - Give advice that contradicts this principle
- test_id: PBT-P140
  principle_id: P140
  prompt: preventing and repairing data corruption. What do you advise, and why?
  expected_behaviour: Plan for the eventuality that even with the best practices a software or config
    bug will corrupt data, by ensuring you can quickly reprocess and restore (recovery is labor-intensive
    and hard to automate), and treat application or configuration errors as the most common cause of pipeline
    outages — responding by rolling back the binary/config, cherry-picking a fix, repairing permissions,
    or restructuring bad data, and preventing them by validating new binaries and configs in a non-production
    environment before full deployment.
  must_not:
  - Give advice that contradicts this principle
- test_id: PBT-P141
  principle_id: P141
  prompt: organizing build and deployment scripting. What do you advise, and why?
  expected_behaviour: Create a script for each pipeline stage kept in the same repository as the source,
    use the right middleware-specific tool for deployment rather than a general-purpose scripting language,
    and require operations and developers to collaborate on the deployment process.
  must_not:
  - Give advice that contradicts this principle
- test_id: PBT-P142
  principle_id: P142
  prompt: deciding which configuration questions to require. What do you advise, and why?
  expected_behaviour: Minimize the number of mandatory configuration questions by converting them to optional
    ones with safe, carefully chosen defaults, and add a new knob only when a real need justifies it,
    because most users will use the default and a wrong default does great harm.
  must_not:
  - Give advice that contradicts this principle
- test_id: PBT-P143
  principle_id: P143
  prompt: separating configuration interface from data representation. What do you advise, and why?
  expected_behaviour: 'Make configuration both code and data but keep them separate: have the infrastructure
    operate on plain static data (Protocol Buffers, YAML, JSON) while users interact with a higher-level
    interface (a DSL, Lua, Jsonnet, or web UI) that generates that data, which gives deployment flexibility
    — adapting to diverse org norms, supporting multiple languages, and externalizing config to end users
    — invisibly to the user whose config language is compiled into raw data behind the scenes.'
  must_not:
  - Give advice that contradicts this principle
- test_id: PBT-P144
  principle_id: P144
  prompt: choosing canary metrics and acceptance thresholds. What do you advise, and why?
  expected_behaviour: Select canary metrics that indicate actual user-perceivable problems, starting from
    your SLIs (which have strong attribution to service health and reuse SLO-compliance work) and avoiding
    metrics like CPU usage whose increase does not necessarily impact users, because a flaky or noisy
    canary process gets disabled or ignored — defeating its purpose — and define acceptable behavior for
    each metric carefully (too strict yields false positives, too loose lets bad canaries through), reevaluating
    these expectations regularly as the service evolves.
  must_not:
  - Give advice that contradicts this principle
- test_id: PBT-P145
  principle_id: P145
  prompt: the same helper logic is duplicated across multiple pipelines. What do you advise, and why?
  expected_behaviour: Centralize reusable pipeline helper code in a versioned Jenkins shared library and
    reference it from all pipelines instead of copying functions into each Jenkinsfile.
  must_not:
  - Give advice that contradicts this principle
- test_id: PBT-P146
  principle_id: P146
  prompt: granting permissions to a user, tool, or pipeline. What do you advise, and why?
  expected_behaviour: Enforce least privilege for all automation identities, never use the cloud root
    account except for billing, create dedicated users/roles with only the permissions needed, and store
    generated access keys securely.
  must_not:
  - Give advice that contradicts this principle
- test_id: PBT-P147
  principle_id: P147
  prompt: architecting a build cluster for resilience. What do you advise, and why?
  expected_behaviour: Spread workers and subnets across multiple availability zones and make workers immutable
    and disposable via Auto Scaling groups for high availability and fault tolerance.
  must_not:
  - Give advice that contradicts this principle
- test_id: PBT-P148
  principle_id: P148
  prompt: operating a Jenkins server that holds important configuration and history. What do you advise,
    and why?
  expected_behaviour: Back up $JENKINS_HOME regularly (via a backup plugin or a scheduled cron job) to
    remote or external storage so Jenkins can be restored after data corruption or human error.
  must_not:
  - Give advice that contradicts this principle
- test_id: PBT-P149
  principle_id: P149
  prompt: publishing build artifacts to a container registry. What do you advise, and why?
  expected_behaviour: Store built images in a private registry and authenticate with a least-privilege
    scoped token or instance profile rather than admin credentials.
  must_not:
  - Give advice that contradicts this principle
- test_id: PBT-P150
  principle_id: P150
  prompt: deploying to more than one environment. What do you advise, and why?
  expected_behaviour: Use the same deployment script and process to deploy to every environment, capturing
    per-environment differences as separately managed configuration, so the production path is rehearsed
    many times and any release-day failure isolates to environment-specific configuration rather than
    the script.
  must_not:
  - Give advice that contradicts this principle
- test_id: PBT-P151
  principle_id: P151
  prompt: managing configuration across applications and environments. What do you advise, and why?
  expected_behaviour: Supply all application configuration through a single mechanism, applied only by
    automated processes from a configuration repository, keeping the list of options with the source but
    the per-environment values separate and tracked against the application version.
  must_not:
  - Give advice that contradicts this principle
- test_id: PBT-P152
  principle_id: P152
  prompt: configuring authentication and authorization for Jenkins. What do you advise, and why?
  expected_behaviour: Control Jenkins access with role-based authorization and delegate authentication
    to an OAuth provider (GitHub, GitLab, Google, OpenID) following least privilege, instead of managing
    per-user permissions and passwords by hand.
  must_not:
  - Give advice that contradicts this principle
- test_id: PBT-P153
  principle_id: P153
  prompt: preparing and stabilizing a release. What do you advise, and why?
  expected_behaviour: Use branch for release to replace the code freeze, developing features on mainline
    and committing only critical fixes to the release branch and merging them back immediately, never
    creating branches off a release branch, and stop branching for release once you release about weekly.
  must_not:
  - Give advice that contradicts this principle
- test_id: PBT-P154
  principle_id: P154
  prompt: planning a project's testing and quality approach. What do you advise, and why?
  expected_behaviour: Build quality in by discovering and fixing defects at the point they are introduced,
    ideally before check-in, since delaying testing decreases quality; testing is not a phase and quality
    is everyone's responsibility all the time.
  must_not:
  - Give advice that contradicts this principle
- test_id: PBT-P155
  principle_id: P155
  prompt: setting up the build for continuous integration. What do you advise, and why?
  expected_behaviour: Script building, testing, and packaging so they run from the command line independently
    of any IDE, and treat those scripts as first-class, version-controlled, tested, and refactored artifacts,
    because the build must run in CI and be auditable.
  must_not:
  - Give advice that contradicts this principle
- test_id: PBT-P156
  principle_id: P156
  prompt: designing the commit test suite and artifact handling. What do you advise, and why?
  expected_behaviour: Store commit-stage outputs in an artifact repository rather than version control,
    keeping a hash of each; make the vast majority of commit tests fast isolated unit tests forming a
    test pyramid, avoiding the UI, the database, and asynchrony and using dependency injection and test
    doubles.
  must_not:
  - Give advice that contradicts this principle
- test_id: PBT-P157
  principle_id: P157
  prompt: developing and testing a story. What do you advise, and why?
  expected_behaviour: Have the whole cross-functional team (developers and testers together) collaboratively
    own and create the automated acceptance tests throughout development — discussing criteria before
    development and responding immediately to breakages — rather than deferring to a separate test team
    or an end-of-story handover.
  must_not:
  - Give advice that contradicts this principle
- test_id: PBT-P158
  principle_id: P158
  prompt: measuring and improving a delivery process. What do you advise, and why?
  expected_behaviour: Make feedback cycles short and visible with information radiators, choose metrics
    carefully because they shape behavior (the Hawthorne effect), and optimize globally using cycle time
    as the primary metric rather than defect count.
  must_not:
  - Give advice that contradicts this principle
- test_id: PBT-P159
  principle_id: P159
  prompt: managing database schema and data changes. What do you advise, and why?
  expected_behaviour: Automate the database migration process, versioning the database with roll-forward
    and roll-back scripts run by a migration tool and managing all database changes as scripts in version
    control used in continuous integration, and keep roll-forward scripts nondestructive by copying data
    to be deleted into a temporary table first.
  must_not:
  - Give advice that contradicts this principle
- test_id: PBT-P160
  principle_id: P160
  prompt: managing state and databases in automated tests. What do you advise, and why?
  expected_behaviour: Never run unit tests against a real database, using the repository pattern, an in-memory
    database, or test doubles, and prefer test isolation through transaction rollback or functional partitioning
    over adaptive or sequenced tests, resisting the temptation to couple tests into a coherent story.
  must_not:
  - Give advice that contradicts this principle
- test_id: PBT-P161
  principle_id: P161
  prompt: leadership provides consistent time, actions, and resources and the team commits. What do you
    advise, and why?
  expected_behaviour: Assume meaningful improvement is achievable for any team in any industry or stack,
    but only when leadership gives consistent support and the team commits to the work.
  must_not:
  - Give advice that contradicts this principle
- test_id: PBT-P162
  principle_id: P162
  prompt: operating and improving the deployment process. What do you advise, and why?
  expected_behaviour: Make deployment the whole team's responsibility rather than a build expert's, do
    not delete old files but move them, keep server applications free of GUIs, warm up caches before going
    live, and smoke-test within the deployment scripts.
  must_not:
  - Give advice that contradicts this principle
- test_id: PBT-P163
  principle_id: P163
  prompt: designing organizational structure and management cadence. What do you advise, and why?
  expected_behaviour: Use visual management (an Obeya) tying each objective measurably to enterprise strategy,
    organize along value streams into small self-steering cross-functional teams, and let structure emerge
    and coaches multiply through coaching the coaches.
  must_not:
  - Give advice that contradicts this principle
- test_id: PBT-P164
  principle_id: P164
  prompt: Use the measured performance benchmarks (e.g., high performers' higher market-cap growth, the
    rework and manual-work J-curves) as evidence that capability gaps carry real business cost. What do
