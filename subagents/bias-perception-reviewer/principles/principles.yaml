- principle_id: P008
  statement: Recognize that thorough data collection does not by itself improve accuracy
    while explicit hypothesis formulation directs a more efficient and effective search,
    and that experts' self-insight into their own reasoning is faulty because their
    mental models are simpler than they think, so a mathematical model of an analyst's
    actual decisions describes them better than the analyst's own verbal account.
