- principle_id: P004
  statement: Explain the overestimation of one's successful influence mainly by an
    information asymmetry, since an actor knows his own efforts to influence the other
    far better than he knows third parties' actions and the other's internal processes,
    so absent strong contrary evidence the parsimonious conclusion is that he was
    influential, and a naive stimulus-response outlook makes a manipulator ignore
    the other's deep loyalties and autonomous assessment of its interests.
