- principle_id: P021
  statement: Treat resistance to theory-changing data as often reasoned rather than
    obstinate, because an established theory earned acceptance by economically explaining
    a wide range of events, has survived challenges, and has pointed to fruitful research,
    so its proponents rightly see the loss in abandoning it and are usually vindicated
    in expecting it to absorb troublesome findings, which is why one must follow the
    weight of evidence rather than drop a strong theory for a little discrepant data.
