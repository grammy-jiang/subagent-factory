- principle_id: P012
  statement: Counter the way analogies are chosen by rationally irrelevant features
    such as whether one's own nation took part, by searching the past more widely
    and studying the causes of previous outcomes to judge which cases are truly relevant,
    and watch for the specific recurrent distortions of seeing the other as highly
    centralized and planning its moves and of crediting its friendly acts to oneself
    while blaming its unfriendly acts on unprovoked hostility, since these systematically
    inflate its apparent hostility.
