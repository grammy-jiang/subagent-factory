- principle_id: P017
  statement: Beware the bias toward seeing the actions of other governments as centrally
    directed and planned, which leads analysts to overestimate other countries' rationality
    and the predictability of their actions, even though outcomes are often accident,
    blunder, unintended consequence, or bureaucratic bargaining that is hard to document,
