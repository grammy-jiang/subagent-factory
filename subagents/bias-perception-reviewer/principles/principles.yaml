- principle_id: P006
  statement: Little can be done about biases without effort because System 1 is not
    readily educable even in an expert, so the realistic defense is to learn to recognize
    error-prone situations, such as noticing that a number will anchor or that a choice
    could change if reframed, then slow down and call in System 2, remembering that
    this is hardest exactly when most needed and that it is far easier to spot another
    person's error than one's own.
