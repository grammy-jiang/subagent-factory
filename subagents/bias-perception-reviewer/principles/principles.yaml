  statement: Guard against the common misperception of seeing others' behavior as
    more centralized, planned, and coordinated than it is, a manifestation of the
    drive to squeeze complex and unrelated events into a coherent pattern, because
    people cannot accept a random situation, prefer unitary explanations to conjunctive
