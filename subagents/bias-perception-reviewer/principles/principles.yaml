principles:
- principle_id: P001
  statement: Counter the vividness criterion, under which vivid, firsthand, and anecdotal
    information has outsized impact while more valuable statistical evidence is overlooked
    and personal observation can be as deceptive as secondhand accounts so that seeing
    is not always believing, by giving little weight to anecdotes and case histories
    unless they are known to be typical.
