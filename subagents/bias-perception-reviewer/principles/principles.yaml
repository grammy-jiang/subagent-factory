- principle_id: P003
  statement: Guard against outcome-driven distortion of lessons, since categorizing
    an outcome as a success leads decision-makers to over-credit the policy while
    ignoring its costs, better alternatives, and luck, so successful policies are
    too quickly repeated, while on failure they assume the rejected alternatives would
    have done better and rarely allow that a policy was the best available given the
    information, and they preserve prior beliefs by attributing an anomalous success
    or failure to special factors.
