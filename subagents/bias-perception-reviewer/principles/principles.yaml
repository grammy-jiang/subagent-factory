- principle_id: P016
  statement: Remember that because people underestimate how strongly established beliefs
    shape perception, they change their minds more slowly than they think and overestimate
    both their sensitivity to variations in others' behavior and their ability to
    change others' image of them, so an effort to make others accept a desired image
    succeeds in proportion to its compatibility with what they already believe, and
    altering their expectations requires prolonged or dramatic behavior that may be
    misperceived for a long time.
