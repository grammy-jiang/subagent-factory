- principle_id: P009
  statement: 'Use Alternative Futures (scenarios) analysis when complexity and uncertainty
    are too high to trust a single-outcome forecast: select by consensus the two most
    critical and uncertain drivers as axes, cross them into four future worlds with
    plausible stories and signposts, involve policymakers so they can test strategies
    against each world, and reserve the technique for high-consequence problems given
    its cost.'
