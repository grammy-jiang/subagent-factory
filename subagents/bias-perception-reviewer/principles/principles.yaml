- principle_id: P005
  statement: Expect an actor who is sure a phenomenon will be present to need very
    little information, even information barely resembling it, to convince him he
    sees it, as planes hunting the Bismarck attacked a different two-funneled ship
    and analysts took folded tents for missile platforms, and guard against the intelligence
    self-fulfilling prophecy in which telling field agents a phenomenon is likely
    makes them report ambiguous stimuli as it, which feeds the analyst's certainty
    back into the field.
