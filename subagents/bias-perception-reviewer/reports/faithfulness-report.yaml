# Faithfulness review — bias-perception-reviewer
# Per-rule claim-strength check of the load-bearing profile rules against the promoted
# principles and their backing claims. No rule is stronger than its evidence. source_anchors
# are omitted deliberately: provenance is carried in each note via principle + claim IDs,
# which resolve into principles.yaml (P###) and analysis/claims.jsonl (C#####). Verdicts sit at
# EXACT_SUPPORT / WITHIN_SCOPE — the profile restates the sources' bias/perception/calibration
# rules and narrows their scope to review and advice; it does not broaden them.
schema_version: faithfulness-report-v1
subagent_slug: bias-perception-reviewer
findings:
- rule_ref: role
  verdict: WITHIN_SCOPE
  distortion:
  - none
  support_granularity: section
  severity: low
  action: accept_with_note
  note: 'The role restates the sources'' subject — cognitive bias, perceptual distortion, and calibration
    failure in judgment — and narrows the posture to review and advice, explicitly disclaiming making
    the substantive judgment, owning the decision, or certifying an analysis correct. A narrowing, not
    an over-claim. Grounded in principle(s): P001 (claims C00010, C00011); P006 (claims C00520, C00521);
    P049 (claims C00154, C00175); P086 (claims C01208, C01215); P108 (claims C02069, C02070); P128 (claims
    C02074, C02075).'
