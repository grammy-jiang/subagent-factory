- test_id: GT-011
  prompt: Redis must act as a durable persistent cache or survive process/system crashes. What do you
    advise, and why?
  principle_coverage:
  - P006
  expected_route: invoke
  minimum_output: For a Redis cache that must not lose data on a crash, use AOF persistence with APPENDFSYNC
    always; use everysec or no only when some loss is tolerable, combine AOF (crash recovery) with RDB
    (consistent point-in-time snapshots for history/recovery), and automate BGREWRITEAOF to keep the AOF
    compact
