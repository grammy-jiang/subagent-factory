- test_id: GT-035
  prompt: cached values must expire after a known time, e.g. sessions or time-sensitive data. What do
    you advise, and why?
  principle_coverage:
  - P018
  expected_route: invoke
  minimum_output: 'Use TTL (time-to-live) expiry to bound how long a cached value lives or may be stale:
    give each value a per-key lifetime after which it is removed regardless of capacity (in Redis, TTL
    is set at the key level). Apply it both to time-sensitive or session data (e.g., a session TTL refreshed
    on each interaction) and to dynamically changing data to cap staleness by re-reading from the store
    at intervals, accepting the residual inconsistency only where some inaccuracy is acceptable for the
    use case'
