- test_id: GT-013
  prompt: designing a multi-region or multicloud Redis deployment. What do you advise, and why?
  principle_coverage:
  - P007
  expected_route: invoke
  minimum_output: 'Respect the open-source-versus-Enterprise boundary for multi-region Redis: open-source
    Redis allows only one master, so remote regions can scale reads via local replicas but writes bottleneck
    at the single master; cross-region read-and-write performance requires Redis Enterprise Active-Active
    (which can keep serving even when most regions are down), and no major cloud provider offers native
    multi-region Active-Active or cross-provider deployments'
