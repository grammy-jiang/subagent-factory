- test_id: GT-007
  prompt: a cache is approaching its capacity or throughput limits. What do you advise, and why?
  principle_coverage:
  - P004
  expected_route: invoke
  minimum_output: 'Plan cache scaling against two distinct limit types — storage limits (space for cached
    data) and resource limits (bandwidth/CPU to serve it, which even a single hot key can exhaust) — and
    scale by raising those limits through vertical scaling (a bigger node: more RAM eases storage, more
    CPU/bandwidth eases resource) or horizontal scaling (more nodes, which can also raise availability)'
