- test_id: GT-001
  prompt: deciding whether a cache-aside cache will improve performance. What do you advise, and why?
  principle_coverage:
  - P001
  expected_route: invoke
  minimum_output: A cache is justified only when it is measurably effective. In cache-aside terms it is
    worthwhile only when the cost to check and fill the cache is significantly smaller than the backing
    operation and cache hits significantly outnumber misses. Quantitatively, the cache helps only when
    total request time over all requests is lower than without it, which requires the hit rate to exceed
    a break-even point set by the overhead-to-service-time ratio; effectiveness rises with both a higher
    hit rate and a larger service-call-time-to-overhead ratio, so the costlier the un-cached operation,
    the more a given hit rate pays off. If cache manipulation costs more than the backing operation, or
    hits are rare, do not deploy the cache
