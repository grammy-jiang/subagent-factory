- test_id: GT-003
  prompt: designing how cached values are updated on writes. What do you advise, and why?
  principle_coverage:
  - P002
  expected_route: invoke
  minimum_output: Maintain consistency with an explicit write-side mechanism — invalidate-on-write (remove
    the stale key so the next read reloads from the store) or write-through (synchronously update cache
    and store together) — because inconsistency arises whenever the underlying data changes and the cache
    is not updated, and is otherwise easy to introduce
