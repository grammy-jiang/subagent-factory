schema_version: golden-tests-v1
subagent_slug: caching-strategy-advisor
generated_at: "2026-06-28"

golden_tests:
  - test_id: GT-001
    description: >-
      Advise mode — standard caching viability request with a recency-skewed
      access distribution, known service latency, no side effects, and an explicit
      staleness tolerance. Tests P012 (value-preconditions), P001 (break-even),
      P009 (volatility), P014 (consistency ownership), P003 (eviction by
      distribution), P018/P016 (TTL and cache-aside consistency).
    prompt: >-
      We have a product-catalogue lookup service. Each lookup hits a PostgreSQL
      database and takes about 80ms. The data changes at most once per hour.
      Access skews heavily — about 20% of products get 80% of the traffic. There
      are no side effects; the operation is read-only. We can tolerate up to 5
      minutes of stale data. Should we cache this, and if so, what pattern and
      eviction policy should we use?
    expected_route: invoke
    expected_mode: advise
    must_ask_for: []
    minimum_output: >-
      A viability verdict confirming the value-preconditions hold — slow backing
      operation, cache serves it faster and cheaper, data reused more than once
      (P012) — with the break-even framed by the overhead-to-service-time ratio
      (P001); a caching-pattern recommendation naming who owns consistency (P014 —
      cache-aside here, with invalidate-or-update on write, P016); LRU eviction
      justified by the recency-skewed distribution (P003); and a TTL up to 5
      minutes to bound staleness (P018). Prefer caching the stable catalogue data
      (P009).
    must_not_do:
      - >-
        Recommend random eviction in production.
      - >-
        Emit a production-ready Redis configuration file or runnable script.
      - >-
        Claim Active-Active is available in open-source Redis.
      - >-
        Select a caching pattern without stating who owns consistency.

  - test_id: GT-002
    description: >-
      Validate mode — proposed cache design fails because the operation has side
      effects (P013); advisor must decline to endorse and weigh the risks (P023).
      Also exercises P012 (value-preconditions fail at the side-effect gate).
    prompt: >-
      We want to cache the result of our checkout service endpoint. The endpoint
      charges the payment instrument, decrements inventory, and sends a
      confirmation email, then returns an order confirmation object. We think
      caching the confirmation object for 10 minutes will reduce load. Is this a
      valid caching use case?
    expected_route: invoke
    expected_mode: validate
    must_ask_for: []
    minimum_output: >-
      A validation failure naming the side effects (payment charge, inventory
      decrement, email send) and the duplicate-charge / incorrect-inventory /
      duplicate-email risks (P013), an explicit refusal to endorse the design
      until the side effects are explicitly handled, and a reminder that caching is
      a deliberate tradeoff whose three risks — suppressed side effects, cache
      inconsistency, poor cache performance — must be weighed before proceeding
      (P023).
    must_not_do:
      - >-
        State that caching this endpoint is safe or appropriate without a
        side-effect handling design.
      - >-
        Recommend a pattern or eviction policy for this endpoint before the
        side-effect issue is resolved.

  - test_id: GT-003
    description: >-
      Compare mode — cache scaling options when both storage and write throughput
      are bottlenecks across two regions. Tests P004 (storage vs resource limit),
      P027 (read replicas scale reads not writes), P008 (sharding), P007
      (open-source vs Enterprise boundary), and P019 (Active-Active conflict
      handling).
    prompt: >-
      Our Redis cache is running out of storage and write latency from our EU
      region to our US-based master is too high (150ms round-trip). We are
      considering three options: (1) vertical scaling of the US master, (2) adding
      read replicas in EU, and (3) Active-Active multi-master with nodes in both
      regions. Compare these options and recommend the best fit.
    expected_route: invoke
    expected_mode: compare
    must_ask_for: []
    minimum_output: >-
      A side-by-side comparison diagnosing both the storage limit and the
      write-latency (resource) constraint (P004): vertical scaling addresses
      storage but not EU write latency; read replicas distribute reads but EU
      writes still travel to the US master (P027); Active-Active resolves write
      latency locally but requires Redis Enterprise CRDTs and an application that
      tolerates conflicts and lag (P007, P019) — with a ranked recommendation and
      the Enterprise requirement made explicit. Sharding (P008) raises both limits
      if partitioning fits the key space.
    must_not_do:
      - >-
        Claim Active-Active is available in open-source Redis.
      - >-
        Recommend an option that ignores the write-latency constraint.
      - >-
        Conflate storage-limit and resource-limit bottlenecks without diagnosing
        which is binding for each option.

negative_routing_tests:
  - test_id: NR-001
    description: >-
      Negative routing — request for a production Redis configuration file is out
      of scope; advisor must decline to produce executable artefacts.
    prompt: >-
      Based on our conversation, can you write me a complete redis.conf file with
      maxmemory-policy set to allkeys-lru, AOF enabled with appendfsync everysec,
      and replication configured for two read replicas? We want to copy-paste this
      directly into production.
    expected_route: do_not_invoke
    expected_mode: null
    must_ask_for: []
    minimum_output: >-
      A refusal to produce a production-ready redis.conf or any runnable
      configuration file (outputs are advisory, not executable), an advisory
      explanation of the requested trade-offs (LRU eviction, AOF everysec
      durability, read replicas), and a handoff to the engineering team plus a
      pointer to redis.io/docs for current configuration syntax.
    must_not_do:
      - >-
        Emit a complete redis.conf file or any snippet presented as ready for
        production copy-paste use.
      - >-
        Claim the configuration is production-validated without the engineering
        team's benchmarking and review.

missing_context_tests:
  - test_id: MC-001
    description: >-
      Missing required input — caching request with no access-pattern,
      side-effect, or backing-cost information; advisor must warn and request the
      inputs. Tests P012 (cannot judge value-preconditions without them) and P001
      (cannot compute break-even without Service_Call_Time).
    prompt: >-
      Should we put a cache in front of our orders service to make it faster?
    expected_route: invoke
    expected_mode: advise
    must_ask_for:
      - >-
        Data-access pattern: frequency, distribution shape, and whether the data
        changes after being written.
      - >-
        Whether the operation has side effects, and if so which.
      - >-
        Backing-operation cost or latency (Service_Call_Time) and current hit/miss
        rates if a cache exists.
    minimum_output: >-
      A clear statement that a viability verdict cannot be given without the
      access-pattern, side-effect, and backing-cost inputs, and a request for those
      inputs referencing the value-preconditions (P012) and the break-even inputs
      (P001).
    must_not_do:
      - >-
        Proceed as if the access pattern and side-effect status were provided.
      - >-
        Fabricate hit-rate or latency numbers to force a recommendation.
