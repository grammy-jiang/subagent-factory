  description: Positive routing — scalability advice for P001
  prompt: We are hyper-growth or rapidly growing production environments. Review it and tell us how to
    scale, with the trade-offs.
  expected_route: invoke
  expected_mode: advise
  must_ask_for: []
  minimum_output: A finding or recommendation naming the principle at stake (P001) and the trade-off it
    implies.
  must_not_do:
  - Write the production implementation code for the design
