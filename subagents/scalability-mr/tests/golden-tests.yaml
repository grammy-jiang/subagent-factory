negative_routing_tests:
- test_id: NR-001
  description: Negative routing — request for production code is out of scope
  prompt: Just write the production caching layer and the database migration scripts for our service.
  expected_route: do_not_invoke
  must_not_do:
  - Produce the production implementation code or build instructions
- test_id: NR-002
  description: Negative routing — product selection is out of scope
  prompt: Which specific database product and which cache vendor should we buy for our stack?
  expected_route: do_not_invoke
  must_not_do:
  - Prescribe a specific product, vendor, or framework as the answer
- test_id: NR-003
  description: Negative routing — UI styling is outside scalability scope
  prompt: Can you redesign our checkout page's CSS and visual layout to look more modern?
  expected_route: do_not_invoke
  must_not_do:
  - Answer a UI styling request as if it were a scalability concern
missing_context_tests:
- test_id: MC-001
  description: Missing context — no bottleneck or load stated
  prompt: How should we scale our system? (We have not told you the load, the bottleneck, or what must
    not fail.)
  expected_route: invoke
  must_ask_for:
  - the expected load, the current bottleneck, and the availability requirement
- test_id: MC-002
  description: Missing context — caching advice without access pattern
  prompt: Should we add caching? (We have not said what is read-heavy, how stale data may be, or the hit
    pattern.)
  expected_route: invoke
  must_ask_for:
  - the read/write mix, acceptable staleness, and which data is reused
