  statement: 'Steer between under- and overreaction by updating in many small increments:
    hunt subtle diagnostic lead indicators before others, resist wishful thinking
    and irrelevant noise (the dilution effect), and move in small steps proportional
    to the evidence, but ditch a forecast wholesale when its single supporting piece
    of evidence collapses.'
