- principle_id: P078
  statement: Never hold a probability of exactly one in your own view or zero in a
    rival's, because the odds ratio becomes undefined and no evidence can move you;
    cap extreme confidence at values like .95 and .05 to stay updatable, remembering
    probative evidence eventually converges beliefs, fastest when the prior is strong
    and the evidence diagnostic.
