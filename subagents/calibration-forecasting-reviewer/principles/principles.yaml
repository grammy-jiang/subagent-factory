- principle_id: P073
  statement: Assessed subjective probability distributions are far too tight, with
    true values falling outside a stated ninety-eight percent interval about thirty
    percent of the time, because people anchor on their best estimate and adjust insufficiently
    and scoring incentives do not fix it, and the elicitation procedure itself changes
    the answer by invoking different anchors, so calibrated intervals must be widened
    and elicitation designed with care.
