  confidence: high
  applies_when:
  - A confident forecast rests on a coherent account of past events
  - long-term planning beyond a reliable forecast horizon
  - a decision-maker is reasoning from a formative historical experience
  - a past outcome is being used to set expectations about a new case
  - explaining why an actor drew a poor lesson from experience
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P002
  statement: The extremeness of a prediction should be controlled by predictability,
    so when predictability is nil the same value such as the average should be predicted
    for every case and the justified range widens only as predictability rises, yet
    under the illusion of validity confidence tracks how well the outcome matches
    the input and persists even when the predictors are known to be weak, and because
    redundant correlated inputs raise confidence while lowering accuracy, independent
    inputs of equal validity should be preferred.
