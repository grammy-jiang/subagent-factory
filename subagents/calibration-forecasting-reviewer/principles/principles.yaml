- principle_id: P014
  statement: Handle evidence of uncertain accuracy probabilistically rather than with
    a best-guess yes-or-no decision that treats seventy-to-eighty-percent-certain
    information as certain and produces overconfidence, recognizing that even discounting
    confidence by assessed validity still tends to be overconfident and that the joint
    probability of two events is the product of their individual probabilities.
