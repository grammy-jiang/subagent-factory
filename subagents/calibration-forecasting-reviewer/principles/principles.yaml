- principle_id: P006
  statement: The inside view builds a forecast from case specifics while the outside
    view uses the statistics of a reference class, and because people ignore the reference-class
    base rate even when they hold it and discard pallid statistics that clash with
    a vivid case, the reference-class baseline should be the anchor, adjusted toward
    case specifics only in proportion to their validity.
