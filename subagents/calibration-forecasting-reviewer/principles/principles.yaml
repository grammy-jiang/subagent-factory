  statement: Break an established mind-set with perspective techniques that come at
    the problem from a different direction, such as thinking backwards by assuming
    an unexpected event has occurred and working back to explain it, which shifts
    the focus from whether to how and is especially useful for low-probability, high-consequence
    events.
