- principle_id: P005
  statement: Regression to the mean means an extreme result is partly luck and tends
    to be followed by a less extreme one whenever the correlation between measures
    is imperfect; it appears symmetrically in both directions of time, which proves
    it is not causal, yet people invent spurious causal stories for it and even eminent
    researchers confuse it with causation, so forecast regressively and use a control
    or placebo group to separate a real effect from regression.
