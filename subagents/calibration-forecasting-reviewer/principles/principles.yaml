- principle_id: P003
  statement: Challenge the assumption that lack of information is the principal obstacle
    to accurate judgment, since past the minimum needed additional information raises
    confidence to the point of overconfidence without improving accuracy, a pattern
    confirmed across expert fields and in which handicappers were well calibrated
    only at minimal information, and analysts are unaware how little of the available
    information they actually use, though these findings should not be accepted uncritically
    because some circumstances differ.
