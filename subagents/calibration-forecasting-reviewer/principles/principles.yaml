schema_version: principles-v1
principles:
- principle_id: P001
  statement: Attribute inappropriate learning from history not to a lack of mental
    ability but to the subject's complexity, a small and biased sample of cases, poor
    learning conditions, and a failure to realize how much one is influenced by views
    of the past, and note that because decision-makers start from dramatic outcomes
    and lack an explicit theory of what is surprising, they learn little from non-events
    such as aggression that did not occur or crises that were quietly avoided.
