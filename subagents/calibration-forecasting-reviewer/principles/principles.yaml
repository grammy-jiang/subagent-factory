- principle_id: P007
  statement: Intuitive predictions are nonregressive and therefore biased, being as
    extreme as the evidence, so correct them by starting from the reference-class
    baseline and moving toward the intuitive estimate only by the fraction equal to
    the evidence-outcome correlation, an effortful step justified when the stakes
    are high and accuracy matters.
