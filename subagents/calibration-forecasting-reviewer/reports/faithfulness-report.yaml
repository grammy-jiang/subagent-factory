    proportionally discounted) success, so the P025/P086 clause now carries its source hedge and
    matches the proportional wording in always_on[7]. P083 (off-on-timing as a red flag, claims
    C01522) is unqualified and directly supports its clause. No longer a hedge-removed over-claim.'
