# Faithfulness review — calibration-forecasting-reviewer
# Per-rule claim-strength check of load-bearing profile rules against the promoted principles
# and their backing claims/evidence. No rule is stronger than its evidence.
#
# Grounding convention (profile v1.0.3): each note names the PRINCIPAL principle(s) that ground the
# rule's content, chosen to match that rule's subject (not a uniform template). Where a rule tags
# more principles than the note lists, the note is REPRESENTATIVE — the rule's full principle set is
# carried in its profile `(Pxxx)` tag list and partitioned across the eight skills (see
# provenance-ledger.md "Profile -> principle mapping"). Pure scope / role / input-output-shape and
# advisory-boundary rules (e.g. "the reviewer does not make the decision or produce the forecast")
# are DESIGN DECISIONS that narrow scope, not restatements of a source claim, so they carry no
# principle over-claim; where such a rule echoes principle content, that grounding is named.
# source_anchors are omitted deliberately — provenance is carried in each note via principle + claim
# IDs, which resolve into principles.yaml (P###) and analysis/claims.jsonl (C#####).
#
# Independent re-verification pass (this revision): every principle_id cited below was confirmed to
# exist in principles.yaml and to thematically support its rule, and every cited claim_id was read
# directly from analysis/claims.jsonl (the claim's own statement text, not recalled) to confirm it
# actually contains the language attributed to it — a principle's derived_from_claims list can bundle
# claims on unrelated sub-topics from the same source section, so list-membership alone is not proof
# of on-topic support. Four claim_id mis-citations were found and corrected; in every case the
# principle-level grounding was already correct, only the specific claim_id evidence was wrong:
#   - forbidden_behaviours[2]: P025 -> C01801 (+C01800), not C00992/C00993 (P025's own claims about
#     the unrelated wrong-side-of-maybe fallacy).
#   - when_to_use[1]: P065 -> C01364, not C01339/C01340 (P065's own claims about problem scorability
#     and causal methods for unique events, not the discrimination/calibration dimensions).
#   - handoff_rules[1]: P037 -> C01734, not C01397/C01398 (P037's own claims about stable-system
#     base rates and reputational fragility, not the marketplace-of-ideas claim).
#   - knowledge_partition.always_on[3]: P012 -> C01126/C01128, not C00984/C01034 (P012's own claims
#     about post-surprise hindsight narratives and accountability metrics, not steering
#     under-/overreaction in small increments).
# forbidden_behaviours[2] and [3] additionally had a verdict/field mismatch: both were WITHIN_SCOPE
# with a note declaring the prior hedge-removed/flat-ban distortion already fixed in profile.yaml,
# yet still carried distortion: [hedge_removed], severity: medium, and action: add_condition — the
# fields for an UNRESOLVED finding still awaiting an owner fix. Since the condition is already
# present in profile.yaml's rule text (verified against profile.yaml directly), these are corrected
# to distortion: [none], severity: low, action: accept_with_note, matching the convention this
# report uses elsewhere for a verified, already-resolved mis-attribution. No rule_ref, verdict, or
# principle_id changed as a result of this pass; only claim_id citations and the two
# distortion/severity/action fields were corrected. All 35 rule_refs below were re-checked for
# resolution against profile.yaml (list lengths, mode names, dotted paths) and all resolve.
