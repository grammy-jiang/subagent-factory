  prompt: We are diagramming or communicating an architecture. What do you advise
    here, and why?
  principle_coverage:
  - P072
  expected_route: invoke
  minimum_output: 'Treat communication as critical to architect success and diagram
    with discipline: apply representational consistency, use low-fidelity ephemeral
    artifacts early to avoid Irrational Artifact Attachment, master tool features,
    follow conventions (solid=sync, dotted=async; UML for class/sequence; C4 for monoliths),
    and always include a key when shapes are ambiguous'
- test_id: GT-P073
  prompt: What do you advise here, and why?
  principle_coverage:
  - P073
  expected_route: invoke
  minimum_output: 'Use the three structure categories for their intended reasoning:
    module structures for modifiability, component-and-connector structures for runtime
    qualities (performance, security, availability), and allocation structures for
    deployment-related qualities; no single structure is the architecture'
- test_id: GT-P074
  prompt: What do you advise here, and why?
  principle_coverage:
  - P074
  expected_route: invoke
  minimum_output: 'Treat the database as a detail that must not pollute the architecture:
    distinguish the architecturally significant data model from the non-significant
    database, restrict knowledge of tabular structure to the outermost utility functions,
    never pass database rows or tables around as objects (which couples use cases,
    business rules, and the UI to the relational structure), encapsulate data-storage
    performance behind low-level access mechanisms, and when a non-engineering requirement
    forces a particular database, bolt it on the side behind a narrow, safe data-access
    channel while keeping the core data in the form most convenient to the application'
- test_id: GT-P075
  prompt: What do you advise here, and why?
  principle_coverage:
  - P075
  expected_route: invoke
  minimum_output: 'Separate business logic from hardware and platform: intermingling
    software and firmware is an anti-pattern (burying SQL or spreading platform dependencies
    is writing firmware), so firm the boundary with a Hardware Abstraction Layer whose
    API is tailored to the software and hides how the hardware works, layering the
    hardware at the bottom so an inevitable hardware change is not a bigger job than
    necessary'
- test_id: GT-P076
  prompt: We are debugging or recovering a system with extraneous or poison messages.
    What do you advise here, and why?
  principle_coverage:
  - P076
  expected_route: invoke
  minimum_output: 'Manage leftover and stuck messages: use a Correlation Identifier
    to detect a stale reply, remember that transactions do not fix programming errors
    that strand messages, and use a Channel Purger to clear all or selected messages
    (storing them for inspection or replay), with temporary channels or removing a
    poison message to restore a crashing recipient'
- test_id: GT-P077
  prompt: We are designing the set of channels for a solution. What do you advise
    here, and why?
  principle_coverage:
  - P077
  expected_route: invoke
  minimum_output: 'Plan channels deliberately: they are created through administration
    tools and fixed at deployment, so dedicate one message type per channel, provide
    an Invalid Message Channel, and recognize that a well-designed channel set forms
    a Message Bus'
- test_id: GT-P078
  prompt: We are the set of routing destinations changes often. What do you advise
    here, and why?
  principle_coverage:
  - P078
  expected_route: invoke
  minimum_output: Choose between predictive routing (a Content-Based Router) and reactive
    filtering (a Publish-Subscribe Channel with Message Filters) by who should control
    routing, whether multiple recipients must process a message, network topology,
    and data sensitivity — routers suit business transactions and sensitive data,
    filter arrays suit event notifications
- test_id: GT-P079
  prompt: We are messages carry more or more deeply nested data than needed. What
    do you advise here, and why?
  principle_coverage:
  - P079
  expected_route: invoke
  minimum_output: Use a Content Filter to remove, simplify, or flatten data for security
    and manageability — stripping unauthorized or irrelevant fields and flattening
    over-nested or database-adapter structures — and pair an enricher on the way out
    with a filter on the way in at external-party boundaries
- test_id: GT-P080
  prompt: We are verifying a running solution's health, especially external services.
    What do you advise here, and why?
  principle_coverage:
  - P080
  expected_route: invoke
  minimum_output: Actively monitor live components by injecting Test Messages — generated,
    tagged in the header rather than by overloading application fields, separated,
    and verified — understanding that active monitoring tests deeper than passive
    logs but adds load, may cost money for metered services, and pollutes stateful
    components that cannot distinguish test from real data
- test_id: GT-P081
  prompt: We are deriving the characteristics a system must support. What do you advise
    here, and why?
  principle_coverage:
  - P081
  expected_route: invoke
  minimum_output: Identify driving characteristics early by extracting from domain
    concerns, requirements, and implicit domain knowledge, translating stakeholder
    language into engineering terms (e.g., 'millions of users' implies scalability;
    time-to-market = agility+testability+deployability)
- test_id: GT-P082
  prompt: We are a workflow can be processed asynchronously. What do you advise here,
    and why?
  principle_coverage:
  - P082
  expected_route: invoke
  minimum_output: 'Exploit asynchronous communication to improve responsiveness (distinct
    from performance) when the user needs only an acknowledgement, but design for
    its hard error handling: use the workflow event pattern (delegate-and-continue,
    programmatic repair, dashboard fallback) and accept out-of-order reprocessing'
- test_id: GT-P083
  prompt: We are choosing an object-relational persistence approach. What do you advise
    here, and why?
  principle_coverage:
  - P083
  expected_route: invoke
  minimum_output: 'Use Data Mapper to let the database schema and object model evolve
    independently (most commonly with a Domain Model, so you can ignore the database
    while designing and testing the model); because its price is an extra layer, gate
    on complexity: simple logic needs neither Domain Model nor Data Mapper, never
    use Data Mapper without a Domain Model, but a simple Domain Model over a developer-controlled
    database may use Active Record and refactor to a mapping layer as complexity grows'
- test_id: GT-P084
  prompt: We are architecture reviews and new designs. What do you advise here, and
    why?
  principle_coverage:
  - P084
  expected_route: invoke
  minimum_output: 'Eliminate single points of failure and avoid components in series:
    strive for active/active and add parallel redundancy, especially at the database
    and network layers'
- test_id: GT-P085
  prompt: We are designing or redesigning any multi-tenant system. What do you advise
    here, and why?
  principle_coverage:
  - P085
  expected_route: invoke
  minimum_output: Strive for statelessness; if state is required, push it to the browser,
    and otherwise use a distributed cache without affinity or replication
- test_id: GT-P086
  prompt: What do you advise here, and why?
  principle_coverage:
  - P086
  expected_route: invoke
  minimum_output: 'Distinguish OLTP from OLAP because they call for different engines:
    OLTP looks up a few records by key with interactive low-latency writes while OLAP
    scans many records reading few columns to compute aggregates, and although SQL
    serves both, analytics is run on a separate data warehouse rather than on the
    transaction-processing system'
- test_id: GT-P087
  prompt: What do you advise here, and why?
  principle_coverage:
  - P087
  expected_route: invoke
  minimum_output: Match the store to the relationship profile (document databases
    for self-contained data with rare relationships, graph databases when anything
    may relate to everything, relational in between), use the right specialized system
    rather than awkwardly emulating one model in another, remember that schema-free
    document and graph stores still rely on an implicit schema, and accept that some
    needs require purpose-built systems
- test_id: GT-P088
  prompt: What do you advise here, and why?
  principle_coverage:
  - P088
  expected_route: invoke
  minimum_output: 'Improve testability with controllability/observability tactics:
    provide specialized test interfaces (set/get, report-state, reset, verbose) kept
    separate from functional interfaces, use record/playback to recreate hard-to-reproduce
    faults, localize state storage, abstract data sources to substitute test data,
    sandbox to isolate experiments, and place executable assertions to embed the oracle'
- test_id: GT-P089
  prompt: What do you advise here, and why?
  principle_coverage:
  - P089
  expected_route: invoke
  minimum_output: Identify the real stakeholders for the project and tailor documentation
    to each one's needs (managers, developers, testers/integrators, maintainers, end
    users, future architects), knowing the golden rule is to know your reader and
    that a project can spend roughly half its effort in testing
- test_id: GT-P090
  prompt: What do you advise here, and why?
  principle_coverage:
  - P090
  expected_route: invoke
  minimum_output: Build individual architect competence on the duties-skills-knowledge
    triad (skills and knowledge serve the duties, which define competence), improving
    it by gaining experience through apprenticeship, developing nontechnical skills,
    and continuously mastering a fast-moving body of knowledge, while investing in
    the architect's many nontechnical duties
- test_id: GT-P091
  prompt: What do you advise here, and why?
  principle_coverage:
  - P091
  expected_route: invoke
  minimum_output: 'Treat quality as an enabler of speed rather than a tax on it: dispel
    the belief that speed opposes quality or that quality can be added later, because
    poor quality and developer fear slow delivery and cause code rot — instead build
    internal quality in from the start and automate to gain speed and quality together,
    judging test coverage by whether teams can change confidently rather than by line
    percentage'
- test_id: GT-P092
  prompt: What do you advise here, and why?
  principle_coverage:
  - P092
  expected_route: invoke
  minimum_output: Build IT pyramids from the top down — starting from an application
    that delivers customer value and letting common components sift down — because
    bottom-up base layers deliver little value, negate use-before-reuse, ignore build-measure-learn,
    and 'reusable' often means unused
- test_id: GT-P093
  prompt: What do you advise here, and why?
  principle_coverage:
  - P093
  expected_route: invoke
  minimum_output: Apply each programming paradigm for its architectural role — polymorphism
    to cross architectural boundaries, functional discipline to govern the location
    of and access to data, and structured programming as the algorithmic foundation
    of modules — understanding that each paradigm restricts rather than adds capability
- test_id: GT-P094
  prompt: We are under schedule pressure to cut corners. What do you advise here,
    and why?
  principle_coverage:
  - P094
  expected_route: invoke
  minimum_output: 'Never trade structure for short-term speed: making messes is always
    slower at every time scale and the cleanup-later promise never comes true, so
    the only way to go fast is to keep the code clean and well-structured'
- test_id: GT-P095
  prompt: What do you advise here, and why?
  principle_coverage:
  - P095
  expected_route: invoke
  minimum_output: 'Enforce architectural rules mechanically rather than by fallible
    discipline or slow post-compilation tooling: prefer to let the compiler enforce
    the architecture, applying access modifiers deliberately so only interfaces with
    inbound cross-package dependencies are public and implementation classes stay
    package-protected, because making all types public reduces packages to mere organization,
    collapses every architectural style to the same thing, and lets code instantiate
    concrete implementations directly in violation of the design'
- test_id: GT-P096
  prompt: What do you advise here, and why?
  principle_coverage:
  - P096
  expected_route: invoke
  minimum_output: Apply the Dependency Inversion Principle so source-code dependencies
    refer only to abstractions, reducing it to concrete rules — do not refer to, derive
    from, or override volatile concrete classes, and never name anything concrete
    and volatile — while tolerating stable concretions such as String and OS facilities,
    keeping interfaces stable by extending implementations, using an Abstract Factory
    to create volatile concretes, and using inheritance sparingly as the most rigid
    relationship
- test_id: GT-P097
  prompt: What do you advise here, and why?
  principle_coverage:
  - P097
  expected_route: invoke
  minimum_output: 'Apply the Single Responsibility Principle so that a module is responsible
    to exactly one actor (not merely doing one thing): separate the code that different
    actors depend on, because co-locating it causes one actor''s change to silently
    break another''s behavior and invites risky merges, optionally separating data
    from functions behind a Facade'
- test_id: GT-P098
  prompt: What do you advise here, and why?
  principle_coverage:
  - P098
  expected_route: invoke
  minimum_output: 'Apply the Liskov Substitution Principle at every level: make subtypes
    substitutable for their base type so any program written against the base behaves
    unchanged, treating it as a general rule about interchangeable implementations
    of any interface, and avoid embedding concrete identifiers in branching code (insulate
    variation behind configuration), because a single substitutability violation pollutes
    the architecture with extra mechanism'
- test_id: GT-P099
  prompt: What do you advise here, and why?
  principle_coverage:
  - P099
  expected_route: invoke
  minimum_output: Place high-level policy in stable components and volatile software
    in unstable ones, keeping the stable policy components abstract (interfaces and
    abstract classes) so per the OCP they stay extensible despite their stability
    — the Stable Abstractions Principle that a component should be as abstract as
    it is stable, which with the SDP forms the DIP for components so dependencies
    run toward abstraction
- test_id: GT-P100
