  principle_coverage:
  - P100
  expected_route: invoke
  minimum_output: Keep components on or near the Main Sequence (from stable-and-abstract
    to unstable-and-concrete), keeping volatile software out of the Zone of Pain (stable
    and concrete, e.g
- test_id: GT-P101
  prompt: What do you advise here, and why?
  principle_coverage:
  - P101
  expected_route: invoke
  minimum_output: Follow the first rule of design — do not depend on volatile things
    — by testing business rules without the volatile GUI through a dedicated testing
    API (a superset of the interactors and interface adapters) that bypasses security
    and expensive resources and forces testable states, whose purpose is to decouple
    the structure of the tests from the structure of the application; avoid structural
    coupling (a test class and method per production class and method), hide the application
    structure so tests and production code evolve independently, and keep a dangerous
    testing API in a separate deployable component
