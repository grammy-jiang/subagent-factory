schema_version: golden-tests-v1
subagent_slug: software-architecture
generated_at: "2026-06-20T00:00:00+00:00"

golden_tests:
  - test_id: GT-001
    description: "Positive routing — review an existing architecture for structural problems"
    prompt: >
      Here is our service: the core business logic imports the ORM and calls the web
      framework directly, and one change keeps breaking unrelated modules. Review the
      architecture.
    expected_route: invoke
    expected_mode: review
    must_ask_for: []
    minimum_output: "At least one finding naming a violated principle (dependency
                     direction / coupling / boundaries) with the trade-off it implies
                     and a concrete remediation."
    must_not_do:
      - "Write the corrected production code for the service"
      - "Prescribe a specific ORM, framework, or database product as the fix"
      - "Assert a single best architecture with no trade-off stated"

  - test_id: GT-002
    description: "Positive routing — advise on a structural decision against driving forces"
    prompt: >
      We are designing a new system and are not sure how to structure it. What should
      we optimise for and how should that shape the architecture?
    expected_route: invoke
    expected_mode: advise
    must_ask_for: []
    minimum_output: "A recommendation that names and prioritizes the driving
                     architecture characteristics and states the trade-offs the chosen
                     direction implies."
    must_not_do:
      - "Promise to maximize every quality at once"
      - "Recommend a specific product or framework as the answer"
      - "Give a structure with no reference to the qualities it must deliver"

  - test_id: GT-003
    description: "Positive routing — compare two architecture styles"
    prompt: >
      Should we use a layered architecture or an event-driven architecture for our
      platform? Compare them for us.
    expected_route: invoke
    expected_mode: compare
    must_ask_for: []
    minimum_output: "A side-by-side contrast of the two styles on architecture
                     characteristics (agility, deployability, testability, performance,
                     scalability) ending in a forces-weighted recommendation."
    must_not_do:
      - "Declare one style universally best without trade-offs"
      - "Recommend a specific product as the deciding factor"
      - "Give only one style without contrasting the alternative"

negative_routing_tests:
  - test_id: NR-001
    description: "Negative routing — product/vendor selection is out of scope"
    prompt: >
      Just tell us which database engine and which message broker product we should
      buy, and write the configuration for them.
    expected_route: do_not_invoke
    expected_mode: null
    must_ask_for: []
    minimum_output: "Explanation that selecting a specific product or vendor and writing
                     configuration is outside this reviewer's scope, which evaluates
                     architecture principles, characteristics, and trade-offs, not
                     products."
    must_not_do:
      - "Recommend a specific database or broker product"
      - "Write configuration or implementation code"
      - "Reframe the question to justify answering it"

missing_context_tests:
  - test_id: MC-001
    description: "Missing required input — no architecture or forces stated"
    prompt: >
      Can you review our architecture?
    expected_route: invoke
    expected_mode: review
    must_ask_for:
      - "The architecture, decision, or design under review and the system's driving
         forces (the quality attributes being optimised and the constraints)."
    minimum_output: "A clear statement that a review cannot proceed without the design
                     and its driving forces, and a request for them."
    must_not_do:
      - "Invent an architecture on the caller's behalf and review that"
      - "List generic advice with no design to anchor it"
      - "Assume the driving characteristics without asking"
