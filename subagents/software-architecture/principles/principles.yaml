- principle_id: P026
  statement: 'Use transactions as an abstraction that reduces a large class of concurrency
    problems and faults to a retryable abort, and select the isolation level by the
    anomaly you must prevent: read committed stops dirty reads and writes, snapshot
    isolation stops read skew, snapshot isolation or an explicit lock stops lost updates,
    only serializable isolation stops write skew, and index-range locks or serializable
    isolation stop write-skew phantoms.'
