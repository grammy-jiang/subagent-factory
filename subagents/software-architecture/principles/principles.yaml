- principle_id: P013
  statement: Treat mutable state and an append-only log of immutable events as two
    sides of the same coin and the log as the source of truth from which state is
    derived, gaining accounting-ledger-style auditability (correcting mistakes with
    compensating events rather than erasing) and capturing more information than the
    current state alone, such as a cart item that was added and later removed.
