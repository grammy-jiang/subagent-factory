schema_version: principles-v1
principles:
- principle_id: P001
  statement: 'Adopt chaos engineering: treat failure as a matter of when not if, and
    deliberately inject faults into the running system in a controlled, monitored
    way (for example randomly killing processes, as with Chaos Monkey) to continually
    exercise the recovery machinery and build confidence that real faults are handled,
    especially where emergent behavior makes full testing impossible.'
  derived_from_claims:
  - C01228
  - C02639
  - C03577
  confidence: high
  applies_when:
  - operating a distributed system in production
  - the system is designed to be fault-tolerant
  - complex adaptive systems with emergent behavior
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P002
