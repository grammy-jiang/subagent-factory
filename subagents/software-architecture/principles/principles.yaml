  - designing microservices with per-service data ownership
  operational_mapping:
    profile_rule: true
    test_cases: []
- principle_id: P014
  statement: 'Choose between concurrency controls by the frequency and severity of
    conflicts: make Optimistic Offline Lock (conflict detection) the default because
    it gives better liveness and is easier, and use Pessimistic Offline Lock (conflict
    prevention) when conflicts are likely or their cost is unacceptable.'
  derived_from_claims:
  - C00770
  - C01016
  - C01415
  - C01416
  confidence: high
  applies_when:
  - conflict probability is low (optimistic) versus high or costly (pessimistic)
  - logically mutable entities that may be updated concurrently
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P015
  statement: Define each architecture characteristic objectively and measurably before
    testing it, decomposing composite characteristics (e.g., agility) into measurable
