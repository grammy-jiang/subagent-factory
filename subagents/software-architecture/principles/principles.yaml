- principle_id: P007
  statement: 'Do not try to make a remote service look like a local object, because
    the RPC ideal of location transparency is fundamentally flawed: a network request
    can be lost, time out leaving the outcome unknown, be silently duplicated by retries,
    have wildly variable latency, and cross language boundaries, which is why newer
    RPC frameworks are explicit about a remote call being different (using futures
    and streams).'
