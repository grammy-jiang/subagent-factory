- principle_id: P005
  statement: Adopt the space-based architecture (replicated in-memory data grids,
    no central database, dynamically started/stopped processing units) for extreme
    and variable concurrent load, structuring it as processing units plus virtualized
    middleware and splitting into multiple processing units by functional area for
    larger applications.
