- principle_id: P006
  statement: Make reducing complexity a primary design goal because complexity raises
    the risk of bugs when changing the system, and remove accidental complexity (that
    which arises only from the implementation, not the problem) chiefly through good,
    reusable abstractions that hide implementation detail.
