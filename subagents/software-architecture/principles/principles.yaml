- principle_id: P023
  statement: Do not build distributed coordination or consensus yourself — two-phase
    commit and consensus algorithms like Paxos are notoriously hard to implement correctly
    — but use a proven coordination service such as ZooKeeper, Consul, or etcd (which
    run a small fixed quorum voting among themselves while serving many clients) for
    small, slow-changing coordination data such as which node leads a partition, not
    for fast-changing application state; note that service discovery alone does not
    require consensus (DNS suffices).
  derived_from_claims:
  - C03073
