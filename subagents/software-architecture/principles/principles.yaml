    test_cases: []
- principle_id: P010
  statement: Design concurrency by creating isolated zones where programmers need
    not think about concurrency and pushing as much code as possible into them, leaning
    on isolation (only one agent touches a piece of data) and immutability (unchanging
    data needs no control); share immutable data widely and route read-only apps to
    copied data sources.
