- principle_id: P016
  statement: 'Route messages that cannot be processed to a dedicated channel rather
    than blocking the flow: send messages a receiver cannot process (e.g. schema-valid
    but semantically invalid or unreadable) to an Invalid Message / error channel
    so processing continues and they can be reprocessed later, and rely on the platform''s
    Dead Letter Channel for undeliverable messages.'
