    skill: null
    reference: null
    test_cases: []
- principle_id: P012
  statement: When session data is unavoidable, prefer keeping it in the user's browser
    via small cookies so any server in the pool can serve the request, and protect
    the authorization cookie over HTTPS against sidejacking.
  derived_from_claims:
  - C02012
  - C02013
  - C02014
  - C02379
  - C02380
  - C02381
