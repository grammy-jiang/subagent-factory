  operational_mapping:
    profile_rule: true
    test_cases: []
- principle_id: P005
  statement: 'Treat service-component granularity as the central microservices design
    decision: right-size components to avoid both coarse-grained loss of benefits
    and fine-grained orchestration; needing UI/API orchestration or inter-service
    calls to satisfy one request signals components that are too fine-grained or mis-partitioned.'
  derived_from_claims:
  - C00242
  - C00243
  - C00246
  - C00247
  - C00248
  - C01179
  - C01181
  - C01194
  - C01195
