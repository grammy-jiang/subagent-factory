    skill: null
    reference: null
    test_cases: []
- principle_id: P008
  statement: Use the layered (n-tier) architecture for small, simple, budget-constrained
    apps or as a temporary starting point, keeping closed layers of isolation, documenting
    which layers are open/closed and why, keeping reuse low and inheritance shallow,
    and watching for the architecture-sinkhole anti-pattern (apply the 80-20 rule).
