- principle_id: P022
  statement: Recognize that a timeout is the only sure way to detect a node fault
    yet has no simple right value (too long delays recovery, too short falsely declares
    slow nodes dead), that prematurely declaring a live node dead is harmful (double-executed
    actions and load that can cascade), and that real asynchronous networks are unbounded
    so a transient round-trip spike can mislead a low timeout.
  derived_from_claims:
  - C02964
  - C02965
  - C02966
  - C03657
  - C03658
  - C03659
