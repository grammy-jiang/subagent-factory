    test_cases: []
- principle_id: P008
  statement: 'Reject silver-bullet solutions and blanket ''decouple everything'' advice:
    no single technique gives order-of-magnitude gains, and over-decoupling yields
    systems that cannot communicate — apply coupling appropriately instead.'
