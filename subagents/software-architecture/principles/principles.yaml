- principle_id: P003
  statement: Record every meaningful architecture decision as an Architecture Decision
    Record capturing Context (problem and alternatives), Decision (stated affirmatively,
    with its justification and emphasizing why over how), and Consequences (impacts
    and trade-offs considered), plus governance/compliance; keep each ADR as its own
    linked record and use an RFC-with-deadline to avoid analysis paralysis.
