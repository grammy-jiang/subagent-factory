  - designing a microservices architecture
  - decomposing or reviewing a microservices application
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P006
  statement: 'Treat every architecture choice as a trade-off: never present an option
    as the single right answer, and if something appears not to be a trade-off, keep
    looking until the trade-off is identified.'
