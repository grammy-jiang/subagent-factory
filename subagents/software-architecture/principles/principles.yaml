    test_cases: []
- principle_id: P011
  statement: 'Use asynchronous, queue-based pipelines to raise throughput by decoupling
    producer and consumer: parallelize the slowest stage with Competing Consumers
    on a Point-to-Point Channel, parallelize only stateless filters, and preserve
    ordering when it is critical with a single instance, a Resequencer, or a correlation
    identifier to match out-of-order results.'
