- principle_id: P009
  statement: 'Design distributed systems for network reality rather than as if they
    were a single in-process application: explicitly counter the fallacies of distributed
    computing — the network is unreliable (use timeouts/circuit breakers), latency
    is non-zero (track average and tail latency), bandwidth is finite (minimize data,
    avoid stamp coupling), the network is insecure (secure every endpoint), the topology
    changes, and platforms are heterogeneous.'
