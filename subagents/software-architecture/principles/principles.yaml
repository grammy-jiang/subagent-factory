    codify governance rules as fitness functions / automated architecture tests (e.g.
    ArchUnit, NetArchTest) built into the CI pipeline rather than relying on error-prone
    manual reviews, so important-but-not-urgent concerns like cyclic dependencies
    are caught automatically.'
