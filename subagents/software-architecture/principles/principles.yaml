schema_version: principles-v1
principles:
- principle_id: P001
  statement: Actively maintain modularity and govern accidental coupling (such as
    cyclic dependencies) with automated fitness functions wired into the build, since
    code reviews catch it too late.
  derived_from_claims:
  - C00027
  - C00066
  - C00128
  - C00129
  - C00130
  - C00131
  - C00614
  - C00617
  - C00618
  - C00619
  - C00622
  - C00623
  confidence: high
  applies_when:
  - fitness functions exist for the system
  - important principles risk being skipped under schedule pressure
  operational_mapping:
    profile_rule: true
    test_cases: []
- principle_id: P002
  statement: Use the architecture quantum — an independently deployable artifact with
    high functional cohesion, high static coupling, and synchronous dynamic coupling
    — as the unit and shared language for coupling and granularity analysis.
  derived_from_claims:
  - C00135
  - C00136
  - C00140
  - C00262
  - C00641
  - C00642
  - C00650
  - C00651
  - C00652
  - C00653
  confidence: high
  applies_when:
  - delimiting boundaries in distributed or microservice architectures
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P003
  statement: 'Design for horizontal scalability from the outset: build for current
    demand but architect so that growth needs no application or architectural redesign
    — scale out, not up.'
  derived_from_claims:
  - C01875
  - C01882
  - C01897
  - C02007
  - C02056
  - C02191
  - C02249
  - C02250
  - C02251
  - C02252
  confidence: high
  applies_when:
  - building or reviewing an internet-facing architecture expected to grow
  - any system, service, or database expected to grow rapidly
  operational_mapping:
    profile_rule: true
    skill: null
    reference: null
    test_cases: []
- principle_id: P004
  statement: Document and justify every architecture decision in an ADR with Context,
    Decision, and Consequences, stating the decision affirmatively and recording the
    why, the trade-offs, and the business value.
  derived_from_claims:
  - C00263
  - C00268
