- rule_ref: quality_bar[5]
  triplet:
    head: scalability advice
    relation: must be grounded in
    tail: named scalability principles, each stated with its trade-off
  verdict: WITHIN_SCOPE
  distortion:
  - none
  support_granularity: section
  severity: low
  action: accept_with_note
  note: Principles P003/P017/P012/P033/P054/P030; claims C01875/C01882/C01897/C02007/C02056/C02191. Scale-out
