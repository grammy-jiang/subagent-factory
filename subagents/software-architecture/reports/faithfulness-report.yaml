schema_version: faithfulness-report-v1
subagent_slug: software-architecture
findings:
- rule_ref: role
  triplet:
    head: software-architecture reviewer
    relation: evaluates and guides
    tail: architecture decisions against characteristics and trade-offs
  verdict: WITHIN_SCOPE
  distortion:
  - none
  support_granularity: section
  severity: low
  action: accept_with_note
  note: Principles P006/P036/P060; claims C00033/C00034/C00055. The role restates the books' framing (architecture
    = structure + the few prioritized characteristics + decisions, governed by trade-offs) and narrows
    to review/advise, excluding code and product choice, so it does not over-claim authority.
- rule_ref: quality_bar[0]
  triplet:
    head: every recommendation
    relation: must state
    tail: what is gained AND what is sacrificed
  verdict: EXACT_SUPPORT
  distortion:
  - none
  support_granularity: section
  severity: low
  action: accept_with_note
  note: Principle P006; claims C00033/C00034. Restates the first Law of Software Architecture and the
    trade-off-analysis chapter.
- rule_ref: quality_bar[1]
  triplet:
    head: driving architecture characteristics
    relation: must be
    tail: named and prioritized, not all maximized
  verdict: EXACT_SUPPORT
  distortion:
  - none
  support_granularity: section
  severity: low
  action: accept_with_note
  note: Principle P036; claims C00094/C00099/C00103. Keeping the driving-characteristics list short and
    not over-specifying is directly supported.
- rule_ref: quality_bar[2]
  triplet:
    head: structural findings
    relation: must be grounded in
    tail: dependency direction, cohesion/coupling, policy/detail boundaries
  verdict: EXACT_SUPPORT
  distortion:
  - none
  support_granularity: section
  severity: low
  action: accept_with_note
  note: Principles P040/P041/P025/P043/P016; claims C00473/C00477/C00488/C00506/C00590. The Dependency
    Rule, dependency inversion, the coupling definition, component cohesion, and policy/detail separation
    are explicit in the sources.
- rule_ref: quality_bar[3]
  triplet:
    head: style and integration recommendations
    relation: must match
    tail: characteristic profile / trade-offs to the caller's forces
  verdict: WITHIN_SCOPE
  distortion:
  - none
  support_granularity: section
  severity: low
  action: accept_with_note
  note: Principles P037/P051/P005/P002; claims C01089/C01090/C01091/C01244. Pattern-by-characteristic
    selection, integration-unlike-single-app, granularity right-sizing, and quantum-scoped splits are
    supported; combining them into one bar is a synthesis within scope.
- rule_ref: quality_bar[4]
  triplet:
    head: each finding
    relation: must be
    tail: actionable (principle, consequence, remediation)
  verdict: WITHIN_SCOPE
  distortion:
  - none
  support_granularity: section
  severity: low
  action: accept_with_note
  note: Operational quality requirement consistent with the review function; not a domain claim, so it
    neither broadens nor contradicts any source.
- rule_ref: forbidden_behaviours[0]
  triplet:
    head: reviewer
    relation: must not
    tail: produce production implementation code
  verdict: WITHIN_SCOPE
  distortion:
  - none
  support_granularity: section
  severity: low
  action: accept_with_note
  note: Some sources include code (PoEAA, Clean Architecture), but this package scopes itself to architecture
    principles and trade-offs; excluding code is a narrowing, not an over-claim.
- rule_ref: forbidden_behaviours[1]
  triplet:
    head: reviewer
    relation: must not
    tail: prescribe a specific product, vendor, or framework
  verdict: WITHIN_SCOPE
  distortion:
  - none
  support_granularity: section
  severity: low
  action: accept_with_note
  note: Principles P020/P016; claims C02268/C02269. The sources teach storage/characteristic fit and treat
    frameworks as details, not product recommendations; forbidding product selection follows from that
    and narrows scope.
- rule_ref: forbidden_behaviours[2]
  triplet:
    head: reviewer
    relation: must not
