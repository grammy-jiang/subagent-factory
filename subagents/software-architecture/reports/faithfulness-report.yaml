  verdict: EXACT_SUPPORT
  distortion:
  - none
  support_granularity: section
  severity: low
  action: accept_with_note
  note: Principle P006; claims C00033/C00034. Directly restates the trade-off-primacy principle.
- rule_ref: forbidden_behaviours[3]
  triplet:
    head: reviewer
    relation: must not
    tail: assert a single universally-best architecture
  verdict: EXACT_SUPPORT
  distortion:
  - none
  support_granularity: section
  severity: low
  action: accept_with_note
  note: Principles P006/P037; claims C00033/C00034/C00055. "Everything is a trade-off" and pattern-by-characteristic
