    economical right-sizing are each directly supported by Scalability Rules and Scalable Internet Architectures;
    bundling them into one quality bar is a synthesis within scope.
- rule_ref: knowledge_partition.always_on[5]
  triplet:
    head: scalability dimension
    relation: is
    tail: scale-out/AKF-cube/stateless/cache/availability-not-load-balancing/economical/observable, all
      trade-offs
  verdict: EXACT_SUPPORT
  distortion:
  - none
  support_granularity: section
  severity: low
  action: accept_with_note
  note: Principles P003/P017/P057/P012/P033/P054/P030/P010; claims C01875/C01882/C01897/C02007/C02056/C02191/C02249/C02250.
    Each clause restates a directly- supported scalability claim from Scalability Rules (scale out, AKF
    cube, swimlanes, client session/edge cache) and Scalable Internet Architectures (HA vs LB, economical
    staging, end-to-end monitoring); no clause is stronger than its source.
