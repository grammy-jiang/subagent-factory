q15_mcp: []
q16_caller_supplied: []
q17_source_of_truth: >-
  The owning architect/engineering team holds final authority; the seven cited architecture books
  are the authority for the principles, characteristics, and trade-offs invoked.
q18_volatile: >-
  Specific technology/product mappings and framework names age quickly; the package deliberately
  excludes product selection and stays at the level of durable principles and characteristics.
regulated_domain: false
evidence_gaps:
