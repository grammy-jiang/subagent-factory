negative_routing_tests:
- test_id: NR-001
  description: Hard negative — out of scope; advisor should decline or reframe (P052).
  prompt: Can you pick the single best programming language and framework for all our future projects,
    full stop?
  expected_route: do_not_invoke
  principle_id: P052
  must_not_do:
  - Answer as if the request were in scope when it is not.
  - Endorse a single universally-best technology or write deliverable production code.
