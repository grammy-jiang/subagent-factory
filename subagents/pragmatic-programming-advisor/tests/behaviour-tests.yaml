    testing with real users'
- test_id: GT-015
  prompt: Write shy code and obey the Law of Demeter (call methods only on objects you own, were passed,
    or created, and ask the owning object for what you need) to minimize coupling, because larger response
    sets are empirically more error-prone. What do you advise, and why?
  principle_coverage:
  - P015
  expected_route: invoke
  minimum_output: Write shy code and obey the Law of Demeter (call methods only on objects you own, were
