schema_version: golden-tests-v1
subagent_slug: pragmatic-programming-advisor
generated_at: '2026-06-28'
golden_tests:
- test_id: GT-001
  prompt: Design and keep components orthogonal, decoupled, and single-responsibility — using layering,
    an orthogonality test (a single requirement change should affect one module), and isolation of third-party
    tools behind abstract interfaces — to localize change, enable reuse, and reduce fragility by eliminating
    effects between unrelated things. What do you advise, and why?
  principle_coverage:
  - P001
  expected_route: invoke
  minimum_output: Design and keep components orthogonal, decoupled, and single-responsibility — using
    layering, an orthogonality test (a single requirement change should affect one module), and isolation
    of third-party tools behind abstract interfaces — to localize change, enable reuse, and reduce fragility
    by eliminating effects between unrelated things
- test_id: GT-002
  prompt: Eliminate duplication by generating all derived forms from one authoritative source with an
    active code generator wired into the build, normalizing data, using calculated fields, accessor functions,
    and generating tests from the specification; keep simple input formats and remember generators need
    not produce code. What do you advise, and why?
  principle_coverage:
  - P002
  expected_route: invoke
  minimum_output: Eliminate duplication by generating all derived forms from one authoritative source
    with an active code generator wired into the build, normalizing data, using calculated fields, accessor
    functions, and generating tests from the specification; keep simple input formats and remember generators
    need not produce code
- test_id: GT-003
  prompt: Do not use manual procedures; automate everything the team does (builds, tests, web publishing,
    administrivia) with scripted, repeatable tools kept under source control and scheduling, and let the
    computer do the repetitious, mundane work. What do you advise, and why?
  principle_coverage:
  - P003
  expected_route: invoke
  minimum_output: Do not use manual procedures; automate everything the team does (builds, tests, web
    publishing, administrivia) with scripted, repeatable tools kept under source control and scheduling,
    and let the computer do the repetitious, mundane work
- test_id: GT-004
  prompt: 'Prototype to learn: build cheap, disposable prototypes (even non-code) of anything risky, ignoring
    inessential details and using a high-level language, set disposability expectations clearly, and switch
    to tracer bullets if the prototype may be mistaken for a deliverable. What do you advise, and why?'
  principle_coverage:
  - P004
  expected_route: invoke
  minimum_output: 'Prototype to learn: build cheap, disposable prototypes (even non-code) of anything
    risky, ignoring inessential details and using a high-level language, set disposability expectations
    clearly, and switch to tracer bullets if the prototype may be mistaken for a deliverable'
- test_id: GT-005
  prompt: Program close to the problem domain using its vocabulary (backed by a glossary) and mini-languages,
    which enable domain-specific validation and can serve each class of user; a mini-language can grow
    from a non-executable specification into executable code, and embedding it lets behavior change without
    recompiling. What do you advise, and why?
  principle_coverage:
  - P005
  expected_route: invoke
  minimum_output: Program close to the problem domain using its vocabulary (backed by a glossary) and
    mini-languages, which enable domain-specific validation and can serve each class of user; a mini-language
    can grow from a non-executable specification into executable code, and embedding it lets behavior
    change without recompiling
- test_id: GT-006
  prompt: 'Estimate to avoid surprises: match accuracy and units to context, build and decompose a model,
    focus on high-impact parameters, beware estimates built on sub-estimates, record and learn from estimates,
    and ask someone who has done it before. What do you advise, and why?'
  principle_coverage:
  - P006
  expected_route: invoke
  minimum_output: 'Estimate to avoid surprises: match accuracy and units to context, build and decompose
    a model, focus on high-impact parameters, beware estimates built on sub-estimates, record and learn
    from estimates, and ask someone who has done it before'
- test_id: GT-007
  prompt: 'Master your basic tools, since tools amplify talent: treat the command shell as a workbench,
    know one editor deeply and use it everywhere, and do not confine yourself to a single IDE. What do
    you advise, and why?'
  principle_coverage:
  - P007
  expected_route: invoke
  minimum_output: 'Master your basic tools, since tools amplify talent: treat the command shell as a workbench,
    know one editor deeply and use it everywhere, and do not confine yourself to a single IDE'
- test_id: GT-008
  prompt: 'Design with contracts: specify each routine''s preconditions, postconditions, and class invariants,
    keep contracts abstract, be strict in what you accept and promise as little as possible, and do not
    use preconditions for user-input validation. What do you advise, and why?'
  principle_coverage:
  - P008
  expected_route: invoke
  minimum_output: 'Design with contracts: specify each routine''s preconditions, postconditions, and class
    invariants, keep contracts abstract, be strict in what you accept and promise as little as possible,
    and do not use preconditions for user-input validation'
- test_id: GT-009
  prompt: 'Finish what you start: the routine or object that allocates a resource frees it; free on every
    exit path, nest allocations (free in reverse order, acquire in a consistent order to avoid deadlock),
    encapsulate resources, avoid global handles, and verify resources are actually freed. What do you
    advise, and why?'
  principle_coverage:
  - P009
  expected_route: invoke
  minimum_output: 'Finish what you start: the routine or object that allocates a resource frees it; free
    on every exit path, nest allocations (free in reverse order, acquire in a consistent order to avoid
    deadlock), encapsulate resources, avoid global handles, and verify resources are actually freed'
- test_id: GT-010
  prompt: 'Program deliberately, not by coincidence: rely only on documented, reliable behavior, do not
    depend on unguaranteed context, remove spurious calls, and document and test your assumptions, because
    coding is design work that demands thought. What do you advise, and why?'
  principle_coverage:
  - P010
  expected_route: invoke
  minimum_output: 'Program deliberately, not by coincidence: rely only on documented, reliable behavior,
    do not depend on unguaranteed context, remove spurious calls, and document and test your assumptions,
    because coding is design work that demands thought'
- test_id: GT-011
  prompt: Continuously invest small daily effort in a diversified, regularly rebalanced knowledge portfolio
    (learn new languages and read widely, learn emerging tech early, broaden beyond your stack), treating
    your knowledge as an expiring asset. What do you advise, and why?
  principle_coverage:
  - P011
  expected_route: invoke
  minimum_output: Continuously invest small daily effort in a diversified, regularly rebalanced knowledge
