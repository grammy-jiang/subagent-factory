    with a single presentation-independent source'
- test_id: GT-013
  prompt: Make tests easy to find and ship them with the code, run them often, build a composable test
    harness (reusing a framework such as xUnit), formalize ad hoc tests into the suite, and build a test
    window into deployed software; internal test drivers are worth building even when no requirement asks
    for them, and tests should return exit codes so they compose. What do you advise, and why?
  principle_coverage:
  - P013
  expected_route: invoke
  minimum_output: Make tests easy to find and ship them with the code, run them often, build a composable
    test harness (reusing a framework such as xUnit), formalize ad hoc tests into the suite, and build
