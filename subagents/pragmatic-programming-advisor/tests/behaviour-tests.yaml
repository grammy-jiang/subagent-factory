- test_id: GT-012
  prompt: 'Treat documentation as code (English as another programming language) and build it in rather
    than bolt it on: it mirrors the code, so comment why not how, choose meaningful and non-misleading
    names, keep tool-maintained information out of comments, record authorship, and use executable documents
    with a single presentation-independent source. What do you advise, and why?'
  principle_coverage:
  - P012
  expected_route: invoke
  minimum_output: 'Treat documentation as code (English as another programming language) and build it
    in rather than bolt it on: it mirrors the code, so comment why not how, choose meaningful and non-misleading
