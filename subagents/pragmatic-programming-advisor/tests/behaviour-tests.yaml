- test_id: GT-014
  prompt: 'Cover the major testing types: unit testing as the foundation, integration testing of contracts
    (often the single largest source of bugs), validation and verification against the real need, resource-exhaustion
    and graceful-failure testing, performance and load testing, and usability testing with real users.
    What do you advise, and why?'
  principle_coverage:
  - P014
  expected_route: invoke
  minimum_output: 'Cover the major testing types: unit testing as the foundation, integration testing
    of contracts (often the single largest source of bugs), validation and verification against the real
