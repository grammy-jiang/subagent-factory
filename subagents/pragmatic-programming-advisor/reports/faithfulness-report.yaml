schema_version: faithfulness-report-v1
subagent_slug: pragmatic-programming-advisor

# Tier-1 faithfulness review: rules compared against evidence-records.yaml,
# principles/principles.yaml (P001..P078), and analysis/claims.jsonl.
# Reviewer: faithfulness-review agent, 2026-06-28
# Profile version reviewed: 0.3.0 (principle ids P001..P078, rebuilt package)

findings:

  # -----------------------------------------------------------------------
  # quality_bar
  # -----------------------------------------------------------------------

  - rule_ref: quality_bar[0]
    triplet:
      head: "advisor output"
      relation: "must cite"
      tail: "a specific principle ID (P001 through P078) or numbered Pragmatic Programmer tip, not a vague style preference"
    verdict: WITHIN_SCOPE
    distortion: ["none"]
    source_anchors: []
    support_granularity: section
    severity: low
    action: accept_with_note
    note: >
      The rule is a meta-operational constraint on advisor output format, not a
      verbatim source claim. The grounding references P040, P001, and P060. P060
      (derived from C00001 and C00002) supports thinking critically about every
      decision; P040 (C00039-C00042) is the DRY principle itself; P001
      (C00052-C00063, C00228) is the orthogonality principle. The book's numbered
      tip apparatus (70 tips) and the call for deliberate critical appraisal (P060)
      together support requiring citation of a specific principle or tip. The rule
      is a valid operational inference from the source's structure and philosophy,
      so WITHIN_SCOPE rather than EXACT_SUPPORT.

  - rule_ref: quality_bar[1]
    triplet:
      head: "tracer-bullet development and throwaway prototyping"
      relation: "must never be conflated"
      tail: "in any comparison or strategy recommendation"
    verdict: EXACT_SUPPORT
    distortion: ["none"]
    source_anchors: []
    support_granularity: section
    severity: low
    action: accept_with_note
    note: >
      Directly supported by P025 (C00075-C00080) and P004 (C00081-C00090).
      C00076 states explicitly: "Tracer code is not a throwaway prototype: it is
      production-quality with error checking, structure, documentation, and
      self-checking." C00080 reinforces: "Tracer code differs from a prototype:
      a prototype explores specific aspects and is then thrown away and recoded,
      whereas tracer code is lean but complete and becomes part of the final
      system's skeleton." The "never conflated" phrasing faithfully reflects the
      source's prescriptive distinction.

  - rule_ref: quality_bar[2]
    triplet:
      head: "refactoring guidance"
      relation: "must prohibit"
      tail: "simultaneous refactor-and-feature work, and must confirm tests are in place first"
    verdict: EXACT_SUPPORT
    distortion: ["none"]
    source_anchors: []
    support_granularity: section
    severity: low
    action: accept_with_note
    note: >
      Directly supported by P024 (C00259-C00264). C00261 captures the rule: take
      short, tested steps without adding functionality at the same time. The
      "adequate tests in place first" requirement is entailed by P024's claim that
      refactoring takes "short, tested steps" (C00259-C00264) and by P041
      (C00326-C00328, C00352), which mandates testing before coding is considered
      done. No distortion detected.

  - rule_ref: quality_bar[3]
    triplet:
      head: "testing advice"
      relation: "must specify"
      tail: "automation and early execution; must not endorse manual-only test plans as sufficient"
    verdict: EXACT_SUPPORT
    distortion: ["none"]
    source_anchors: []
    support_granularity: section
    severity: low
    action: accept_with_note
    note: >
      Supported by P041 (C00326-C00328, C00352) and P003 (C00313-C00325). P041
      states: "Test early, test often, and test automatically (with results
      interpreted automatically)." C00326 captures: "test early, test often, test
      automatically." P003 (C00313-C00325) states: "Do not use manual procedures;
      automate everything." Together these entail that manual-only test plans are
      insufficient. No distortion.

  - rule_ref: quality_bar[4]
    triplet:
      head: "estimates"
      relation: "communicate uncertainty through"
      tail: "unit choice; unit selection (days, weeks, months) is itself the uncertainty signal, matched to context not false precision"
    verdict: EXACT_SUPPORT
    distortion: ["none"]
    source_anchors: []
    support_granularity: section
    severity: low
    action: accept_with_note
    note: >
      Supported by P006 (C00102-C00111). C00103 addresses matching accuracy and
      units to context; C00106 and the estimation-units table in the source define
      unit selection as the mechanism for conveying accuracy. The current rule
      accurately restates the source's mechanism (unit choice conveys uncertainty)
      without adding a prohibition on single-point estimates that the source does
      not state. This is a corrected restatement from the prior stale report's
      SCOPE_BROADENED finding — the current wording is now EXACT_SUPPORT.

  # -----------------------------------------------------------------------
  # forbidden_behaviours
  # -----------------------------------------------------------------------

  - rule_ref: forbidden_behaviours[0]
    triplet:
      head: "advisor"
      relation: "must not recommend"
      tail: "leaving known defects or broken windows unaddressed on grounds of time pressure"
    verdict: EXACT_SUPPORT
    distortion: ["none"]
    source_anchors: []
    support_granularity: section
    severity: low
    action: accept_with_note
    note: >
      Supported by P039 (C00013-C00016) and P024 (C00259-C00264). C00013 states:
      "Do not live with broken windows: fix bad designs, wrong decisions, and poor
      code as soon as they are discovered." C00014 addresses the time-pressure case:
      "board it up" rather than ignore it. The "deferral consistently costs more as
      dependencies grow" rationale is entailed by C00015-C00016 (neglect accelerates
      rot). No distortion.

  - rule_ref: forbidden_behaviours[1]
    triplet:
      head: "advisor"
      relation: "must not recommend"
      tail: "disabling assertions in production builds"
    verdict: EXACT_SUPPORT
    distortion: ["none"]
    source_anchors: []
    support_granularity: section
    severity: low
    action: accept_with_note
    note: >
      Directly supported by P045 (C00183-C00186). P045 states: "Use assertions to
      guard conditions that should never happen ... leave them on in production."
      The reason given in the profile ("production environments expose conditions
      testing never reached") is consistent with the source's argument for
      keeping assertions on. No distortion.

  - rule_ref: forbidden_behaviours[2]
    triplet:
      head: "advisor"
      relation: "must not endorse"
      tail: "wizard-generated or auto-generated code the developer cannot explain"
    verdict: EXACT_SUPPORT
    distortion: ["none"]
    source_anchors: []
    support_granularity: section
    severity: low
    action: accept_with_note
    note: >
      Supported by P076 (C00278). C00278 states: "Do not use wizard-generated or
      any code you do not understand, because it becomes interwoven with your own
      code and you must be able to maintain and debug it." The profile rule
      restates this faithfully and adds the observation that "the generated code
      eventually becomes the developer's own responsibility," which is entailed by
      C00278's maintenance-and-debug rationale. No distortion. This is a
      well-grounded rule in the current package, correcting the prior stale
      report's SCOPE_BROADENED finding (which noted the absence of an evidence
      record — C00278 and P076 now exist).

  - rule_ref: forbidden_behaviours[3]
    triplet:
      head: "advisor"
      relation: "must not give"
      tail: "false-precision estimates; must choose units that convey intended accuracy and pause before quoting estimates for very large work"
    verdict: EXACT_SUPPORT
    distortion: ["none"]
    source_anchors: []
    support_granularity: section
    severity: low
    action: accept_with_note
    note: >
      Supported by P006 (C00102-C00111). C00103 captures matching accuracy and
      units to context; C00107 captures pausing before committing to an estimate.
      The "pause before quoting any estimate for very large work" language is a
      faithful paraphrase of the source's guidance on large-work estimates. No
      distortion.

  - rule_ref: forbidden_behaviours[4]
    triplet:
      head: "advisor"
      relation: "must not make"
      tail: "categorical technology endorsements (best language, best framework, best OS)"
    verdict: EXACT_SUPPORT
    distortion: ["none"]
    source_anchors: []
    support_granularity: section
    severity: low
    action: accept_with_note
    note: >
      Directly supported by P052 (C00003, C00004, C00006). C00003 states: "There
      is no single best tool, language, or operating system; choose the option most
      appropriate to the specific circumstances." The profile rule faithfully
      restates this as a forbidden behaviour. No distortion.

  - rule_ref: forbidden_behaviours[5]
    triplet:
      head: "advisor"
      relation: "must not"
      tail: "generate or write production application code"
    verdict: SCOPE_BROADENED
    distortion: ["scope_broadened"]
    source_anchors: []
    support_granularity: section
    severity: medium
    action: add_condition
    note: >
      This is an operational scope boundary for the subagent, not a claim
      attributable to any source passage, evidence record, or principle in this
      package. No claim in analysis/claims.jsonl and no principle in P001..P078
      addresses the constraint that an advisor must not write production code. It
      is a reasonable factory design decision (the advisor critiques rather than
      implements) but it derives from the subagent's operational role definition,
      not from The Pragmatic Programmer. The action is add_condition: annotate this
      rule explicitly as an operational meta-rule (scope boundary defined by the
      factory), not a principle distilled from the source, so its non-source
      origin is transparent.

  # -----------------------------------------------------------------------
