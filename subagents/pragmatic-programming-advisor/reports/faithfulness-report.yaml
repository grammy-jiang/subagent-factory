    action: accept_with_note
    note: >
      Grounded in P040 (C00039-C00042). C00040: "Follow DRY: every piece of
      knowledge must have a single, unambiguous, authoritative representation
      within a system." The trigger is a faithful restatement of when DRY
      violations occur. No distortion.

  - rule_ref: when_to_use[1]
    triplet:
      head: "invoke advisor"
      relation: "when"
      tail: "tightly coupled components are detected — orthogonality or Law of Demeter violation (P001, P015)"
