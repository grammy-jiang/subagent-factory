principles:
- principle_id: P001
  statement: Design and keep components orthogonal, decoupled, and single-responsibility
    — using layering, an orthogonality test (a single requirement change should affect
    one module), and isolation of third-party tools behind abstract interfaces — to
    localize change, enable reuse, and reduce fragility by eliminating effects between
    unrelated things.
