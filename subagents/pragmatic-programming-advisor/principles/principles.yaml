- principle_id: P009
  statement: 'Finish what you start: the routine or object that allocates a resource
    frees it; free on every exit path, nest allocations (free in reverse order, acquire
    in a consistent order to avoid deadlock), encapsulate resources, avoid global
    handles, and verify resources are actually freed.'
